<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Archive — Turtle and Sun</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:linear-gradient(175deg,#FFF5A0 0%,#FFE800 20%,#FFD000 40%,#FFC000 60%,#FFAA00 80%,#FF9500 100%);color:#1C0A00;min-height:100vh;}
.main{max-width:960px;margin:0 auto;padding:36px 40px 60px;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px;}
.header h2{font-size:22px;font-weight:800;}
.header p{font-size:13px;color:rgba(28,10,0,0.6);margin-top:2px;}
.btn-new{display:inline-block;background:#1C2A14;color:#FFE800;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:10px;font-size:14px;border:2px solid #000;}
.btn-new:hover{background:#2d4a24;}

/* Drop zone */
.dropzone{border:2.5px dashed rgba(28,10,0,0.25);border-radius:14px;padding:24px;text-align:center;margin-bottom:32px;transition:border-color .15s,background .15s;cursor:pointer;background:rgba(255,255,255,0.25);}
.dropzone.drag-over{border-color:#1C2A14;background:rgba(255,255,255,0.5);}
.dropzone-icon{font-size:28px;margin-bottom:6px;}
.dropzone p{font-size:14px;color:rgba(28,10,0,0.6);}
.dropzone strong{color:#1C2A14;}

/* Gallery grid */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
.lv-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);cursor:grab;transition:transform .12s,box-shadow .12s;}
.lv-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.13);}
.lv-card:active{cursor:grabbing;}
.lv-thumb{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#f5f2ea;}
.lv-thumb-placeholder{width:100%;aspect-ratio:9/16;background:#f5f2ea;display:flex;align-items:center;justify-content:center;color:rgba(28,10,0,0.3);font-size:13px;}
.lv-info{padding:12px 14px;}
.lv-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.lv-date{font-size:12px;color:rgba(28,10,0,0.45);margin-bottom:10px;}
.lv-actions{display:flex;gap:8px;flex-wrap:wrap;}
.lv-btn{display:inline-block;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;text-decoration:none;border:1.5px solid #1C2A14;color:#1C2A14;background:#fff;}
.lv-btn:hover{background:#f0f7ea;}
.lv-btn.primary{background:#1C2A14;color:#FFE800;}
.lv-btn.primary:hover{background:#2d4a24;}
.lv-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.lv-status-paid{background:#c8e6c9;color:#1b5e20;}
.lv-status-pending{background:#fff3cd;color:#856404;}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state p{font-size:16px;margin-bottom:20px;color:rgba(28,10,0,0.6);}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox-inner{position:relative;max-width:90vw;max-height:90vh;}
.lightbox-inner img,.lightbox-inner video{max-width:90vw;max-height:85vh;border-radius:10px;display:block;}
.lightbox-close{position:absolute;top:-36px;right:0;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;}

.loading{text-align:center;padding:60px;color:rgba(28,10,0,0.35);font-size:14px;}
@media(max-width:600px){.main{padding:20px 16px 40px;}.gallery{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}}
</style>
<script src="/nav.js?v=20260611b"></script>
<style>
/* Align nav logo with page content left edge */
.ts-nav-bar{padding:0!important;}
.ts-nav-panel-spacer{display:none!important;}
.ts-nav-wrap{max-width:960px;margin:0 auto;padding:0 40px;box-sizing:border-box;}
.ts-nav > a{margin-left:0!important;}
</style>
</head>
<body>
<div class="main">
  <div id="loading" class="loading">Loading your Loveograms…</div>
  <div id="content" style="display:none;">

    <div class="header">
      <div>
        <h2 id="welcomeMsg">My Loveograms</h2>
        <p id="emailLine"></p>
      </div>
      <a href="/account/review" style="font-size:13px;font-weight:700;color:#1C2A14;text-decoration:none;border:1.5px solid #1C2A14;border-radius:8px;padding:8px 14px;background:rgba(255,255,255,0.4);">&#9733; Leave a review</a>
    </div>

    <!-- Drag-in drop zone -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">🐢</div>
      <p><strong>Drop a photo here</strong> to add it to your archive</p>
    </div>

    <!-- Gallery -->
    <div id="gallery" class="gallery"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <p>You don't have any Loveograms yet.</p>
      <a href="/" class="btn-new">Create your first one →</a>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <div id="lightboxContent"></div>
  </div>
</div>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(s){return s?new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';}
function productLabel(p){
  if(!p) return 'Loveogram';
  if(p.includes('bundle')) return 'Image + Video';
  if(p.includes('video')) return 'Loveogram Video';
  if(p.includes('image')) return 'Loveogram Image';
  if(p.startsWith('concept:')) return p.replace('concept:','').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  return p;
}

function openLightbox(url, isVideo) {
  const lb = document.getElementById('lightbox');
  const lbc = document.getElementById('lightboxContent');
  lbc.innerHTML = isVideo
    ? `<video src="${esc(url)}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:10px;display:block;"></video>`
    : `<img src="${esc(url)}" style="max-width:90vw;max-height:85vh;border-radius:10px;display:block;">`;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxContent').innerHTML = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });

function makeDraggable(card, url, filename) {
  card.setAttribute('draggable', 'true');
  card.addEventListener('dragstart', e => {
    // text/plain carries the URL for internal drop-to-create
    e.dataTransfer.setData('text/plain', url);
    const ext = url.match(/\.(mp4|webm|mov)(\?|$)/i) ? 'video/mp4' : 'image/jpeg';
    e.dataTransfer.setData('DownloadURL', `${ext}:${filename}:${url}`);
    e.dataTransfer.effectAllowed = 'copy';
  });
}

function createFromArchive(url) {
  sessionStorage.setItem('ts_state', JSON.stringify({ cloudinaryUrl: url, ts: Date.now() }));
  window.location.href = '/';
}

async function deleteOrder(id) {
  if (!confirm('Remove this from your archive?')) return;
  await fetch(`/api/account/order/${id}`, { method: 'DELETE' });
  document.getElementById('card-' + id)?.remove();
}

function renderGallery(orders) {
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('emptyState');
  if (!orders.length) { empty.style.display = 'block'; return; }

  gallery.innerHTML = orders.map(o => {
    const imgUrl  = o.output_asset_url   || o.result_url        || null;
    const vidUrl  = o.output_video_asset_url || o.result_video_url || null;
    const viewUrl = vidUrl || imgUrl;
    const isVideo = !!vidUrl;
    const label   = productLabel(o.product);

    let thumbHtml;
    if (imgUrl && !isVideo) {
      // Image — use <img>
      thumbHtml = `<img class="lv-thumb" src="${esc(imgUrl)}" alt="${esc(label)}" loading="lazy" onclick="openLightbox('${esc(imgUrl)}',false)">`;
    } else if (vidUrl) {
      // Video — use <video preload="metadata"> so browser shows first frame
      thumbHtml = `<div style="position:relative;cursor:pointer;" onclick="openLightbox('${esc(vidUrl)}',true)">
        <video class="lv-thumb" src="${esc(vidUrl)}" preload="metadata" muted playsinline style="pointer-events:none;"></video>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div style="width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;">
            <div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:18px solid #fff;margin-left:4px;"></div>
          </div>
        </div>
      </div>`;
    } else {
      thumbHtml = `<div class="lv-thumb-placeholder">Processing…</div>`;
    }

    return `<div class="lv-card" id="card-${o.id}">
      ${thumbHtml}
      <div class="lv-info">
        <div class="lv-name">${esc(label)}</div>
        <div class="lv-date">${fmtDate(o.created_at)}</div>
        <div class="lv-actions">
          ${viewUrl ? `<button class="lv-btn primary" onclick="openLightbox('${esc(viewUrl)}',${isVideo})">${isVideo?'▶ Play':'View'}</button>` : ''}
          ${viewUrl ? `<a class="lv-btn" href="/api/download?url=${encodeURIComponent(viewUrl)}&filename=loveogram-${o.id}${isVideo?'.mp4':'.jpg'}">↓ Download</a>` : ''}
          ${imgUrl  ? `<a class="lv-btn" href="/print/loveogram?url=${encodeURIComponent(imgUrl)}" target="_blank">Print</a>` : ''}
          ${!viewUrl ? `<span style="font-size:12px;color:#aaa;">Processing…</span>` : ''}
          ${(o.input_asset_url || imgUrl) ? `<button class="lv-btn" onclick="createFromArchive('${esc(o.input_asset_url || imgUrl)}')">+ New Loveogram</button>` : ''}
          <button class="lv-btn" style="border-color:#e53935;color:#e53935;" onclick="deleteOrder(${o.id})">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Make completed cards draggable (drag-out to desktop)
  orders.forEach(o => {
    const vidUrl = o.output_video_asset_url || o.result_video_url || null;
    const imgUrl = o.output_asset_url || o.result_url || null;
    const url = vidUrl || imgUrl;
    if (!url) return;
    const card = document.getElementById('card-' + o.id);
    if (card) makeDraggable(card, url, `loveogram-${o.id}${vidUrl?'.mp4':'.jpg'}`);
  });
}

// Drag-in drop zone — photo dropped starts the creation flow
(function setupDropzone() {
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', async e => {
    e.preventDefault();
    dz.classList.remove('drag-over');

    // External file drop → save to archive
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    dz.querySelector('p').textContent = 'Uploading…';
    try {
      const fd = new FormData();
      fd.append('image', file);
      const r = await fetch('/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (!j.url) throw new Error(j.error || 'Upload failed');
      await fetch('/api/account/archive-photo', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ url: j.url, filename: file.name })
      });
      load();
      dz.querySelector('p').innerHTML = '<strong>Drop a photo here</strong> to add it to your archive';
    } catch(err) {
      dz.querySelector('p').textContent = 'Upload failed — try again.';
    }
  });
  dz.addEventListener('click', () => window.location.href = '/');
})();

async function load() {
  try {
    const res = await fetch('/api/account/data');
    if (res.status === 401) { location.href = '/login'; return; }
    const { user, orders } = await res.json();
    document.getElementById('welcomeMsg').textContent = 'My Archive';
    document.getElementById('emailLine').textContent = user.email;
    renderGallery(orders);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load. Please refresh.';
  }
}

NavBar.init({ requireAuth: true }).then(status => { if (status) load(); });
</script>
</body>
</html>
