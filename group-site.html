<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle &amp; Sun</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{ --ink:#23291d; --green:#1f4a45; --gold:#c9a24b; --cream:#f7f3e8; --muted:#7a8470; }
  *{ box-sizing:border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  body{ margin:0; font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; color:var(--ink);
        background:linear-gradient(175deg,#FFFFFF 0%,#FFF5A0 18%,#FFE800 38%,#FFD000 58%,#FFAA00 80%,#FF9500 100%) fixed; }
  .hero{ background:var(--green); color:#f4efe4; padding:64px 20px 56px; text-align:center; }
  .hero h1{ font-family:Georgia,'Times New Roman',serif; font-size:clamp(30px,6vw,52px); margin:0; }
  .hero .tag{ font-size:clamp(15px,2.5vw,19px); color:#cdddd2; margin-top:10px; }
  .hero .count{ display:inline-block; margin-top:18px; font-size:14px; color:var(--gold); letter-spacing:1px; text-transform:uppercase; }
  .wrap{ width:100%; margin:0; padding:0 36px; }
  @media (max-width:600px){ .wrap{ padding:0 16px; } }
  body.display{ user-select:none; }
  body.display.dragging{ cursor:grabbing!important; }
  body.idle{ cursor:none; }
  section{ padding:44px 0 8px; }
  h2{ font-family:Georgia,serif; color:var(--green); font-size:26px; margin:0 0 6px; }
  .rule{ border:none; border-top:3px solid var(--gold); width:64px; margin:0 0 24px; }
  .people{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:18px; }
  .person{ text-align:center; }
  .person .ph{ display:block; max-width:100%; max-height:160px; width:auto; margin:0 auto; border-radius:8px; background:var(--cream); }
  .person .init{ width:96px; height:110px; border-radius:8px; background:var(--cream); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:28px; font-family:Georgia,serif; margin:0 auto; }
  .person .nm{ font-size:14.5px; font-weight:600; margin-top:8px; }
  .person .role{ font-size:12.5px; color:var(--green); }
  .person .sub{ font-size:12.5px; color:var(--muted); }
  .person .ct{ font-size:12.5px; margin-top:3px; line-height:1.45; }
  .person .ct a{ color:var(--green); text-decoration:none; word-break:break-all; }
  .updates{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .upd{ background:var(--cream); border-radius:10px; padding:14px 16px; }
  .upd .d{ font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .upd .t{ font-size:15px; font-weight:600; margin-top:3px; }
  .posts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); grid-auto-rows:2px; grid-auto-flow:dense; column-gap:18px; row-gap:0; }
  .post{ background:#fff; border:1px solid #e2dccb; border-radius:12px; overflow:hidden; align-self:start; margin-bottom:18px; }
  .post.c2{ grid-column:span 2; }
  .post.c3{ grid-column:span 3; }
  @media (max-width:640px){ .post.c2,.post.c3{ grid-column:span 1; } }
  .post img{ width:100%; height:auto; display:block; }
  .post img+.bd{ padding-top:9px; }
  .post .bd{ padding:14px 16px 15px; }
  .post .dt{ font-size:13px; color:var(--muted); }
  .post h3{ margin:3px 0 6px; font-size:20px; color:var(--green); }
  .post.c2 h3,.post.c3 h3{ font-size:23px; }
  .post p{ margin:0 0 5px; font-size:17px; font-weight:600; line-height:1.3; }
  .post p a{ color:var(--green); text-decoration:underline; word-break:break-all; }
  .post p:last-child{ margin-bottom:0; }
  .person{ cursor:pointer; border-radius:10px; padding:6px 4px; }
  .person.sel{ outline:3px solid var(--gold); outline-offset:2px; }
  #map{ height:340px; border-radius:12px; }
  footer{ margin-top:56px; padding:26px 20px; background:var(--cream); text-align:center; font-size:13px; color:var(--muted); }
  footer a{ color:var(--green); text-decoration:none; }
  .err{ text-align:center; padding:80px 20px; color:var(--muted); font-size:16px; }
  .hide{ display:none!important; }
</style>
</head>
<body>

<div id="page" class="hide">
  <div class="hero">
    <h1 id="gname"></h1>
    <div class="tag" id="gtag"></div>
    <div class="count" id="gcount"></div>
  </div>

  <div class="wrap">
    <section id="secPeople" class="hide">
      <h2>People</h2><hr class="rule">
      <div class="people" id="people"></div>
    </section>

    <section id="secUpd" class="hide">
      <h2>Coming up</h2><hr class="rule">
      <div class="updates" id="updates"></div>
    </section>

    <section id="secPosts" class="hide">
      <h2>News</h2><hr class="rule">
      <div class="posts" id="posts"></div>
    </section>

    <section id="secMap" class="hide">
      <h2>Where we are</h2><hr class="rule">
      <div id="map"></div>
    </section>
  </div>

  <footer>Made with <a href="/" target="_blank">Turtle &amp; Sun</a> · always up to date</footer>
</div>

<div id="err" class="err hide">This page is not published.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const token = location.pathname.split('/').pop();
const display = new URLSearchParams(location.search).has('display');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Escape text but turn URLs into real links (odd split indexes are the URLs).
const linkify = raw => String(raw==null?'':raw).split(/(https?:\/\/[^\s<>"')]+|www\.[^\s<>"')]+)/g)
  .map((t,i) => i%2
    ? '<a href="'+esc(t.startsWith('www.')?'https://'+t:t)+'" target="_blank" rel="noopener">'+esc(t)+'</a>'
    : esc(t)).join('');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function nextDate(md){
  const m = String(md||'').match(/^(\d{1,2})-(\d{1,2})/);
  if(!m) return null;
  const now = new Date();
  let d = new Date(now.getFullYear(), +m[1]-1, +m[2]);
  if(d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d = new Date(now.getFullYear()+1, +m[1]-1, +m[2]);
  return d;
}
function fmt(d){ return d.getDate() + ' ' + MON[d.getMonth()]; }

// Masonry: each card spans as many 8px grid rows as its natural height needs,
// so a text-only post takes exactly the space of its text.
function layoutPosts(){
  const cards = document.querySelectorAll('#posts .post');
  cards.forEach(card => {
    card.style.gridRowEnd = '';
    const h = card.getBoundingClientRect().height;
    card.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil((h + 18) / 2));
  });
}
addEventListener('resize', () => { clearTimeout(window._lay); window._lay = setTimeout(layoutPosts, 150); });
addEventListener('load', layoutPosts);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutPosts);

// Two-way selection: person card <-> map pin.
function selectPerson(i, from){
  document.querySelectorAll('.person.sel').forEach(x => x.classList.remove('sel'));
  const card = document.querySelector('.person[data-i="'+i+'"]');
  if(card) card.classList.add('sel');
  const mk = (window._markers||{})[i];
  if(from === 'people' && mk && window._tsMap){
    document.getElementById('secMap').scrollIntoView({ behavior:'smooth', block:'nearest' });
    window._tsMap.panTo(mk.getLatLng());
    mk.openPopup();
  }
  if(from === 'map' && card){
    card.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

async function load(){
  const r = await fetch('/api/site/' + token);
  if(!r.ok){ document.getElementById('err').classList.remove('hide'); return; }
  const data = await r.json();
  document.title = data.group_name + ' · Turtle & Sun';

  document.getElementById('gname').textContent = data.group_name;
  document.getElementById('gtag').textContent = data.tagline || '';
  document.getElementById('gtag').classList.toggle('hide', !data.tagline);
  const n = (data.members||[]).length;
  document.getElementById('gcount').textContent = n ? (n + (n===1?' member':' members')) : '';

  const ppl = data.members||[];
  ppl.forEach((p,i)=>p._i=i);
  if(ppl.length){
    document.getElementById('secPeople').classList.remove('hide');
    document.getElementById('people').innerHTML = ppl.map(p => {
      const init = (p.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const img = p.photo_url
        ? '<img class="ph" src="'+esc(p.photo_url)+'" alt="" loading="lazy">'
        : '<div class="init">'+esc(init)+'</div>';
      const ct = [
        p.email ? '<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>' : '',
        p.phone ? '<a href="tel:'+esc(String(p.phone).replace(/[^+\d]/g,''))+'">'+esc(p.phone)+'</a>' : ''
      ].filter(Boolean).join('<br>');
      return '<div class="person" data-i="'+p._i+'">'+img+
        '<div class="nm">'+esc(p.name||'')+'</div>'+
        (p.job_title?'<div class="role">'+esc(p.job_title)+'</div>':'')+
        (p.subgroup_name?'<div class="sub">'+esc(p.subgroup_name)+'</div>':'')+
        (ct?'<div class="ct">'+ct+'</div>':'')+
        '</div>';
    }).join('');
    document.getElementById('people').onclick = e => {
      if(e.target.closest('a')) return;
      const card = e.target.closest('.person');
      if(card) selectPerson(+card.dataset.i, 'people');
    };
  }

  const ups = [];
  const horizon = new Date(); horizon.setDate(horizon.getDate()+90);
  ppl.forEach(p => {
    const d = nextDate(p.birthday);
    if(d && d <= horizon) ups.push({ d, label:(p.name||'').split(' ')[0] + "'s birthday" });
  });
  (data.occasions||[]).forEach(o => {
    let d = null;
    if(o.frequency === 'yearly'){ d = nextDate(String(o.start_date).slice(5,10)); }
    else { const t = new Date(o.start_date); if(t >= new Date()) d = t; }
    if(d && d <= horizon) ups.push({ d, label: o.name + (o.contact_name ? ' · ' + o.contact_name.split(' ')[0] : '') });
  });
  ups.sort((a,b)=>a.d-b.d);
  if(ups.length){
    document.getElementById('secUpd').classList.remove('hide');
    document.getElementById('updates').innerHTML = ups.slice(0,8).map(u =>
      '<div class="upd"><div class="d">'+fmt(u.d)+'</div><div class="t">'+esc(u.label)+'</div></div>').join('');
  }

  const posts = data.posts||[];
  if(posts.length){
    document.getElementById('secPosts').classList.remove('hide');
    // Sizes control WIDTH only (1–3 columns); pictures are never cropped — they
    // show whole at natural aspect, and the masonry puzzles the heights.
    // Deterministic per post (hash of the title) so the wall is stable.
    const hash = s => { let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h); };
    document.getElementById('posts').innerHTML = posts.map(p => {
      const ph = (p.photos||[])[0];
      const dt = new Date(p.post_date);
      const paras = String(p.body||'').split(/\n\n+/).filter(Boolean)
        .map(par => '<p>'+linkify(par)+'</p>').join('');
      // Width: the author's chosen size (1–5 one column, 6–9 wide, 10 biggest),
      // otherwise a stable hash pick for photo posts / long text posts.
      const n = (p.size >= 1 && p.size <= 10) ? p.size - 1
              : (ph ? hash(p.title||p.body) % 10 : (String(p.body||'').length > 700 ? 5 : 0));
      const cls = n === 9 ? ' c3' : (n >= 5 ? ' c2' : '');
      const img = ph ? '<img src="'+esc(ph)+'" alt="" loading="lazy">' : '';
      const by = p.author ? ' · by '+esc(p.author) : '';
      return '<div class="post'+cls+'">'+img+
        '<div class="bd"><div class="dt">'+fmt(dt)+' '+dt.getFullYear()+by+'</div>'+
        (p.title?'<h3>'+esc(p.title)+'</h3>':'')+paras+'</div></div>';
    }).join('');
    requestAnimationFrame(layoutPosts);
    document.querySelectorAll('#posts img').forEach(im => im.addEventListener('load', layoutPosts));
  }

  document.getElementById('page').classList.remove('hide');

  const pins = ppl.filter(p => p.latitude != null && p.longitude != null);
  if(pins.length && window.L){
    document.getElementById('secMap').classList.remove('hide');
    if(!window._tsMap){
      window._tsMap = L.map('map', { scrollWheelZoom:false }).setView([62,15],4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(window._tsMap);
    }
    const map = window._tsMap;
    if(map._pinLayer) map.removeLayer(map._pinLayer);
    const lg = L.layerGroup().addTo(map); map._pinLayer = lg;
    window._markers = {};
    pins.forEach(p => {
      const mk = L.marker([p.latitude,p.longitude]).addTo(lg).bindPopup(esc(p.name||''));
      mk.on('click', () => selectPerson(p._i, 'map'));
      window._markers[p._i] = mk;
    });
    setTimeout(() => {
      map.invalidateSize();
      map.fitBounds(pins.map(p=>[p.latitude,p.longitude]), { padding:[40,40], maxZoom:11 });
    }, 100);
  }
}

load();
setInterval(load, 5*60*1000);

if(display){
  document.body.classList.add('display');
  let dir = 1, pauseUntil = Date.now() + 2500, idleTimer = null;

  // Any human activity: show the cursor, pause the auto-scroll; both come back
  // by themselves after a few idle seconds.
  function humanActivity(){
    pauseUntil = Date.now() + 5000;
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
  }
  ['mousemove','wheel','touchstart','mousedown','keydown'].forEach(ev =>
    addEventListener(ev, humanActivity, { passive:true }));
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);

  setInterval(() => {
    if(Date.now() < pauseUntil) return;
    window.scrollBy(0, dir);
    const max = document.documentElement.scrollHeight - innerHeight;
    if(scrollY >= max - 2) dir = -1;
    if(scrollY <= 0) dir = 1;
  }, 40);

  // Grab the page and drag it, without breaking normal clicks on links:
  // only counts as a drag after 5px of movement.
  let dragY = null, dragged = false;
  addEventListener('mousedown', e => { if(e.button===0){ dragY = e.clientY; dragged = false; } });
  addEventListener('mousemove', e => {
    if(dragY == null) return;
    const dy = dragY - e.clientY;
    if(Math.abs(dy) > 5){ dragged = true; document.body.classList.add('dragging'); }
    if(dragged){ window.scrollBy(0, dy); dragY = e.clientY; }
  });
  addEventListener('mouseup', () => { dragY = null; document.body.classList.remove('dragging'); });
  addEventListener('click', e => {
    if(dragged){ e.preventDefault(); e.stopPropagation(); dragged = false; }
  }, true);
}
</script>
</body>
</html>
