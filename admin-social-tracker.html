<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Tracker — Turtle and Sun Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(160deg,#f0ece0 0%,#e8e2d4 100%);min-height:100vh;color:#1C0A00;font-size:13px;overflow-x:auto}
.page{padding:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:8px}
h1{font-size:18px;font-weight:700}
.btn{padding:6px 13px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1C2A14;color:#FFE800}
.btn-primary:hover{background:#2d4a24}
.btn-secondary{background:#fff;border:1px solid #ccc;color:#333}
.btn-secondary:hover{background:#f5f5f5}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-danger{background:#c0392b;color:#fff}
.layout{display:grid;grid-template-columns:1fr;gap:12px;transition:grid-template-columns 0.15s}

.list-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.07)}
table{border-collapse:collapse;table-layout:fixed}
thead th{font-size:11px;font-weight:700;color:#555;padding:5px 7px;border-bottom:2px solid #b0aba4;text-align:left;white-space:nowrap;background:#dedad5;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid #a8a29c;cursor:pointer}
tbody tr:hover{background:#faf8f4}
tbody tr.sel{background:#e8f5e9;box-shadow:inset 3px 0 0 #1C2A14}
td{padding:4px 7px;vertical-align:middle}
.concept-name{font-weight:700;font-size:12px}
.ref-tag{font-size:10px;color:#aaa;margin-top:0}
.clk-loading{color:#b8a200;animation:clkblink 1s ease-in-out infinite}@keyframes clkblink{0%,100%{opacity:1}50%{opacity:.25}}
.tags-row{display:flex;flex-wrap:nowrap;gap:2px;margin-top:1px;overflow:hidden}
.tag{font-size:9px;padding:0px 5px;border-radius:20px;line-height:1.6}
.tag-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tag-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tag-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.pip{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.plat-sep{border-left:2px solid #a8a29c!important}
.pip-y{background:#1C2A14;color:#FFE800}
.pip-n{background:#eee;color:#aaa;border:1px solid #ddd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.yt-num{color:#0F6E56;font-weight:700}
.muted{color:#aaa}
.empty{padding:40px;text-align:center;color:#aaa;font-size:13px}

/* Bottom panel */
.bottom-panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;width:100%}
.bp-head{background:#1C2A14;color:#FFE800;padding:8px 0;display:grid;grid-template-columns:314fr 90fr 90fr 90fr 90fr 224fr;align-items:center}
.bp-head h2{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-head button{background:none;border:none;color:#FFE800;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}
.bp-body{padding:16px}
@media(max-width:700px){.bp-body{grid-template-columns:1fr}}
.bp-video video{width:100%;border-radius:8px;background:#000;display:block}
.bp-video .no-video{aspect-ratio:9/16;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
.bp-chart{overflow:visible}.bp-canvas-wrap{position:relative;height:220px;margin-top:8px}
.bp-no-stats{color:#aaa;font-size:12px;text-align:center;padding:40px 0}
.bp-actions{margin-top:10px;padding-top:10px;border-top:1px solid #eee;display:flex;gap:6px;flex-wrap:wrap}
.section-label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.section-label:first-child{margin-top:0}
.tags-big{display:flex;flex-wrap:wrap;gap:4px}
.tbig{font-size:11px;padding:3px 9px;border-radius:20px}
.tbig-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tbig-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tbig-sty{background:#e3f0ff;color:#185FA5;border:1px solid #378ADD}
.tbig-moo{background:#f3e8ff;color:#534AB7;border:1px solid #7F77DD}
.tbig-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.plat-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ptab{font-size:11px;padding:4px 11px;border-radius:7px;border:1px solid #ccc;cursor:pointer;background:#fff;color:#555;font-weight:700}
.ptab:hover{background:#f5f5f5}
.ptab.act{background:#1C2A14;color:#FFE800;border-color:#1C2A14}
.ptab.np{opacity:.4;cursor:default}
.field{background:#faf8f4;border-radius:7px;padding:9px 11px;margin-bottom:7px}
.field-label{font-size:10px;color:#888;margin-bottom:3px}
.field-val{font-size:12px;color:#1C0A00;line-height:1.45;word-break:break-word}
.field-val.mono{font-size:11px;color:#555;word-break:break-all}
.field a{color:#185FA5;font-size:11px}
.field-input{width:100%;border:1px solid #ddd;border-radius:5px;padding:6px 8px;font-size:12px;background:#fff;color:#1C0A00;margin-top:3px}
.field-input:focus{outline:none;border-color:#1C2A14}
.not-posted{font-size:12px;color:#aaa;padding:10px 0}
.stats-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px}
.badge-auto{background:#e1f5ee;color:#0F6E56}
.badge-manual{background:#fffde7;color:#856700}
table.st{width:100%;border-collapse:collapse;font-size:11px}
table.st th{padding:4px 7px;color:#888;border-bottom:1px solid #eee;border-right:1px solid #e8e8e8;text-align:right;font-weight:700;white-space:nowrap}
table.st th:first-child{text-align:left}
table.st td{padding:4px 7px;border-bottom:1px solid #f0f0f0;border-right:1px solid #e8e8e8;text-align:right;font-variant-numeric:tabular-nums}
table.st td:first-child{text-align:left;color:#888}
table.st td.yt{color:#0F6E56;font-weight:700}
.log-form{background:#faf8f4;border-radius:7px;padding:10px;margin-top:8px}
.log-form h4{font-size:11px;font-weight:700;color:#555;margin-bottom:7px}
.log-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.log-row label{font-size:10px;color:#888;display:block;margin-bottom:2px}

/* ── Embedded calendar ─────────────────────────────────────── */
.cal-section{margin-top:20px}
.cal-section h2{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{padding:3px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
.cal-week-label{font-size:12px;font-weight:700;min-width:160px;text-align:center}
.cal-month-nav-wrap{overflow-x:auto;overflow-y:hidden;cursor:grab;user-select:none;margin-bottom:0;border-radius:10px 10px 0 0;background:#e8e4dc}
.cal-month-nav-wrap:active{cursor:grabbing}
.cal-month-nav-inner{display:flex;min-width:max-content;padding:4px 6px;gap:4px}
.cal-month-btn{flex-shrink:0;padding:4px 10px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#555;white-space:nowrap}
.cal-month-btn:hover{background:#1C2A14;color:#FFE800}
.cal-month-btn.active-month{background:#1C2A14;color:#FFE800}
.cal-wrap{background:#ece8e0;border-radius:0 0 10px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:auto}
.cal-month-label{font-size:11px;font-weight:700;padding:6px 8px;background:#1C2A14;color:#FFE800;letter-spacing:.04em;min-width:900px}
.cal-day-head{display:grid;grid-template-columns:80px repeat(31,minmax(20px,1fr));border-bottom:1px solid #a8a49c;background:#dedad2;min-width:900px}
.cal-day-num{padding:2px 1px;text-align:center;font-size:9px;font-weight:700;color:#888;border-right:1px solid #b0aa9e}
.cal-day-num.today-day{color:#856700;background:#fffde7}
.cal-row{display:grid;grid-template-columns:80px repeat(31,minmax(20px,1fr));border-bottom:1px solid #a8a49c;min-height:26px;min-width:900px}
.cal-row:last-child{border-bottom:none}
.plat-label{padding:3px 5px;display:flex;align-items:center;justify-content:flex-end;border-right:1px solid #b0aa9e;background:#e8e4dc}
.plat-pill{font-size:9px;font-weight:700;padding:2px 5px;border-radius:20px}
.plat-tiktok{background:#1C0A00;color:#fff}
.copy-btn{font-size:11px;padding:2px 9px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#444;line-height:1.4}
.copy-btn:hover{background:#f0f0f0}
.copy-btn.copied{background:#d4edda;border-color:#b2dfdb;color:#2e7d32}
.plat-instagram{background:#C13584;color:#fff}
.plat-youtube{background:#FF0000;color:#fff}
.plat-facebook{background:#1877F2;color:#fff}
.cal-cell{padding:1px 2px;border-right:1px solid #b0aa9e;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px}
.cal-cell{background:#f0ece4}.cal-cell.today-day{background:#fffde7}
.cal-cell.no-day{background:#d8d4cc}
.cal-num{font-size:10px;font-weight:700;cursor:pointer;color:#1C2A14;padding:1px 2px;border-radius:3px;line-height:1.3}
.cal-num:hover{background:#FFE800}
.cal-num.sel-num{background:#FFE800;outline:1px solid #856700}
.pill-tiktok{background:#1C0A00;color:#fff}
.pill-instagram{background:#C13584;color:#fff}
.pill-youtube{background:#FF0000;color:#fff}
.pill-facebook{background:#1877F2;color:#fff}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:540px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:#555;font-weight:700;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:4px 7px;font-size:13px;color:#1C0A00;background:#fff}
.form-row textarea{resize:vertical;min-height:60px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:#1C2A14}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:160px 1088px;width:1280px;align-items:start;padding:0 16px;gap:0">

  <!-- LEFT: persistent sticky video column -->
  <div id="side-col" style="position:sticky;top:0;align-self:start;padding:0 10px;display:flex;flex-direction:column;align-items:center">
    <video id="side-video-el" controls playsinline draggable="true" title="Drag this video into TikTok Studio to upload it" style="width:140px;border-radius:8px;background:#111;display:none;cursor:grab"></video>
    <div id="side-video-ph" style="aspect-ratio:9/16;width:140px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#444;font-size:11px;text-align:center;padding:8px">Select a clip</div>
  </div>

  <!-- RIGHT: all main content -->
  <div>
    <div style="padding:16px 0">
      <div class="toolbar">
        <div class="toolbar-left">
          <h1>Social Tracker</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="fetchAll(this)" style="background:#1C2A14;color:#FFE800;border-color:#1C2A14">&#8635; Fetch all stats</button>
          <button class="btn btn-primary" onclick="showAddModal()">+ Add clip</button>
        </div>
      </div>
      <div id="tracker-block" style="width:100%;display:flex;flex-direction:column;gap:28px">
        <div class="list-wrap">
          <table style="width:100%">
            <colgroup>
              <col style="width:24px">
              <col style="width:130px">
              <col style="width:160px">
              <col style="width:45px"><col style="width:45px">
              <col style="width:45px"><col style="width:45px">
              <col style="width:45px"><col style="width:45px">
              <col style="width:45px"><col style="width:45px">
              <col style="width:62px">
              <col style="width:54px">
              <col style="width:54px">
              <col style="width:54px">
            </colgroup>
            <thead>
              <tr>
                <th class="num" style="width:24px;color:#aaa">#</th>
                <th style="width:130px">Concept</th>
                <th style="width:160px">Tags</th>
                <th id="th-tiktok" colspan="2" style="color:#1C0A00;border-left:2px solid #a8a29c;text-align:center">TikTok</th>
                <th id="th-instagram" colspan="2" style="color:#C13584;border-left:2px solid #a8a29c;text-align:center">Instagram</th>

        </div>

    </div>
    <div style="padding:0 0 24px 0">
      <div style="margin-bottom:0">

    <!-- Stats summary chart panel -->

      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <span style="font-size:10px;font-weight:700;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-right:6px">All clips</span>

</div>

<script>
const PF = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook' };
const PLAT_COLORS = { tiktok:'#1C0A00', instagram:'#C13584', youtube:'#FF0000', facebook:'#1877F2' };
let clips = [], selId = null, selPlat = 'tiktok', postCache = {}, statCache = {}, ytLiveCache = {}, fbLiveCache = {};
let calCurrentYM = null;
let ttConnected = false;
let igConnected = false;
let fbConnected = false;
let ytConnected = false;
let channelFollowers = {};
let chartInstance = null;
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('sv-SE',{month:'short',day:'numeric'}) : '—'; }
function fd(v) { if (!v) return ''; if (v instanceof Date) return v.toISOString().slice(0,10); return String(v).slice(0,10); }
function fdd(v) { return v ? new Date(fd(v)).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'}) : '—'; }

function fmtFollowers(n) {
  if (n == null) return '';
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}

let channelDailyStats = [];

async function loadFollowers() {
  try {
    const [r, dr, cr] = await Promise.all([
      fetch('/admin/api/tracker/channel-followers'),
      fetch('/admin/api/tracker/channel-daily-stats'),
      fetch('/admin/api/tracker/clicks-daily'),
    ]);
    if (cr.ok) { const cd = await cr.json(); clicksDaily = cd.rows || []; }
    if (r.ok) {
      const d = await r.json();
      channelFollowers = d;
      const map = { tiktok:'#1C0A00', instagram:'#C13584', youtube:'#FF0000', facebook:'#1877F2' };
      const labels = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook' };
      for (const [ch, color] of Object.entries(map)) {
        const el = document.getElementById('th-' + ch);
        if (!el) continue;
        const count = d[ch];
        if (count != null) {
          el.innerHTML = labels[ch] + ' <span style="font-weight:400;font-size:10px;color:' + color + ';opacity:0.8">' + fmtFollowers(count) + '</span>';
        }
      }
    }
    if (dr.ok) { channelDailyStats = await dr.json(); }
    updateStats();
  } catch(e) { console.warn('loadFollowers:', e.message); }
}

let summaryMetric = 'subscribers';

let clicksDaily = [];

function renderClipChart() {
  const ctx = document.getElementById('views-chart');
  if (!ctx || !clipStats.length) return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const dates = [...new Set(clipStats.map(s => fd(s.stat_date)))].sort();
  const datasets = ['tiktok','instagram','youtube','facebook'].map(p => {
    const byDate = {};
    clipStats.filter(s => s.platform === p).forEach(s => { byDate[fd(s.stat_date)] = s[clipMetric] || 0; });
    if (!Object.keys(byDate).length) return null;
    return {

      data: dates.map(d => byDate[d] ?? null),
      borderColor: PLAT_COLORS[p],
      backgroundColor: PLAT_COLORS[p] + '22',

  }).filter(Boolean);

        y: { beginAtZero: true, ticks: { font: { size: 10 } } }
      }
    }

}

function setSummaryMetric(m) {
  summaryMetric = m;
  ['subscribers','views','likes','clicks'].forEach(k => {
    const b = document.getElementById('ssbtn-'+k);
    if (b) { b.style.background = k===m ? '#333' : '#fff'; b.style.color = k===m ? '#fff' : '#555'; }
  });
  updateStats();
}

function updateStats() {
  const canvas = document.getElementById('summary-chart');
  if (!canvas) return;
  if (summaryChart) { summaryChart.destroy(); summaryChart = null; }

  const chs = ['tiktok','instagram','youtube','facebook'];
  const metricKey = { subscribers: 'subscribers', views: 'total_views', likes: 'total_likes', clicks: 'clicks' }[summaryMetric];
  const isClicks = summaryMetric === 'clicks';
  const source = isClicks ? clicksDaily : channelDailyStats;

  if (source.length) {
    // Line chart: day-by-day time series per platform.
    // subscribers/views/likes are cumulative snapshots; clicks are native daily counts.
    // 'Accumulated' shows running totals, 'Daily' shows per-day change.
    const dates = [...new Set(source.map(r => r.stat_date))].sort();
    const datasets = chs.map(p => {
      const byDate = {};
      source.filter(r => r.platform === p).forEach(r => { byDate[r.stat_date] = parseInt(r[metricKey]) || 0; });
      if (!Object.keys(byDate).length) return null;
      let vals = dates.map(d => byDate[d] ?? null);
      if (summaryMode === 'acc' && isClicks) {
        let run = 0; vals = vals.map(v => { run += (v || 0); return run; });
      } else if (summaryMode === 'daily' && !isClicks) {
        let prev = null; vals = vals.map(v => { if (v == null) return null; const diff = prev == null ? null : Math.max(0, v - prev); prev = v; return diff; });
      }
      return {
        label: PF[p],
        data: vals,
        borderColor: PLAT_COLORS[p],
        backgroundColor: PLAT_COLORS[p] + '22',
        tension: 0.3, spanGaps: true, pointRadius: 3, pointHoverRadius: 5,
      };
    }).filter(Boolean);
    summaryChart = new Chart(canvas, {
      type: 'line',
      data: { labels: dates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { font: { size: 10 }, boxWidth: 12 } } },
        scales: {
          x: { ticks: { font: { size: 10 }, maxRotation: 45 } },
          y: { beginAtZero: true, ticks: { font: { size: 10 } } }
        }
      }
    });
  } else {
    // Fallback bar chart (no history yet — shows current snapshot)
    const views = {tiktok:0,instagram:0,youtube:0,facebook:0};
    const likes = {tiktok:0,instagram:0,youtube:0,facebook:0};
    for (const c of clips) {
      for (const ch of chs) {
        views[ch] += (+c[ch+'_views'])||0;
        likes[ch] += (+c[ch+'_likes'])||0;
      }
    }
    const clicksByCh = {tiktok:0,instagram:0,youtube:0,facebook:0};
    for (const c2 of clips) {
      clicksByCh.tiktok    += (+c2.clicks_tiktok)||0;
      clicksByCh.instagram += (+c2.clicks_instagram)||0;
      clicksByCh.youtube   += (+c2.clicks_youtube)||0;
      clicksByCh.facebook  += (+c2.clicks_facebook)||0;
    }
    const dataMap = {
      subscribers: chs.map(ch => channelFollowers[ch] || 0),
      views:       chs.map(ch => views[ch]),
      likes:       chs.map(ch => likes[ch]),
      clicks:      chs.map(ch => clicksByCh[ch]),
    };
    const colors = chs.map(ch => PLAT_COLORS[ch]);
    summaryChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['TikTok','Instagram','YouTube','Facebook'],
        datasets: [{
          data: dataMap[summaryMetric],
          backgroundColor: colors.map(c => c + 'cc'),
          borderColor: colors,
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ctx.parsed.y.toLocaleString('sv-SE') } }
        },
        scales: {
          x: { ticks: { font: { size: 11 }, color: colors }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { font: { size: 10 } } }
        }
      }
    });
  }
}

async function load() {
  // 1. Fast path: clip list only — render the table immediately.
  const r = await fetch('/admin/api/tracker/clips');
  const d = await r.json();
  clips = d.rows || [];
  renderTable();
  // 2. Everything else loads in the background and fills in when ready.
  // Clicks right away; platform statuses + follower stats 3s later so they
  // never compete with the first paint.
  loadClicksBg();
  setTimeout(() => { loadStatusesBg(); loadFollowers(); }, 3000);
}

function loadClicksBg() {
  fetch('/admin/api/tracker/clicks')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.rows) return;
      const map = {};
      d.rows.forEach(x => map[x.id] = x);
      let changed = false;
      clips.forEach(c => {
        const m = map[c.id];
        const v = m ? m.clicks : 0;
        if (c.clicks !== v) changed = true;
        c.clicks            = v;
        c.clicks_youtube    = m ? m.clicks_youtube : 0;
        c.clicks_tiktok     = m ? m.clicks_tiktok : 0;
        c.clicks_instagram  = m ? m.clicks_instagram : 0;
        c.clicks_facebook   = m ? m.clicks_facebook : 0;
      });
      if (changed || d.rows.length) renderTable();
    })
    .catch(() => {});
}

async function pick(id) {
  if (selId === id) return; // already selected — no toggle
  selId = id;
  renderTable();
  updateSideVideo(clips.find(x => x.id === id) || null);
  const selRow = document.getElementById('row-' + id);
  if (selRow) selRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const c = clips.find(x => x.id === id);
  await Promise.all([loadStats(id), loadPosts(id)]);
  if (c && c.yt_video_id && !ytLiveCache[id]) {
    try {
      const r = await fetch(`/admin/api/tracker/clips/${id}/youtube-live`, { headers: { 'Accept': 'application/json' } });
      if (r.ok) ytLiveCache[id] = await r.json();
    } catch(e) { /* non-fatal */ }
  }
  if (c && c.facebook_video_id && !fbLiveCache[id]) {
    try {
      const r = await fetch(`/admin/api/tracker/clips/${id}/fb-live`, { headers: { 'Accept': 'application/json' } });
      if (r.ok) fbLiveCache[id] = await r.json();
    } catch(e) { /* non-fatal */ }
  }
  // Scroll calendar to the week this clip was published

  renderPanel();
}

function positionSideVideo() {
  const panel   = document.getElementById('bottom-panel');
  const sideCol = document.getElementById('side-col');
  if (!panel || !sideCol) return;
  const bpHead  = panel.querySelector('.bp-head');
  const headH   = bpHead ? bpHead.offsetHeight : 0;
  // absolute page Y of bp-body top (below the green header)
  const panelY  = panel.getBoundingClientRect().top + window.scrollY;
  const sideY   = sideCol.getBoundingClientRect().top + window.scrollY;
  const mt      = Math.max(0, panelY + headH - sideY);
  ['side-video-el','side-video-ph'].forEach(function(id){
    const el = document.getElementById(id);
    if (el) el.style.marginTop = mt + 'px';
  });
}
function updateSideVideo(c) {
  const vid = document.getElementById('side-video-el');
  const ph  = document.getElementById('side-video-ph');
  if (!vid || !ph) return;
  if (c && c.output_url) {
    vid.src = c.output_url;
    vid.style.display = 'block';
    ph.style.display  = 'none';
    vid.ondragstart = (e) => {
      const filename = 'clip-' + (c.id||'video') + '.mp4';
      e.dataTransfer.setData('DownloadURL', 'video/mp4:' + filename + ':' + c.output_url);
      e.dataTransfer.effectAllowed = 'copy';
    };
  } else {
    vid.src = '';
    vid.style.display = 'none';
    ph.style.display  = 'flex';
    ph.textContent = c ? 'No video yet' : 'Select a clip';
  }
  // delay so panel has rendered before measuring
  setTimeout(positionSideVideo, 50);
}

async function fetchAll(btn) {

  try {

    const [ytR, igR, fbR] = await Promise.all([

    ]);
    const [yt, ig, fb] = await Promise.all([ytR.json(), igR.json(), fbR.json()]);

    total += ttUpdated;

    setTimeout(() => { btn.disabled=false; btn.textContent='↻ Fetch all stats'; }, 3000);

    btn.disabled = false; btn.textContent = '↻ Fetch all stats';
    alert('Fetch stats error: ' + e.message);
  }
}

async function fetchTikTokViaExtension() {
  // Ask the extension to scrape TikTok Studio
  return new Promise((resolve) => {
    const timeout = setTimeout(() => resolve(0), 30000); // 30s timeout
    function handler(e) {
      if (e.data?.type !== 'TTS_FETCH_TIKTOK_STATS_REPLY') return;
      window.removeEventListener('message', handler);
      clearTimeout(timeout);
      const videos = e.data.videos || [];
      if (!videos.length) { resolve(0); return; }
      // Now update each clip in the DB by matching video ID to post_url
      updateTikTokStats(videos).then(resolve).catch(() => resolve(0));
    }
    window.addEventListener('message', handler);
    window.postMessage({ type: 'TTS_FETCH_TIKTOK_STATS' }, '*');
  });
}

async function updateTikTokStats(videos) {
  const today = new Date().toISOString().slice(0, 10);
  let updated = 0;
  for (const v of videos) {
    // Find clip with matching tiktok_post_url containing this video ID
    const clip = (clips||[]).find(c => c.tiktok_post_url && c.tiktok_post_url.includes(v.videoId));
    if (!clip) continue;
    const r = await fetch(`/admin/api/tracker/clips/${clip.id}/stats`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform:'tiktok', stat_date:today, views:v.views, likes:v.likes, comments:v.comments, shares:0 })
    });
    const d = await r.json();
    if (d.ok) updated++;
  }
  return updated;
}

async function autofillTikTok() {
  const btn = document.getElementById('tt-autofill-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Filling…'; }
  try {
    const clip = (clips || []).find(c => c.id === selId);
    if (!clip || !clip.output_url) throw new Error('No video generated yet for this clip.');
    const caption  = document.getElementById('pm-caption')?.value?.trim()  || clip.tiktok_caption  || clip.concept || '';
    const hashtags = document.getElementById('pm-hashtags')?.value?.trim() || clip.tiktok_hashtags || '';
    const filename = `clip-${selId}.mp4`;

    // Send to extension via admin-relay.js content script
    window.postMessage({ type: 'TTS_POST_TIKTOK', data: { videoUrl: clip.output_url, caption, hashtags, filename } }, '*');

    // Listen for reply
    const reply = await new Promise((resolve, reject) => {
      const handler = (e) => {
        if (e.data?.type === 'TTS_POST_TIKTOK_REPLY') {
          window.removeEventListener('message', handler);
          resolve(e.data);
        }
      };
      window.addEventListener('message', handler);
      setTimeout(() => { window.removeEventListener('message', handler); reject(new Error('Extension did not respond — is the Turtle & Sun Chrome extension installed?')); }, 8000);
    });

    if (!reply.ok) throw new Error(reply.error || 'Extension error');
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Auto-fill TikTok'; }
    // Extension will show a banner in TikTok Studio when done
  } catch(e) {
    alert('Auto-fill failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Auto-fill TikTok'; }
  }
}

async function editOnInstagram() {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  const text = [caption, hashtags].filter(Boolean).join('\n\n');
  const pd = (postCache[selId]||{}).instagram || {};
  // /reels/ URLs open a viewer popup; /p/ URLs open the editable post view
  const rawUrl = pd.post_url || '';
  const url = rawUrl.replace(/instagram\.com\/reels?\//i, 'instagram.com/p/');
  if (text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch(e) { /* clipboard not available */ }
  }
  if (url) {
    if (text) alert('Caption copied to clipboard!\n\nInstagram will open — tap the three dots on your post → Edit → paste.');
    window.open(url, '_blank');
  } else if (text) {
    alert('Caption copied to clipboard!\n\nOpen the post on Instagram, tap the three dots → Edit → paste.\n\n(Post URL not yet saved — it will be fetched automatically next time you open this modal.)');
  }
}

// ── Embedded content calendar ───────────────────────────────
const CAL_PLATS = [
  { key:'tiktok',    label:'TikTok',    dateKey:'tiktok_posted_at',    cls:'tiktok' },
  { key:'instagram', label:'Instagram', dateKey:'instagram_posted_at', cls:'instagram' },
  { key:'youtube',   label:'YouTube',   dateKey:'yt_posted_at',        cls:'youtube' },
  { key:'facebook',  label:'Facebook',  dateKey:'fb_posted_at',        cls:'facebook' },
];
const CAL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function calIso(d){return d.toISOString().slice(0,10);}

function loadCal(){const n=new Date();calCurrentYM=[n.getFullYear(),n.getMonth()];renderCal(clips);renderCalNav();}

function renderCalNav(){
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const nav=document.getElementById('cal-month-nav');
  if(!nav)return;
  if(!calCurrentYM){const n=new Date();calCurrentYM=[n.getFullYear(),n.getMonth()];}
  const curY=calCurrentYM[0], curM=calCurrentYM[1];
  // Year selector sits outside the scrollable area to avoid pointer-capture conflicts
  const arrowStyle='flex-shrink:0;padding:3px 9px;border-radius:5px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:#1C2A14;color:#FFE800';
  nav.style.overflow='hidden';
  nav.innerHTML=
    '<div style="display:flex;align-items:stretch;height:100%">'+
      // Fixed year selector
      '<div style="display:flex;align-items:center;gap:5px;padding:4px 10px;flex-shrink:0;background:#1C2A14;border-radius:10px 0 0 0">'+
        '<button style="'+arrowStyle+'" onclick="calChangeYear(-1)">&#9664;</button>'+
        '<span style="min-width:38px;text-align:center;font-size:13px;font-weight:700;color:#FFE800">'+curY+'</span>'+
        '<button style="'+arrowStyle+'" onclick="calChangeYear(1)">&#9654;</button>'+
      '</div>'+
      // Scrollable months
      '<div id="cal-scroll" style="overflow-x:auto;overflow-y:hidden;flex:1;cursor:grab;user-select:none;background:#e8e4dc">'+
        '<div style="display:flex;min-width:max-content;padding:4px 6px;gap:4px">'+
          MN.map(function(mn,mo){
            return '<button class="cal-month-btn'+(mo===curM?' active-month':'')+'" data-y="'+curY+'" data-m="'+mo+'" onclick="calJumpToMonth('+curY+','+mo+')">'+mn+'</button>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>';
  // Drag-to-scroll on the months area only
  var scroll=document.getElementById('cal-scroll');
  if(!scroll)return;
  var isDown=false,startX=0,scrollL=0;
  scroll.addEventListener('pointerdown',function(e){
    if(e.target.tagName==='BUTTON')return; // let month button clicks through
    isDown=true;startX=e.pageX-scroll.getBoundingClientRect().left;scrollL=scroll.scrollLeft;scroll.setPointerCapture(e.pointerId);
  });
  scroll.addEventListener('pointermove',function(e){if(!isDown)return;scroll.scrollLeft=scrollL-(e.pageX-scroll.getBoundingClientRect().left-startX);});
  scroll.addEventListener('pointerup',function(){isDown=false;});
}

function calJumpToMonth(yr,mo){
  calCurrentYM=[yr,mo];
  renderCal(clips);
  renderCalNav();
}

function calScrollToToday(){
  var wrap=document.getElementById('cal-wrap');
  if(!wrap)return;
  var now=new Date();
  calJumpToMonth(now.getFullYear(),now.getMonth());
}

function calChangeYear(delta){
  if(!calCurrentYM){const n=new Date();calCurrentYM=[n.getFullYear(),n.getMonth()];}
  calCurrentYM=[calCurrentYM[0]+delta,calCurrentYM[1]];
  renderCal(clips);
  renderCalNav();
}

function renderCal(clips){
  const todayStr=calIso(new Date());
  const byPlatDay={};
  CAL_PLATS.forEach(p=>{byPlatDay[p.key]={};});
  clips.forEach(c=>{
    CAL_PLATS.forEach(p=>{
      let ds=null;
      if(p.key==='youtube'){ds=c.yt_posted_at?fd(c.yt_posted_at):(c.yt_scheduled_at?fd(c.yt_scheduled_at):null);}
      else if(p.key==='tiktok'){ds=(c.tiktok_post_url&&c.tiktok_posted_at)?fd(c.tiktok_posted_at):null;}
      else{const v=c[p.dateKey];ds=v?fd(v):null;}
      if(!ds)return;
      if(!byPlatDay[p.key][ds])byPlatDay[p.key][ds]=[];
      byPlatDay[p.key][ds].push(c);
    });
  });
  if(!calCurrentYM){const n=new Date();calCurrentYM=[n.getFullYear(),n.getMonth()];}
  const [yr,mo]=calCurrentYM;
  const dim=new Date(yr,mo+1,0).getDate();
  const D31=Array.from({length:31},(_,i)=>i+1);
  let html='<div class="cal-day-head"><div class="cal-day-num"></div>';
  D31.forEach(d=>{
    const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const inv=d>dim;
    html+='<div class="cal-day-num'+(ds===todayStr?' today-day':'')+'" style="'+(inv?'color:#ccc':'')+'">'+( inv?'':`<strong>${d}</strong>`)+'</div>';
  });
  html+='</div>';
  CAL_PLATS.forEach(plat=>{
    html+='<div class="cal-row"><div class="plat-label"><span class="plat-pill plat-'+plat.key+'">'+plat.label+'</span></div>';
    D31.forEach(d=>{
      if(d>dim){html+='<div class="cal-cell no-day"></div>';return;}
      const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const dc=byPlatDay[plat.key][ds]||[];
      const nums=dc.map((c,i)=>'<span class="cal-num'+(c.id===selId?' sel-num':'')+'" title="'+esc(c.concept||'Clip')+'" onclick="pick('+c.id+')">'+(i+1)+'</span>').join('');
      html+='<div class="cal-cell'+(ds===todayStr?' today-day':'')+'">'+nums+'</div>';
    });
    html+='</div>';
  });
  document.getElementById('cal-body').innerHTML=html;
}
</script>
