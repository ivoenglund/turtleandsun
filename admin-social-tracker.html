<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Tracker — Turtle and Sun Admin</title>
<script src="/nav.js?v=20260602a"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f2ea;color:#1C0A00;font-size:13px}
.page{max-width:1400px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:8px}
h1{font-size:18px;font-weight:700}
.btn{padding:6px 13px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1C2A14;color:#FFE800}
.btn-primary:hover{background:#2d4a24}
.btn-secondary{background:#fff;border:1px solid #ccc;color:#333}
.btn-secondary:hover{background:#f5f5f5}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-danger{background:#c0392b;color:#fff}
.layout{display:grid;grid-template-columns:1fr;gap:12px;transition:grid-template-columns 0.15s}
.layout.split{grid-template-columns:1fr 360px}
.list-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;font-weight:700;color:#555;padding:8px 9px;border-bottom:1px solid #e8e4dc;text-align:left;white-space:nowrap;background:#faf8f4;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid #f0ece4;cursor:pointer}
tbody tr:hover{background:#faf8f4}
tbody tr.sel{background:#f0f7ea}
td{padding:7px 9px;vertical-align:middle}
.concept-name{font-weight:700;font-size:13px}
.ref-tag{font-size:10px;color:#888;margin-top:1px}
.tags-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tag{font-size:10px;padding:1px 6px;border-radius:20px}
.tag-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tag-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tag-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.pip{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.pip-y{background:#1C2A14;color:#FFE800}
.pip-n{background:#eee;color:#aaa;border:1px solid #ddd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.yt-num{color:#0F6E56;font-weight:700}
.muted{color:#aaa}
.empty{padding:40px;text-align:center;color:#aaa;font-size:13px}

/* Panel */
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;height:fit-content;position:sticky;top:16px}
.panel-head{background:#1C2A14;color:#FFE800;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-head h2{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-head button{background:none;border:none;color:#FFE800;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}
.panel-body{padding:14px;overflow-y:auto;max-height:80vh}
.section-label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.section-label:first-child{margin-top:0}
.tags-big{display:flex;flex-wrap:wrap;gap:4px}
.tbig{font-size:11px;padding:3px 9px;border-radius:20px}
.tbig-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tbig-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tbig-sty{background:#e3f0ff;color:#185FA5;border:1px solid #378ADD}
.tbig-moo{background:#f3e8ff;color:#534AB7;border:1px solid #7F77DD}
.tbig-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.plat-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ptab{font-size:11px;padding:4px 11px;border-radius:7px;border:1px solid #ccc;cursor:pointer;background:#fff;color:#555;font-weight:700}
.ptab:hover{background:#f5f5f5}
.ptab.act{background:#1C2A14;color:#FFE800;border-color:#1C2A14}
.ptab.np{opacity:.4;cursor:default}
.field{background:#faf8f4;border-radius:7px;padding:9px 11px;margin-bottom:7px}
.field-label{font-size:10px;color:#888;margin-bottom:3px}
.field-val{font-size:12px;color:#1C0A00;line-height:1.45;word-break:break-word}
.field-val.mono{font-size:11px;color:#555;word-break:break-all}
.field a{color:#185FA5;font-size:11px}
.field-input{width:100%;border:1px solid #ddd;border-radius:5px;padding:6px 8px;font-size:12px;background:#fff;color:#1C0A00;margin-top:3px}
.field-input:focus{outline:none;border-color:#1C2A14}
.not-posted{font-size:12px;color:#aaa;padding:10px 0}
.stats-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px}
.badge-auto{background:#e1f5ee;color:#0F6E56}
.badge-manual{background:#fffde7;color:#856700}
table.st{width:100%;border-collapse:collapse;font-size:11px}
table.st th{padding:4px 7px;color:#888;border-bottom:1px solid #eee;text-align:right;font-weight:700;white-space:nowrap}
table.st th:first-child{text-align:left}
table.st td{padding:4px 7px;border-bottom:1px solid #f5f5f5;text-align:right;font-variant-numeric:tabular-nums}
table.st td:first-child{text-align:left;color:#888}
table.st td.yt{color:#0F6E56;font-weight:700}
.log-form{background:#faf8f4;border-radius:7px;padding:10px;margin-top:8px}
.log-form h4{font-size:11px;font-weight:700;color:#555;margin-bottom:7px}
.log-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.log-row label{font-size:10px;color:#888;display:block;margin-bottom:2px}
.panel-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #eee}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:540px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:#555;font-weight:700;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:7px 9px;font-size:13px;color:#1C0A00;background:#fff}
.form-row textarea{resize:vertical;min-height:60px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:#1C2A14}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="toolbar-left">
      <h1>Social Tracker</h1>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" onclick="fetchYT(this)">&#8635; Fetch YouTube stats</button>
      <button class="btn btn-primary" onclick="showAddModal()">+ Add clip</button>
    </div>
  </div>

  <div class="layout" id="layout">
    <div class="list-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:28%">Concept</th>
            <th>Tags</th>
            <th title="TikTok">TT</th>
            <th title="Instagram">IG</th>
            <th title="YouTube">YT</th>
            <th title="Facebook">FB</th>
            <th class="num">Total views</th>
            <th class="num">YT views</th>
            <th class="num">TT views</th>
            <th>Added</th>
          </tr>
        </thead>
        <tbody id="clips-body">
          <tr><td colspan="10" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="panel" id="panel" style="display:none"></div>
  </div>
</div>

<!-- Add clip modal -->
<div class="modal-bg" id="add-modal" style="display:none">
  <div class="modal">
    <h3>Add clip</h3>
    <div class="form-row">
      <label>Concept name *</label>
      <input id="f-concept" placeholder="e.g. Royal Portrait">
    </div>
    <div class="form-row">
      <label>Ref tag * <span style="font-weight:400;color:#aaa">(unique ID for attribution)</span></label>
      <input id="f-ref" placeholder="e.g. tns-rp-jun05">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <label>Subject</label>
        <select id="f-subject">
          <option value="">—</option>
          <option>dog</option><option>cat</option><option>human</option><option>family</option><option>other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Subject name</label>
        <input id="f-name" placeholder="e.g. Bella">
      </div>
      <div class="form-row">
        <label>Occasion</label>
        <select id="f-occasion">
          <option value="">—</option>
          <option value="general">General</option>
          <option value="birthday">Birthday</option>
          <option value="fathers-day">Father's Day</option>
          <option value="mothers-day">Mother's Day</option>
          <option value="christmas">Christmas</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Style</label>
        <select id="f-style">
          <option value="">—</option>
          <option value="royal-portrait">Royal Portrait</option>
          <option value="talking-pet">Talking Pet</option>
          <option value="watercolor">Watercolor</option>
          <option value="before-after">Before/After</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Mood</label>
        <select id="f-mood">
          <option value="">—</option>
          <option>funny</option><option>heartfelt</option><option>dramatic</option><option>cute</option><option>elegant</option>
        </select>
      </div>
      <div class="form-row">
        <label>Custom tags <span style="font-weight:400;color:#aaa">(comma-separated)</span></label>
        <input id="f-custom" placeholder="e.g. before-after, transformation">
      </div>
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="f-notes" rows="2" placeholder="Optional"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="hideAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveClip()">Save clip</button>
    </div>
  </div>
</div>

<script src="/nav.js?v=20260602a"></script>
<script>
const PF = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook' };
let clips = [], selId = null, selPlat = 'tiktok', postCache = {}, statCache = {};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('sv-SE',{month:'short',day:'numeric'}) : '—'; }

async function load() {
  const r = await fetch('/admin/api/tracker/clips');
  const d = await r.json();
  clips = d.rows || [];
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('clips-body');
  if (!clips.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty">No clips yet. Click "+ Add clip" to get started.</td></tr>';
    return;
  }
  tbody.innerHTML = clips.map(c => {
    const tv = (+c.tiktok_views)+(+c.instagram_views)+(+c.youtube_views)+(+c.facebook_views);
    const tagHtml = [
      c.subject ? `<span class="tag tag-subj">${esc(c.subject)}${c.subject_name?' · '+esc(c.subject_name):''}</span>` : '',
      c.occasion && c.occasion!=='general' ? `<span class="tag tag-occ">${esc(c.occasion)}</span>` : '',
    ].filter(Boolean).join('');
    return `<tr onclick="pick(${c.id})" id="row-${c.id}" class="${selId===c.id?'sel':''}">
      <td><div class="concept-name">${esc(c.concept)}</div><div class="ref-tag">${esc(c.ref_tag)}</div></td>
      <td><div class="tags-row">${tagHtml||'<span class="muted">—</span>'}</div></td>
      <td><div class="pip ${c.tiktok_posted?'pip-y':'pip-n'}">TT</div></td>
      <td><div class="pip ${c.instagram_posted?'pip-y':'pip-n'}">IG</div></td>
      <td><div class="pip ${c.youtube_posted?'pip-y':'pip-n'}">YT</div></td>
      <td><div class="pip ${c.facebook_posted?'pip-y':'pip-n'}">FB</div></td>
      <td class="num">${tv ? tv.toLocaleString('sv-SE') : '<span class="muted">—</span>'}</td>
      <td class="num yt-num">${+c.youtube_views ? (+c.youtube_views).toLocaleString('sv-SE') : '<span class="muted">—</span>'}</td>
      <td class="num">${+c.tiktok_views ? (+c.tiktok_views).toLocaleString('sv-SE') : '<span class="muted">—</span>'}</td>
      <td style="font-size:11px;color:#888">${fmtDate(c.created_at)}</td>
    </tr>`;
  }).join('');
}

async function pick(id) {
  if (selId === id) { closePanel(); return; }
  selId = id; selPlat = 'tiktok';
  renderTable();
  await loadPosts(id);
  await loadStats(id);
  renderPanel();
}

async function loadPosts(id) {
  const r = await fetch(`/admin/api/tracker/clips/${id}/posts`);
  const d = await r.json();
  const map = {};
  (d.rows||[]).forEach(p => map[p.platform] = p);
  postCache[id] = map;
}

async function loadStats(id) {
  const r = await fetch(`/admin/api/tracker/clips/${id}/stats`);
  const d = await r.json();
  statCache[id] = d.rows || [];
}

function renderPanel() {
  const c = clips.find(x => x.id === selId);
  if (!c) return;
  const posts = postCache[selId] || {};
  const stats = statCache[selId] || [];
  const panel = document.getElementById('panel');

  const tagHtml = [
    c.subject ? `<span class="tbig tbig-subj">${esc(c.subject)}${c.subject_name?' — '+esc(c.subject_name):''}</span>` : '',
    c.occasion && c.occasion!=='general' ? `<span class="tbig tbig-occ">${esc(c.occasion)}</span>` : '',
    c.style ? `<span class="tbig tbig-sty">${esc(c.style)}</span>` : '',
    c.mood  ? `<span class="tbig tbig-moo">${esc(c.mood)}</span>` : '',
    ...(c.custom_tags||[]).map(t=>`<span class="tbig tbig-gen">${esc(t)}</span>`)
  ].filter(Boolean).join('');

  const tabs = ['tiktok','instagram','youtube','facebook'].map(p => {
    const has = !!posts[p];
    return `<button class="ptab ${p===selPlat?'act':''} ${!has?'np':''}" onclick="${has?`switchPlat('${p}')`:''}">${PF[p]}${has?' ✓':''}</button>`;
  }).join('');

  const pd = posts[selPlat];
  let fieldsHtml = '';
  if (pd) {
    if (selPlat === 'tiktok' || selPlat === 'instagram') {
      fieldsHtml = `
        <div class="field"><div class="field-label">Posted</div><div class="field-val">${esc(pd.posted_at||'')}</div></div>
        <div class="field"><div class="field-label">Post URL</div><div class="field-val"><a href="${esc(pd.post_url||'#')}" target="_blank">${esc(pd.post_url||'—')}</a></div></div>
        <div class="field"><div class="field-label">Caption</div><div class="field-val">${esc(pd.caption||'—')}</div></div>
        <div class="field"><div class="field-label">Hashtags</div><div class="field-val mono">${esc(pd.hashtags||'—')}</div></div>
        ${selPlat==='instagram' && pd.alt_text ? `<div class="field"><div class="field-label">Alt text</div><div class="field-val">${esc(pd.alt_text)}</div></div>` : ''}`;
    } else if (selPlat === 'youtube') {
      fieldsHtml = `
        <div class="field"><div class="field-label">Posted</div><div class="field-val">${esc(pd.posted_at||'')}</div></div>
        <div class="field"><div class="field-label">Post URL</div><div class="field-val"><a href="${esc(pd.post_url||'#')}" target="_blank">${esc(pd.post_url||'—')}</a></div></div>
        <div class="field"><div class="field-label">Title</div><div class="field-val">${esc(pd.yt_title||'—')}</div></div>
        <div class="field"><div class="field-label">Description</div><div class="field-val" style="white-space:pre-line;font-size:11px">${esc(pd.yt_description||'—')}</div></div>
        <div class="field"><div class="field-label">Keyword tags</div><div class="field-val mono">${esc(pd.yt_keyword_tags||'—')}</div></div>
        <div class="field"><div class="field-label">Video ID <span style="font-size:10px;color:#aaa">(used for auto stats)</span></div><div class="field-val mono">${esc(pd.yt_video_id||'not set')}</div></div>`;
    } else if (selPlat === 'facebook') {
      fieldsHtml = `
        <div class="field"><div class="field-label">Posted</div><div class="field-val">${esc(pd.posted_at||'')}</div></div>
        <div class="field"><div class="field-label">Post URL</div><div class="field-val"><a href="${esc(pd.post_url||'#')}" target="_blank">${esc(pd.post_url||'—')}</a></div></div>
        <div class="field"><div class="field-label">Caption</div><div class="field-val">${esc(pd.fb_caption||'—')}</div></div>`;
    }
  } else {
    fieldsHtml = `<div class="not-posted">Not posted to ${PF[selPlat]} yet. <button class="btn btn-sm btn-secondary" onclick="showPostModal('${selPlat}')">+ Add post info</button></div>`;
  }
  if (pd) {
    fieldsHtml += `<button class="btn btn-sm btn-secondary" style="margin-top:6px" onclick="showPostModal('${selPlat}')">Edit</button>`;
  }

  // Stats table
  let statsHtml = '';
  if (stats.length) {
    // Group by date, pivot platforms
    const dates = [...new Set(stats.map(s=>s.stat_date))].sort().reverse().slice(0,14);
    const plats = ['tiktok','instagram','youtube','facebook'];
    const byKey = {};
    stats.forEach(s => { byKey[s.stat_date+'_'+s.platform] = s; });
    const rows = dates.map(dt => {
      const cells = plats.map(p => {
        const s = byKey[dt+'_'+p];
        const v = s ? s.views.toLocaleString('sv-SE') : '—';
        const cls = p==='youtube' ? ' class="yt"' : '';
        const src = s && s.source==='api' ? ' title="auto-fetched"' : '';
        return `<td${cls}${src}>${v}${s&&s.source==='api'?' ↺':''}</td>`;
      }).join('');
      return `<tr><td>${dt}</td>${cells}</tr>`;
    }).join('');

    statsHtml = `
      <div class="stats-hd">
        <span></span>
        <div style="display:flex;gap:5px">
          <span class="badge badge-auto">YT ↺ auto</span>
          <span class="badge badge-manual">others manual</span>
        </div>
      </div>
      <table class="st">
        <thead><tr><th>Date</th><th>TikTok</th><th>Instagram</th><th>YouTube</th><th>Facebook</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  panel.innerHTML = `
    <div class="panel-head">
      <h2>${esc(c.concept)}</h2>
      <button onclick="closePanel()">&#x2715;</button>
    </div>
    <div class="panel-body">
      <div class="section-label">Tags</div>
      <div class="tags-big">${tagHtml||'<span style="color:#aaa;font-size:12px">No tags</span>'}</div>

      <div class="section-label">Platform content</div>
      <div class="plat-tabs">${tabs}</div>
      ${fieldsHtml}

      <div class="section-label">
        <span>Stats</span>
        <button class="btn btn-sm btn-secondary" style="float:right;margin-top:-2px" onclick="toggleLogForm()">+ Log stats</button>
      </div>
      ${statsHtml || '<div class="not-posted">No stats logged yet.</div>'}

      <div id="log-form" style="display:none">
        <div class="log-form">
          <h4>Log stats manually</h4>
          <div class="log-row">
            <div>
              <label>Platform</label>
              <select id="log-plat" class="field-input">
                <option value="tiktok">TikTok</option>
                <option value="instagram">Instagram</option>
                <option value="youtube">YouTube</option>
                <option value="facebook">Facebook</option>
              </select>
            </div>
            <div>
              <label>Date</label>
              <input id="log-date" type="date" class="field-input" value="${new Date().toISOString().slice(0,10)}">
            </div>
          </div>
          <div class="log-row">
            <div><label>Views</label><input id="log-views" type="number" class="field-input" placeholder="0"></div>
            <div><label>Likes</label><input id="log-likes" type="number" class="field-input" placeholder="0"></div>
          </div>
          <div class="log-row">
            <div><label>Comments</label><input id="log-comments" type="number" class="field-input" placeholder="0"></div>
            <div><label>Shares</label><input id="log-shares" type="number" class="field-input" placeholder="0"></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="logStats()">Save stats</button>
        </div>
      </div>

      <div class="panel-actions">
        <button class="btn btn-secondary btn-sm" onclick="deleteClip(${c.id})">Delete clip</button>
      </div>
    </div>`;

  panel.style.display = 'block';
  document.getElementById('layout').className = 'layout split';
}

function switchPlat(p) { selPlat = p; renderPanel(); }
function closePanel() { selId = null; document.getElementById('panel').style.display = 'none'; document.getElementById('layout').className = 'layout'; renderTable(); }
function toggleLogForm() { const f = document.getElementById('log-form'); f.style.display = f.style.display==='none'?'block':'none'; }

async function logStats() {
  const body = {
    platform: document.getElementById('log-plat').value,
    stat_date: document.getElementById('log-date').value,
    views: +document.getElementById('log-views').value||0,
    likes: +document.getElementById('log-likes').value||0,
    comments: +document.getElementById('log-comments').value||0,
    shares: +document.getElementById('log-shares').value||0,
  };
  await fetch(`/admin/api/tracker/clips/${selId}/stats`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  await loadStats(selId);
  await load();
  renderPanel();
}

async function fetchYT(btn) {
  btn.disabled = true; btn.textContent = 'Fetching…';
  try {
    const r = await fetch('/admin/api/tracker/fetch-youtube-stats', { method:'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    btn.textContent = `✓ Updated ${d.updated} video${d.updated===1?'':'s'}`;
    await load();
    if (selId) { await loadStats(selId); renderPanel(); }
    setTimeout(() => { btn.disabled=false; btn.textContent='↻ Fetch YouTube stats'; }, 3000);
  } catch(e) {
    btn.disabled = false; btn.textContent = '↻ Fetch YouTube stats';
    alert('YouTube stats error: ' + e.message);
  }
}

async function deleteClip(id) {
  if (!confirm('Delete this clip and all its stats?')) return;
  await fetch(`/admin/api/tracker/clips/${id}`, { method:'DELETE' });
  closePanel();
  await load();
}

// Add clip modal
function showAddModal() { document.getElementById('add-modal').style.display='flex'; document.getElementById('f-concept').focus(); }
function hideAddModal() { document.getElementById('add-modal').style.display='none'; }

async function saveClip() {
  const concept = document.getElementById('f-concept').value.trim();
  const ref_tag = document.getElementById('f-ref').value.trim();
  if (!concept || !ref_tag) { alert('Concept name and ref tag are required'); return; }
  const custom_raw = document.getElementById('f-custom').value.trim();
  const custom_tags = custom_raw ? custom_raw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const body = {
    concept, ref_tag,
    subject: document.getElementById('f-subject').value || null,
    subject_name: document.getElementById('f-name').value.trim() || null,
    occasion: document.getElementById('f-occasion').value || null,
    style: document.getElementById('f-style').value || null,
    mood: document.getElementById('f-mood').value || null,
    custom_tags,
    notes: document.getElementById('f-notes').value.trim() || null,
  };
  const r = await fetch('/admin/api/tracker/clips', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { alert(d.error); return; }
  hideAddModal();
  await load();
  pick(d.clip.id);
}

// Post modal (add/edit platform info)
let postModalPlat = null;
function showPostModal(plat) {
  postModalPlat = plat;
  const pd = (postCache[selId]||{})[plat] || {};
  const c = clips.find(x=>x.id===selId);

  let fields = '';
  if (plat === 'tiktok') {
    fields = `
      <div class="form-row"><label>Posted date</label><input id="pm-date" type="date" value="${pd.posted_at||''}"></div>
      <div class="form-row"><label>Post URL</label><input id="pm-url" placeholder="https://tiktok.com/..." value="${esc(pd.post_url||'')}"></div>
      <div class="form-row"><label>Caption</label><textarea id="pm-caption" rows="3">${esc(pd.caption||'')}</textarea></div>
      <div class="form-row"><label>Hashtags</label><textarea id="pm-hashtags" rows="2">${esc(pd.hashtags||'')}</textarea></div>`;
  } else if (plat === 'instagram') {
    fields = `
      <div class="form-row"><label>Posted date</label><input id="pm-date" type="date" value="${pd.posted_at||''}"></div>
      <div class="form-row"><label>Post URL</label><input id="pm-url" value="${esc(pd.post_url||'')}"></div>
      <div class="form-row"><label>Caption</label><textarea id="pm-caption" rows="3">${esc(pd.caption||'')}</textarea></div>
      <div class="form-row"><label>Hashtags (max 30)</label><textarea id="pm-hashtags" rows="2">${esc(pd.hashtags||'')}</textarea></div>
      <div class="form-row"><label>Alt text</label><input id="pm-alt" value="${esc(pd.alt_text||'')}"></div>`;
  } else if (plat === 'youtube') {
    fields = `
      <div class="form-row"><label>Posted date</label><input id="pm-date" type="date" value="${pd.posted_at||''}"></div>
      <div class="form-row"><label>Post URL</label><input id="pm-url" value="${esc(pd.post_url||'')}"></div>
      <div class="form-row"><label>Video ID <span style="font-weight:400;color:#aaa">(from URL, used for auto stats)</span></label><input id="pm-ytid" placeholder="e.g. dQw4w9WgXcQ" value="${esc(pd.yt_video_id||'')}"></div>
      <div class="form-row"><label>Title</label><input id="pm-yttitle" value="${esc(pd.yt_title||'')}"></div>
      <div class="form-row"><label>Description</label><textarea id="pm-ytdesc" rows="4">${esc(pd.yt_description||'')}</textarea></div>
      <div class="form-row"><label>Keyword tags</label><input id="pm-ytkw" value="${esc(pd.yt_keyword_tags||'')}"></div>`;
  } else if (plat === 'facebook') {
    fields = `
      <div class="form-row"><label>Posted date</label><input id="pm-date" type="date" value="${pd.posted_at||''}"></div>
      <div class="form-row"><label>Post URL</label><input id="pm-url" value="${esc(pd.post_url||'')}"></div>
      <div class="form-row"><label>Caption</label><textarea id="pm-fbcap" rows="3">${esc(pd.fb_caption||'')}</textarea></div>`;
  }

  const existing = document.getElementById('post-modal-bg');
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.className = 'modal-bg';
  div.id = 'post-modal-bg';
  div.innerHTML = `<div class="modal">
    <h3>${PF[plat]} post info</h3>
    ${fields}
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="document.getElementById('post-modal-bg').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="savePost()">Save</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

async function savePost() {
  const plat = postModalPlat;
  const body = { platform: plat };
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  body.posted_at = g('pm-date') || null;
  body.post_url  = g('pm-url')  || null;
  if (plat === 'tiktok' || plat === 'instagram') {
    body.caption   = g('pm-caption')   || null;
    body.hashtags  = g('pm-hashtags')  || null;
    body.alt_text  = g('pm-alt')       || null;
  }
  if (plat === 'youtube') {
    body.yt_video_id     = g('pm-ytid')    || null;
    body.yt_title        = g('pm-yttitle') || null;
    body.yt_description  = g('pm-ytdesc')  || null;
    body.yt_keyword_tags = g('pm-ytkw')    || null;
  }
  if (plat === 'facebook') { body.fb_caption = g('pm-fbcap') || null; }

  await fetch(`/admin/api/tracker/clips/${selId}/posts`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  document.getElementById('post-modal-bg').remove();
  await loadPosts(selId);
  await load();
  renderPanel();
}

NavBar.init({ requireAuth: true }).then(() => load());
