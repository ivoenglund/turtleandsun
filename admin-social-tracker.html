<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Tracker — Turtle and Sun Admin</title>
<script src="/nav.js?v=20260602a"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f2ea;color:#1C0A00;font-size:13px}
.page{max-width:1400px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:8px}
h1{font-size:18px;font-weight:700}
.btn{padding:6px 13px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1C2A14;color:#FFE800}
.btn-primary:hover{background:#2d4a24}
.btn-secondary{background:#fff;border:1px solid #ccc;color:#333}
.btn-secondary:hover{background:#f5f5f5}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-danger{background:#c0392b;color:#fff}
.layout{display:grid;grid-template-columns:1fr;gap:12px;transition:grid-template-columns 0.15s}

.list-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;font-weight:700;color:#555;padding:8px 9px;border-bottom:1px solid #e8e4dc;text-align:left;white-space:nowrap;background:#faf8f4;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid #dedad2;cursor:pointer}
tbody tr:hover{background:#faf8f4}
tbody tr.sel{background:#e8f5e9;box-shadow:inset 3px 0 0 #1C2A14}
td{padding:7px 9px;vertical-align:middle}
.concept-name{font-weight:700;font-size:13px}
.ref-tag{font-size:10px;color:#888;margin-top:1px}
.tags-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tag{font-size:10px;padding:1px 6px;border-radius:20px}
.tag-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tag-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tag-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.pip{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.pip-y{background:#1C2A14;color:#FFE800}
.pip-n{background:#eee;color:#aaa;border:1px solid #ddd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.yt-num{color:#0F6E56;font-weight:700}
.muted{color:#aaa}
.empty{padding:40px;text-align:center;color:#aaa;font-size:13px}

/* Bottom panel */
.bottom-panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;margin-top:12px}
.bp-head{background:#1C2A14;color:#FFE800;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bp-head h2{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-head button{background:none;border:none;color:#FFE800;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}
.bp-body{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:16px;align-items:start}
@media(max-width:700px){.bp-body{grid-template-columns:1fr}}
.bp-video video{width:100%;border-radius:8px;background:#000;display:block}
.bp-video .no-video{aspect-ratio:9/16;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
.bp-chart{position:relative;min-height:220px}
.bp-no-stats{color:#aaa;font-size:12px;text-align:center;padding:40px 0}
.bp-actions{margin-top:10px;padding-top:10px;border-top:1px solid #eee;display:flex;gap:6px;flex-wrap:wrap}
.section-label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.section-label:first-child{margin-top:0}
.tags-big{display:flex;flex-wrap:wrap;gap:4px}
.tbig{font-size:11px;padding:3px 9px;border-radius:20px}
.tbig-subj{background:#e8f5e9;color:#1C2A14;border:1px solid #1C2A14}
.tbig-occ{background:#fffde7;color:#856700;border:1px solid #F9A825}
.tbig-sty{background:#e3f0ff;color:#185FA5;border:1px solid #378ADD}
.tbig-moo{background:#f3e8ff;color:#534AB7;border:1px solid #7F77DD}
.tbig-gen{background:#f5f5f5;color:#555;border:1px solid #ddd}
.plat-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ptab{font-size:11px;padding:4px 11px;border-radius:7px;border:1px solid #ccc;cursor:pointer;background:#fff;color:#555;font-weight:700}
.ptab:hover{background:#f5f5f5}
.ptab.act{background:#1C2A14;color:#FFE800;border-color:#1C2A14}
.ptab.np{opacity:.4;cursor:default}
.field{background:#faf8f4;border-radius:7px;padding:9px 11px;margin-bottom:7px}
.field-label{font-size:10px;color:#888;margin-bottom:3px}
.field-val{font-size:12px;color:#1C0A00;line-height:1.45;word-break:break-word}
.field-val.mono{font-size:11px;color:#555;word-break:break-all}
.field a{color:#185FA5;font-size:11px}
.field-input{width:100%;border:1px solid #ddd;border-radius:5px;padding:6px 8px;font-size:12px;background:#fff;color:#1C0A00;margin-top:3px}
.field-input:focus{outline:none;border-color:#1C2A14}
.not-posted{font-size:12px;color:#aaa;padding:10px 0}
.stats-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px}
.badge-auto{background:#e1f5ee;color:#0F6E56}
.badge-manual{background:#fffde7;color:#856700}
table.st{width:100%;border-collapse:collapse;font-size:11px}
table.st th{padding:4px 7px;color:#888;border-bottom:1px solid #eee;text-align:right;font-weight:700;white-space:nowrap}
table.st th:first-child{text-align:left}
table.st td{padding:4px 7px;border-bottom:1px solid #f5f5f5;text-align:right;font-variant-numeric:tabular-nums}
table.st td:first-child{text-align:left;color:#888}
table.st td.yt{color:#0F6E56;font-weight:700}
.log-form{background:#faf8f4;border-radius:7px;padding:10px;margin-top:8px}
.log-form h4{font-size:11px;font-weight:700;color:#555;margin-bottom:7px}
.log-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.log-row label{font-size:10px;color:#888;display:block;margin-bottom:2px}

/* ── Embedded calendar ─────────────────────────────────────── */
.cal-section{margin-top:20px}
.cal-section h2{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{padding:3px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
.cal-week-label{font-size:12px;font-weight:700;min-width:160px;text-align:center}
.cal-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
.cal-month-label{font-size:11px;font-weight:700;padding:6px 8px;background:#1C2A14;color:#FFE800;letter-spacing:.04em;min-width:900px;border-top:3px solid #e8e4dc}
.cal-day-head{display:grid;grid-template-columns:80px repeat(31,minmax(20px,1fr));border-bottom:1px solid #e8e4dc;background:#faf8f4;min-width:900px}
.cal-day-num{padding:2px 1px;text-align:center;font-size:9px;font-weight:700;color:#888;border-right:1px solid #f0ece4}
.cal-day-num.today-day{color:#856700;background:#fffde7}
.cal-row{display:grid;grid-template-columns:80px repeat(31,minmax(20px,1fr));border-bottom:1px solid #dedad2;min-height:26px;min-width:900px}
.cal-row:last-child{border-bottom:none}
.plat-label{padding:3px 5px;display:flex;align-items:center;justify-content:flex-end;border-right:1px solid #e8e4dc;background:#faf8f4}
.plat-pill{font-size:9px;font-weight:700;padding:2px 5px;border-radius:20px}
.plat-tiktok{background:#1C0A00;color:#fff}
.plat-instagram{background:#C13584;color:#fff}
.plat-youtube{background:#FF0000;color:#fff}
.plat-facebook{background:#1877F2;color:#fff}
.cal-cell{padding:1px 2px;border-right:1px solid #f0ece4;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px}
.cal-cell.today-day{background:#fffde7}
.cal-cell.no-day{background:#f8f6f2}
.cal-num{font-size:10px;font-weight:700;cursor:pointer;color:#1C2A14;padding:1px 2px;border-radius:3px;line-height:1.3}
.cal-num:hover{background:#FFE800}
.cal-num.sel-num{background:#FFE800;outline:1px solid #856700}
.pill-tiktok{background:#1C0A00;color:#fff}
.pill-instagram{background:#C13584;color:#fff}
.pill-youtube{background:#FF0000;color:#fff}
.pill-facebook{background:#1877F2;color:#fff}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:540px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:#555;font-weight:700;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:7px 9px;font-size:13px;color:#1C0A00;background:#fff}
.form-row textarea{resize:vertical;min-height:60px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:#1C2A14}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="toolbar-left">
      <h1>Social Tracker</h1>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" onclick="fetchYT(this)">&#8635; Fetch YouTube stats</button>
      <button class="btn btn-primary" onclick="showAddModal()">+ Add clip</button>
    </div>
  </div>

  <div class="layout" id="layout">
    <div class="list-wrap">
      <table>
        <thead>
          <tr>
            <th class="num" style="width:36px;color:#aaa">#</th>
            <th style="width:26%">Concept</th>
            <th>Tags</th>
            <th>TikTok</th>
            <th>Instagram</th>
            <th>YouTube</th>
            <th>Facebook</th>
            <th class="num">Total views</th>
            <th>Added</th>
          </tr>
        </thead>
        <tbody id="clips-body">
          <tr><td colspan="9" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div id="bottom-panel" style="display:block"></div>
<div style="max-width:1400px;margin:0 auto;padding:32px 16px 32px;border-top:2px solid #e8e4dc;margin-top:20px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <h2 style="font-size:14px;font-weight:700">Content Calendar</h2>
  </div>
  <div class="cal-wrap" style="overflow-x:auto">
    <div id="cal-body"></div>
  </div>
</div>

<!-- Add clip modal -->
<div class="modal-bg" id="add-modal" style="display:none">
  <div class="modal">
    <h3>Add clip</h3>
    <div class="form-row">
      <label>Concept name *</label>
      <input id="f-concept" placeholder="e.g. Royal Portrait">
    </div>
    <div class="form-row">
      <label>Ref tag * <span style="font-weight:400;color:#aaa">(unique ID for attribution)</span></label>
      <input id="f-ref" placeholder="e.g. tns-rp-jun05">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <label>Subject</label>
        <select id="f-subject">
          <option value="">—</option>
          <option>dog</option><option>cat</option><option>human</option><option>family</option><option>other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Subject name</label>
        <input id="f-name" placeholder="e.g. Bella">
      </div>
      <div class="form-row">
        <label>Occasion</label>
        <select id="f-occasion">
          <option value="">—</option>
          <option value="general">General</option>
          <option value="birthday">Birthday</option>
          <option value="fathers-day">Father's Day</option>
          <option value="mothers-day">Mother's Day</option>
          <option value="christmas">Christmas</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Style</label>
        <select id="f-style">
          <option value="">—</option>
          <option value="royal-portrait">Royal Portrait</option>
          <option value="talking-pet">Talking Pet</option>
          <option value="watercolor">Watercolor</option>
          <option value="before-after">Before/After</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Mood</label>
        <select id="f-mood">
          <option value="">—</option>
          <option>funny</option><option>heartfelt</option><option>dramatic</option><option>cute</option><option>elegant</option>
        </select>
      </div>
      <div class="form-row">
        <label>Custom tags <span style="font-weight:400;color:#aaa">(comma-separated)</span></label>
        <input id="f-custom" placeholder="e.g. before-after, transformation">
      </div>
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="f-notes" rows="2" placeholder="Optional"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="hideAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveClip()">Save clip</button>
    </div>
  </div>
</div>

<script src="/nav.js?v=20260602a"></script>
<script>
const PF = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', facebook:'Facebook' };
const PLAT_COLORS = { tiktok:'#1C0A00', instagram:'#C13584', youtube:'#FF0000', facebook:'#1877F2' };
let clips = [], selId = null, selPlat = 'tiktok', postCache = {}, statCache = {}, ytLiveCache = {};
let ttConnected = false;
let igConnected = false;
let chartInstance = null;
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('sv-SE',{month:'short',day:'numeric'}) : '—'; }
function fd(v) { if (!v) return ''; if (v instanceof Date) return v.toISOString().slice(0,10); return String(v).slice(0,10); }
function fdd(v) { return v ? new Date(fd(v)).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'}) : '—'; }

async function load() {
  const [r, ttR, igR] = await Promise.all([
    fetch('/admin/api/tracker/clips'),
    fetch('/admin/api/tiktok/status'),
    fetch('/admin/api/instagram/status'),
  ]);
  const d = await r.json();
  clips = d.rows || [];
  if (ttR.ok) { const ttD = await ttR.json(); ttConnected = !!ttD.connected; }
  if (igR.ok) { const igD = await igR.json(); igConnected = !!igD.connected; }
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('clips-body');
  if (!clips.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No clips yet. Click "+ Add clip" to get started.</td></tr>';
    return;
  }
  tbody.innerHTML = clips.map(c => {
    const tv = (+c.tiktok_views)+(+c.instagram_views)+(+c.youtube_views)+(+c.facebook_views);
    const tagHtml = [
      c.subject ? `<span class="tag tag-subj">${esc(c.subject)}${c.subject_name?' · '+esc(c.subject_name):''}</span>` : '',
      c.occasion && c.occasion!=='general' ? `<span class="tag tag-occ">${esc(c.occasion)}</span>` : '',
    ].filter(Boolean).join('');
    return `<tr onclick="pick(${c.id})" id="row-${c.id}" class="${selId===c.id?'sel':''}">
      <td class="num" style="color:#bbb;font-size:11px;font-weight:700">#${c.id}</td>
      <td><div class="concept-name">${esc(c.concept)}</div><div class="ref-tag">${esc(c.ref_tag)}</div></td>
      <td><div class="tags-row">${tagHtml||'<span class="muted">—</span>'}</div></td>
      <td><div style="display:flex;align-items:center;gap:4px"><div class="pip ${c.tiktok_posted?'pip-y':'pip-n'}"></div>${+c.tiktok_views?'<span style="font-size:11px">'+c.tiktok_views.toLocaleString('sv-SE')+'</span>':''}</div></td>
      <td><div style="display:flex;align-items:center;gap:4px"><div class="pip ${c.instagram_posted?'pip-y':'pip-n'}"></div>${+c.instagram_views?'<span style="font-size:11px">'+c.instagram_views.toLocaleString('sv-SE')+'</span>':''}</div></td>
      <td><div style="display:flex;align-items:center;gap:4px"><div class="pip ${c.youtube_posted?'pip-y':'pip-n'}"></div>${+c.youtube_views?'<span style="font-size:11px">'+c.youtube_views.toLocaleString('sv-SE')+'</span>':''}</div></td>
      <td><div style="display:flex;align-items:center;gap:4px"><div class="pip ${c.facebook_posted?'pip-y':'pip-n'}"></div>${+c.facebook_views?'<span style="font-size:11px">'+c.facebook_views.toLocaleString('sv-SE')+'</span>':''}</div></td>
      <td class="num">${tv ? tv.toLocaleString('sv-SE') : '<span class="muted">—</span>'}</td>
      <td style="font-size:11px;color:#888">${fmtDate(c.created_at)}</td>
    </tr>`;
  }).join('');
}

async function pick(id) {
  if (selId === id) return; // already selected — no toggle
  selId = id;
  renderTable();
  const selRow = document.getElementById('row-' + id);
  if (selRow) selRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const c = clips.find(x => x.id === id);
  await Promise.all([loadStats(id), loadPosts(id)]);
  if (c && c.yt_video_id && !ytLiveCache[id]) {
    try {
      const r = await fetch(`/admin/api/tracker/clips/${id}/youtube-live`, { headers: { 'Accept': 'application/json' } });
      if (r.ok) ytLiveCache[id] = await r.json();
    } catch(e) { /* non-fatal */ }
  }
  // Scroll calendar to the week this clip was published

  renderPanel();
}

async function loadPosts(id) {
  const r = await fetch(`/admin/api/tracker/clips/${id}/posts`);
  const d = await r.json();
  const map = {};
  (d.rows||[]).forEach(p => map[p.platform] = p);
  postCache[id] = map;
}

async function loadStats(id) {
  const r = await fetch(`/admin/api/tracker/clips/${id}/stats`);
  const d = await r.json();
  statCache[id] = d.rows || [];
}

function renderPanel() {
  const c = clips.find(x => x.id === selId);
  if (!c) return;
  const stats = statCache[selId] || [];
  const posts = postCache[selId] || {};
  const panel = document.getElementById('bottom-panel');

  // Live YouTube data
  const yt = ytLiveCache[selId];
  const ytInfoHtml = yt ? `
    <div style="margin-bottom:8px">
      <div style="font-size:12px;font-weight:700;color:#1C0A00;margin-bottom:3px">${esc(yt.title)}</div>
      ${yt.description ? `<div style="font-size:11px;color:#555;white-space:pre-line;max-height:60px;overflow:hidden">${esc(yt.description.slice(0,200))}${yt.description.length>200?'…':''}</div>` : ''}
      <div style="font-size:10px;color:#888;margin-top:4px">Published ${yt.published_at||'—'} &nbsp;·&nbsp; <a href="${esc(yt.url)}" target="_blank" style="color:#185FA5">Open on YouTube ↗</a></div>
    </div>` : '';

  // Video
  const videoHtml = c.output_url
    ? `<video src="${esc(c.output_url)}" controls playsinline></video>`
    : `<div class="no-video">No video yet</div>`;

  // Action buttons
  const ytEditBtn = c.yt_video_id
    ? `<button style="padding:3px 9px;font-size:10px;font-weight:700;border-radius:5px;border:none;background:#FF0000;color:#fff;cursor:pointer" onclick="showPostModal('youtube')">YouTube ✎</button>`
    : '';
  const otherEditBtns = ['tiktok','instagram','facebook'].map(p =>
    `<button style="padding:3px 9px;font-size:10px;font-weight:700;border-radius:5px;border:none;background:rgba(255,255,255,.2);color:#fff;cursor:pointer" onclick="showPostModal('${p}')">${PF[p]} ✎</button>`
  ).join('');

  panel.innerHTML = `
    <div class="bp-head">
      <div style="min-width:0;flex:1">
        <h2>${esc(c.concept)} <span style="font-size:11px;opacity:.7">${esc(c.ref_tag)}</span></h2>
      </div>
      <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
        ${ytEditBtn}${otherEditBtns}
        <button onclick="closePanel()" style="margin-left:4px">&#x2715;</button>
      </div>
    </div>
    <div class="bp-body">
      <div class="bp-video">${videoHtml}</div>
      <div class="bp-chart">
        ${ytInfoHtml}
        ${stats.length ? '<canvas id="views-chart"></canvas>' : '<div class="bp-no-stats">No stats yet — use Fetch YouTube stats to load them.</div>'}
      </div>
    </div>`;

  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  if (stats.length) {
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    // Normalise dates and build per-platform series
    const dates = [...new Set(stats.map(s => fd(s.stat_date)))].sort();
    const datasets = ['tiktok','instagram','youtube','facebook'].map(p => {
      const byDate = {};
      stats.filter(s => s.platform === p).forEach(s => { byDate[fd(s.stat_date)] = s.views; });
      if (!Object.keys(byDate).length) return null;
      return {
        label: PF[p],
        data: dates.map(d => byDate[d] ?? null),
        borderColor: PLAT_COLORS[p],
        backgroundColor: PLAT_COLORS[p] + '22',
        tension: 0.3, spanGaps: true, pointRadius: 3,
      };
    }).filter(Boolean);
    const ctx = document.getElementById('views-chart');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: dates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { font: { size: 10 }, boxWidth: 12 } } },
        scales: {
          x: { ticks: { font: { size: 10 }, maxRotation: 45 } },
          y: { beginAtZero: true, ticks: { font: { size: 10 } } }
        }
      }
    });
    ctx.parentElement.style.height = '220px';
  }
}

async function savePost() {

  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  body.posted_at = g('pm-date') || null;
  body.post_url  = g('pm-url')  || null;
  if (plat === 'tiktok' || plat === 'instagram') {
    body.caption   = g('pm-caption')   || null;
    body.hashtags  = g('pm-hashtags')  || null;
    body.alt_text  = g('pm-alt')       || null;
  }
  if (plat === 'youtube') {
    body.yt_video_id     = g('pm-ytid')    || null;
    body.yt_title        = g('pm-yttitle') || null;
    body.yt_description  = g('pm-ytdesc')  || null;
    body.yt_keyword_tags = g('pm-ytkw')    || null;
  }
  if (plat === 'facebook') { body.fb_caption = g('pm-fbcap') || null; }

  await fetch(`/admin/api/tracker/clips/${selId}/posts`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  document.getElementById('post-modal-bg').remove();
  await loadPosts(selId);
  await load();
  renderPanel();
}

async function syncToYouTube() {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  const yt = ytLiveCache[selId] || {};
  const clip = clips.find(x => x.id === selId) || {};
  const body = {
    yt_video_id:     clip.yt_video_id || yt.video_id || null,
    yt_title:        g('pm-yttitle') || null,
    yt_description:  g('pm-ytdesc')  || null,
    yt_keyword_tags: g('pm-ytkw')    || null,
  };
  const btn = document.querySelector('#post-modal-bg .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  try {
    const r = await fetch(`/admin/api/tracker/clips/${selId}/sync-youtube`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    document.getElementById('post-modal-bg').remove();
    delete ytLiveCache[selId]; // force re-fetch of live data
    await load();
    await pick(selId);
  } catch(e) {
    alert('Sync failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '▶ Sync to YouTube'; }

async function editOnInstagram() {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const caption = g('pm-caption');
  const hashtags = g('pm-hashtags');
  const text = [caption, hashtags].filter(Boolean).join('\n\n');
  const pd = (postCache[selId]||{}).instagram || {};
  // /reels/ URLs open a viewer popup; /p/ URLs open the editable post view
  const rawUrl = pd.post_url || '';
  const url = rawUrl.replace(/instagram\.com\/reels?\//i, 'instagram.com/p/');
  if (text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch(e) { /* clipboard not available */ }
  }
  if (url) {
    if (text) alert('Caption copied to clipboard!\n\nInstagram will open — tap the three dots on your post → Edit → paste.');
    window.open(url, '_blank');
  } else if (text) {
    alert('Caption copied to clipboard!\n\nOpen the post on Instagram, tap the three dots → Edit → paste.\n\n(Post URL not yet saved — it will be fetched automatically next time you open this modal.)');
  }
}

async function removeFromInstagram() {
  if (!confirm('Remove this clip from Instagram tracking?\n\nNote: the existing Instagram post must be deleted manually from the Instagram app.')) return;

async function reuploadToInstagram() {
  if (!confirm('This will upload a new version to Instagram.\n\nThe existing Instagram post must be deleted manually from the Instagram app.\n\nContinue?')) return;
  // Save caption/hashtags/alt text first so the new upload uses the latest text
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  const saveBody = { platform: 'instagram', caption: g('pm-caption'), hashtags: g('pm-hashtags'), alt_text: g('pm-alt') };
  await fetch(`/admin/api/tracker/clips/${selId}/posts`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(saveBody) });
  // Clear old Instagram tracking
  await fetch(`/admin/api/tracker/clips/${selId}/instagram`, { method: 'DELETE' });
  // Now upload fresh
  await uploadToInstagram();
}

async function uploadToInstagram() {
  const btn = document.getElementById('ig-upload-btn');
  const schedEl = document.getElementById('pm-ig-schedule');
  const schedVal = schedEl ? schedEl.value : '';
  const body = {};
  if (schedVal) body.scheduled_publish_time = Math.floor(new Date(schedVal).getTime() / 1000);
  if (btn) { btn.disabled = true; btn.textContent = schedVal ? 'Scheduling…' : 'Uploading…'; }
  try {
    const r = await fetch(`/admin/api/tracker/clips/${selId}/upload-instagram`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    document.getElementById('post-modal-bg').remove();
    await load();
    // Reload post cache so the panel shows updated Instagram data
    await loadPosts(selId);
    renderPanel();
    const msg = d.scheduled

      : d.permalink ? `✅ Published to Instagram!\n${d.permalink}` : '✅ Published to Instagram!';
    alert(msg);
  } catch(e) {
    alert('Instagram upload failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '▶ Upload to Instagram'; }
  }
}

// ── Embedded content calendar ───────────────────────────────
const CAL_PLATS = [
  { key:'tiktok',    label:'TikTok',    dateKey:'tiktok_posted_at',    cls:'tiktok' },
  { key:'instagram', label:'Instagram', dateKey:'instagram_posted_at', cls:'instagram' },
  { key:'youtube',   label:'YouTube',   dateKey:'yt_posted_at',        cls:'youtube' },
  { key:'facebook',  label:'Facebook',  dateKey:'fb_posted_at',        cls:'facebook' },
];
const CAL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function calIso(d){return d.toISOString().slice(0,10);}

function loadCal(){renderCal(clips);}

function renderCal(clips){
  const todayStr=calIso(new Date());
  const byPlatDay={};
  CAL_PLATS.forEach(p=>{byPlatDay[p.key]={}; });
  clips.forEach(c=>{
    CAL_PLATS.forEach(p=>{
      let ds=null;
      if(p.key==='youtube'){ds=c.yt_posted_at?fd(c.yt_posted_at):(c.yt_scheduled_at?fd(c.yt_scheduled_at):null);}
      else{const v=c[p.dateKey];ds=v?fd(v):null;}
      if(!ds)return;
      if(!byPlatDay[p.key][ds])byPlatDay[p.key][ds]=[];
      byPlatDay[p.key][ds].push(c);
    });
  });
  const allDates=Object.values(byPlatDay).flatMap(d=>Object.keys(d)).map(s=>new Date(s)).filter(d=>!isNaN(d));
  const now=new Date(),endY=now.getFullYear(),endM=now.getMonth();
  let startY=endY,startM=endM;
  if(allDates.length){const e=new Date(Math.min(...allDates.map(d=>d.getTime())));startY=e.getFullYear();startM=e.getMonth();}
  const months=[];
  let y=startY,m=startM;
  while(y<endY||(y===endY&&m<=endM)){months.push([y,m]);m++;if(m>11){m=0;y++;}}
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const D31=Array.from({length:31},(_,i)=>i+1);
  let html='';
  months.forEach(([yr,mo])=>{
    const dim=new Date(yr,mo+1,0).getDate();
    html+=`<div class="cal-month-label">${MN[mo]} ${yr}</div>`;
    html+='<div class="cal-day-head"><div class="cal-day-num"></div>';
    D31.forEach(d=>{
      const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inv=d>dim;
      html+=`<div class="cal-day-num${ds===todayStr?' today-day':''}" style="${inv?'color:#ddd':''}">${inv?'':`<strong>${d}</strong>`}</div>`;
    });
    html+='</div>';
    CAL_PLATS.forEach(plat=>{
      html+='<div class="cal-row"><div class="plat-label"><span class="plat-pill plat-'+plat.key+'">'+plat.label+'</span></div>';
      D31.forEach(d=>{
        if(d>dim){html+='<div class="cal-cell no-day"></div>';return;}
        const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dc=byPlatDay[plat.key][ds]||[];
        const nums=dc.map((c,i)=>`<span class="cal-num${c.id===selId?' sel-num':''}" title="${esc(c.concept||'Clip')}" onclick="pick(${c.id})">${i+1}</span>`).join('');
        html+=`<div class="cal-cell${ds===todayStr?' today-day':''}">${nums}</div>`;
      });
      html+='</div>';
    });
  });
  document.getElementById('cal-body').innerHTML=html||'<div style="padding:20px;color:#888;font-size:12px">No posts yet.</div>';
}
</script>
