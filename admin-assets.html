<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Storage — Admin</title>
<script src="/nav.js?v=20260611a"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f5f2ea;color:#1C0A00;font-size:13px;}
.page-header{padding:16px 24px 10px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
.page-header h1{font-size:18px;font-weight:800;}
.page-header .hint{font-size:12px;color:#888;}
.summary-bar{display:flex;gap:14px;flex-wrap:wrap;padding:10px 24px 12px;background:#fff;border-bottom:1px solid #e3dcc8;align-items:center;}
.summary-stat{display:flex;flex-direction:column;align-items:center;min-width:70px;}
.summary-stat .num{font-size:20px;font-weight:800;line-height:1;}
.summary-stat .lbl{font-size:10px;color:#888;margin-top:2px;text-align:center;}
.summary-stat.warn .num{color:#e53935;}
.summary-stat.good .num{color:#2e7d32;}
.summary-stat.ok .num{color:#e65100;}
.summary-divider{width:1px;background:#e3dcc8;height:32px;}
.migrate-btn{margin-left:auto;padding:8px 16px;border-radius:8px;border:none;background:#1C2A14;color:#FFE800;font-weight:700;font-size:13px;cursor:pointer;}
.migrate-btn:disabled{opacity:0.5;cursor:not-allowed;}
.migrate-msg{font-size:12px;color:#555;margin-left:6px;}
.filters{padding:10px 24px;background:#fff8ee;border-bottom:1px solid #e3dcc8;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{padding:6px 10px;border-radius:8px;border:1px solid #ccc;font-size:13px;}
.filters input{min-width:180px;}
.count{color:#888;font-size:12px;margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:20px 24px;}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid #e3dcc8;}
.card.needs-migration{border-color:#e53935;}
.thumb-wrap{width:100%;aspect-ratio:1/1;background:#eee;overflow:hidden;position:relative;cursor:pointer;}
.thumb-wrap img,.thumb-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.no-thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa;background:#f5f5f5;}
.storage-badge{position:absolute;top:6px;left:6px;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;}
.badge-r2{background:#c8e6c9;color:#1b5e20;}
.badge-cloudinary{background:#fff3cd;color:#7b5e00;}
.badge-fal{background:#ffccbc;color:#bf360c;}
.badge-other{background:#e3f2fd;color:#0d47a1;}
.table-badge{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;background:rgba(0,0,0,0.5);color:#fff;}
.card-body{padding:9px 11px;}
.card-name{font-weight:700;font-size:12px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-owner{font-size:11px;color:#3A6B20;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shown-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.shown-tag{padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;}
.tag-gallery{background:#e3f2fd;color:#0d47a1;}
.tag-account{background:#f3e5f5;color:#6a1b9a;}
.tag-triplet{background:#fff3e0;color:#e65100;}
.tag-none{background:#f5f5f5;color:#aaa;}
.card-url{font-size:9px;color:#ccc;word-break:break-all;margin-top:3px;line-height:1.3;}
.card-footer{display:flex;justify-content:flex-end;margin-top:6px;}
.btn-delete{padding:3px 9px;border-radius:6px;border:1.5px solid #e53935;background:#fff;color:#e53935;font-size:10px;font-weight:700;cursor:pointer;}
.btn-delete:hover{background:#e53935;color:#fff;}
.btn-delete:disabled{opacity:0.4;cursor:not-allowed;}
.loading{text-align:center;padding:60px;color:#aaa;grid-column:1/-1;}
.pagination{display:flex;gap:8px;justify-content:center;padding:20px;}
.pagination button{padding:7px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:13px;}
.pagination button.active{background:#1C2A14;color:#FFE800;border-color:#1C2A14;}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:999;align-items:center;justify-content:center;}
.lb.open{display:flex;}
.lb-inner{position:relative;max-width:90vw;max-height:90vh;}
.lb-inner img,.lb-inner video{max-width:90vw;max-height:88vh;border-radius:8px;display:block;}
.lb-close{position:absolute;top:-34px;right:0;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;}
</style>
</head>
<body class="ts-nav-loggedin ts-nav-admin">
<div class="sun"></div>
<script src="/currency.js?v=20260526a"></script>

<div class="page-header">
  <h1>Asset Storage</h1>
  <span class="hint"><a href="/admin" style="color:#3A6B20;text-decoration:none;">← Admin</a> &nbsp;·&nbsp; Every file — where it lives, who owns it, where it appears.</span>
</div>

<div class="summary-bar">
  <div class="summary-stat good" id="statR2"><div class="num">—</div><div class="lbl">On R2</div></div>
  <div class="summary-divider"></div>
  <div class="summary-stat ok"   id="statCloud"><div class="num">—</div><div class="lbl">Cloudinary</div></div>
  <div class="summary-divider"></div>
  <div class="summary-stat warn" id="statFal"><div class="num">—</div><div class="lbl">fal.ai</div></div>
  <div class="summary-divider"></div>
  <div class="summary-stat"      id="statTotal"><div class="num">—</div><div class="lbl">Total</div></div>
  <button class="migrate-btn" id="migrateBtn" onclick="runBackfill()">Migrate all to R2</button>
  <span class="migrate-msg" id="migrateMsg"></span>
</div>

<div class="filters">
  <input type="text" id="fSearch" placeholder="Search owner or name…" oninput="debounceLoad()">
  <select id="fTable" onchange="load(1)">
    <option value="">All tables</option>
    <option value="orders_output">Orders — output image</option>
    <option value="orders_video">Orders — output video</option>
    <option value="orders_input">Orders — upload photo</option>
    <option value="generations">Generations</option>
    <option value="concept_media">Concept media (gallery)</option>
  </select>
  <select id="fStorage" onchange="load(1)">
    <option value="">All storage</option>
    <option value="r2">R2 only</option>
    <option value="cloudinary">Cloudinary only</option>
    <option value="fal">fal.ai only</option>
  </select>
  <select id="fShown" onchange="load(1)">
    <option value="">All locations</option>
    <option value="front_gallery">Front page gallery</option>
    <option value="customer_account">Customer account</option>
    <option value="triplet">Triplet</option>
  </select>
  <span class="count" id="countLine"></span>
</div>

<div id="grid" class="grid"><div class="loading">Loading…</div></div>
<div class="pagination" id="pagination"></div>

<div class="lb" id="lb" onclick="closeLb()">
  <div class="lb-inner" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <img id="lbImg" src="" style="display:none">
    <video id="lbVid" controls style="display:none"></video>
  </div>
</div>

<script>
const PER_PAGE = 48;
let page = 1;
let allRows = [];
let debTimer;

function storageOf(url) {
  if (!url) return 'none';
  if (url.includes('cloudinary')) return 'cloudinary';
  if (url.includes('fal.') || url.includes('fal.run') || url.includes('fal.media')) return 'fal';
  return 'r2';
}

function storageBadge(url) {
  const s = storageOf(url);
  const map = {r2:['badge-r2','R2'], cloudinary:['badge-cloudinary','Cloudinary'], fal:['badge-fal','fal.ai'], none:['badge-other','No URL']};
  const [cls,lbl] = map[s] || ['badge-other','?'];
  return `<span class="storage-badge ${cls}">${lbl}</span>`;
}

const TABLE_LABELS = {
  orders_output:'order-img', orders_video:'order-vid', orders_input:'upload',
  generations:'generation', concept_media:'gallery'
};

function shownTags(shown_in) {
  if (!shown_in || !shown_in.length) return `<span class="shown-tag tag-none">Not shown</span>`;
  return shown_in.map(s => {
    if (s === 'front_gallery') return `<span class="shown-tag tag-gallery">Front gallery</span>`;
    if (s === 'customer_account') return `<span class="shown-tag tag-account">Customer account</span>`;
    if (s === 'triplet') return `<span class="shown-tag tag-triplet">Triplet</span>`;
    return `<span class="shown-tag tag-none">${s}</span>`;
  }).join('');
}

function isVideo(url) {
  return /\.(mp4|webm|mov)(\?|$)/i.test(url||'') || (url||'').includes('/video/');
}

function thumbContent(url) {
  if (!url) return `<div class="no-thumb">No file</div>`;
  if (isVideo(url)) {
    return `<video src="${url}" preload="metadata" muted onclick="openLb('${escAttr(url)}','video')"></video>`;
  }
  return `<img src="${url}" loading="lazy"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
    onclick="openLb('${escAttr(url)}','img')">
    <div class="no-thumb" style="display:none">No preview</div>`;
}

async function loadAll() {
  const table   = document.getElementById('fTable').value;
  const search  = document.getElementById('fSearch').value.trim();
  const storage = document.getElementById('fStorage').value;
  const shown   = document.getElementById('fShown').value;

  const params = new URLSearchParams();
  if (table)   params.set('table', table);
  if (search)  params.set('search', search);
  if (storage) params.set('storage', storage);
  if (shown)   params.set('shown_in', shown);
  params.set('limit', '2000');

  const d = await fetch('/admin/api/assets?' + params).then(r => r.json());
  allRows = d.rows || [];

  // Update summary counts
  let r2=0, cl=0, fa=0;
  allRows.forEach(r => {
    const s = storageOf(r.url);
    if (s==='r2') r2++;
    else if (s==='cloudinary') cl++;
    else if (s==='fal') fa++;
  });
  document.getElementById('statR2').querySelector('.num').textContent    = r2;
  document.getElementById('statCloud').querySelector('.num').textContent = cl;
  document.getElementById('statFal').querySelector('.num').textContent   = fa;
  document.getElementById('statTotal').querySelector('.num').textContent = allRows.length;

  if (cl === 0 && fa === 0) {
    document.getElementById('migrateBtn').textContent = 'All on R2 ✓';
    document.getElementById('migrateBtn').disabled = true;
  }
}

async function load(p = 1) {
  page = p;
  document.getElementById('grid').innerHTML = '<div class="loading">Loading…</div>';
  await loadAll();

  document.getElementById('countLine').textContent = `${allRows.length} assets`;

  const slice = allRows.slice((page-1)*PER_PAGE, page*PER_PAGE);
  if (!slice.length) {
    document.getElementById('grid').innerHTML = '<div class="loading">No assets found.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('grid').innerHTML = slice.map(r => {
    const needsMig = ['cloudinary','fal'].includes(storageOf(r.url));
    const tbl = TABLE_LABELS[r._type] || r._type;
    const canDelete = ['concept_media','orders_input','generations'].includes(r._type);
    const dbId = r.meta && (r.meta.media_id || r.meta.order_id || r.meta.gen_id);
    const deleteBtn = canDelete && dbId
      ? `<button class="btn-delete" onclick="deleteAsset('${r._type}',${dbId},this)" title="Delete from R2 and DB">Delete</button>`
      : '';
    return `<div class="card${needsMig?' needs-migration':''}">
      <div class="thumb-wrap">
        ${thumbContent(r.url)}
        ${storageBadge(r.url)}
        <span class="table-badge">${escHtml(tbl)}</span>
      </div>
      <div class="card-body">
        <div class="card-name" title="${escAttr(r.name)}">${escHtml(r.name)}</div>
        <div class="card-owner">👤 ${escHtml(r.owner || '—')}</div>
        <div class="shown-tags">${shownTags(r.shown_in)}</div>
        <div class="card-url">${r.url ? r.url.slice(-55) : 'No URL'}</div>
        ${deleteBtn ? '<div class="card-footer">' + deleteBtn + '</div>' : ''}
      </div>
    </div>`;
  }).join('');

  const pages = Math.ceil(allRows.length / PER_PAGE);
  document.getElementById('pagination').innerHTML = pages <= 1 ? '' :
    Array.from({length: pages}, (_, i) =>
      `<button class="${i+1===page?'active':''}" onclick="load(${i+1})">${i+1}</button>`
    ).join('');
}

async function runBackfill() {
  const btn = document.getElementById('migrateBtn');
  const msg = document.getElementById('migrateMsg');
  btn.disabled = true;
  msg.textContent = 'Running migration… (up to 60 seconds)';
  try {
    const d = await fetch('/admin/api/backfill-assets', {method:'POST'}).then(r=>r.json());
    msg.textContent = d.message || 'Started in background.';
    setTimeout(() => { load(page); msg.textContent = 'Done — refreshed.'; }, 10000);
  } catch(e) {
    msg.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}

function debounceLoad() {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => load(1), 350);
}

async function deleteAsset(type, id, btn) {
  if (!confirm('Delete this asset from R2 and the database? This cannot be undone.')) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await fetch(`/admin/api/assets/${type}/${id}`, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) {
      btn.closest('.card').remove();
      // update total count
      const cur = parseInt(document.getElementById('statTotal').querySelector('.num').textContent) || 0;
      document.getElementById('statTotal').querySelector('.num').textContent = Math.max(0, cur - 1);
    } else {
      alert(d.error || 'Delete failed');
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

function openLb(url, type) {
  const img = document.getElementById('lbImg');
  const vid = document.getElementById('lbVid');
  if (type === 'video') { img.style.display='none'; vid.style.display='block'; vid.src=url; vid.play().catch(()=>{}); }
  else { vid.pause(); vid.style.display='none'; img.style.display='block'; img.src=url; }
  document.getElementById('lb').classList.add('open');
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lbVid').pause();
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLb(); });

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

NavBar.init({ requireAuth: true }).then(() => load(1));
</script>
</body>
</html>
