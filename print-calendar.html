<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Calendar — Turtle and Sun</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{background:#fff!important;}.ts-bg,.sun{display:none!important;}body{font-family:'DM Sans',sans-serif;color:#1C0A00;display:flex;flex-direction:column;overflow:visible;background:#fff!important;}

/* ── Nav ──────────────────────────────────────────────────────────────────── */
.app-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;background:#fff!important;}
/* Nav bar: transparent so gradient shows through */
.btn-print-cal{padding:9px 22px;background:#3A6B20;color:#fff;border:none;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.btn-print-2x{background:#1a4a8a;}
.btn-print-cal:hover{background:#1C0A00;}

/* ── Poster (standing A2/A1 sheet of mini-months) ─────────────────────────── */
.poster{width:1200px;height:1697px;background:#fff;display:flex;flex-direction:column;padding:24px;box-sizing:border-box;font-family:'DM Sans',sans-serif;}
.poster-head{height:90px;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;padding:0 6px 10px;}
.poster-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:44px;font-weight:800;color:#1C0A00;letter-spacing:-0.02em;}
.poster-range{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:600;color:rgba(28,10,0,0.5);}
.poster-grid{flex:1;display:grid;gap:16px;align-content:space-evenly;justify-content:center;}
.poster-cell{position:relative;overflow:hidden;}
.poster-cell-inner{position:absolute;top:0;left:0;width:900px;transform-origin:top left;}
.poster-cell .cal-page{box-shadow:none;border:1px solid rgba(28,10,0,0.12);border-radius:2px;width:900px;height:636px;aspect-ratio:auto;padding:20px 24px 14px;}
.poster-cell .cal-page-footer{display:none;}
/* Chrome's print engine mangles flex/1fr sizing inside scaled content —
   every level gets an explicit height so nothing is left to negotiation. */
.poster-cell .cal-page-header{height:40px;padding-bottom:0;margin-bottom:4px;flex:none;}
.poster-cell .cal-dow-row{height:26px;margin-bottom:4px;flex:none;}
.poster-cell .cal-body{flex:none;height:528px;}
.poster-cell .cal-week-nums{height:528px;}
.poster-cell .cal-grid{height:528px;flex:none;width:calc(100% - 20px);}
body.no-weeknums .poster-cell .cal-grid{width:100%;}
.poster-foot{height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;color:rgba(28,10,0,0.4);letter-spacing:0.06em;}
/* Preview chrome (screen only) */
.poster-preview-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.poster-note{font-size:12px;color:rgba(28,10,0,0.55);}
.poster-scalebox{box-shadow:0 4px 28px rgba(0,0,0,0.13);border-radius:4px;overflow:hidden;background:#fff;}
/* Tiled print pieces */
.tile-page{position:relative;overflow:hidden;page-break-after:always;background:#fff;}
.tile-guide{position:absolute;z-index:5;border:0;border-color:#3A6B20;opacity:0.65;}
.tile-guide.v{border-left:1.5px dashed #3A6B20;top:0;bottom:0;width:0;}
.tile-guide.h{border-top:1.5px dashed #3A6B20;left:0;right:0;height:0;}
.tile-label{position:absolute;z-index:6;font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:700;color:#3A6B20;background:#fff;padding:1px 4px;opacity:0.85;}
/* Printing the preview page directly must never print the chrome. */
@media print{
  .poster-preview-bar{display:none!important;}
  .poster-scalebox{box-shadow:none!important;border-radius:0!important;}
}

/* ── Controls ─────────────────────────────────────────────────────────────── */
.controls-bar{background:transparent;border-bottom:none;padding:10px 24px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;flex-shrink:0;}
.ctrl{display:flex;flex-direction:column;gap:4px;}
.ctrl-lbl{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(28,10,0,0.4);}
.ctrl input[type=number],.ctrl select{padding:7px 10px;border:1.5px solid #e0dcd4;border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;color:#1C0A00;background:#fff;outline:none;}
.ctrl input[type=number]{width:68px;}
.ctrl select{width:auto;}
.ctrl input[type=number]:focus,.ctrl select:focus{border-color:#3A6B20;}
.ctrl-check{display:flex;align-items:center;gap:7px;padding-bottom:8px;}
.ctrl-check label{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.ctrl-check input[type=checkbox]{width:14px;height:14px;accent-color:#3A6B20;cursor:pointer;}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.main-area{flex:1;display:flex;min-height:0;overflow:hidden;}

/* ── Filter sidebar ───────────────────────────────────────────────────────── */
.filter-panel{width:220px;flex-shrink:0;background:transparent;border-right:none;overflow-y:auto;padding:16px;}
.fp-section{margin-bottom:18px;}
.fp-sec-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:rgba(28,10,0,0.35);margin-bottom:8px;}
.fp-sep{height:1px;background:rgba(28,10,0,0.07);margin:10px 0;}
.fp-check{display:flex;align-items:center;gap:7px;padding:3px 0;}
.fp-check label{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#1C0A00;display:flex;align-items:center;gap:5px;}
.fp-check input[type=checkbox]{width:13px;height:13px;accent-color:#3A6B20;cursor:pointer;flex-shrink:0;}
.fp-check.sub{padding-left:16px;}
.fp-check.sub2{padding-left:28px;}
.fp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── Calendar area ────────────────────────────────────────────────────────── */
.cal-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;align-items:center;background:#fff!important;}

/* ── Calendar page (screen = paper card) ─────────────────────────────────── */
.cal-page{background:#fff;box-shadow:0 4px 28px rgba(0,0,0,0.13);border-radius:4px;width:min(900px,100%);aspect-ratio:1.414/1;padding:24px 28px 16px;display:flex;flex-direction:column;flex-shrink:0;}

.cal-page-header{display:flex;align-items:baseline;justify-content:center;padding-bottom:6px;margin-bottom:6px;}
.cal-month-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:700;color:#1C0A00;letter-spacing:-0.02em;}


.cal-dow-row{display:flex;align-items:center;margin-bottom:5px;}
.cal-dow-wk{width:24px;flex-shrink:0;}
.cal-dow-cell{flex:1;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:#000;text-align:center;padding:3px 1px;}

.cal-body{display:flex;flex:1;}
.cal-week-nums{width:20px;flex-shrink:0;display:flex;flex-direction:column;}
.cal-week-num{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-size:8px;font-weight:700;color:#000;border-right:1.5px solid rgba(28,10,0,0.15);}
body.no-weeknums .cal-week-nums,body.no-weeknums .cal-dow-wk{display:none;}
.cal-grid{flex:1;overflow:visible;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(var(--rows,6),1fr);border-top:1.5px solid rgba(28,10,0,0.15);}
body.no-weeknums .cal-grid{border-left:1.5px solid rgba(28,10,0,0.15);}
.cal-cell{padding:6px 7px;overflow:visible;border-right:1.5px solid rgba(28,10,0,0.15);border-bottom:1.5px solid rgba(28,10,0,0.15);position:relative;}

.cal-cell.other-month{background:#faf8f5;}
.cal-cell.other-month .cal-day-num{color:rgba(28,10,0,0.18);}
.cal-cell.other-month .cal-events{display:none;}
.cal-day-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:#000;text-align:right;position:absolute;top:4px;right:5px;z-index:1;}
.cal-events{display:flex;flex-direction:column;gap:2px;padding-right:22px;}
.ev-icon{font-size:1.5em;line-height:1;vertical-align:middle;margin-right:1px;}
.cal-event{font-size:9px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;line-height:1.3;padding:1.5px 4px;border-radius:3px;word-break:break-word;}

/* Color mode */
body.color-mode .cal-event.birthday{color:#2d5a16;}
body.color-mode .cal-event.remembrance{color:rgba(28,10,0,0.6);}
body.color-mode .cal-event.occasion{color:#b85e10;}
body.color-mode .cal-event.milestone{color:#6b2d9a;}
/* B&W mode */
.cal-event{color:#1C0A00;background:none;padding-left:0;}
body:not(.color-mode) .cal-event.birthday::before{content:none;}
body:not(.color-mode) .cal-event.remembrance::before{content:'† ';}
body:not(.color-mode) .cal-event.occasion::before{content:none;}
body:not(.color-mode) .cal-event.milestone::before{content:'★ ';font-size:7px;vertical-align:middle;}

.cal-page-footer{margin-top:10px;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:700;color:rgba(28,10,0,0.5);letter-spacing:0.04em;}
.bday-photo{display:inline-block;width:14px;height:14px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;vertical-align:middle;}
body.color-mode .cal-event.holiday{color:#1a5276;}
body:not(.color-mode) .cal-event.holiday::before{content:'◉ ';font-size:7px;vertical-align:middle;}
body:not(.color-mode) .ev-icon{filter:grayscale(1);}
.cal-event.birthday{display:flex;align-items:center;gap:3px;}.cal-event.occasion,.cal-event.birthday{display:block;padding:0;background:none!important;overflow:visible;}.cal-cell.has-tiles{z-index:20;}.tiles-overlay{display:block;overflow:visible;margin:0 -10px;height:0;}
.tile-bday{background:#FFEE00!important;}.tile-occ{background:#FFBFA0!important;}.tile-mile{background:#FFEE00!important;}
body:not(.color-mode) .tile-bday,body:not(.color-mode) .tile-occ,body:not(.color-mode) .tile-mile{background:#e0e0e0!important;}body:not(.color-mode) .occasion-tile{background:#e0e0e0!important;filter:grayscale(1);}.occasion-tile{display:inline-block;text-align:center;vertical-align:top;width:min-content;max-width:47%;margin:1px 1px 0 0;background:#FFE800;border-radius:0;padding:1px 2px;font-size:9px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:#1C0A00!important;box-shadow:2px 3px 6px rgba(130,130,130,0.45);word-break:normal;overflow-wrap:break-word;line-height:1.4;}

#loading-msg{text-align:center;padding:60px;color:rgba(28,10,0,0.35);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;}

/* ── Print ─────────────────────────────────────────────────────────────────── */

/* Design 2 — Tiles */
body.design-2 .cal-grid{gap:8px;border:none;background:transparent;}
body.design-2 .cal-cell{border:1.5px solid rgba(28,10,0,0.15);border-radius:16px;}
body.design-2 .cal-week-num{border-right:none;padding-right:4px;}
body.design-2.no-weeknums .cal-grid{border-left:none;}
@media print {
  @page{margin:10mm 12mm 10mm 10mm;}
  html,body{height:100%;margin:0;padding:0;overflow:visible;background:#fff!important;}body{background:#fff!important;}.sun,.ts-bg{display:none!important;}
  .ts-nav-bar,.controls-bar,.filter-panel{display:none!important;}
  .app-shell{overflow:visible;}
  .main-area{flex:1;display:flex;height:auto;overflow:visible;min-height:0;}
  .cal-area{flex:1;display:flex;flex-direction:column;align-items:stretch;overflow:visible;padding:0;gap:0;min-height:0;}

  .cal-page{
    box-shadow:none;border-radius:0;max-width:100%;width:100%;
    padding:0;display:flex;flex-direction:column;
    flex:1;height:auto;aspect-ratio:unset;page-break-after:always;
  }
  .cal-page:last-child{page-break-after:auto;}

  .cal-page-header{padding-bottom:2mm;margin-bottom:2mm;margin-left:5mm;text-align:center;}
  .cal-month-name{font-size:26pt;}

  .cal-dow-row{display:flex;align-items:center;margin-bottom:2mm;}
  .cal-dow-wk{width:5mm;flex-shrink:0;}
  .cal-dow-cell{flex:1;text-align:center;}
  .cal-dow-cell{font-size:15pt;}

  .cal-body{display:flex;flex:1;min-height:0;overflow:hidden;width:100%;}
  .cal-week-nums{width:5mm;flex-shrink:0;display:flex;flex-direction:column;}
  .cal-week-num{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:1mm;font-size:6pt;font-weight:700;color:#000;border-right:1px solid #000;}
  .cal-grid{
    flex:1;
    overflow:visible;
    min-height:0;
    min-width:0;
    display:grid!important;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(var(--rows,6),1fr);
    border-top:1px solid #000;
    border-right:1px solid #000;
    border-bottom:1px solid #000;
  }
  body.no-weeknums .cal-grid{border-left:1px solid #000;}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell:nth-last-child(-n+7){border-bottom:none;}
  /* Design 2 print */
  body.design-2 .cal-grid{gap:5px;border:none;background:transparent;}
  body.design-2 .cal-cell{border:1px solid #000;border-radius:8px;}
  body.design-2 .cal-week-num{border-right:none;}
  body.design-2.no-weeknums .cal-grid{border-left:none;}

  .cal-cell{padding:4px 5px;overflow:visible;border-right:1px solid #000;border-bottom:1px solid #000;position:relative;}.cal-cell.has-tiles{z-index:20;position:relative;}

  .cal-day-num{font-size:9pt;position:absolute;top:3px;right:4px;z-index:1;}
  .cal-events{padding-right:18px;}
  .ev-icon{font-size:1.5em;line-height:1;vertical-align:middle;margin-right:1px;}
.cal-event{font-size:6.5pt;padding:1px 3px;border-radius:2px;line-height:1.25;}
  .cal-page-footer{font-size:8pt;color:#1C0A00;margin-top:5px;font-weight:700;letter-spacing:0.04em;margin-left:5mm;text-align:center;}
  .occasion-tile{box-shadow:1px 2px 3px rgba(130,130,130,0.35);border:0.5pt solid #d4b800;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:inline-block!important;width:min-content!important;max-width:47%;font-size:9px;padding:1px 2px;background:#FFE800!important;}
  .tile-bday{background:#FFEE00!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .tile-occ{background:#FFBFA0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body:not(.color-mode) .tile-bday,body:not(.color-mode) .tile-occ,body:not(.color-mode) .tile-mile{background:#e0e0e0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body:not(.color-mode) .occasion-tile{background:#e0e0e0!important;filter:grayscale(1);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body:not(.color-mode) .ev-icon{filter:grayscale(1);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body:not(.color-mode) .cal-event{color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .tiles-overlay{display:block;overflow:visible;margin:0 -4px;height:0;}
  .bday-photo{width:12px;height:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  body.color-mode .cal-event.birthday{color:#2d5a16!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.color-mode .cal-event.remembrance{color:#555!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.color-mode .cal-event.occasion{color:#b85e10!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.color-mode .cal-event.holiday{color:#1a5276!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.color-mode .cal-event.milestone{color:#6b2d9a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* Explicit page heights for landscape (A4: 210mm - 20mm margins, Letter: 215.9mm - 20mm) */
}

@media print and (orientation:portrait){
  .cal-grid{flex:none;width:179mm;}
  .cal-dow-row{width:184mm;}
}
</style>
<script src="/nav.js?v=20260618c"></script>
</head>
<body class="color-mode paper-a4" data-no-bg>


<div class="app-shell">
<div class="controls-bar">
  <div class="ctrl">
    <div class="ctrl-lbl">Year</div>
    <input type="number" id="yearInput" value="2026" min="1900" max="2100" oninput="renderCalendar()">
  </div>
  <div class="ctrl" id="monthCtrl">
    <div class="ctrl-lbl">Month</div>
    <select id="monthSel" onchange="renderCalendar()">
      <option value="0">January</option><option value="1">February</option>
      <option value="2">March</option><option value="3">April</option>
      <option value="4">May</option><option value="5">June</option>
      <option value="6">July</option><option value="7">August</option>
      <option value="8">September</option><option value="9">October</option>
      <option value="10">November</option><option value="11">December</option>
    </select>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">View</div>
    <select id="viewSel" onchange="onViewChange()">
      <option value="month">Month</option>
      <option value="year">Full year</option>
    </select>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">Paper</div>
    <select id="paperSel" onchange="applyPaper()">
      <option value="a4">A4</option>
      <option value="letter">US Letter</option>
    </select>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">Orientation</div>
    <select id="orientSel" onchange="applyOrientation()">
      <option value="landscape">Landscape</option>
      <option value="portrait">Portrait</option>
    </select>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">Week starts</div>
    <select id="weekStartSel" onchange="renderCalendar()">
      <option value="1">Monday</option>
      <option value="0">Sunday</option>
    </select>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">Design</div>
    <select id="designSel" onchange="applyDesign()">
      <option value="1">Grid</option>
      <option value="2">Tiles</option>
    </select>
  </div>
  <div class="ctrl-check">
    <input type="checkbox" id="colorCb" checked onchange="applyColor()">
    <label for="colorCb">Colour</label>
  </div>
  <div class="ctrl-check">
    <input type="checkbox" id="weekNumCb" checked onchange="applyWeekNums()">
    <label for="weekNumCb">Week numbers</label>
  </div>
  <div class="ctrl">
    <div class="ctrl-lbl">"Holidays"</div>
    <select id="countrySel" onchange="onCountryChange()">
      <option value="">None</option>
    </select>
  </div>
  <div class="ctrl-check">
    <input type="checkbox" id="holidayCb" checked onchange="renderCalendar()">
    <label for="holidayCb">Show</label>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;align-self:center;">
    <button class="btn-print-cal" onclick="window.print()">Print</button>
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">Poster start</span>
    <select id="posterStartSel" title="First month of the poster. 6-month poster = this month + the next five; 12-month = a full year from here."></select>
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">12-mo sheet</span>
    <select id="posterSizeSel" title="Sheet size for the 12-month poster. A2 (42×59 cm) fits a fridge door but has small text; A1 (59×84 cm) gives each month the same size as on the 6-month A2 — a wall calendar. The 6-month poster is always A2.">
      <option value="a2">A2 (fridge, dense)</option>
      <option value="a1">A1 (wall, comfy)</option>
    </select>
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">Poster</span>
    <div style="display:flex;gap:8px;">
      <button class="btn-print-cal" onclick="openPoster(6)" title="Build a 6-month poster (2×3 months on one standing A2 sheet) and show it on screen. Uses everything set on this page: filters, groups, holidays, week start, colors. Nothing prints until you choose a print mode in the preview.">Poster 6 mo</button>
      <button class="btn-print-cal btn-print-2x" onclick="openPoster(12)" title="Build a 12-month poster (3×4 months on one standing sheet, size per the 12-mo sheet selector) and show it on screen first.">Poster 12 mo</button>
    </div>
    <button class="btn-print-cal btn-print-2x" onclick="printLarge()">Print 2×</button>
    <button class="btn-print-cal btn-print-2x" onclick="printNormal()">Print 1×</button>
  </div>
</div>

<div class="main-area">
  <div class="filter-panel">
    <div class="fp-section">
      <div class="fp-sec-title">People</div>
      <div class="fp-check">
        <input type="checkbox" id="fp-living" onchange="renderCalendar()">
        <label for="fp-living">Living only</label>
      </div>
      <div class="fp-check">
        <input type="checkbox" id="fp-unrelated" checked onchange="renderCalendar()">
        <label for="fp-unrelated">Show unrelated</label>
      </div>
    </div>
    <div class="fp-sep"></div>
    <div class="fp-section">
      <div class="fp-sec-title">Types</div>
      <div class="fp-check">
        <input type="checkbox" id="typ-birthday" checked onchange="renderCalendar()">
        <label for="typ-birthday"><span class="fp-dot" style="background:#e8f0e0;border:1px solid #3A6B2044;"></span>Birthdays</label>
      </div>
      <div class="fp-check">
        <input type="checkbox" id="typ-remembrance" checked onchange="renderCalendar()">
        <label for="typ-remembrance"><span class="fp-dot" style="background:#f0ede6;border:1px solid rgba(28,10,0,0.12);"></span>Remembrances</label>
      </div>
      <div class="fp-check">

const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let _allContacts = [];
let _allOccasions = [];
let _contactMap = {};
let _contactGroups = {};
let _rawGroups = [];
let _groupById = {};
let _groupByName = {};

const _params = new URLSearchParams(location.search);

function ordinal(n) {
  if (n <= 0) return String(n);
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function load() {

// ── Group filter ──────────────────────────────────────────────────────────────
const GP_COLORS = ['#3A6B20','#1a4f8a','#8a4a1a','#4a1a8a','#1a7a5a','#8a1a4a'];
const FAMILY_COLOR = '#c0195a';

function buildGroupFilters() {
  const container = document.getElementById('groupChecks');
  container.innerHTML = '';
  const topGroups = _rawGroups.filter(g => !g.parent_group_id)
    .sort((a, b) => a.name === 'Family' ? -1 : b.name === 'Family' ? 1 : a.name.localeCompare(b.name));
  const subsByParent = {};
  _rawGroups.filter(g => g.parent_group_id).forEach(g => {
    if (!subsByParent[g.parent_group_id]) subsByParent[g.parent_group_id] = [];
    subsByParent[g.parent_group_id].push(g);
  });
  topGroups.forEach((g, i) => {
    const color = g.name === 'Family' ? FAMILY_COLOR : GP_COLORS[i % GP_COLORS.length];
    addGroupCheck(container, g, color, 0, subsByParent);
  });
}

function addGroupCheck(container, g, color, depth, subsByParent) {
  const div = document.createElement('div');
  div.className = 'fp-check' + (depth === 1 ? ' sub' : depth >= 2 ? ' sub2' : '');
  const dotSz = depth === 0 ? '8px' : '6px';
  const id = 'grp-' + g.id;
  div.innerHTML = `<input type="checkbox" id="${id}" data-group-name="${esc(g.name)}" checked onchange="onGroupCheck()"><label for="${id}"><span style="width:${dotSz};height:${dotSz};border-radius:50%;background:${color};flex-shrink:0;${depth>0?'opacity:0.7':''}"></span>${esc(g.name)}</label>`;
  container.appendChild(div);
  (subsByParent[g.id] || []).sort((a,b) => a.name.localeCompare(b.name))
    .forEach(sub => addGroupCheck(container, sub, color, depth + 1, subsByParent));
}

function toggleAllGroups(cb) {
  document.querySelectorAll('#groupChecks input[type=checkbox]').forEach(c => { c.checked = cb.checked; });
  renderCalendar();
}

function onGroupCheck() {
  const allChecked = [...document.querySelectorAll('#groupChecks input[type=checkbox]')].every(c => c.checked);
  document.getElementById('grp-all').checked = allChecked;
  renderCalendar();
}

function getActiveGroups() {
  if (document.getElementById('grp-all').checked) return null;
  const active = new Set();
  document.querySelectorAll('#groupChecks input[type=checkbox]').forEach(c => {
    if (c.checked) active.add(c.dataset.groupName);
  });
  return active;
}

function isGroupActive(groupName, active) {
  if (!active) return true;
  if (active.has(groupName)) return true;
  const g = _groupByName[groupName];
  if (!g || !g.parent_group_id) return false;
  const parent = _groupById[g.parent_group_id];
  return parent ? isGroupActive(parent.name, active) : false;
}

function isContactVisible(contactId, active, showOnlyLiving, showUnrelated) {
  const c = _contactMap[contactId];
  if (!c || c.is_me) return false;
  if (showOnlyLiving && c.died_on) return false;
  const groups = _contactGroups[contactId];
  if (!groups || groups.size === 0) return showUnrelated;
  if (!active) return true;
  for (const g of groups) { if (isGroupActive(g, active)) return true; }
  return false;
}

// ── Occasion data ─────────────────────────────────────────────────────────────
function getOccasionsForMonth(year, month) {
  const active        = getActiveGroups();
  const showOnlyLiving = document.getElementById('fp-living').checked;
  const showUnrelated  = document.getElementById('fp-unrelated').checked;
  const showBirthday   = document.getElementById('typ-birthday').checked;
  const showRem        = document.getElementById('typ-remembrance').checked;
  const showOcc        = document.getElementById('typ-occasion').checked;
  const showMilestone  = document.getElementById('typ-milestone').checked;

  const byDay = {};
  const add = (day, item) => { if (!byDay[day]) byDay[day] = []; byDay[day].push(item); };

  for (const c of _allContacts) {
    if (!isContactVisible(c.id, active, showOnlyLiving, showUnrelated)) continue;

    if (showBirthday && c.birthday) {
      const b = new Date(c.birthday.split('T')[0]);
      if (!isNaN(b) && b.getMonth() === month) {
        const birthYear = b.getFullYear();
        const age = birthYear > 1000 ? year - birthYear : null;
        if (age !== null && age < 0) continue; // not born yet in this calendar year
        const ageText = (age !== null && age >= 0) ? `${age} years` : '';
        const nameText = c.name || 'Unnamed';
        const bdayLabel = ageText ? `${nameText}, ${ageText}` : nameText;
        const _ageTxt = (age !== null && age >= 0) ? `<text x="21" y="40" text-anchor="middle" font-size="16" font-weight="800" font-family="Plus Jakarta Sans,sans-serif" fill="#1C0A00">${age}</text>` : '';
        const cakeHtml = `<svg width="22" height="28" viewBox="0 0 42 54" style="display:block;overflow:visible;margin:0 auto;"><rect x="4" y="24" width="34" height="20" rx="2" fill="none" stroke="#1C0A00" stroke-width="2.2"/><path d="M4 24 Q7 19 10 24 Q13 19 16 24 Q19 19 22 24 Q25 19 28 24 Q31 19 34 24 Q36 19 38 24" fill="white" stroke="#1C0A00" stroke-width="2"/><rect x="9" y="11" width="3.5" height="14" rx="1" fill="#e74c3c" stroke="#1C0A00" stroke-width="1.5"/><rect x="19" y="9" width="3.5" height="16" rx="1" fill="#2ecc71" stroke="#1C0A00" stroke-width="1.5"/><rect x="29" y="11" width="3.5" height="14" rx="1" fill="#9b59b6" stroke="#1C0A00" stroke-width="1.5"/><path d="M10.75 11 Q9 7.5 10.75 4.5 Q12.5 7.5 10.75 11Z" fill="#f39c12" stroke="#1C0A00" stroke-width="1"/><path d="M20.75 9 Q19 5.5 20.75 2.5 Q22.5 5.5 20.75 9Z" fill="#f39c12" stroke="#1C0A00" stroke-width="1"/><path d="M30.75 11 Q29 7.5 30.75 4.5 Q32.5 7.5 30.75 11Z" fill="#f39c12" stroke="#1C0A00" stroke-width="1"/><ellipse cx="10.75" cy="7" rx="0.9" ry="1.4" fill="#fff9"/><ellipse cx="20.75" cy="5" rx="0.9" ry="1.4" fill="#fff9"/><ellipse cx="30.75" cy="7" rx="0.9" ry="1.4" fill="#fff9"/>${_ageTxt}<rect x="2" y="43" width="38" height="4" rx="2" fill="#1C0A00"/></svg>`;
        const cleanName = esc(nameText).replace(/[,.]/g,' ').replace(/ +/g,' ').trim();
        const eventHtml = `${cakeHtml}<span style="display:block;text-align:center;margin-top:-4px;">${cleanName}</span>`;
        add(b.getDate(), { type: 'birthday', html: eventHtml, label: bdayLabel });
      }
    }

    if (showRem && c.died_on) {
      const d = new Date(c.died_on.split('T')[0]);
      if (!isNaN(d) && d.getMonth() === month && year >= d.getFullYear()) {
        add(d.getDate(), { type: 'remembrance', label: `† ${c.name || 'Unnamed'}` });
      }
    }
  }

  for (const o of _allOccasions) {
    if (!o.start_date) continue;
    const _oc = _contactMap[o.contact_id];
    if (!_oc) continue;
    if (!_oc.is_me && !isContactVisible(o.contact_id, active, showOnlyLiving, showUnrelated)) continue;
    const s = new Date(o.start_date.split('T')[0]);
    if (isNaN(s)) continue;

    if (o.frequency === 'yearly') {
      if (showOcc && s.getMonth() === month) {
        const startYear = s.getFullYear();
        const yrs = startYear > 1000 ? year - startYear : null;
        if (yrs !== null && yrs < 0) continue; // occasion hasn't started yet
        const cName = o.contact_name || _contactMap[o.contact_id]?.name || '';
        const base = cName ? `${cName}: ${o.name}` : o.name;
        const label = (yrs !== null && yrs > 0) ? `${base} (${yrs}y)` : base;
        add(s.getDate(), { type: 'occasion', label });
      }
    } else if (o.frequency === 'milestone') {
      if (showMilestone && s.getMonth() === month) {
        const startYear = s.getFullYear();
        const yrs = startYear > 1000 ? year - startYear : null;
        if (yrs !== null && yrs < 0) continue; // milestone hasn't happened yet
        const cName = o.contact_name || _contactMap[o.contact_id]?.name || '';
        const base = cName ? `${cName}: ${o.name}` : o.name;
        const label = (yrs !== null && yrs > 0) ? `${base} (${yrs}y)` : base;
        add(s.getDate(), { type: 'milestone', label });
      }
    } else {
      if (showOcc && s.getFullYear() === year && s.getMonth() === month) {
        const cName = _contactMap[o.contact_id]?.name || '';
        const label = cName ? `${cName}: ${o.name}` : o.name;
        add(s.getDate(), { type: 'occasion', label });
      }
    }
  }

  const typeOrder = { birthday: 0, remembrance: 1, occasion: 2, milestone: 3 };
  Object.values(byDay).forEach(arr => arr.sort((a, b) => (typeOrder[a.type]||0) - (typeOrder[b.type]||0)));
  return byDay;
}

// ── Render ────────────────────────────────────────────────────────────────────
function isoWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y) / 86400000 + 1) / 7);
}

function eventIcon(type, label) {
  if (type === 'birthday')    return birthdayIcon(label);
  if (type === 'remembrance') return '🕊️';
  if (type === 'milestone')   return milestoneIcon(label);
  if (type === 'holiday')     return holidayIcon(label);
  if (type === 'occasion')    return occasionIcon(label);
  return '•';
}

function renderMonthPage(year, month) {
  const byDay = getOccasionsForMonth(year, month);
  // Pre-compute tile HTML from byDay snapshot BEFORE the render loop can mutate anything
  const tileHtmlByDay = {};
  Object.keys(byDay).forEach(function(d) {
    const tileEvents = (byDay[d] || []).filter(function(e){ return e.type==='occasion'||e.type==='birthday'; });
    if (!tileEvents.length) return;
    tileHtmlByDay[d] = tileEvents.map(function(e, i) {
      var lbl = e.label || '';
      var h = (i + 1) * 31;
      for (var j = 0; j < lbl.length; j++) h = (h * 37 + lbl.charCodeAt(j)) & 0xFFFF;
      var angle = (h % 30) - 15;
      var ml = ((h >> 8) % 10) - 3;
      var st = 'transform:rotate('+angle+'deg);transform-origin:center center;';
      var tc='occasion-tile'+(e.type==='birthday'?' tile-bday':e.type==='occasion'?' tile-occ':e.type==='milestone'?' tile-mile':'');
      return '<div class="'+tc+'" style="'+st+'">'+(e.html!==undefined?e.html:esc(e.label).replace(/\.\s*$/,'').replace(/[;:]\s*/g,'<br>').replace(/[,.]\s*/g,' ').replace(/ {2,}/g,' ').trim())+'</div>';
    }).join('');
  });
  const startDay = parseInt((document.getElementById('weekStartSel') || {value:'1'}).value); // 0=Sun,1=Mon
  const allLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const labels = [...allLabels.slice(startDay), ...allLabels.slice(0, startDay)];

  const firstDayOfMonth = new Date(year, month, 1).getDay();
  const firstDow        = (firstDayOfMonth - startDay + 7) % 7;
  const daysInMonth     = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const totalRows       = Math.ceil((firstDow + daysInMonth) / 7);

  const dowHtml = `<div class="cal-dow-wk"></div>` +
    labels.map(d => `<div class="cal-dow-cell">${d}</div>`).join('');

  // Build separate week-number and day-cell lists
  let weekNums = '';
  let dayCells = '';
  for (let row = 0; row < totalRows; row++) {
    const rs = row * 7 - firstDow;
    let wkDate = (rs < 0) ? new Date(year, month, rs + 1)
               : (rs >= daysInMonth) ? new Date(year, month + 1, rs - daysInMonth + 1)
               : new Date(year, month, rs + 1);
    weekNums += `<div class="cal-week-num">${isoWeekNumber(wkDate)}</div>`;
    for (let col = 0; col < 7; col++) {
      const off = row * 7 + col - firstDow;
      let day, cur;
      if (off < 0)                 { day = daysInPrevMonth + off + 1; cur = false; }
      else if (off >= daysInMonth) { day = off - daysInMonth + 1;     cur = false; }
      else                         { day = off + 1;                    cur = true; }
      const events = cur ? (byDay[day] || []) : [];

      if (cur && document.getElementById('holidayCb')?.checked) {
        const hKey = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        (_holidays[hKey] || []).forEach(h => events.push({ type: 'holiday', label: h }));
      }
      const _hasTiles = events.some(e=>e.type==='occasion'||e.type==='birthday');
      dayCells += `<div class="cal-cell${cur ? '' : ' other-month'}${_hasTiles ? ' has-tiles' : ''}">`
        + `<div class="cal-day-num">${day}</div>`
        + (()=>{
          const otherEvents = events.filter(e=>e.type!=='occasion'&&e.type!=='birthday');
          const evHtml = otherEvents.map(e=>'<div class="cal-event '+e.type+'">'+(e.html!==undefined?e.html:'<span class="ev-icon">'+eventIcon(e.type,e.label)+'</span>'+esc(e.label))+'</div>').join('');
          const tileHtml = cur ? (tileHtmlByDay[day] || '') : '';
          return '<div class="cal-events">'+evHtml+'</div>'+(tileHtml?'<div class="tiles-overlay">'+tileHtml+'</div>':'');
        })()
        + `</div>`;
    }
  }

  return `<div class="cal-page">
  <div class="cal-page-header">
    <span class="cal-month-name">${MONTHS_FULL[month]} ${year}</span>
  </div>
  <div class="cal-dow-row">${dowHtml}</div>
  <div class="cal-body">
    <div class="cal-week-nums">${weekNums}</div>
    <div class="cal-grid" style="--rows:${totalRows}">${dayCells}</div>
  </div>
  <div class="cal-page-footer">turtleandsun.com</div>
</div>`;
}

async function loadCountries() {
  try {
    const data = await fetch('/api/holidays/countries').then(r => r.json());
    const sel = document.getElementById('countrySel');
    data.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {

      sel.appendChild(o);

async function loadHolidays(year, countryCode) {

  if (!countryCode) return;
  try {
    const data = await fetch(`/api/holidays?year=${year}&country=${countryCode}`).then(r => r.json());
    data.forEach(h => {
      if (!_holidays[h.date]) _holidays[h.date] = [];
      _holidays[h.date].push(h.localName || h.name);

// Poster: 6 months (2×3) or 12 months (3×4) on one standing sheet.
// Reuses renderMonthPage() so every filter, group, holiday, week-start,
// design and color setting on this page applies to the poster too.
// ═══════════════════════════════════════════════════════════════════════════
const MM2PX = 96 / 25.4; // css px per mm
const POSTER_W = 1200, POSTER_H = 1697; // design pixels, A-series ratio

let _posterState = null;

function populatePosterControls() {
  const sel = document.getElementById('posterStartSel');
  if (!sel || sel.options.length) return;
  MONTHS_FULL.forEach((m, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = m;
    sel.appendChild(o);
  });
  sel.value = '0';
}

// Additive holiday loading for posters spanning a year boundary
// (loadHolidays() resets the map, so merge manually).
async function ensureHolidaysForYears(years) {
  const code = document.getElementById('countrySel')?.value;
  if (!code || !document.getElementById('holidayCb')?.checked) return;
  const merged = {};
  for (const y of years) {
    try {
      const data = await fetch(`/api/holidays?year=${y}&country=${code}`).then(r => r.json());
      data.forEach(h => {
        if (!merged[h.date]) merged[h.date] = [];
        merged[h.date].push(h.localName || h.name);
      });
    } catch (e) { /* keep going */ }
  }
  _holidays = merged;
  _lastHolidayYear = null; // force renderCalendar to reload single-year later
}

function buildPosterHtml(startYear, startMonth, count) {
  const cols = count === 6 ? 2 : 3;
  const rows = count === 6 ? 3 : 4;
  const GAP = 16, PAD = 24;
  const gridW = POSTER_W - 2 * PAD;
  const cellW = (gridW - (cols - 1) * GAP) / cols;
  const scale = cellW / 900;
  const cellH = (900 / 1.41421) * scale;

  let cells = '';
  for (let i = 0; i < count; i++) {
    const y = startYear + Math.floor((startMonth + i) / 12);
    const m = (startMonth + i) % 12;
    cells += `<div class="poster-cell" style="width:${cellW.toFixed(1)}px;height:${cellH.toFixed(1)}px;">`
      + `<div class="poster-cell-inner" style="transform:scale(${scale.toFixed(5)});">`
      + renderMonthPage(y, m)
      + `</div></div>`;
  }

  const endIdx = startMonth + count - 1;
  const endYear = startYear + Math.floor(endIdx / 12);
  const endMonth = endIdx % 12;
  const range = (startYear === endYear)
    ? `${MONTHS_FULL[startMonth]} – ${MONTHS_FULL[endMonth]} ${startYear}`
    : `${MONTHS_FULL[startMonth]} ${startYear} – ${MONTHS_FULL[endMonth]} ${endYear}`;
  const title = (startYear === endYear) ? String(startYear) : `${startYear}–${endYear}`;

  return `<div class="poster poster-${count}">
    <div class="poster-head"><span class="poster-title">${title}</span><span class="poster-range">${range}</span></div>
    <div class="poster-grid" style="grid-template-columns:repeat(${cols},${cellW.toFixed(1)}px);">${cells}</div>
    <div class="poster-foot">turtleandsun.com — remember to love</div>
  </div>`;
}

async function openPoster(count) {
  if (!_loaded) return alert('Still loading your data — try again in a moment.');
  const startYear = parseInt(document.getElementById('yearInput').value) || new Date().getFullYear();
  const startMonth = parseInt(document.getElementById('posterStartSel').value) || 0;
  const years = [...new Set([startYear, startYear + Math.floor((startMonth + count - 1) / 12)])];
  await ensureHolidaysForYears(years);

  const html = buildPosterHtml(startYear, startMonth, count);
  _posterState = { html, count };

  const s = Math.min(680, window.innerWidth - 80) / POSTER_W;
  const size12 = document.getElementById('posterSizeSel').value;
  const tiledDesc = count === 6
    ? 'tiled = 4×A4 portrait, assembled ≈ 41×58 cm (A2 with 10 mm glue overlap)'
    : (size12 === 'a1'
        ? 'tiled = 8×A4 landscape, assembled ≈ 57×81 cm (A1 with 10 mm glue overlap)'
        : 'tiled = 4×A4 portrait, assembled ≈ 41×58 cm (A2 with 10 mm glue overlap)');
  document.getElementById('calArea').innerHTML = `
    <div class="poster-preview-bar">
      <button class="btn-print-cal" onclick="printPoster('a4')" title="Print the whole poster scaled onto ONE A4 page — the quick desk proof on your printer.">🖨 A4 proof</button>
      <button class="btn-print-cal btn-print-2x" onclick="printPoster('tiled')" title="Print at full poster size split across A4 sheets with 10 mm overlaps and dashed green glue-guides. Tape the sheets together for the fridge test. ${esc(tiledDesc)}">🖨 Tiled full-size</button>
      <button class="btn-print-cal" style="background:#888" onclick="renderCalendar()" title="Back to the normal month view.">← Back</button>
      <span class="poster-note">${esc(tiledDesc)} · A4 proof = whole poster on one sheet</span>
    </div>
    <div class="poster-scalebox" style="width:${(POSTER_W * s).toFixed(0)}px;height:${(POSTER_H * s).toFixed(0)}px;">
      <div style="transform:scale(${s.toFixed(5)});transform-origin:top left;">${html}</div>
    </div>`;
  window.scrollTo(0, 0);
}

function collectPageCss() {
  let css = '';
  for (const sheet of document.styleSheets) {
    try { for (const rule of sheet.cssRules) { css += rule.cssText + '\n'; } } catch (e) {}
  }
  return css;
}

function printPoster(mode) {
  if (!_posterState) return;
  const { html, count } = _posterState;
  const size = (count === 12 && document.getElementById('posterSizeSel').value === 'a1') ? 'a1' : 'a2';
  const css = collectPageCss();
  const bodyClass = document.body.className;
  let inner = '';
  let pageRule = '';

  if (mode === 'a4') {
    const targetW = 194 * MM2PX;              // A4 minus 8mm margins
    const s = targetW / POSTER_W;
    pageRule = '@page{size:A4 portrait;margin:8mm;}';
    inner = `<div style="width:${(POSTER_W * s).toFixed(0)}px;height:${(POSTER_H * s).toFixed(0)}px;overflow:hidden;">
      <div style="transform:scale(${s.toFixed(5)});transform-origin:top left;">${html}</div></div>`;
  } else {
    // Tiled: pieces overlap 10mm; dashed guides mark the glue line.
    const OV = 10;
    let cols, rows, pageWmm, pageHmm, s;
    if (size === 'a2') {
      cols = 2; rows = 2; pageWmm = 210; pageHmm = 297;
      s = (410 * MM2PX) / POSTER_W;           // fit width: 2×210−10 = 410mm
      pageRule = '@page{size:A4 portrait;margin:0;}';
    } else {
      cols = 2; rows = 4; pageWmm = 297; pageHmm = 210;
      s = (810 * MM2PX) / POSTER_H;           // fit height: 4×210−3×10 = 810mm
      pageRule = '@page{size:A4 landscape;margin:0;}';
    }
    const stepX = pageWmm - OV, stepY = pageHmm - OV;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const guides =
          (c < cols - 1 ? `<div class="tile-guide v" style="right:${OV}mm;"></div><div class="tile-label" style="right:${OV + 1}mm;top:4mm;">glue →</div>` : '') +
          (c > 0        ? `<div class="tile-guide v" style="left:${OV}mm;"></div>` : '') +
          (r < rows - 1 ? `<div class="tile-guide h" style="bottom:${OV}mm;"></div><div class="tile-label" style="bottom:${OV + 1}mm;left:4mm;">glue ↓</div>` : '') +
          (r > 0        ? `<div class="tile-guide h" style="top:${OV}mm;"></div>` : '');
        inner += `<div class="tile-page" style="width:${pageWmm}mm;height:${pageHmm}mm;">
          <div style="position:absolute;left:${(-c * stepX)}mm;top:${(-r * stepY)}mm;">
            <div style="transform:scale(${s.toFixed(5)});transform-origin:top left;">${html}</div>
          </div>${guides}
          <div class="tile-label" style="right:4mm;bottom:4mm;">sheet ${r * cols + c + 1}/${rows * cols} (row ${r + 1}, col ${c + 1})</div>
        </div>`;
      }
    }
  }

  const w = window.open('', '_blank', 'width=900,height=1200');
  if (!w) { alert('Please allow pop-ups for this site to print the poster'); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Poster print</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">'
    + '<style>\n' + css + '\n'
    + 'html,body{margin:0;padding:0;background:#fff;}'
    + '.tile-page{page-break-after:always;}'
    + '.tile-page:last-child{page-break-after:avoid;}'
    + '@media print{' + pageRule + 'body{margin:0!important;}}'
    + '</style></head><body class="' + bodyClass + '">'
    + inner + '</body></html>');
  w.document.close();
  w.focus();
  setTimeout(function () { w.print(); }, 900);
}

function printLarge() {
  const year     = parseInt(document.getElementById('yearInput').value) || new Date().getFullYear();
  const month    = parseInt(document.getElementById('monthSel').value);
  const startDay = parseInt((document.getElementById('weekStartSel') || {value:'1'}).value);

  const page1Html = renderHalfMonthPage(year, month, startDay, [0,1,2,3], {showHeader:true,  showFooter:false});
  const page2Html = renderHalfMonthPage(year, month, startDay, [4,5,6],   {showHeader:false, showFooter:true});

  // Collect all inline CSS rules from this page
  let css = '';
  for (const sheet of document.styleSheets) {
    try {
      for (const rule of sheet.cssRules) { css += rule.cssText + '\n'; }
    } catch(e) {}
  }

  const w = window.open('','_blank','width=900,height=1200');
  if (!w) { alert('Please allow pop-ups for this site to use Print 2\u00d7'); return; }
  const bodyClass = document.body.className;
  const monthName = MONTHS_FULL[month];
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8">'
    + '<title>Print 2\u00d7 \u2014 '+monthName+' '+year+'</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">'
    + '<style>\n'+css+'\n'
    + 'html,body{margin:0;padding:0;background:#fff;}'
    + '.cal-page{page-break-after:always;box-sizing:border-box;}'
    + '.cal-page:last-child{page-break-after:avoid;}'
    + '.cal-month-name{font-size:18pt!important;}'
    + '.cal-dow-cell{font-size:11pt!important;}'
    + '.cal-day-num{font-size:10pt!important;}'
    + '.cal-event{font-size:8pt!important;padding:2px 4px!important;}'
    + '.occasion-tile{display:inline-block!important;width:min-content!important;max-width:47%!important;padding:1px 2px!important;}'
    + '.cal-week-num{font-size:7pt!important;}'
    + 
    + '@media print{'
    + '@page{size:A4 portrait;margin:8mm;}'
    + 'body{margin:0!important;}'
    + '.cal-page{page-break-after:always!important;}'
    + '}'
    + '</style></head>'
    + '<body class="'+bodyClass+'">'
    + page1Html
    + page2Html
    + '</body></html>');
  w.document.close();
  w.focus();
  setTimeout(function(){ w.print(); }, 800);
}
