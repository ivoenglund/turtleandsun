<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;color:#1C0A00;margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column;background:#FBF6EC;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 24px 48px;width:100%;flex:1;}
  h1{font-size:24px;margin:0;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .btn{display:inline-block;padding:9px 16px;background:#3A6B20;color:#FFF9E6;border:none;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{background:#a12a1a;color:#fff;}
  .btn.secondary{background:#1C0A00;color:#fff;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e6e2d8;border-radius:10px;overflow:hidden;}
  #conceptTable{table-layout:fixed;}
  th{background:#FFF3C4;text-transform:uppercase;font-size:11px;letter-spacing:0.04em;font-weight:700;padding:10px 12px;text-align:left;border-bottom:1px solid #e6e2d8;}
  td{padding:9px 12px;border-bottom:1px solid #f0ede6;vertical-align:middle;font-size:13px;}
  tr:last-child td{border-bottom:none;}
  tr.concept-row:hover td{background:#fffdf5;}
  tr.expand-row td{padding:0;border-bottom:2px solid #3A6B20;}
  .expand-row iframe{display:block;width:100%;border:none;background:#fafaf5;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.03em;}
  .badge.active{background:#d4edbe;color:#2c5016;}
  .badge.inactive{background:#f0ede6;color:#888;}
  .badge.mood{background:#FFF3C4;color:#7a5c00;}
  .badge.dim-chip{background:#eef3ea;color:#2c5016;}
  .id-chip{font-size:11px;color:#aaa;font-weight:700;}
  .dim{font-weight:700;font-size:13px;color:#1C0A00;}
  .desc{color:#888;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;}
  /* Samples sub-grid */
  .samples-wrap{padding:0;background:#f7f5ef;}
  .samples-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#3A6B20;margin:0;padding:12px 16px 8px;}
  .samples-grid{width:100%;border-collapse:collapse;background:#fff;border-top:1px solid #d8d4cc;border-bottom:1px solid #d8d4cc;border-radius:0;overflow:hidden;margin-bottom:0;table-layout:fixed;}
  .samples-grid th{background:#f0ede6;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:7px 10px;text-align:left;border-bottom:1px solid #e6e2d8;}
  .samples-grid td{padding:8px 10px;border-bottom:1px solid #f5f3ee;vertical-align:middle;font-size:12px;}
  .samples-grid tr:last-child td{border-bottom:none;}
  .thumb{width:56px;height:42px;object-fit:cover;border-radius:4px;display:block;background:#e6e2d8;}
  .thumb-missing{width:56px;height:42px;border-radius:4px;background:#e6e2d8;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;}
  .add-sample-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid #e6e2d8;border-radius:8px;padding:12px 14px;}
  .add-sample-form label{font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:3px;}
  .add-sample-form input[type=text]{width:260px;padding:6px 10px;border:1px solid #d0ccc4;border-radius:6px;font-size:12px;font-family:inherit;}
  .add-sample-form select{padding:6px 10px;border:1px solid #d0ccc4;border-radius:6px;font-size:12px;font-family:inherit;background:#fff;}
  .sample-type-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;}
  .sample-type-badge.image{background:#dce8f5;color:#1a4e8a;}
  .sample-type-badge.video{background:#f5dcf0;color:#7a1a6e;}
  .flash{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;}
  .flash.ok{background:#e3f3d8;color:#2c5016;}
  .flash.err{background:#f7d9d4;color:#7a2114;}
  #newRow td{padding:0;border-bottom:2px solid #3A6B20;}
  #newRow iframe{display:block;width:100%;border:none;background:#fafaf5;}
  footer.ts-footer{text-align:center;padding:32px 20px;font-size:13px;opacity:0.6;}
  /* Sample drop zones */
  .sample-drop-zone{width:130px;height:100px;border:2px dashed #ccc;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:default;background:#fafaf5;transition:border-color 0.15s,background 0.15s;}
  .sample-drop-zone.dragover{border-color:#3A6B20;background:#eef3ea;}
  .sample-drop-zone .drop-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#aaa;}
  .sample-drop-zone .drop-hint{font-size:11px;color:#bbb;text-align:center;padding:0 8px;}
  .sample-drop-zone img,.sample-drop-zone video{max-width:120px;max-height:80px;border-radius:4px;object-fit:cover;}
  /* Lightbox */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;cursor:pointer;}
  #lightbox.open{display:flex;}
  #lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.6);}
  #lightbox video{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.6);}
</style>
</head>

<div class="wrap">
  <div class="top">
    <h1>Concepts</h1>
    <button class="btn" onclick="toggleNew()">+ New concept</button>
  </div>
  <div id="flash"></div>
  <table id="conceptTable">
    <thead>
      <tr>
        <th style="width:40px;" title="Concept ID — used for grid ordering">#</th>
        <th style="width:120px;" title="The event or occasion (e.g. Birthday, Anniversary, Valentine's Day)">Occasion</th>
        <th style="width:100px;" title="Who the loveogram is for (e.g. Mom, Partner, Best Friend)">Subject</th>
        <th style="width:120px;" title="The emotional action or theme (e.g. Celebrate, Thank, Cheer Up)">Action</th>
        <th style="width:100px;" title="Emotional tone of the concept (e.g. Warm, Playful, Romantic)">Mood</th>
        <th style="width:80px;" title="Visible = shown to customers. Hidden = draft or inactive.">Status</th>
        <th style="width:140px;" title="Edit or permanently delete this concept">Concept</th>
        <th style="width:90px;" title="Before/After sample pairs — drag media from the gallery to add">Samples</th>
        <th style="width:100px;" title="Social media clip generated from this concept's sample">Clip</th>
      </tr>
    </thead>
    <tbody id="conceptBody">
      <tr><td colspan="9" style="text-align:center;color:#aaa;padding:32px;">Loading…</td></tr>
    </tbody>
  </table>
</div>

<footer class="ts-footer">
  <p>Turtle and Sun — Admin</p>
</footer>

<script>
var openExpandId = null;
var openSamplesId = null;
var newOpen = false;
var formIsDirty = false;

// ── Listen for save/delete messages from the iframe ────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'form-dirty') { formIsDirty = true; }
  if (e.data.type === 'form-clean') { formIsDirty = false; }
  if (e.data.type === 'concept-saved') {
    formIsDirty = false;
    showFlash('Concept saved.', 'ok');
    collapseAll();
    loadConcepts();
  }
  if (e.data.type === 'concept-deleted') {
    showFlash('Concept deleted.', 'ok');
    collapseAll();
    loadConcepts();
  }
});

function showFlash(msg, kind) {
  var el = document.getElementById('flash');
  el.innerHTML = '<div class="flash ' + kind + '">' + msg + '</div>';
  setTimeout(function(){ el.innerHTML = ''; }, 4000);
}

function okToClose() {
  if (!formIsDirty) return true;
  return confirm('You have unsaved changes. Discard them?');
}

function collapseAll() {
  document.querySelectorAll('.expand-row').forEach(function(r){ r.remove(); });
  openExpandId = null;
  openSamplesId = null;
  document.getElementById('newRow') && closeNew();
  history.replaceState(null, '', location.pathname);
}

// ── New concept ────────────────────────────────────────────────────────────
function toggleNew() {
  if (newOpen) { if (!okToClose()) return; closeNew(); return; }
  if (!okToClose()) return;
  collapseAll();
  newOpen = true;
  var tbody = document.getElementById('conceptBody');
  // Insert a special row at the top
  var tr = document.createElement('tr');
  tr.id = 'newRow';
  tr.innerHTML = '<td colspan="9" style="padding:0;border-bottom:2px solid #3A6B20;"><iframe src="/admin/concepts/new" id="newIframe" style="display:block;width:100%;border:none;background:#fafaf5;" scrolling="no"></iframe></td>';
  tbody.insertBefore(tr, tbody.firstChild);
  autoResizeIframe(document.getElementById('newIframe'));
}

function closeNew() {
  var r = document.getElementById('newRow');
  if (r) r.remove();
  newOpen = false;
}

// ── Load concepts list ─────────────────────────────────────────────────────
function loadConcepts() {
  fetch('/admin/api/concepts/list')
    .then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ': ' + t); });
      return r.json();
    })
    .then(function(concepts){
      if (!Array.isArray(concepts)) throw new Error('Unexpected response: ' + JSON.stringify(concepts));
      renderGrid(concepts);
      var hm = location.hash.match(/^#s-(\d+)$/);
      if (hm) { setTimeout(function(){ toggleSamples(parseInt(hm[1], 10)); }, 80); }
    })
    .catch(function(err){
      document.getElementById('conceptBody').innerHTML =
        '<tr><td colspan="9" style="color:#a12a1a;padding:24px;">Error loading concepts: ' + err.message + '</td></tr>';
    });
}

function renderGrid(concepts) {
  var tbody = document.getElementById('conceptBody');
  if (!concepts.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#aaa;padding:32px;">No concepts yet.</td></tr>';
    return;
  }
  tbody.innerHTML = concepts.map(function(c) {
    var dim = [c.subject, c.occasion, c.action].filter(Boolean).join(' · ');
    var chip = function(v){ return v ? '<span class="badge dim-chip">' + escHtml(v) + '</span>' : '<span style="color:#ccc;">—</span>'; };
    var mood = c.mood ? '<span class="badge mood">' + escHtml(c.mood) + '</span>' : '<span style="color:#ccc;">—</span>';
    var status = c.active
      ? '<span class="badge active" title="This concept is published and visible to customers">Visible</span>'
      : '<span class="badge inactive" title="This concept is hidden — not shown to customers">Hidden</span>';
    return '<tr class="concept-row" data-id="' + c.id + '">' +
      '<td><span class="id-chip">' + c.id + '</span></td>' +
      '<td>' + chip(c.occasion) + '</td>' +
      '<td>' + chip(c.subject)  + '</td>' +
      '<td>' + chip(c.action)   + '</td>' +
      '<td>' + mood + '</td>' +
      '<td>' + status + '</td>' +
      '<td style="white-space:nowrap;">' +
        '<button class="btn small" title="Edit this concept\'s fields" onclick="toggleEdit(' + c.id + ')">Edit</button> ' +
        '<button class="btn small danger" title="Permanently delete this concept and all its samples" onclick="deleteConcept(' + c.id + ', \'' + escHtml(dim) + '\')">Delete</button>' +
      '</td>' +
      '<td>' +
        '<button class="btn small secondary" title="View and manage Before/After samples for this concept" onclick="toggleSamples(' + c.id + ')">Samples</button>' +
      '</td>' +
    '</tr>';  }).join('');
}

// ── Edit (expand inline) ───────────────────────────────────────────────────
function toggleEdit(id) {
  // If this one is already open, close it
  if (openExpandId === id) {
    if (!okToClose()) return;
    collapseAll();
    return;
  }
  if (!okToClose()) return;
  collapseAll();
  openExpandId = id;

  var conceptRow = document.querySelector('tr.concept-row[data-id="' + id + '"]');
  if (!conceptRow) return;

  var tr = document.createElement('tr');
  tr.className = 'expand-row';
  tr.dataset.forId = id;
  tr.innerHTML = '<td colspan="9" style="padding:0;border-bottom:2px solid #3A6B20;"><iframe src="/admin/concepts/edit/' + id + '" id="editIframe-' + id + '" style="display:block;width:100%;border:none;background:#fafaf5;" scrolling="no"></iframe></td>';
  conceptRow.insertAdjacentElement('afterend', tr);
  autoResizeIframe(document.getElementById('editIframe-' + id));
}

// ── Samples sub-grid ────────────────────────────────────────────
function toggleSamples(conceptId) {
  if (openSamplesId === conceptId) {
    collapseAll();
    return;
  }
  if (!okToClose()) return;
  collapseAll();
  openSamplesId = conceptId;
  history.replaceState(null, '', location.pathname + '#s-' + conceptId);

  var conceptRow = document.querySelector('tr.concept-row[data-id="' + conceptId + '"]');
  if (!conceptRow) return;

  var tr = document.createElement('tr');
  tr.className = 'expand-row';
  tr.dataset.forId = 'samples-' + conceptId;
  tr.innerHTML = '<td colspan="9"><div class="samples-wrap"><div class="samples-title">Samples for concept #' + conceptId + '</div><div id="samplesInner-' + conceptId + '"><em style="color:#aaa;font-size:12px;">Loading…</em></div></div></td>';
  conceptRow.insertAdjacentElement('afterend', tr);

  loadSamples(conceptId);
}

function loadSamples(conceptId) {
  fetch('/admin/api/concepts/' + conceptId + '/samples')
    .then(function(r){ return r.json(); })
    .then(function(samples){ renderSamples(conceptId, samples); })
    .catch(function(err){
      var el = document.getElementById('samplesInner-' + conceptId);
      if (el) el.innerHTML = '<span style="color:#a12a1a;font-size:12px;">Error: ' + escHtml(err.message) + '</span>';
    });
}

function renderSamples(conceptId, samples) {
  var el = document.getElementById('samplesInner-' + conceptId);
  if (!el) return;

  var rows = samples.map(function(s) {
    var beforeThumb = s.before_url
      ? '<img class="thumb" src="' + escHtml(s.before_url) + '" loading="lazy" style="cursor:pointer" onclick="openLightbox(\'' + escHtml(s.before_url) + '\',\'image\')">'
      : '<div class="thumb-missing">—</div>';
    var afterUrl = s.image_url || s.video_url || '';
    var afterType = s.video_url ? 'video' : 'image';
    var afterThumb = afterUrl
      ? (afterType === 'video'
          ? '<video class="thumb" src="' + escHtml(afterUrl) + '" muted playsinline style="cursor:pointer" onclick="openLightbox(\'' + escHtml(afterUrl) + '\',\'video\')"></video>'
          : '<img class="thumb" src="' + escHtml(afterUrl) + '" loading="lazy" style="cursor:pointer" onclick="openLightbox(\'' + escHtml(afterUrl) + '\',\'image\')">')
      : '<div class="thumb-missing">—</div>';
    var typeBadge = '<span class="sample-type-badge ' + afterType + '">' + afterType + '</span>';
    function tog(sId, field, val, cId) {
      var on = val ? 'badge active' : 'badge inactive';
      var label = val ? 'On' : 'Off';
      var tips = {active:'Click to enable/disable this sample',rolling:'Click to include/exclude from homepage rolling demo',gallery:'Click to include/exclude from the public gallery'};
      var tip = tips[field] || '';
      return '<span class="' + on + '" title="' + tip + '" style="cursor:pointer" onclick="toggleSampleFlag(' + sId + ',\'' + field + '\',' + cId + ')">' + label + '</span>';
    }
    return '<tr>' +
      '<td style="color:#aaa;font-size:11px;">#' + s.triplet_number + '</td>' +
      '<td>' + beforeThumb + '</td>' +
      '<td>' + afterThumb + '</td>' +
      '<td>' + typeBadge + '</td>' +
      '<td>' + tog(s.id,'active',s.active,conceptId) + '</td>' +
      '<td style="white-space:nowrap">' + tog(s.id,'rolling',s.in_rolling_demo,conceptId) + ' ' + tog(s.id,'gallery',s.in_gallery,conceptId) + '</td>' +
      '<td></td>' +
      '<td><button class="btn small danger" title="Permanently delete this sample" onclick="deleteSample(' + conceptId + ',' + s.id + ')">Delete</button></td>' +
      '<td>' + (s.clip_count > 0
        ? '<a class="btn small secondary" href="/admin/social-clips/' + s.clip_id + '" title="Open the social media clip editor for this sample">Edit clip</a>'
        : '<button class="btn small" title="Generate a social media clip (video) from this sample" onclick="createClip(' + s.id + ',' + conceptId + ')">Generate clip</button>') + '</td>' +
    '</tr>';
  }).join('');

  var tableHtml = samples.length
    ? '<table class="samples-grid"><colgroup><col style="width:40px"><col style="width:120px"><col style="width:100px"><col style="width:120px"><col style="width:100px"><col style="width:80px"><col style="width:140px"><col style="width:90px"><col></colgroup><thead><tr><th title="Sample number within this concept">#</th><th title="The original photo the customer submits">Before</th><th title="The AI-generated loveogram result">After</th><th title="Whether the result is an image or video">Type</th><th title="Toggle to enable or disable this sample">Active</th><th title="Rolling demo · Gallery visibility">Rolling · Gallery</th><th></th><th title="Delete this sample"></th><th title="Social media clip for this sample">Clip</th></tr></thead><tbody>' + rows + '</tbody></table>'
    : '<p style="font-size:12px;color:#aaa;margin:0 0 12px;">No samples yet.</p>';

  el.innerHTML = tableHtml +
    '<div class="add-sample-form" style="gap:12px;margin:14px 16px 16px;">' +
      '<div>' +
        '<div class="drop-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#555;margin-bottom:4px;">Before</div>' +
        '<div class="sample-drop-zone" id="beforeDrop-' + conceptId + '" title="Drag the original customer photo here from the gallery window"><span class="drop-hint">Drop from gallery</span></div>' +
      '</div>' +
      '<div>' +
        '<div class="drop-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#555;margin-bottom:4px;">After</div>' +
        '<div class="sample-drop-zone" id="afterDrop-' + conceptId + '" title="Drag the generated loveogram image or video here from the gallery window"><span class="drop-hint">Drop from gallery</span></div>' +
      '</div>' +
      '<div style="display:flex;align-items:flex-end;"><button class="btn small" title="Add a new sample using the media dropped above" onclick="addSample(' + conceptId + ')">+ Add sample</button></div>' +
    '</div>';

  setupSampleDropZone(document.getElementById('beforeDrop-' + conceptId), conceptId, 'before');
  setupSampleDropZone(document.getElementById('afterDrop-' + conceptId), conceptId, 'after');
}

var sampleDropData = {};

function setupSampleDropZone(zone, conceptId, slot) {
  if (!zone) return;
  var key = conceptId + '-' + slot;
  zone.addEventListener('dragover', function(e) {
    var types = e.dataTransfer ? (e.dataTransfer.types || []) : [];
    var ok = false;
    for (var i = 0; i < types.length; i++) {
      if (types[i] === 'application/x-ts-media' || types[i] === 'text/uri-list' || types[i] === 'text/plain') ok = true;
    }
    if (!ok) return;
    e.preventDefault();
    zone.classList.add('dragover');
  });
  zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
  zone.addEventListener('drop', function(e) {
    zone.classList.remove('dragover');
    e.preventDefault();
    var data;
    var json = e.dataTransfer.getData('application/x-ts-media');
    if (json) {
      try { data = JSON.parse(json); } catch(err) {}
    }
    if (!data || !data.url) {
      // Fallback: plain URL drag (from OS, browser image drag, etc.)
      var url = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').trim().split('\n')[0].trim();
      if (!url || !/^https?:\/\//i.test(url)) return;
      var kind = /\.(mp4|mov|webm|avi)(\?|$)/i.test(url) ? 'video' : 'image';
      data = { url: url, kind: kind };
    }
    sampleDropData[key] = data;
    zone.innerHTML = data.kind === 'video'
      ? '<video src="' + escHtml(data.url) + '" muted playsinline style="max-width:120px;max-height:88px;border-radius:4px;"></video>'
      : '<img src="' + escHtml(data.url) + '" style="max-width:120px;max-height:88px;border-radius:4px;object-fit:cover;">';
  });
}

function addSample(conceptId) {
  var beforeData = sampleDropData[conceptId + '-before'];
  var afterData  = sampleDropData[conceptId + '-after'];
  if (!beforeData) { alert('Drop a Before image from the gallery.'); return; }
  if (!afterData)  { alert('Drop an After image or video from the gallery.'); return; }
  var fd = new FormData();
  // Use media ID if valid, otherwise send URL for server to create a new media record
  if (beforeData.id && !isNaN(beforeData.id)) fd.append('before_media_id', beforeData.id);
  else fd.append('before_url', beforeData.url);
  if (afterData.id && !isNaN(afterData.id)) fd.append('after_media_id', afterData.id);
  else fd.append('after_url', afterData.url);
  fd.append('after_type', afterData.kind);
  fetch('/admin/api/concepts/' + conceptId + '/samples/add', { method: 'POST', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) { alert('Error: ' + j.error); return; }
      delete sampleDropData[conceptId + '-before'];
      delete sampleDropData[conceptId + '-after'];
      loadSamples(conceptId);
    })
    .catch(function(err){ alert('Error: ' + err.message); });
}

function deleteSample(conceptId, sampleId) {
  if (!confirm('Delete this sample?')) return;
  var fd = new FormData();
  fetch('/admin/api/concepts/' + conceptId + '/samples/' + sampleId + '/delete', { method: 'POST', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) { alert('Error: ' + j.error); return; }
      loadSamples(conceptId);
    })
    .catch(function(err){ alert('Error: ' + err.message); });
}

function toggleSampleFlag(sampleId, field, conceptId) {
  fetch('/admin/triplets/' + sampleId + '/toggle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'field=' + encodeURIComponent(field)
  })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) { alert('Toggle failed: ' + j.error); return; }
      loadSamples(conceptId);
    })
    .catch(function(err){ alert('Toggle failed: ' + err.message); });
}

function createClip(sampleId, conceptId) {
  fetch('/admin/api/social-clips/queue', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ triplet_ids: [sampleId], clip_style: 1 })
  })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) { alert('Error creating clip: ' + j.error); return; }
      var clipId = j.created && j.created[0];
      if (clipId) {
        window.location.href = '/admin/social-clips/' + clipId;
      } else {
        alert('Clip created — open Produce to find it.');
      }
    })
    .catch(function(err){ alert('Error: ' + err.message); });
}

// ── Delete ───────────────────────────────────────────────────────────────────────────
function deleteConcept(id, name) {
  if (!confirm('Delete concept "' + name + '"? This cannot be undone.')) return;
  var fd = new FormData();
  fetch('/admin/concepts/delete/' + id, { method: 'POST', body: fd })
    .then(function(){ showFlash('Concept deleted.', 'ok'); loadConcepts(); })
    .catch(function(){ showFlash('Delete failed.', 'err'); });
}

// ── Auto-resize iframe to fit its content ────────────────────────────────────────────
function autoResizeIframe(iframe) {
  function resize() {
    try {
      var h = iframe.contentDocument.body.scrollHeight;
      iframe.style.height = (h + 32) + 'px';
    } catch(e) {}
  }
  iframe.addEventListener('load', function() {
    resize();
    // Watch for content changes (dynamic fields)
    try {
      var mo = new MutationObserver(resize);
      mo.observe(iframe.contentDocument.body, { childList:true, subtree:true, attributes:true });
    } catch(e) {}
    // Check if iframe navigated to saved/deleted URL
    try {
      var url = iframe.contentWindow.location.href;
      if (url.indexOf('concept-saved') !== -1) {
        showFlash('Concept saved.', 'ok');
        collapseAll();
        loadConcepts();
      }
    } catch(e) {}
  });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openLightbox(url, type) {
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lbImg');
  var vid = document.getElementById('lbVid');
  if (type === 'video') {
    img.style.display = 'none'; img.src = '';
    vid.src = url; vid.style.display = 'block';
  } else {
    vid.style.display = 'none'; vid.src = '';
    img.src = url; img.style.display = 'block';
  }
  lb.classList.add('open');
}
function closeLightbox() {
  var lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.getElementById('lbVid').pause();
  document.getElementById('lbVid').src = '';
  document.getElementById('lbImg').src = '';
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLightbox(); });

loadConcepts();
</script>
