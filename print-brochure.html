}
function toggleRes(){
  const el=document.getElementById('res');
  el.classList.toggle('open');
  if(el.classList.contains('open')){ if(!RES.loaded) initContent(); else fetchContent(); }
  syncResLayout();
}

async function initContent(){
  const get=async u=>{ try{ const r=await fetch(u); return r.ok?await r.json():null; }catch(e){ return null; } };
  const [groups,counts]=await Promise.all([get('/api/groups'), get('/api/content/counts')]);
  const flat=[]; (function walk(list,depth){ (list||[]).forEach(g=>{
    flat.push({id:g.id,name:g.name,depth:depth}); walk(g.subgroups,depth+1); }); })(groups||[],0);
  RES.groups=flat;
  RES.counts=(counts&&counts.counts)||{};
  flat.forEach(g=>{ if(RES.on['g:'+g.id]===undefined) RES.on['g:'+g.id]=false; });
  RES.loaded=true;
  renderTree();
  fetchContent();
}

function renderTree(){
  const t=document.getElementById('resTree');
  const row=(id,label,checked,count,extra,sub)=>
    '<label class="frow'+(sub?' sub':'')+'"><input type="checkbox" data-f="'+id+'"'+(checked?' checked':'')+'>'+
      '<span class="c2"><span class="nm">'+esc(label)+'</span>'+(extra||'')+
      (count!=null?'<span class="ct">'+count+'</span>':'')+'</span></label>';
  let h='<div class="fh">Groups</div>';
  h+=RES.groups.map(g=>row('g:'+g.id, g.name, !!RES.on['g:'+g.id], RES.counts['g:'+g.id]||0, '', g.depth>0)).join('');
  h+=row('ungrouped','Ungrouped',RES.ungrouped,RES.counts.ungrouped||0);
  h+='<div class="fh">Sources</div>';
  // Timeline is NOT a <label>: the year fields live on the same row, and inside a
  // label every click on them would toggle the checkbox.
  h+='<div class="frow"><input type="checkbox" data-f="timeline"'+(RES.timeline?' checked':'')+'>'+
       '<span class="c2"><span class="nm" id="rTlLbl" style="cursor:pointer;flex:0 0 auto;">Timeline</span>'+
       '<span class="yrs"><input type="number" id="rY1" value="'+esc(RES.y1)+'">'+
       '<input type="number" id="rY2" value="'+esc(RES.y2)+'"></span></span></div>';
  h+=row('archive','Archive',RES.archive);
  h+='<div class="fh">Cards</div>';
  h+=row('cards','My cards',RES.cards,RES.cardList.length||null);
  h+='<div class="fh">Filter</div>';
  h+=row('living','Living',RES.living)+row('deceased','Deceased',RES.deceased)+
     row('people','People',RES.people)+row('pets','Pets',RES.pets);
  t.innerHTML=h;
  t.querySelectorAll('input[data-f]').forEach(cb=>{
    cb.onchange=()=>{
      const f=cb.dataset.f;
      if(f.slice(0,2)==='g:') RES.on[f]=cb.checked; else RES[f]=cb.checked;
      fetchContent();
    };
  });
  ['rY1','rY2'].forEach((id,i)=>{
    const el=document.getElementById(id); if(!el) return;
    el.oninput=()=>{ RES[i?'y2':'y1']=el.value; resDebounced(); };
  });
  const tl=document.getElementById('rTlLbl');
  if(tl) tl.onclick=()=>{ const cb=t.querySelector('input[data-f="timeline"]');
    cb.checked=!cb.checked; RES.timeline=cb.checked; fetchContent(); };
}

let resTimer=null;
function resDebounced(){ clearTimeout(resTimer); resTimer=setTimeout(fetchContent,350); }

async function fetchContent(){
  if(!resOpenPanel()) return;
  const body=document.getElementById('resBody');
  const mine=++RES.seq;
  try{
    const jobs=[fetch('/api/content?'+resQuery({preview:100}))];
    if(RES.cards&&RES.cardsDirty) jobs.push(fetch('/api/print-blocks'));
    const [r,rb]=await Promise.all(jobs);
    if(mine!==RES.seq) return;                  // a newer request has overtaken this one
    if(!r.ok){ body.textContent='Could not load your content.'; return; }
    RES.sections=(await r.json()).sections||[];
    if(rb&&rb.ok){ RES.cardList=((await rb.json()).blocks)||[]; RES.cardsDirty=false; }
    renderContent();
  }catch(e){ if(mine===RES.seq) body.textContent='Could not load your content.'; }
}

function resItemHtml(kind,o){
  if(kind==='contact') return personCard({_idx:-1,ref_type:'contact',content:o,overrides:{}});
  if(kind==='media')   return mediaBlock({_idx:-1,ref_type:'media',content:o,overrides:{caption:1}});
  // Every picture in the item, then its words cut to eight rows — enough to know
  // what it is without a long post filling the panel.
  return (o.photos||[]).map((_,i)=>
           postBlock({_idx:-1,ref_type:'post',content:o,overrides:{part:'img'+i}})).join('')+
         '<div class="clamp8">'+postBlock({_idx:-1,ref_type:'post',content:o,overrides:{}})+'</div>';
}
// A saved card previews as a real mini page: the same renderers, positioned
// exactly where the objects sit, scaled by each wrapper's font-size.
// A saved card previews as a real mini page. It has to apply what absWrap()
// applies — font, colour, background, rotation, stacking — or the preview lies:
// the .block.ffo rules inherit their font from the WRAPPER, so a wrapper with no
// font-family silently drops the chosen typeface.
//
// Scale: the thumbnail is its own little page, so pScale becomes W/794 and the
// font-size formula is the same one fsOf() uses. No ad-hoc numbers.
// Render the card at FULL PAGE SIZE, then shrink the whole thing with one CSS
// transform — the same technique the filmstrip uses, and the reason the filmstrip
// looks right.
//
// The previous version recomputed a tiny font-size per object. That cannot work:
// browsers enforce a minimum font size, so anything small refuses to shrink past
// it, becomes proportionally enormous and clips. Scaling the rendered result
// sidesteps the whole problem and is faithful by construction.
function cardThumbHtml(b, W){
  const P=paperOf(b.paper||(COMP&&COMP.params&&COMP.params.paper)||'a4');
  const natW=P.w*MMPX, natH=P.h*MMPX;
  const k=W/natW, H=Math.round(natH*k);
  const pS=natW/794;                       // this card's own paper scale
  const objHtml=(ov, inner)=>{
    const w=+ov.w||28, ts=(ov.ts?+ov.ts:1);
    const fs=Math.max(2, 13.5*(w/28)*ts*pS);     // exactly what fsOf() gives
    const st='position:absolute;left:'+(+ov.x||0)+'%;top:'+(+ov.y||0)+'%;width:'+w+'%;'+
      'font-size:'+fs.toFixed(2)+'px;z-index:'+(+ov.z||0)+';'+
      'border-radius:'+(ov.sq?'0':(4.5*pS).toFixed(1)+'px')+';'+
      ((+ov.r)?'transform:rotate('+(+ov.r)+'deg);':'')+
      (ov.ff?'font-family:'+esc(fontCss(ov.ff))+';':'')+
      (ov.tc?'color:'+esc(ov.tc)+';':'')+
      (ov.bg?'background:'+esc(ov.bg)+';padding:'+(5.4*pS).toFixed(1)+'px;':'')+
      (+ov.bw?'border:'+((+ov.bw)*pS).toFixed(1)+'px '+
        (BORDER_STYLES.includes(ov.bs)?ov.bs:'solid')+' '+esc(ov.bc||'#23291d')+';':'');
    return '<div class="'+(ov.sq?'sqo':'')+'" style="'+st+'">'+inner+'</div>';
  };
  const parts=[];
  (b.cover||[]).forEach(it=>parts.push({ z:+((it.overrides||{}).z)||0,
    h:objHtml(it.overrides||{}, cardInner({ ...it, _idx:-1 })) }));
  (b.texts||[]).forEach(t=>parts.push({ z:+t.z||0,
    h:objHtml(t, '<div class="block txtobj'+(t.ff?' ffo':'')+(t.tc?' tco':'')+'">'+
      '<div class="bd">'+sanitizeHtml(t.text||'')+'</div></div>') }));
  parts.sort((a,c)=>a.z-c.z);
  return '<div style="position:relative;width:'+W+'px;height:'+H+'px;background:#fff;'+
      'border:1px solid #e2dccb;border-radius:4px;overflow:hidden;">'+
      '<div style="position:absolute;top:0;left:0;width:'+natW.toFixed(0)+'px;height:'+natH.toFixed(0)+'px;'+
        'transform:scale('+k.toFixed(5)+');transform-origin:top left;">'+
        parts.map(x=>x.h).join('')+
      '</div></div>';
}

function renderContent(){
  const body=document.getElementById('resBody');
  const W=Math.round(RES.size*11);              // thumbnail column width follows the size
  const list=RES.cardList||[];
  const curPaper=(COMP&&COMP.params&&COMP.params.paper)||'a4';
  const cardsHtml = RES.cards
    ? '<div class="sechd"><b>My cards</b><span class="n">'+list.length+'</span></div>'+
      (list.length
        ? '<div class="rgrid">'+list.map(b=>
            '<div class="rcard'+((b.paper&&b.paper!==curPaper)?' paperOff':'')+
            '" draggable="true" data-blk="'+b.id+'" style="width:'+W+'px;" '+
            'title="'+esc(b.name)+' · '+esc((b.paper||'a4').toUpperCase())+
            ((b.paper&&b.paper!==curPaper)?' — built for a different paper':'')+' — drag it onto the page">'+
            '<button class="rdel" data-blkdel="'+b.id+'" title="Delete this card">✕</button>'+
            cardThumbHtml(b,W-18)+
            '<div class="rname" data-rn="'+b.id+'" title="Double-click to rename" '+
            'style="font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;'+
            'overflow:hidden;text-overflow:ellipsis;cursor:text;">'+esc(b.name)+'</div>'+
            '<div class="rmeta">'+esc((b.paper||'a4').toUpperCase())+' · v'+(+b.version||1)+
              ' · '+(+b.pages||1)+(+b.pages>1?' pages':' page')+'</div></div>').join('')+'</div>'
        : '<div class="empty">No saved cards yet. Hover a card in the filmstrip and press ⬒ to keep it.</div>')
    : '';
  if(!RES.sections.length&&!cardsHtml){
    body.innerHTML='<div class="empty">Nothing ticked — choose a group, or Timeline, Archive or Cards above.</div>';
    return;
  }
  body.innerHTML=cardsHtml+RES.sections.map(sec=>{
    const shown=sec.items.length, more=sec.total-shown;
    const arch=sec.key==='archive';
    // Grab the heading to drag the WHOLE section onto a card.
    return '<div class="sechd" draggable="true" data-sec="'+esc(sec.key)+'" data-title="'+esc(sec.title)+'"'+
      ' title="Drag this heading to put the whole group on the card">'+
      '<b>'+esc(sec.title)+'</b><span class="n">'+sec.total+'</span>'+
      (more>0?'<button class="more" data-more="'+esc(sec.key)+'">Show all '+sec.total+'</button>':'')+'</div>'+
      '<div class="'+(arch?'rgrid dropz':'rgrid')+'"'+(arch?' data-drop="1"':'')+'>'+
      sec.items.map(o=>
        '<div class="rcard" draggable="true" data-rt="'+sec.kind+'" data-ri="'+o.id+'" data-sec="'+esc(sec.key)+'"'+
        ' style="width:'+W+'px;font-size:'+RES.size+'px;">'+
        (arch?'<button class="rdel" data-del="'+o.id+'" title="Delete from the archive">✕</button>':'')+
        resItemHtml(sec.kind,o)+'</div>').join('')+
      (shown?'':'<div class="empty">'+(arch?'Archive is empty — drop a picture here.'
                                            :'Nothing here with these filters.')+'</div>')+
      '</div>';
  }).join('');
  body.querySelectorAll('.rcard').forEach(el=>{
    el.ondragstart=e=>{
      // The same payload the Make board sends, so the existing drop handler places it.
      try{ e.dataTransfer.setData('text/ts-card',
        JSON.stringify({ref_type:el.dataset.rt, ref_id:+el.dataset.ri})); }catch(err){}
      e.dataTransfer.effectAllowed='copy';
    };
    el.onclick=()=>{                            // click = look at it big, drag = place it
      const box=document.getElementById('resPrevBox');
      box.innerHTML=el.innerHTML;
      document.getElementById('resPrev').classList.add('open');
    };
  });
  // Delete from the archive — but tell the truth first. Deleting a picture also
  // removes it from every print that uses it (the server clears those items), so
  // the count is the thing you actually need to see before deciding.
  body.querySelectorAll('.rcard[data-blk]').forEach(el=>{
    el.ondragstart=e=>{
      try{ e.dataTransfer.setData('text/ts-block', el.dataset.blk); }catch(err){}
      e.dataTransfer.effectAllowed='copy';
    };
    el.onclick=e=>{ if(e.target.closest('[data-blkdel]')) return; };
  });
  // Double-click a card's name to rename it. Renaming never breaks a link — those
  // are by id — but it does change which name a later save will match.
  body.querySelectorAll('[data-rn]').forEach(el=>{
    el.ondblclick=e=>{
      e.stopPropagation();
      const id=el.dataset.rn, was=el.textContent;
      const inp=document.createElement('input');
      inp.type='text'; inp.value=was;
      inp.style.cssText='width:100%;font-family:inherit;font-size:11px;font-weight:700;'+
        'padding:2px 4px;border:1px solid var(--gold);border-radius:5px;';
      inp.onclick=ev=>ev.stopPropagation();
      const done=async(save)=>{
        const v=inp.value.trim();
        el.textContent = (save&&v) ? v : was;
        if(save&&v&&v!==was){
          try{ await fetch('/api/print-blocks/'+id,{method:'PUT',
            headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v})}); }catch(err){}
          const c=(RES.cardList||[]).find(x=>+x.id===+id); if(c) c.name=v;
        }
      };
      inp.onkeydown=ev=>{ if(ev.key==='Enter') inp.blur(); if(ev.key==='Escape'){ inp._x=1; inp.blur(); } };
      inp.onblur=()=>done(!inp._x);
      el.textContent=''; el.appendChild(inp); inp.focus(); inp.select();
    };
  });
  body.querySelectorAll('[data-blkdel]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm('Delete this card? Prints you already made keep their layout.')) return;
    try{ await fetch('/api/print-blocks/'+b.dataset.blkdel,{method:'DELETE'});
         RES.cardsDirty=true; fetchContent(); }catch(err){}
  });
  body.querySelectorAll('.sechd[data-sec]').forEach(h=>{
    h.ondragstart=e=>{
      try{ e.dataTransfer.setData('text/ts-group',
        JSON.stringify({section:h.dataset.sec, title:h.dataset.title, q:resQuery({})})); }catch(err){}
      e.dataTransfer.effectAllowed='copy';
    };
  });
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.del;
    let msg='Delete this picture from the archive?';
    try{
      const r=await fetch('/api/media-cards/'+id+'/usage');
      if(r.ok){
        const u=await r.json();
        if(u.prints||u.blocks){
          msg='This picture is used in '+u.prints+' print'+(u.prints===1?'':'s')+
              (u.blocks?' and '+u.blocks+' block'+(u.blocks===1?'':'s'):'')+
              (u.first?' (e.g. "'+u.first+'")':'')+
              '.\n\nDeleting it removes it from them too. Delete anyway?';
        }
      }
    }catch(err){}
    if(!confirm(msg)) return;
    try{
      const d=await fetch('/api/media-cards/'+id,{method:'DELETE'});
      if(!d.ok){ alert('Could not delete that picture.'); return; }
      fetchContent();
    }catch(err){ alert('Could not delete that picture.'); }
  });

  // Drop pictures straight into the archive: files from the desktop, or an image
  // dragged off a web page. Same upload path as pasting into a card.
  body.querySelectorAll('[data-drop]').forEach(z=>{
    z.ondragover=e=>{
      const t=[...(e.dataTransfer.types||[])];
      if(t.includes('text/ts-card')) return;             // that's one of ours, not an upload
      if(t.includes('Files')||t.includes('text/uri-list')||t.includes('text/html')){
        e.preventDefault(); e.stopPropagation(); z.classList.add('over'); }
    };
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=async e=>{
      const t=[...(e.dataTransfer.types||[])];
      if(t.includes('text/ts-card')) return;
      e.preventDefault(); e.stopPropagation();
      z.classList.remove('over');
      const files=[...(e.dataTransfer.files||[])].filter(f=>/^image\//i.test(f.type||''));
      let did=false;
      for(const f of files){ await archiveAdd({file:f}); did=true; }
      if(!did){
        const html=e.dataTransfer.getData('text/html')||'';
        const m=html.match(/<img[^>]+src\s*=\s*["']([^"']+)["']/i);
        const uri=(e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain')||'').trim().split(/\s+/)[0];
        const url=(m&&/^https?:\/\//i.test(m[1]))?m[1]:(/^https?:\/\//i.test(uri)?uri:null);
        if(url){ await archiveAdd({url}); did=true; }
      }
      if(did) fetchContent();
    };
  });

  body.querySelectorAll('[data-more]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.more;
    b.textContent='Loading…';
    try{
      const r=await fetch('/api/content?'+resQuery({section:key,limit:500,offset:0}));
      if(!r.ok) return;
      const got=((await r.json()).sections||[])[0];
      if(got){ const i=RES.sections.findIndex(s=>s.key===key); if(i>=0) RES.sections[i]=got; renderContent(); }
    }catch(e){ b.textContent='Failed'; }
  });
}

// Add to the archive without placing it on a card — same endpoint as everywhere else.
async function archiveAdd(src){
  try{
    let r;
    if(src.file){
      const fd=new FormData();
      fd.append('file',src.file);
      fd.append('title',(src.file.name||'Picture').replace(/\.[a-z0-9]+$/i,''));
      r=await fetch('/api/media-cards',{method:'POST',body:fd});
    }else{
      r=await fetch('/api/media-cards',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url:src.url})});
    }
    if(!r.ok){ const d=await r.json().catch(()=>({})); alert(d.error||'Could not add that picture.'); return false; }
    return true;
  }catch(e){ alert('Could not add that picture.'); return false; }
}

function setResSize(k){
  RES.size=RSIZES[k];
  ['S','M','L'].forEach(x=>document.getElementById('res'+x).classList.toggle('on',x===k));
  renderContent();
}
document.getElementById('resTab').onclick=toggleRes;
document.getElementById('resClose').onclick=toggleRes;
document.getElementById('resS').onclick=()=>setResSize('S');
document.getElementById('resM').onclick=()=>setResSize('M');
document.getElementById('resL').onclick=()=>setResSize('L');
document.getElementById('resSearch').oninput=e=>{ RES.q=e.target.value; resDebounced(); };
document.getElementById('resPrev').onclick=()=>document.getElementById('resPrev').classList.remove('open');
// Drag the edge to whatever width suits the monitor. Nothing automatic.
(function(){
  const sp=document.getElementById('resSplit'), el=document.getElementById('res');
  sp.onpointerdown=e=>{
    e.preventDefault();
    const move=ev=>{ el.style.width=Math.max(260,Math.min(window.innerWidth-160,ev.clientX-16))+'px';
                     const st=document.getElementById('strip'); if(st) st.style.left=(el.offsetWidth+32)+'px'; };
    const up=()=>{ removeEventListener('pointermove',move); removeEventListener('pointerup',up); syncResLayout(); };
    addEventListener('pointermove',move); addEventListener('pointerup',up);
  };
})();

document.getElementById('docName').onchange=async e=>{
  const v=e.target.value.trim();
  if(!v||!COMP||v===COMP.name){ e.target.value=COMP?COMP.name||'':''; return; }
  COMP.name=v;
  document.title=v+' · Turtle & Sun';
  try{
    await fetch('/api/compositions/'+compId,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:v})});
    saveState('✓ Renamed', 1800);
  }catch(err){ saveState('Rename failed', 2500); }
};

document.getElementById('stripTab').onclick=toggleStrip;
// A long row scrolls sideways: turn a normal vertical wheel into horizontal travel.
document.getElementById('stripInner').addEventListener('wheel',e=>{
  const host=document.getElementById('stripInner');
  const d=e.deltaY||e.deltaX;
  if(!d) return;
  e.preventDefault();
  host.scrollLeft+=d;
},{passive:false});


load();
