<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brochure — Turtle &amp; Sun</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Caveat:wght@600&display=swap');
  :root{ --ink:#23291d; --green:#1f4a45; --gold:#c9a24b; --cream:#f7f3e8; --muted:#7a8470; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; color:var(--ink); background:#e8e4d8; }
  .toolbar{ padding:10px 16px; display:flex; gap:10px; align-items:center; }
  .toolbar button{ font-family:inherit; font-weight:700; font-size:14px; padding:8px 16px; border:none; border-radius:8px; background:var(--green); color:#f4efe4; cursor:pointer; }
  /* Page width/height/padding are injected per paper size by applyPaper(). */
  .page{ width:210mm; min-height:296mm; margin:0 auto 14px; background:#fff; position:relative; overflow:hidden;
         box-shadow:0 2px 14px rgba(0,0,0,.18); padding:16mm; display:flex; flex-direction:column; }
  .block.sel{ outline:3px dashed var(--gold); outline-offset:3px; }
  .block.pos-left, .block.pos-right{ display:flex; gap:5mm; align-items:flex-start; }
  .block.pos-left img, .block.pos-right img{ width:45%; margin-bottom:0; }
  .block.pos-right{ flex-direction:row-reverse; }
  .block.pos-left > div, .block.pos-right > div{ flex:1; }
  .block.img-s img{ max-height:55mm; object-fit:cover; }
  .block.img-m img{ max-height:95mm; object-fit:cover; }
  .block.img-l img{ max-height:150mm; object-fit:cover; }
  .block.txt-s p{ font-size:11.5px; } .block.txt-l p{ font-size:16px; line-height:1.5; }
  .block.txt-l h3{ font-size:25px; }
  .block.media{ text-align:center; }
  .block.media img{ object-fit:contain !important; max-height:80mm; margin:0 auto; }
  .block.media.img-s img{ max-height:45mm; } .block.media.img-m img{ max-height:80mm; }
  .block.media.img-l img{ max-height:130mm; } .block.media.big img{ max-height:200mm; }
  .block.media .cap{ font-size:12px; color:#5c5c4d; margin-top:3mm; }
  #knobs{ position:fixed; right:14px; top:64px; width:220px; background:#fff; border:2px solid var(--gold);
          border-radius:12px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.2); z-index:10; }
  #knobs .kh{ font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--green); margin:8px 0 4px; }
  #knobs .row{ display:flex; gap:4px; flex-wrap:wrap; }
  #knobs button{ font-family:inherit; font-size:12px; padding:4px 9px; border:1px solid #d9d4c4; background:#fff;
                 border-radius:7px; cursor:pointer; color:var(--ink); }
  #knobs button.on{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  .block.font-serif h3,.block.font-serif p{ font-family:Georgia,'Times New Roman',serif; }
  .block.font-hand h3,.block.font-hand p{ font-family:'Caveat',cursive; font-size:1.35em; }
  .block .bd[contenteditable="true"]{ outline:2px solid #7FB36F; outline-offset:2px; border-radius:2mm; }
  #out{ position:relative; overflow:hidden; transform-origin:0 0; margin:0 auto; }
  #zoomWrap button, #pageNav button{ font-family:inherit; font-weight:700; padding:4px 8px; border:1px solid #c9c4b4; border-radius:7px; background:#fff; cursor:pointer; }
  #zoomWrap button:hover, #pageNav button:hover{ background:#f4efe4; }
  #pageNav button:disabled{ opacity:.4; cursor:default; }
  /* Card tray — the document's cards; tap to place on the current page. */
  #tray{ position:fixed; left:0; top:56px; bottom:0; width:210px; background:#fff; border-right:2px solid var(--gold);
         overflow:auto; z-index:9; box-shadow:2px 0 10px rgba(0,0,0,.08); }
  #tray.collapsed{ transform:translateX(-100%); }
  .trayhead{ font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--green);
             padding:10px 12px 6px; position:sticky; top:0; background:#fff; }
  .trayrow{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid #eee8d8; cursor:pointer; }
  .trayrow:hover{ background:#f7f3e8; }
  .trayrow.on{ background:#eef5ee; }
  .trayrow img, .trayrow .ph{ width:30px; height:30px; object-fit:contain; border-radius:5px; background:#f0ead8; flex-shrink:0; }
  .trayrow .tt{ flex:1; min-width:0; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trayrow .badge{ font-size:11px; font-weight:800; color:#7a8470; min-width:20px; text-align:right; }
  .trayrow.on .badge{ color:var(--green); }
  .trayempty{ padding:14px 12px; font-size:12px; color:var(--muted); }
  #out .page{ cursor:grab; }
  .abswrap.sel{ outline:3px dashed var(--gold); outline-offset:3px; }
  .block.abs{ position:absolute; margin:0; cursor:grab; }
  .block.abs:active{ cursor:grabbing; }
  .block.abs .person{ background:#fff; }
  @media print{ #knobs{ display:none!important; } .block.sel,.abswrap.sel{ outline:none; }
    .page{ height:auto; min-height:296mm; } body.fmt-poster .page{ height:1000mm; }
    .block{ page-break-inside:avoid; } #zoomWrap,#pageNav,#tray{ display:none!important; }
    #out .page{ cursor:auto; }
    /* Never print the on-screen zoom transform — always full size. */
    #out{ transform:none!important; width:auto!important; height:auto!important; margin:0!important; overflow:visible!important; } }
  .page.cover{ padding:0; background:var(--green); color:#f4efe4; }
  .cover .img{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .cover .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(31,74,69,0) 30%,rgba(31,74,69,.88) 78%); }
  .cover .txt{ position:absolute; left:0; right:0; bottom:0; padding:18mm; }
  .cover h1{ font-family:Georgia,serif; font-size:44px; margin:0 0 6px; line-height:1.1; }
  .cover .sub{ font-size:17px; color:#ffe8b0; font-weight:600; }
  .cover .band{ position:absolute; top:0; left:0; right:0; height:9mm;
                background:linear-gradient(90deg,#FFF5A0,#FFE800,#FFD000,#FFAA00,#FF9500); }
  h2.sect{ font-family:Georgia,serif; color:var(--green); font-size:26px; margin:0 0 3mm; }
  .rule{ border:none; border-top:3px solid var(--gold); width:60px; margin:0 0 6mm; }
  .block{ margin-bottom:8mm; }
  .block img{ width:100%; height:auto; border-radius:4mm; display:block; margin-bottom:4mm; }
  .block.big img{ max-height:150mm; object-fit:cover; }
  .block h3{ font-family:Georgia,serif; color:var(--green); font-size:21px; margin:0 0 2mm; }
  .block .meta{ font-size:11.5px; color:var(--muted); margin-bottom:2mm; }
  .block p{ margin:0 0 2.6mm; font-size:13.5px; line-height:1.45; }
  .team{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6mm; }
  .person{ text-align:center; }
  .person img{ max-width:100%; max-height:52mm; width:auto; border-radius:3mm; display:block; margin:0 auto 2mm; }
  .person .init{ width:30mm; height:36mm; border-radius:3mm; background:var(--cream); color:var(--green);
                 display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:22px; margin:0 auto 2mm; }
  .person b{ font-size:13.5px; display:block; }
  .person .role{ font-size:11px; color:var(--green); font-weight:700; }
  .person .ct{ font-size:10.5px; color:var(--muted); line-height:1.4; }
  .backpage{ background:var(--green); color:#f4efe4; align-items:center; justify-content:center; text-align:center; }
  .backpage h2{ font-family:Georgia,serif; font-size:30px; margin:0 0 4mm; color:#f4efe4; }
  .backpage .foot{ position:absolute; bottom:12mm; left:0; right:0; font-size:11.5px; color:#cdddd2; }
  .err{ text-align:center; padding:60px; color:var(--muted); }
  @media print{
    body{ background:#fff; } .toolbar{ display:none; }
    .page{ box-shadow:none; margin:0; page-break-after:always; width:auto; min-height:auto; height:296mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨 Print / save as PDF</button>
  <label style="font-size:13.5px;font-weight:700;">Paper
    <select id="paper" style="font-family:inherit;font-size:13.5px;padding:5px 8px;border-radius:7px;border:1px solid #c9c4b4;"></select></label>
  <span id="zoomWrap" style="font-size:13.5px;font-weight:700;display:none;align-items:center;gap:6px;">Zoom
    <button id="zoomOut" title="Zoom out ( - )" style="min-width:30px;">−</button>
    <input type="range" id="zoom" min="5" max="200" value="18" style="vertical-align:middle;">
    <button id="zoomIn" title="Zoom in ( + )" style="min-width:30px;">＋</button>
    <button id="zoomFit" title="Fit to window ( 0 )" style="font-size:12px;">Fit</button>
    <span id="zoomPct" style="min-width:42px;display:inline-block;text-align:right;color:#5c5c4d;">18%</span>
  </span>
  <span id="pageNav" style="font-size:13.5px;font-weight:700;display:none;align-items:center;gap:6px;">
    <button id="pgPrev" title="Previous page" style="min-width:30px;">◀</button>
    <span id="pgLabel" style="min-width:74px;text-align:center;">Page 1 / 1</span>
    <button id="pgNext" title="Next page" style="min-width:30px;">▶</button>
    <button id="pgAdd" title="Add a page">＋ Page</button>
    <button id="pgDel" title="Delete this page">🗑</button>
  </span>
  <button id="saveBtn" style="background:#fff;color:var(--green);border:2px solid var(--green);">Save layout</button>
  <span style="font-size:13px;color:#5c5c4d;">Tap a card on the left to place it · drag to move · scroll to zoom · drag empty space to pan</span>
</div>
<aside id="tray"><div class="trayhead">Cards</div><div id="trayList"></div></aside>
<div id="knobs" class="hidden" style="display:none;"></div>
<div id="out"><div class="err">Loading…</div></div>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compId = new URLSearchParams(location.search).get('comp');

// Limited rich text: only harmless formatting survives (text is content; scripts are not).
function sanitizeHtml(s){
  return String(s||'')
    .replace(/<\s*(script|style|iframe|object|embed|link|meta)[\s\S]*?(<\/\s*\1\s*>|$)/gi,'')
    .replace(/<([a-z0-9]+)([^>]*)>/gi,(m,tag)=>['h3','p','b','strong','u','i','em','br','div','span'].includes(tag.toLowerCase())?'<'+tag.toLowerCase()+'>':'')
    .replace(/<\/([a-z0-9]+)>/gi,(m,tag)=>['h3','p','b','strong','u','i','em','br','div','span'].includes(tag.toLowerCase())?'</'+tag.toLowerCase()+'>':'');
}
function postBlock(it){
  const c=it.content, ov=it.overrides||{}, big=ov.big;
  const ph=(c.photos||[])[0];
  const d=c.post_date?new Date(c.post_date):null;
  const cls=['block', big?'big':'', ov.pos?'pos-'+ov.pos:'', ov.img?'img-'+ov.img:'',
             ov.txt?'txt-'+ov.txt:'', ov.font?'font-'+ov.font:''].filter(Boolean).join(' ');
  let inner;
  if(ov.text){ inner='<div class="bd">'+sanitizeHtml(ov.text)+'</div>'; }
  else{
    const paras=String(c.body||'').split(/\n\n+/).filter(Boolean).slice(0, big?12:4)
      .map(p=>'<p>'+esc(p)+'</p>').join('');
    inner='<div class="bd">'+(c.title?'<h3>'+esc(c.title)+'</h3>':'')+
      (d&&!ov.nodate?'<div class="meta">'+d.toLocaleDateString('sv-SE')+(c.author?' · '+esc(c.author):'')+'</div>':'')+paras+'</div>';
  }
  return '<div class="'+cls+'" data-idx="'+it._idx+'">'+
    (ph?'<img src="'+esc(ph)+'">':'')+inner+'</div>';
}
function personCard(it){
  const c=it.content;
  const init=(c.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return '<div class="person">'+
    (c.photo_url?'<img src="'+esc(c.photo_url)+'">':'<div class="init">'+esc(init)+'</div>')+
    '<b>'+esc(c.name||'')+'</b>'+
    (c.job_title?'<div class="role">'+esc(c.job_title)+'</div>':'')+
    '<div class="ct">'+[c.email,c.phone].filter(Boolean).map(esc).join('<br>')+'</div></div>';
}
// Media card = an SVG (logo/graphic). Rendered via <img> so no script runs.
function mediaBlock(it){
  const c=it.content||{}, ov=it.overrides||{};
  const cls=['block','media', ov.big?'big':'', ov.img?'img-'+ov.img:''].filter(Boolean).join(' ');
  const showCap = ov.caption && c.title;
  return '<div class="'+cls+'" data-idx="'+it._idx+'">'+
    (c.url?'<img src="'+esc(c.url)+'">':'')+
    (showCap?'<div class="cap">'+esc(c.title)+'</div>':'')+'</div>';
}

let COMP=null;
let curPage=1;
function render(){ renderCurrent(); }
// Every card lives on a page at a free position (page/x/y/w in its overrides).
// Legacy: poster items already had x/y → page 1; anything else starts unplaced.
function normalizeItems(){
  (COMP.items||[]).forEach(it=>{
    const ov=it.overrides=it.overrides||{};
    if(ov.page==null && ov.x!=null) ov.page=1;
  });
  COMP.params=COMP.params||{};
}

async function load(){
  if(!compId){ document.getElementById('out').innerHTML='<div class="err">No composition given (?comp=ID).</div>'; return; }
  const r=await fetch('/api/compositions/'+compId);
  if(!r.ok){ document.getElementById('out').innerHTML='<div class="err">Could not load the brochure.</div>'; return; }
  COMP=await r.json();
  document.title=COMP.name+' · Turtle & Sun';
  normalizeItems();
  buildPaperOptions();
  document.getElementById('zoomWrap').style.display='inline-flex';
  document.getElementById('pageNav').style.display='inline-flex';
  const paper=(COMP.params&&COMP.params.paper)||'a4';
  document.getElementById('paper').value=paperOf(paper).k;
  applyPaper(paper);
  render();
  syncZoom();
}

// ── Paper sizes ─────────────────────────────────────────────────────
// Dimensions in mm (portrait). A-series shown in cm, US sizes in inches.
// `canvas:true` = the free-placement poster renderer; the rest flow as pages.
const PAPERS=[
  {k:'a0',n:'A0',w:841,h:1189,u:'cm'},
  {k:'a1',n:'A1',w:594,h:841,u:'cm'},
  {k:'a2',n:'A2',w:420,h:594,u:'cm'},
  {k:'a3',n:'A3',w:297,h:420,u:'cm'},
  {k:'a4',n:'A4',w:210,h:297,u:'cm'},
  {k:'a5',n:'A5',w:148,h:210,u:'cm'},
  {k:'a6',n:'A6',w:105,h:148,u:'cm'},
  {k:'letter', n:'US Letter',  w:215.9,h:279.4,u:'in'},
  {k:'legal',  n:'US Legal',   w:215.9,h:355.6,u:'in'},
  {k:'tabloid',n:'US Tabloid', w:279.4,h:431.8,u:'in'},
  {k:'ansic',  n:'US ANSI C',  w:431.8,h:558.8,u:'in'},
  {k:'ansid',  n:'US ANSI D',  w:558.8,h:863.6,u:'in'},
  {k:'ansie',  n:'US ANSI E',  w:863.6,h:1117.6,u:'in'},
  {k:'poster', n:'Poster',     w:700,  h:1000,  u:'cm', canvas:true},
];
const paperArea=P=>P.w*P.h;
const num1=x=>String(Math.round(x*10)/10);
function paperLabel(P){
  return P.u==='in'
    ? P.n+' — '+num1(P.w/25.4)+' × '+num1(P.h/25.4)+' in'
    : P.n+' — '+num1(P.w/10)+' × '+num1(P.h/10)+' cm';
}
function paperOf(k){ return PAPERS.find(x=>x.k===k) || PAPERS.find(x=>x.k==='a4'); }
function buildPaperOptions(){
  const sel=document.getElementById('paper');
  sel.innerHTML=PAPERS.slice().sort((a,b)=>paperArea(b)-paperArea(a))
    .map(P=>'<option value="'+P.k+'">'+paperLabel(P)+'</option>').join('');
}

function applyPaper(k){
  const P=paperOf(k);
  document.body.className = P.canvas ? 'fmt-poster' : 'fmt-doc';
  let st=document.getElementById('pageSize');
  if(!st){ st=document.createElement('style'); st.id='pageSize'; document.head.appendChild(st); }
  let css='@page{ size:'+P.w+'mm '+P.h+'mm; margin:0; }';
  if(P.canvas){
    css+=' .page{ width:'+P.w+'mm; height:'+P.h+'mm; min-height:0; padding:0; }';
  }else{
    const pad=Math.max(8, Math.round(P.w*0.06));
    css+=' .page{ width:'+P.w+'mm; min-height:'+P.h+'mm; height:auto; padding:'+pad+'mm; }';
    css+=' .cover h1{ font-size:'+Math.round(P.w*0.209)+'px; }';
    css+=' .cover .sub{ font-size:'+Math.max(11,Math.round(P.w*0.081))+'px; }';
  }
  st.textContent=css;
}

// ── Zoom ────────────────────────────────────────────────────────────
// Any paper can be scaled to fit and panned. Zoom is anchored to a focal
// point (the mouse, or the viewport centre) so the spot you point at stays
// put; near the edges the scroll simply clamps ("physical constraints").
const ZMIN=5, ZMAX=200;   // percent
let curScale=1;           // fraction; kept in sync with the slider
function posterMode(){ return document.body.classList.contains('fmt-poster'); }
function clampPct(p){ return Math.max(ZMIN, Math.min(ZMAX, p)); }

// Natural (unscaled) size of the rendered content — transform-independent.
function contentNat(){
  const out=document.getElementById('out');
  let w=0,h=0;
  out.querySelectorAll('.page').forEach(p=>{ w=Math.max(w,p.offsetWidth); h=Math.max(h,p.offsetTop+p.offsetHeight); });
  return { w, h };
}
function applyZoom(pct){
  pct=clampPct(pct);
  const out=document.getElementById('out');
  const s=pct/100; curScale=s;
  const {w,h}=contentNat();
  out.style.transformOrigin='0 0';
  out.style.margin='0 auto';
  if(!w){ out.style.transform=''; out.style.width=''; out.style.height=''; syncZoomLabel(pct); return; }
  out.style.transform = s===1 ? '' : 'scale('+s+')';
  out.style.width=(w*s)+'px';
  out.style.height=(h*s)+'px';
  syncZoomLabel(pct);
}
function syncZoomLabel(pct){
  const zi=document.getElementById('zoom'); if(zi) zi.value=Math.round(pct);
  const zp=document.getElementById('zoomPct'); if(zp) zp.textContent=Math.round(pct)+'%';
}
// Scale so the page fits the viewport width (never above 100%).
function fitPct(){
  const {w}=contentNat();
  if(!w) return 100;
  return clampPct(Math.min(100, (window.innerWidth-48)/w*100));
}
function syncZoom(){ applyZoom(fitPct()); window.scrollTo(0,0); }

// Zoom to a new percent while keeping (cx,cy) — a client point — over the
// same spot on the canvas. Falls back to viewport centre when no point given.
function zoomToPct(pct, cx, cy){
  pct=clampPct(pct);
  const out=document.getElementById('out');
  if(cx==null){ cx=window.innerWidth/2; cy=window.innerHeight/2; }
  const r0=out.getBoundingClientRect(), s0=curScale;
  const px=(cx-r0.left)/s0, py=(cy-r0.top)/s0;   // content point under focal
  applyZoom(pct);
  const r1=out.getBoundingClientRect();
  window.scrollBy(r1.left-(cx-px*curScale), r1.top-(cy-py*curScale));
}
function zoomStep(factor, cx, cy){ zoomToPct(curScale*100*factor, cx, cy); }

// ── Page model ──────────────────────────────────────────────────────
// A document is N pages. Each card sits on one page at a free position.
// We edit ONE page at a time; print stitches every page in order.
function itemsAll(){ return (COMP.items||[]).map((it,i)=>({ ...it, _idx:i })); }
function pageCount(){
  let n=(COMP.params&&+COMP.params.pages)||1;
  itemsAll().forEach(it=>{ const p=it.overrides&&+it.overrides.page; if(p>n) n=p; });
  return Math.max(1,n);
}
function cardInner(it){
  return it.ref_type==='contact' ? personCard(it)
       : it.ref_type==='media'   ? mediaBlock(it)
       : postBlock(it);
}
function absWrap(it){
  const ov=it.overrides||{};
  const x=ov.x!=null?ov.x:10, y=ov.y!=null?ov.y:10, w=ov.w||28;
  return '<div class="abswrap" style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+w+'%;" data-absidx="'+it._idx+'">'+cardInner(it)+'</div>';
}
function markAbs(){ document.querySelectorAll('.abswrap .block,.abswrap .person').forEach(b=>b.classList.add('abs')); }

// The editor view: a single page of freely-placed cards.
function renderCurrent(){
  const N=pageCount();
  curPage=Math.max(1,Math.min(N,curPage));
  const on=itemsAll().filter(it=>(it.overrides&&+it.overrides.page)===curPage);
  document.getElementById('out').innerHTML=
    '<div class="page" data-page="'+curPage+'" style="position:relative;">'+on.map(absWrap).join('')+'</div>';
  markAbs(); wireDrag(); wirePan();
  updatePageNav(); renderTray(); markSel();
}
// Print view: every page, in order.
function renderAllPages(){
  const N=pageCount(), all=itemsAll(); let html='';
  for(let n=1;n<=N;n++){
    const on=all.filter(it=>(it.overrides&&+it.overrides.page)===n);
    html+='<div class="page printpage" style="position:relative;">'+on.map(absWrap).join('')+'</div>';
  }
  document.getElementById('out').innerHTML=html; markAbs();
}

// Drag a card to reposition it (x/y saved as % of the page).
function wireDrag(){
  document.querySelectorAll('.abswrap').forEach(w=>{
    w.onpointerdown=e=>{
      if(e.target.closest('[contenteditable="true"]')) return;
      const page=w.parentElement, pr=page.getBoundingClientRect();
      const idx=+w.dataset.absidx; selIdx=idx; showKnobs(); markSel();
      const sx=e.clientX, sy=e.clientY;
      const ox=parseFloat(w.style.left), oy=parseFloat(w.style.top);
      let moved=false;
      const mv=ev=>{
        const dx=(ev.clientX-sx)/pr.width*100, dy=(ev.clientY-sy)/pr.height*100;
        if(Math.abs(dx)+Math.abs(dy)>0.1) moved=true;
        w.style.left=Math.max(0,Math.min(96,ox+dx))+'%';
        w.style.top=Math.max(0,Math.min(98,oy+dy))+'%';
      };
      const up=()=>{
        removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
        if(moved){
          const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
          ov.x=Math.round(parseFloat(w.style.left)*10)/10; ov.y=Math.round(parseFloat(w.style.top)*10)/10;
        }
      };
      addEventListener('pointermove',mv); addEventListener('pointerup',up);
      e.stopPropagation(); e.preventDefault();
    };
  });
}
// Drag empty page background to pan the zoomed view.
function wirePan(){
  const page=document.querySelector('#out .page'); if(!page) return;
  page.addEventListener('pointerdown',e=>{
    if(e.target.closest('.abswrap')) return;
    const sx=e.clientX, sy=e.clientY, ox=window.scrollX, oy=window.scrollY;
    page.style.cursor='grabbing';
    const mv=ev=>window.scrollTo(ox-(ev.clientX-sx), oy-(ev.clientY-sy));
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); page.style.cursor=''; };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
    e.preventDefault();
  });
}

// ── Page navigation ─────────────────────────────────────────────────
function updatePageNav(){
  const N=pageCount();
  const lab=document.getElementById('pgLabel'); if(lab) lab.textContent='Page '+curPage+' / '+N;
  const prev=document.getElementById('pgPrev'), next=document.getElementById('pgNext'), del=document.getElementById('pgDel');
  if(prev) prev.disabled=curPage<=1;
  if(next) next.disabled=curPage>=N;
  if(del)  del.disabled=N<=1 && !itemsAll().some(it=>(it.overrides&&+it.overrides.page)===curPage);
}
function setPage(n){ curPage=n; renderCurrent(); syncZoom(); }
function addPage(){ COMP.params.pages=pageCount()+1; setPage(COMP.params.pages); }
function deletePage(){
  const N=pageCount();
  if(!confirm('Delete page '+curPage+'? Cards on it go back to the tray.')) return;
  itemsAll().forEach(it=>{ const ov=it.overrides; if(!ov||ov.page==null) return;
    if(+ov.page===curPage){ delete ov.page; delete ov.x; delete ov.y; }
    else if(+ov.page>curPage){ ov.page=+ov.page-1; }
  });
  COMP.params.pages=Math.max(1,N-1);
  curPage=Math.min(curPage, pageCount());
  renderCurrent(); syncZoom();
}

// ── Card tray (placing/moving cards) ────────────────────────────────
function trayThumb(it){
  const c=it.content||{};
  return it.ref_type==='post' ? (c.photos||[])[0]
       : it.ref_type==='media' ? c.url
       : c.photo_url;
}
function trayText(it){
  const c=it.content||{};
  return it.ref_type==='post' ? (c.title||(c.body||'').slice(0,32)||'(post)')
       : it.ref_type==='media' ? (c.title||'(logo)')
       : (c.name||'(person)');
}
function renderTray(){
  const host=document.getElementById('trayList'); if(!host) return;
  const all=itemsAll();
  if(!all.length){ host.innerHTML='<div class="trayempty">No cards yet. Add them from the Make tab, then place them here.</div>'; return; }
  host.innerHTML=all.map(it=>{
    const p=it.overrides&&+it.overrides.page, img=trayThumb(it);
    return '<div class="trayrow'+(p===curPage?' on':'')+'" data-idx="'+it._idx+'">'+
      (img?'<img src="'+esc(img)+'">':'<span class="ph"></span>')+
      '<span class="tt">'+esc(trayText(it))+'</span>'+
      '<span class="badge">'+(p?('p'+p):'—')+'</span></div>';
  }).join('');
  host.querySelectorAll('.trayrow').forEach(row=>row.onclick=()=>{
    const idx=+row.dataset.idx, ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
    const p=+ov.page;
    if(!p) placeCard(idx);                              // unplaced → drop on this page
    else if(p!==curPage){ curPage=p; renderCurrent(); } // elsewhere → go to its page
    else { selIdx=idx; showKnobs(); markSel(); }        // here → just select it
  });
}
function placeCard(idx){
  const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
  const n=itemsAll().filter(it=>(it.overrides&&+it.overrides.page)===curPage).length;
  ov.page=curPage;
  if(ov.x==null) ov.x=8+(n%3)*30;
  if(ov.y==null) ov.y=6+Math.floor(n/3)*24;
  if(ov.w==null) ov.w=28;
  selIdx=idx; renderCurrent(); showKnobs();
}
function unplaceCard(idx){
  const ov=COMP.items[idx].overrides||{};
  delete ov.page; delete ov.x; delete ov.y;
  selIdx=null; document.getElementById('knobs').style.display='none'; renderCurrent();
}
function moveCardToPage(idx,n){
  const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
  ov.page=Math.max(1,Math.min(pageCount(),n));
  curPage=ov.page; renderCurrent(); showKnobs();   // follow the card
}

// ── Knobs: click a block → adjust its parameters, live ──
let selIdx=null;
const KN={
  img:[['s','Small'],['m','Medium'],['l','Large'],['','Full']],
  pos:[['','Top'],['left','Left'],['right','Right']],
  txt:[['s','Small'],['','Normal'],['l','Large']],
  font:[['','Jakarta'],['serif','Georgia'],['hand','Handwritten']],
  w:[['20','Narrow'],['28','Medium'],['40','Wide'],['60','Huge']],
};
function knobRow(kind,label,cur){
  return '<div class="kh">'+label+'</div><div class="row">'+
    KN[kind].map(([v,t])=>'<button data-k="'+kind+'" data-v="'+v+'" class="'+((cur||'')===v?'on':'')+'">'+t+'</button>').join('')+'</div>';
}
function showKnobs(){
  const k=document.getElementById('knobs');
  if(selIdx==null){ k.style.display='none'; return; }
  const it=COMP.items[selIdx];
  const ov=it.overrides=it.overrides||{};
  const isPost=it.ref_type==='post';
  const isMedia=it.ref_type==='media';
  const N=pageCount();
  k.style.display='block';
  k.innerHTML='<b style="font-size:13px;">Card '+(selIdx+1)+'</b>'+
    '<div class="kh">On page</div><div class="row">'+
      '<button id="knPgPrev" title="Move to the previous page">◀</button>'+
      '<span style="align-self:center;font-weight:700;">Page '+(ov.page||curPage)+' / '+N+'</span>'+
      '<button id="knPgNext" title="Move to the next page">▶</button></div>'+
    '<div class="row"><button id="knUnplace" style="flex:1;">Remove from page</button></div>'+
    ((isPost||isMedia)?knobRow('img','Picture size',ov.img):'')+
    knobRow('w','Card width',String(ov.w||28))+
    (isMedia?'<div class="kh">Caption</div><div class="row"><button data-k="caption" data-v="'+(ov.caption?'':'1')+'" class="'+(ov.caption?'on':'')+'">'+(ov.caption?'Showing name — hide it':'Show the name')+'</button></div>':'')+
    (isPost?knobRow('txt','Text size',ov.txt):'')+
    (isPost?knobRow('font','Font',ov.font):'')+
    (isPost?'<div class="kh">Date</div><div class="row"><button data-k="nodate" data-v="'+(ov.nodate?'':'1')+'" class="'+(ov.nodate?'on':'')+'">'+(ov.nodate?'Hidden — show it':'Hide the date')+'</button></div>':'')+
    (isPost?'<div style="margin-top:8px;"><button id="knEdit" style="width:100%;">✏ Edit the text</button></div>':'')+
    '<div id="knEditBar" style="display:none;margin-top:6px;" class="row">'+
      '<button id="knB" style="font-weight:800;">B</button>'+
      '<button id="knU" style="text-decoration:underline;">U</button>'+
      '<button id="knReset" title="Back to the original text">↺ Original</button>'+
      '<button id="knDone" style="flex:1;">✓ Done editing</button></div>'+
    '<div style="margin-top:10px;"><button id="knClose" style="width:100%;">Done</button></div>';
  k.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    const kk=b.dataset.k, v=b.dataset.v;
    if(kk==='nodate') ov.nodate=!!v;
    else if(kk==='caption') ov.caption=!!v;
    else if(kk==='w') ov.w=+v;
    else if(v==='') delete ov[kk]; else ov[kk]=v;
    render(); showKnobs(); markSel();
  });
  document.getElementById('knPgPrev').onclick=()=>moveCardToPage(selIdx,(ov.page||curPage)-1);
  document.getElementById('knPgNext').onclick=()=>moveCardToPage(selIdx,(ov.page||curPage)+1);
  document.getElementById('knUnplace').onclick=()=>unplaceCard(selIdx);
  const editBtn=document.getElementById('knEdit');
  if(editBtn) editBtn.onclick=()=>{
    const bd=document.querySelector('[data-idx="'+selIdx+'"] .bd');
    if(!bd) return;
    bd.setAttribute('contenteditable','true'); bd.focus();
    document.getElementById('knEditBar').style.display='flex';
    editBtn.style.display='none';
  };
  const q=id=>document.getElementById(id);
  q('knB').onclick=e=>{ e.preventDefault(); document.execCommand('bold'); };
  q('knU').onclick=e=>{ e.preventDefault(); document.execCommand('underline'); };
  q('knReset').onclick=()=>{ delete ov.text; render(); showKnobs(); markSel(); };
  q('knDone').onclick=()=>{
    const bd=document.querySelector('[data-idx="'+selIdx+'"] .bd');
    if(bd){ ov.text=sanitizeHtml(bd.innerHTML); bd.removeAttribute('contenteditable'); }
    render(); showKnobs(); markSel();
  };
  document.getElementById('knClose').onclick=()=>{ selIdx=null; showKnobs(); markSel(); };
}
function markSel(){
  document.querySelectorAll('.abswrap.sel,.block.sel').forEach(x=>x.classList.remove('sel'));
  if(selIdx!=null){
    const el=document.querySelector('.abswrap[data-absidx="'+selIdx+'"]')||document.querySelector('.block[data-idx="'+selIdx+'"]');
    if(el) el.classList.add('sel');
  }
}
document.getElementById('out').addEventListener('click',e=>{
  const bl=e.target.closest('.block[data-idx]'); if(!bl) return;
  selIdx=+bl.dataset.idx; showKnobs(); markSel();
});
document.getElementById('paper').onchange=e=>{
  COMP.params=COMP.params||{}; COMP.params.paper=e.target.value;
  applyPaper(e.target.value); render(); syncZoom();
};
document.getElementById('zoom').oninput=e=>zoomToPct(+e.target.value);
document.getElementById('zoomIn').onclick=()=>zoomStep(1.25);
document.getElementById('zoomOut').onclick=()=>zoomStep(1/1.25);
document.getElementById('zoomFit').onclick=()=>syncZoom();

// Track the mouse so keyboard zoom anchors where you're looking.
let lastMouse=null;
document.getElementById('out').addEventListener('mousemove',e=>{ lastMouse={x:e.clientX,y:e.clientY}; });

// One page is shown at a time, so the plain wheel always zooms (anchored to the
// cursor). Pan a zoomed page by dragging an empty part of it.
document.getElementById('out').addEventListener('wheel',e=>{
  e.preventDefault();
  zoomStep(e.deltaY<0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
}, { passive:false });

// Keyboard: +/= zoom in, -/_ zoom out, 0 fits. Ignore while editing text.
document.addEventListener('keydown',e=>{
  if(e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
  const at=lastMouse||{};
  if(e.key==='+'||e.key==='='){ e.preventDefault(); zoomStep(1.25, at.x, at.y); }
  else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoomStep(1/1.25, at.x, at.y); }
  else if(e.key==='0'){ e.preventDefault(); syncZoom(); }
});
// Page navigation buttons.
document.getElementById('pgPrev').onclick=()=>setPage(curPage-1);
document.getElementById('pgNext').onclick=()=>setPage(curPage+1);
document.getElementById('pgAdd').onclick=()=>addPage();
document.getElementById('pgDel').onclick=()=>deletePage();

// Print = all pages in order; restore the single-page editor afterwards.
window.addEventListener('beforeprint',()=>renderAllPages());
window.addEventListener('afterprint',()=>{ renderCurrent(); applyZoom(curScale*100); });

document.getElementById('saveBtn').onclick=async()=>{
  COMP.params=COMP.params||{}; COMP.params.pages=pageCount();
  const items=COMP.items.map(i=>({ref_type:i.ref_type,ref_id:i.ref_id,overrides:i.overrides||{}}));
  const r=await fetch('/api/compositions/'+compId,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items, params:COMP.params||{}})});
  document.getElementById('saveBtn').textContent = r.ok ? '✓ Saved' : 'Save failed';
  setTimeout(()=>document.getElementById('saveBtn').textContent='Save layout',1500);
};
load();
</script>
