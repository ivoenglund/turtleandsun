<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brochure — Turtle &amp; Sun</title>
<style>
  :root{ --ink:#23291d; --green:#1f4a45; --gold:#c9a24b; --cream:#f7f3e8; --muted:#7a8470; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; color:var(--ink); background:#e8e4d8; overflow:hidden; }
  /* Page width/height/padding are injected per paper size by applyPaper(). */
  /* isolation:isolate makes the page a stacking context. Without it the page is
     position:relative with z-index:auto, so an object sent to the back (negative
     z-index) paints BEHIND the page's own white background and vanishes. */
  .page{ width:210mm; min-height:296mm; margin:0 auto 14px; background:#fff; position:relative; overflow:visible;
         isolation:isolate;
         box-shadow:0 2px 14px rgba(0,0,0,.18); padding:16mm; display:flex; flex-direction:column; }
  /* Objects parked outside the page stay visible but grey — fetch them back
     any time. (Print clips to the page, so parked objects never print.) */
  .offpage{ opacity:.35; filter:grayscale(.8); }
  .marquee{ position:fixed; border:1.5px dashed var(--gold); background:rgba(201,162,75,.12);
            z-index:50; pointer-events:none; }
  /* ── Objects ──────────────────────────────────────────────────────
     Every picture and every text is its OWN object on the page: freely
     draggable, resizable, rotatable, borderable. All typography is em so
     the wrapper's font-size zooms the whole object. */
  /* --ui (set per zoom) keeps selection outlines and handles the SAME SCREEN
     SIZE at any zoom — on an A0 at fit-zoom they used to shrink to nothing. */
  .abswrap{ cursor:grab; }
  .abswrap.sel{ outline:calc(3px*var(--ui,1)) dashed var(--gold); outline-offset:calc(3px*var(--ui,1)); }
  /* Placed by a rule, then moved by hand: the rule will leave this one alone. */
  .abswrap.pinned::after{ content:''; position:absolute; left:calc(-4px*var(--ui,1));
    top:calc(-4px*var(--ui,1)); width:calc(9px*var(--ui,1)); height:calc(9px*var(--ui,1));
    border-radius:50%; background:var(--green); box-shadow:0 0 0 calc(1.5px*var(--ui,1)) #fff; }
  /* Card contents are styled by the shared /card-render.css, linked above. */
  /* A frame = its own object: a border you can drag, resize, restyle. */
  .frameobj{ cursor:grab; border-radius:var(--pr,6px); }
  .frameobj.sel{ outline:calc(3px*var(--ui,1)) dashed var(--gold); outline-offset:calc(3px*var(--ui,1)); }
  .rszh{ position:absolute; right:calc(-9px*var(--ui,1)); bottom:calc(-9px*var(--ui,1));
         width:calc(17px*var(--ui,1)); height:calc(17px*var(--ui,1)); border-radius:50%;
         background:var(--gold); border:calc(2px*var(--ui,1)) solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4);
         cursor:nwse-resize; z-index:6; touch-action:none; }
  /* Crop mode: four edge handles — drag any edge to shape the window, drag
     inside the picture to choose what shows. */
  .abswrap.cropping{ outline-color:#7FB36F; }
  .abswrap.cropping img{ cursor:move; }
  .crE{ position:absolute; background:var(--gold); border:calc(2px*var(--ui,1)) solid #fff;
        box-shadow:0 1px 5px rgba(0,0,0,.4); z-index:6; touch-action:none; }
  .crE[data-edge="l"],.crE[data-edge="r"]{ top:50%; width:calc(11px*var(--ui,1)); height:calc(30px*var(--ui,1));
        margin-top:calc(-15px*var(--ui,1)); border-radius:calc(6px*var(--ui,1)); cursor:ew-resize; }
  .crE[data-edge="l"]{ left:calc(-6px*var(--ui,1)); } .crE[data-edge="r"]{ right:calc(-6px*var(--ui,1)); }
  .crE[data-edge="t"],.crE[data-edge="b"]{ left:50%; height:calc(11px*var(--ui,1)); width:calc(30px*var(--ui,1));
        margin-left:calc(-15px*var(--ui,1)); border-radius:calc(6px*var(--ui,1)); cursor:ns-resize; }
  .crE[data-edge="t"]{ top:calc(-6px*var(--ui,1)); } .crE[data-edge="b"]{ bottom:calc(-6px*var(--ui,1)); }
  /* ── Panel ────────────────────────────────────────────────────────── */
  #panel{ position:fixed; right:16px; top:16px; width:258px; max-height:calc(100vh - 32px); overflow:auto;
          background:#fff; border:2px solid var(--gold); border-radius:14px; padding:10px 12px;
          box-shadow:0 4px 18px rgba(0,0,0,.2); z-index:10; font-size:13px; }
  #panel .prow, #panel .krow{ display:flex; gap:5px; align-items:center; margin-bottom:5px; }
  #panel .prow > button{ flex:1; }
  #panel .ph, #panel .kh{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
                          color:var(--green); margin:8px 0 3px; }
  #panel .ph:first-child, #panel .kh:first-child{ margin-top:0; }
  #panel button{ font-family:inherit; font-weight:700; font-size:12.5px; padding:5px 8px; border:1px solid #d9d4c4;
                 border-radius:8px; background:#fff; cursor:pointer; color:var(--ink); line-height:1.2; }
  #panel button:hover{ background:#f4efe4; }
  #panel button:disabled{ opacity:.35; cursor:default; }
  #docName{ width:100%; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink);
            padding:5px 8px; margin-bottom:6px; border:1px solid transparent; border-radius:8px;
            background:#f7f4ea; }
  #docName:hover{ border-color:#e2dccb; }
  #docName:focus{ border-color:var(--gold); background:#fff; outline:none; }
  #saveState{ flex:1; font-size:11.5px; font-weight:700; color:var(--muted); text-align:right;
              padding-right:2px; white-space:nowrap; }
  #panel button.primary{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.primary:hover{ background:#17403b; }
  #panel button.on{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.danger{ color:#8c2f1b; border-color:#dcc0b5; font-size:11px; padding:3px 8px; }
  #panel button.danger:hover{ background:#f9ece7; }
  #panel select{ width:100%; font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px;
                 border:1px solid #d9d4c4; background:#fff; color:var(--ink); margin-bottom:3px; }
  #panel select:disabled, #panel button:disabled, #panel input:disabled{ opacity:.35; }
  #panel input[type=range]{ width:100%; margin:1px 0 3px; accent-color:var(--gold); }
  #panel input[type=number]{ font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px; border:1px solid #d9d4c4; }
  #zoomWrap input[type=range]{ flex:1; min-width:0; width:auto; margin:0; }
  /* ── Filmstrip: the document IS this row of cards ── */
  /* No bar, no border: the cards sit straight on the background. */
  #strip{ position:fixed; left:0; right:282px; bottom:0; z-index:9;
          display:flex; align-items:stretch; }
  #strip.hid{ transform:translateY(100%); }
  #stripTab{ position:fixed; left:10px; bottom:8px; z-index:11; font-family:inherit; font-weight:700;
             font-size:11.5px; padding:3px 10px; border:1px solid #cfc9b8; border-radius:8px;
             background:rgba(255,255,255,.8); cursor:pointer; color:var(--muted); }
  #stripTab:hover{ background:#fff; color:var(--ink); }
  #stripInner{ flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; display:flex;
               gap:9px; padding:38px 10px 10px; align-items:flex-start;
               /* Grow out from the middle. "safe" keeps the first card reachable
                  once the row is long enough to scroll — plain centring would
                  push it off the left edge with no way to scroll back to it. */
               justify-content:center;
               justify-content:safe center; }
  .sthumb{ flex:0 0 auto; cursor:pointer; position:relative; }
  .sprev{ overflow:hidden; background:#fff; border:1.5px solid #d9d4c4; border-radius:5px;
          position:relative; pointer-events:none; }
  .sthumb.cur .sprev{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.45); }
  .sthumb:hover .sprev{ border-color:var(--green); }
  /* Previews are pictures, not workspaces — no handles, no selection outlines. */
  .sprev .abswrap.sel,.sprev .frameobj.sel{ outline:none!important; }
  .sprev .rszh,.sprev .crE{ display:none!important; }
  .sscale{ transform-origin:top left; position:absolute; top:0; left:0; }
  /* applyPaper() puts the output-paper zoom on every .page. The filmstrip does its
     own scaling, so a page in here must NOT be zoomed a second time — printing at
     50% would otherwise halve every miniature. Same for the big preview. */
  #stripInner .page, #resPrevBox .page{ zoom:1 !important; }
  .snum{ text-align:center; font-size:10.5px; font-weight:800; color:#6f7865; margin-top:2px;
         text-shadow:0 1px 0 rgba(255,255,255,.85);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sthumb.cur .snum{ color:var(--green); }
  .sthumb.dragover .sprev{ border-color:var(--green); box-shadow:-3px 0 0 var(--green); }
  /* Hovering a card floats a real toolbar above it — the old corner buttons were
     10px and impossible to hit. */
  .sact{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
         display:none; padding-bottom:6px; z-index:3; white-space:nowrap; }
  .sactin{ display:flex; gap:3px; background:#fff; border:1.5px solid var(--gold);
           border-radius:9px; padding:3px; box-shadow:0 3px 12px rgba(0,0,0,.22); }
  .sthumb:hover .sact, .sact:hover{ display:block; }
  .sact button{ font-family:inherit; font-size:14px; font-weight:700; line-height:1;
                width:26px; height:26px; display:flex; align-items:center; justify-content:center;
                border:1px solid #e2dccb; border-radius:7px; background:#fff;
                cursor:pointer; color:var(--ink); }
  .sact button:hover{ background:#f4efe4; border-color:var(--gold); }
  .sact button.danger{ color:#8c2f1b; border-color:#dcc0b5; }
  .sact button.danger:hover{ background:#f9ece7; }
  /* Drop a saved card here to append it as a new page. */
  /* A card that follows a group says so, and the badge takes you to its rule. */
  /* A chapter reads as one run: a tinted band under its cards, name on the first. */
  .sthumb.chIn .sprev{ box-shadow:0 6px 0 -2px rgba(31,74,69,.30); }
  .sthumb.chIn.cur .sprev{ box-shadow:0 0 0 2px rgba(201,162,75,.45), 0 6px 0 -2px rgba(31,74,69,.45); }
  .schap{ position:absolute; left:3px; bottom:-3px; z-index:2; max-width:calc(100% - 6px);
          font-size:9.5px; font-weight:800; letter-spacing:.3px; padding:1px 6px;
          border-radius:20px; background:var(--green); color:#f4efe4; cursor:pointer;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .schap:hover{ background:#17403b; }
  .srule{ position:absolute; left:3px; top:3px; z-index:2; max-width:calc(100% - 6px);
          font-size:9.5px; font-weight:800; letter-spacing:.3px; padding:2px 6px;
          border-radius:20px; background:var(--green); color:#f4efe4; cursor:pointer;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
          box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .srule:hover{ background:#17403b; }
  #stripEnd{ flex:0 0 auto; align-self:flex-start; display:flex; align-items:center;
             justify-content:center; border:2px dashed #cfc9b8; border-radius:6px;
             color:var(--muted); font-size:18px; font-weight:700; cursor:default;
             background:rgba(255,255,255,.45); }
  #stripEnd.over{ border-color:var(--green); color:var(--green); background:#fff; }
  @media print{ #strip,#stripTab{ display:none!important; } }
  /* ── Content panel: same feeling as the right panel — white, gold border,
     rounded, drop shadow. A vertical tab slides it out. Plain: you open it, you
     size it, you drag things out of it, you close it. ── */
  #res{ position:fixed; left:16px; top:16px; bottom:16px; width:640px; z-index:12; display:none;
        flex-direction:column; background:#fff; border:2px solid var(--gold); border-radius:14px;
        box-shadow:0 4px 18px rgba(0,0,0,.2); font-size:13px; overflow:hidden; }
  #res.open{ display:flex; }
  #resHead{ display:flex; align-items:center; gap:6px; padding:9px 12px; border-bottom:1px solid #ece7d9; }
  #resHead b{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--green); }
  #resHead .sp{ flex:1; }
  #res button{ font-family:inherit; font-weight:700; font-size:12px; padding:3px 8px;
               border:1px solid #d9d4c4; border-radius:7px; background:#fff; cursor:pointer; color:var(--ink); }
  #res button:hover{ background:#f4efe4; }
  #res button.on{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #resMain{ flex:1; display:flex; min-height:0; }
  #resFilters{ width:212px; flex:0 0 auto; padding:9px 10px; overflow-y:auto;
               border-right:1px solid #ece7d9; }
  #resSearch{ width:100%; font-family:inherit; font-size:13px; padding:5px 8px; margin-bottom:8px;
              border:1px solid #d9d4c4; border-radius:8px; }
  #resBody{ flex:1; min-width:0; overflow-y:auto; padding:10px 12px; }
  /* Archive accepts drops: pictures dragged in from the page or the desktop. */
  #resBody .dropz.over{ outline:2px dashed var(--gold); outline-offset:3px; border-radius:9px; }
  .rcard .rdel{ position:absolute; top:3px; right:3px; font-size:10px; font-weight:700;
                line-height:1; padding:2px 5px; border:1px solid #dcc0b5; border-radius:6px;
                background:rgba(255,255,255,.92); color:#8c2f1b; cursor:pointer; display:none; }
  .rcard:hover .rdel{ display:block; }
  #resBody .sechd{ display:flex; align-items:baseline; gap:9px; margin:16px 0 8px;
                   position:sticky; top:-10px; z-index:2; background:#fff;
                   padding:6px 0 5px; border-bottom:1px solid #ece7d9; cursor:grab; }
  #resBody .sechd:first-child{ margin-top:0; }
  #resBody .sechd:active{ cursor:grabbing; }
  #resBody .sechd b{ font-size:17px; font-weight:800; letter-spacing:.2px; color:var(--green); }
  #resBody .sechd .n{ font-size:12px; color:var(--muted); }
  #resBody .sechd .more{ margin-left:auto; font-size:11px; }
  #resBody .empty{ color:var(--muted); padding:10px 2px; line-height:1.5; }
  .rgrid{ display:flex; flex-wrap:wrap; gap:8px; }
  /* Everything in the card renderers is em, so the container's font-size scales a
     faithful preview at any size — no separate thumbnail code. */
  .rcard{ background:#fff; border:1px solid #e2dccb; border-radius:9px; padding:8px;
          cursor:grab; position:relative; overflow:hidden; }
  .rcard:hover{ border-color:var(--gold); box-shadow:0 2px 10px rgba(0,0,0,.10); }
  .rcard:active{ cursor:grabbing; }
  .rcard .block{ margin:0; }
  .rcard .clamp8 .bd{ display:-webkit-box; -webkit-line-clamp:8; -webkit-box-orient:vertical;
                      overflow:hidden; }
  .rcard img{ pointer-events:none; }
  #resSplit{ position:absolute; top:0; right:-4px; width:9px; height:100%; cursor:col-resize; z-index:2; }
  #resSplit:hover{ background:rgba(201,162,75,.35); }
  /* Vertical slide-out tab. */
  #resTab{ position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:11;
           font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1.2px;
           text-transform:uppercase; padding:14px 5px; border:1px solid #cfc9b8; border-left:0;
           border-radius:0 9px 9px 0; background:rgba(255,255,255,.9); cursor:pointer;
           color:var(--muted); writing-mode:vertical-rl; }
  #resTab:hover{ background:#fff; color:var(--ink); }
  /* Click a thumbnail to see it big. */
  #resPrev{ display:none; position:fixed; inset:0; z-index:70; background:rgba(35,41,29,.45);
            align-items:center; justify-content:center; padding:40px; }
  #resPrev.open{ display:flex; }
  #resPrevBox{ background:#fff; border:2px solid var(--gold); border-radius:14px; padding:22px;
               max-width:620px; max-height:88vh; overflow:auto; font-size:20px;
               box-shadow:0 8px 30px rgba(0,0,0,.3); }
  /* Out-of-date cards, offered when a print opens. */
  #updOverlay{ display:none; position:fixed; inset:0; z-index:75; background:rgba(35,41,29,.45);
               align-items:center; justify-content:center; padding:40px; }
  #updOverlay.open{ display:flex; }
  #updBox{ background:#fff; border:2px solid var(--gold); border-radius:14px; padding:18px 20px;
           max-width:620px; width:100%; max-height:86vh; overflow:auto; font-size:13px;
           box-shadow:0 8px 30px rgba(0,0,0,.3); }
  #updBox h3{ margin:0 0 4px; font-size:15px; color:var(--green); }
  #updBox .sub{ color:var(--muted); font-size:12.5px; margin-bottom:12px; }
  #updBody .uhead,#updBody .urow{ display:grid; grid-template-columns:1fr auto auto 28px;
        gap:10px; align-items:start; padding:8px 2px; border-bottom:1px solid #efe9d8; }
  #updBody .uhead{ font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
        color:var(--green); border-bottom-width:2px; }
  #updBody .urow.edited{ background:#fdf6ee; }
  #updBody .uwarn{ font-size:11px; color:#8c2f1b; }
  #updBox .foot{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  #updBox button{ font-family:inherit; font-weight:700; font-size:13px; padding:6px 12px;
        border:1px solid #d9d4c4; border-radius:9px; background:#fff; cursor:pointer; }
  #updBox button.primary{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  /* Saved-card badges in the Content panel. */
  .rcard .rmeta{ font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  .rcard.paperOff{ opacity:.45; }
  .rcard.paperOff:hover{ opacity:1; }
  @media print{ #res,#resTab,#resPrev,#updOverlay{ display:none!important; } }
  #knobs{ margin-top:8px; padding-top:8px; border-top:2px solid #efe9d8; }
  #knobs .row{ display:flex; gap:4px; flex-wrap:wrap; }
  #knobs .hint{ font-size:12px; color:var(--muted); line-height:1.45; }
  #knobs .sw{ width:21px; height:21px; border-radius:6px; padding:0; border:1px solid rgba(0,0,0,.18); cursor:pointer; }
  #knobs input[type=color]{ width:34px; height:26px; padding:0 2px; border:1px solid #d9d4c4; border-radius:6px; background:#fff; cursor:pointer; }
  /* The canvas floats free: translate+scale, no anchors, no scrollbars. Fit brings it home. */
  #out{ position:absolute; left:0; top:0; transform-origin:0 0; }
  #zoomWrap button{ font-family:inherit; font-weight:700; padding:4px 8px; border:1px solid #c9c4b4; border-radius:7px; background:#fff; cursor:pointer; }
  #zoomWrap button:hover{ background:#f4efe4; }
  #out .page{ cursor:grab; }
  .err{ text-align:center; padding:60px; color:var(--muted); }
  @media print{
    #panel{ display:none!important; } .rszh,.crE{ display:none!important; }
    [contenteditable]{ outline:none!important; }
    .abswrap.sel,.frameobj.sel{ outline:none!important; }
    body{ background:#fff; overflow:visible!important; height:auto!important; }
    /* Backgrounds and shadows must actually print. */
    .abswrap,.frameobj,.block,.txtfree{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #out{ position:static!important; transform:none!important; width:auto!important; height:auto!important; margin:0!important; overflow:visible!important; }
    /* Size comes from applyPaper()'s injected rule — the DESIGN paper. */
    .page{ box-shadow:none; margin:0; page-break-after:always; overflow:hidden!important; }
    .page:last-child{ page-break-after:auto; break-after:auto; }   /* no phantom empty sheet */
    #out .page{ cursor:auto; }
  }
</style>
<link rel="stylesheet" href="/filter-tree.css">
<link rel="stylesheet" href="/card-render.css">
<script src="/card-render.js"></script>
</head>
<body>

<aside id="panel">
  <div id="docCtl">
    <input id="docName" type="text" placeholder="Name of this print" title="Rename this print">
    <div class="prow">
      <button onclick="window.print()" title="Print / save as PDF">🖨 PDF</button>
      <span id="saveState" title="Everything saves by itself">✓ Saved</span>
      <button id="undoBtn" title="Undo (Ctrl+Z)" style="flex:0 0 auto;">↶</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" style="flex:0 0 auto;">↷</button>
    </div>
    <div class="ph">Paper</div>
    <div class="hint" id="designPaper" style="margin:0 0 4px;">Designed for A4</div>
    <select id="outPaper" title="Print this design on a different paper — the whole page scales, nothing is re-laid out"></select>
    <div class="hint" id="printPaperNote" style="display:none;margin:4px 0 0;"></div>
    <div class="ph">Zoom · <span id="zoomPct">100%</span></div>
    <div id="zoomWrap" class="prow">
      <button id="zoomOut" title="Zoom out ( - )">−</button>
      <input type="range" id="zoom" min="5" max="200" value="18">
      <button id="zoomIn" title="Zoom in ( + )">＋</button>
      <button id="zoomFit" title="Fit to window ( 0 )">Fit</button>
    </div>
    <!-- Page navigation and page operations live in the filmstrip now. -->
    <div class="prow"><button id="addTextBtn" title="Add a free text object to this page">＋ Text</button></div>
  </div>
  <div id="knobs"></div>
</aside>
<div id="out"><div class="err">Loading…</div></div>
<button id="resTab" title="Show or hide your content">Content</button>
<aside id="res">
  <div id="resSplit" title="Drag to set the width"></div>
  <div id="resHead"><b>Content</b><span class="sp"></span>
    <button id="resS" title="Small thumbnails">S</button>
    <button id="resM" class="on" title="Medium">M</button>
    <button id="resL" title="Large">L</button>
    <button id="resClose" title="Close">✕</button></div>
  <div id="resMain">
    <div id="resFilters">
      <input type="text" id="resSearch" placeholder="Search…" autocomplete="off">
      <div class="ftree" id="resTree"></div>
    </div>
    <div id="resBody"></div>
  </div>
</aside>
<div id="resPrev"><div id="resPrevBox"></div></div>
<div id="updOverlay"><div id="updBox">
  <h3>Some cards have newer versions</h3>
  <div class="sub">Nothing changes unless you tick it. Updating replaces those pages with the latest.</div>
  <div id="updBody"></div>
  <div class="foot"><button id="updSkip">Not now</button><button id="updGo" class="primary">Update ticked</button></div>
</div></div>
<button id="stripTab" title="Show or hide the row of cards">▤ Cards</button>
<div id="strip"><div id="stripInner"></div></div>

<script>
// Everything about how a card LOOKS comes from the shared module, so the
// editor, the filmstrip, the Content panel and the print library can never
// disagree. Aliased to the old names so no call site had to change.
const { esc, cleanStyle, sanitizeHtml, STYLE_OK, BORDER_STYLES, FONTSTACK, fontCss,
        SHB, SHT, shStr, decoCss, borderCss, cropEms, fsOf,
        postBlock, personCard, mediaBlock, cardInner,
        PAPERS, paperOf, MMPX, r4, pScale, RADpx, PADpx } = CardRender;
const compId = new URLSearchParams(location.search).get('comp');

// Limited rich text: only harmless formatting survives (text is content; scripts
// are not). DOM-based: parse into an inert template, drop dangerous elements,
// unwrap unknown tags, and keep only whitelisted style properties on the rest.

// ── Object renderers ───────────────────────────────────────────────
// A post decomposes into SEPARATE objects: one text object + one object per
// photo (part: 'txt' | 'img0','img1',…). They never move together — every
// piece is dragged, sized, angled and bordered on its own.
// Futura Book is licensed, so it may simply not be on the machine. Name it first,
// then Jost — the open geometric sans from the same lineage — so the page still
// looks right rather than dropping to the browser default.
// Shadow presets (em-based → they scale with the object). Bare text (no
// background, no border) gets a LETTER shadow; everything else a box shadow.
// Border/background/radius/shadow all scale WITH THE PAPER (A4 = reference),
// so a card and a poster carry the exact same look, just proportionally.
// Tight, close shadows — short gradient, real density. Values are A4 px.
// The words under the portrait live in a .bd, exactly like a post's text — that
// is what makes them editable in place. The photo stays OUTSIDE .bd so editing
// can never swallow it. ov.text overrides the generated wording, same as a post.
// Media card = an SVG (logo/graphic). Rendered via <img> so no script runs.
// A media picture crops exactly like a post photo: the .imgo wrapper is always
// present (that is what the crop code measures and drags), and when ov.pwr is set
// it becomes a window over a larger, offset image. The caption stays outside the
// window so cropping never clips it.

let COMP=null;
let curPage=1;
function render(){ renderCurrent(); }
function frames(){ COMP.params=COMP.params||{}; return COMP.params.frames=COMP.params.frames||[]; }
function texts(){ COMP.params=COMP.params||{}; return COMP.params.texts=COMP.params.texts||[]; }

// ── A DOCUMENT IS AN ORDERED LIST OF CARDS ──────────────────────────
// params.cards = [{id}, {id}, …]. Every object carries overrides.card = the id
// of the card it lives on. The card id is STABLE; the page number is NOT — it is
// a derived cache, recomputed by syncPages() from the card's position in the list.
//
// That's the whole trick. Reordering pages is a splice of params.cards followed
// by syncPages(); no object is touched and nothing has to be renumbered. All the
// existing rendering code goes on reading overrides.page exactly as before.
function cards(){ COMP.params=COMP.params||{}; return COMP.params.cards=COMP.params.cards||[]; }
function newCardId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function cardIdAt(n){ const c=cards(); return (c[n-1]&&c[n-1].id)||null; }
function ensureCards(n){ const c=cards(); while(c.length<n) c.push({id:newCardId()}); }
// Recompute every object's page from where its card now sits in the list.
function syncPages(){
  const idx=new Map(); cards().forEach((c,i)=>idx.set(c.id,i+1));
  const N=Math.max(1,cards().length);
  // An object whose card is missing or unknown would keep a STALE page number and
  // sit there for ever, appearing next to the real objects as if duplicated.
  // Adopt it onto the card its page currently points at instead.
  const put=o=>{
    if(!o) return;
    let p=o.card?idx.get(o.card):null;
    if(!p){ p=Math.max(1,Math.min(N,+o.page||1)); o.card=cardIdAt(p); }
    o.page=p;
  };
  (COMP.items||[]).forEach(it=>put(it.overrides));
  frames().forEach(put); texts().forEach(put);
  COMP.params.pages=Math.max(1,cards().length);
}
// Documents made before cards existed are keyed by page number only: mint one
// card per page, in page order, and hand every object the matching id.
function migrateCards(){
  if(!cards().length){
    let maxP=Math.max(1,+((COMP.params||{}).pages)||1);
    const scan=o=>{ if(o&&+o.page>maxP) maxP=+o.page; };
    (COMP.items||[]).forEach(it=>scan(it.overrides));
    frames().forEach(scan); texts().forEach(scan);
    ensureCards(maxP);
  }
  const give=o=>{ if(!o) return; if(!o.card){ const n=Math.max(1,+o.page||1); ensureCards(n); o.card=cardIdAt(n); } };
  (COMP.items||[]).forEach(it=>give(it.overrides));
  frames().forEach(give); texts().forEach(give);
  syncPages();
}
// Explode posts into separate objects (text + each photo) the first time a
// document opens under the object model; everything else just gets a place.
function normalizeItems(){
  COMP.params=COMP.params||{};
  frames(); texts();
  const out=[]; let n=0;
  const seed=()=>{ const s={x:8+(n%3)*30, y:6+Math.floor(n/3)*24}; n++; return s; };
  (COMP.items||[]).forEach(it=>{
    const ov=it.overrides=it.overrides||{};
    if(+ov.pw&&!+ov.pwr){   // absolute-em window crop (one deploy old) → ratios
      const P=paperOf((COMP.params&&COMP.params.paper)||'a4');
      const Wem=P.w*MMPX*((+ov.w||28)/100)/fsOf(ov);
      ov.pwr=r4(+ov.pw/Wem); ov.phr=r4((+ov.ph||10)/Wem);
      ov.ixr=r4((+ov.ix||0)/Wem); ov.iyr=r4((+ov.iy||0)/Wem);
      delete ov.pw; delete ov.ph;
    }
    delete ov.ix; delete ov.iy; delete ov.tx; delete ov.ty;   // pre-object-model leftovers
    if(it.ref_type==='post'&&!ov.part){
      const photos=(it.content&&it.content.photos)||[];
      const s=(ov.x==null)?seed():{x:+ov.x,y:+ov.y};
      const page=ov.page==null?1:+ov.page, w=+ov.w||28;
      // Pictures stacked, then the text UNDERNEATH them. They used to cascade
      // diagonally, which put every photo on top of the words.
      const P=paperOf((COMP.params&&COMP.params.paper)||'a4');
      const imgH=w*(P.w/P.h)*0.85, GAP=1.5;      // a photo runs ~0.85x its width
      photos.forEach((p,i)=> out.push({ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content,
        overrides:{ part:'img'+i, page, x:s.x, y:Math.round((s.y+i*(imgH+GAP))*10)/10, w } }));
      const ty=s.y+photos.length*(imgH+GAP);
      out.push({ ...it, overrides:Object.assign({},ov,
        {part:'txt', page, x:s.x, y:Math.round(ty*10)/10, w}) });
    } else {
      if(ov.page==null){ const s=seed(); ov.page=1; if(ov.x==null) ov.x=s.x; if(ov.y==null) ov.y=s.y; if(ov.w==null) ov.w=28; }
      out.push(it);
    }
  });
  COMP.items=out;
  migrateCards();
}

async function load(){
  if(!compId){ document.getElementById('out').innerHTML='<div class="err">No composition given (?comp=ID).</div>'; return; }
  const r=await fetch('/api/compositions/'+compId);
  if(!r.ok){ document.getElementById('out').innerHTML='<div class="err">Could not load the brochure.</div>'; return; }
  COMP=await r.json();
  document.title=COMP.name+' · Turtle & Sun';
  { const dn=document.getElementById('docName'); if(dn) dn.value=COMP.name||''; }
  normalizeItems();
  buildPaperOptions();
  document.getElementById('outPaper').value=paperOf(outPaperKey()).k;
  applyPaper();
  render();
  syncZoom();
  showKnobs();
  renderStrip();
  setTimeout(()=>{ try{ checkForUpdates(); }catch(e){} }, 400);
}

// ── Paper sizes ─────────────────────────────────────────────────────
const paperArea=P=>P.w*P.h;
const num1=x=>String(Math.round(x*10)/10);
function paperLabel(P){
  return P.u==='in'
    ? P.n+' — '+num1(P.w/25.4)+' × '+num1(P.h/25.4)+' in'
    : P.n+' — '+num1(P.w/10)+' × '+num1(P.h/10)+' cm';
}
function buildPaperOptions(){
  const sel=document.getElementById('outPaper');
  sel.innerHTML=PAPERS.slice().sort((a,b)=>paperArea(b)-paperArea(a))
    .map(P=>'<option value="'+P.k+'">'+paperLabel(P)+'</option>').join('');
}
// The page is ALWAYS built at its design size. The output paper is one zoom on
// top — layout-affecting, so the sheet is the right physical size, and inherited
// by everything inside including absolute px.
function applyPaper(){
  const D=paperOf(designPaperKey()), O=paperOf(outPaperKey());
  CardRender.setPaper(D.k);
  document.body.className = D.canvas ? 'fmt-poster' : 'fmt-doc';
  document.body.style.setProperty('--pr',(4.5*D.w*MMPX/794).toFixed(1)+'px');
  let st=document.getElementById('pageSize');
  if(!st){ st=document.createElement('style'); st.id='pageSize'; document.head.appendChild(st); }
  // Fit BOTH ways. Scaling by width alone overflows whenever the output sheet is
  // a different shape — A4 onto US Letter is 2.8% wider but 6% shorter, so the
  // bottom of the design would run off the page.
  const ratio=Math.min(O.w/D.w, O.h/D.h);
  // Chrome matches a CSS *named* size to its paper dropdown more reliably than raw
  // millimetres. Only a few names exist in the spec; everything else stays in mm.
  const CSSNAME={ a5:'A5', a4:'A4', a3:'A3', letter:'letter', legal:'legal', tabloid:'ledger' };
  const sz = CSSNAME[O.k] || (O.w+'mm '+O.h+'mm');
  let css='@page{ size:'+sz+'; margin:0; }';
  if(D.canvas){
    css+=' .page{ width:'+D.w+'mm; height:'+D.h+'mm; min-height:0; padding:0;';
  }else{
    const pad=Math.max(8, Math.round(D.w*0.06));
    css+=' .page{ width:'+D.w+'mm; min-height:'+D.h+'mm; height:auto; padding:'+pad+'mm;';
  }
  css+=' zoom:'+ratio.toFixed(6)+'; }';
  st.textContent=css;
  const lbl=document.getElementById('designPaper');
  if(lbl) lbl.textContent='Designed for '+paperLabel(D)+(ratio!==1?' — printing at '+(ratio*100).toFixed(0)+'%':'');
  // Chrome cannot be told which paper to preselect, so say it plainly instead.
  const rem=document.getElementById('printPaperNote');
  if(rem){
    rem.textContent='In the print dialog: paper '+O.n+', margins None, scale 100%.';
    rem.style.display='block';
  }
}
function designPaperKey(){ return (COMP&&COMP.params&&COMP.params.paper)||'a4'; }
function outPaperKey(){ return (COMP&&COMP.params&&(COMP.params.outPaper||COMP.params.paper))||'a4'; }

// ── Zoom + free pan ─────────────────────────────────────────────────
const ZMIN=5;
let curScale=1;
// Small papers may zoom far further: the limit is "page ≈ 3× window width",
// so an A6 goes to ~1000%+ while an A0 keeps a sane range.
function zmax(){
  const P=paperOf((COMP&&COMP.params&&COMP.params.paper)||'a4');
  return Math.max(200, Math.round(window.innerWidth*3/(P.w*MMPX)*100));
}
function clampPct(p){ return Math.max(ZMIN, Math.min(zmax(), p)); }
function contentNat(){
  const out=document.getElementById('out');
  let w=0,h=0;
  out.querySelectorAll('.page').forEach(p=>{ w=Math.max(w,p.offsetWidth); h=Math.max(h,p.offsetTop+p.offsetHeight); });
  return { w, h };
}
let panX=20, panY=16;
function setView(){
  const out=document.getElementById('out');
  out.style.transform='translate('+panX+'px,'+panY+'px) scale('+curScale+')';
  out.style.setProperty('--ui', String(1/screenScale()));   // constant-screen-size handles/outlines
}
// True screen scale = the editor's zoom x the output-paper zoom.
function paperZoom(){
  try{ const D=paperOf(designPaperKey()), O=paperOf(outPaperKey());
       return Math.min(O.w/D.w, O.h/D.h); }
  catch(e){ return 1; }
}
function screenScale(){ return curScale*paperZoom(); }
function applyZoom(pct){ pct=clampPct(pct); curScale=pct/100; setView(); syncZoomLabel(pct); }
function syncZoomLabel(pct){
  const zi=document.getElementById('zoom'); if(zi){ zi.max=zmax(); zi.value=Math.round(pct); }
  const zp=document.getElementById('zoomPct'); if(zp) zp.textContent=Math.round(pct)+'%';
}
function fitPct(){
  const {w,h}=contentNat();
  if(!w) return 100;
  // The WHOLE page must fit: whichever of width and height is tighter wins.
  // The open filmstrip eats the bottom of the window, so Fit has to allow for it.
  const strip=document.getElementById('strip');
  const eat = (stripOpen && strip) ? strip.offsetHeight : 0;
  const rp=document.getElementById('res');
  const left=(rp&&rp.classList.contains('open'))?rp.offsetWidth:0;
  return clampPct(Math.min((window.innerWidth-306-left)/w, (window.innerHeight-32-eat)/h)*100);
}
function syncZoom(){
  const {w}=contentNat();
  const pct=fitPct();
  curScale=pct/100;
  panX=Math.max(14, ((window.innerWidth-292)-w*curScale)/2);
  panY=16;
  setView(); syncZoomLabel(pct);
}
function zoomToPct(pct, cx, cy){
  pct=clampPct(pct);
  if(cx==null){ cx=(window.innerWidth-292)/2; cy=window.innerHeight/2; }
  const s0=curScale;
  const px=(cx-panX)/s0, py=(cy-panY)/s0;
  curScale=pct/100;
  panX=cx-px*curScale; panY=cy-py*curScale;
  setView(); syncZoomLabel(pct);
}
function zoomStep(factor, cx, cy){ zoomToPct(curScale*100*factor, cx, cy); }

// ── Page model ──────────────────────────────────────────────────────
function itemsAll(){ return (COMP.items||[]).map((it,i)=>({ ...it, _idx:i })); }
// The card list is the truth. (The scan is a belt-and-braces fallback for a
// document opened before migrateCards() has run.)
function pageCount(){
  const c=cards(); if(c.length) return c.length;
  let n=(COMP.params&&+COMP.params.pages)||1;
  itemsAll().forEach(it=>{ const p=it.overrides&&+it.overrides.page; if(p>n) n=p; });
  frames().forEach(f=>{ if(+f.page>n) n=+f.page; });
  texts().forEach(t=>{ if(+t.page>n) n=+t.page; });
  return Math.max(1,n);
}
// An object's font-size follows its width (true zoom), times a text-zoom knob.
// An object's width is a PERCENTAGE of the page, so it grows with the paper.
// The font-size has to grow with it, or changing A4 → poster leaves the box three
// times bigger with the same small type — and because everything inside an object
// is em, the whole internal layout drifts. pScale() is 1.0 on A4, so A4 documents
// are unaffected; other papers are corrected.
// Crop geometry is stored as RATIOS of the window width (pwr/phr/ixr/iyr), so
// it survives paper-size changes and object resizing untouched. cropEms turns
// them into em values for the CURRENT paper.
function absWrap(it){
  const ov=it.overrides||{};
  const x=ov.x!=null?+ov.x:10, y=ov.y!=null?+ov.y:10, w=+ov.w||28;
  const bareText=it.ref_type==='post'&&(ov.part||'txt')==='txt';
  // One corner rule for the WHOLE object: rounded (default) or square —
  // the wrapper radius rounds background, border and box-shadow together.
  const st='position:absolute;left:'+x+'%;top:'+y+'%;width:'+w+'%;font-size:'+fsOf(ov)+'px;z-index:'+(+ov.z||0)+';'
    +'border-radius:'+(ov.sq?'0':RADpx().toFixed(1)+'px')+';'
    +(+ov.r?'transform:rotate('+(+ov.r)+'deg);':'')
    +borderCss(ov)
    +decoCss(ov,bareText)
    +(ov.tc?'color:'+esc(ov.tc)+';':'');
  return '<div class="abswrap'+(ov.sq?' sqo':'')+(+ov.pin?' pinned':'')+
    '" style="'+st+'" data-absidx="'+it._idx+'">'+cardInner(it)+'</div>';
}
function frameDiv(f,i){
  const bs=BORDER_STYLES.includes(f.bs)?f.bs:'solid';
  return '<div class="frameobj" data-frame="'+i+'" style="position:absolute;'+
    'left:'+(+f.x||0)+'%;top:'+(+f.y||0)+'%;width:'+(+f.w||20)+'%;height:'+(+f.h||20)+'%;'+
    'z-index:'+(+f.z||0)+';border:'+((+f.bw||2)*pScale()).toFixed(1)+'px '+bs+' '+esc(f.bc||'#c9a24b')+';'+
    (f.bg?'background:'+esc(f.bg)+';':'')+
    (+f.sh?'box-shadow:'+shStr(SHB,+f.sh)+';':'')+
    'border-radius:'+(f.sq?'0':RADpx().toFixed(1)+'px')+';'+
    (+f.r?'transform:rotate('+(+f.r)+'deg);':'')+'"></div>';
}
// A free text object — lives in params (like frames), needs no card behind it.
function txtFreeDiv(t,i){
  const st='position:absolute;left:'+(+t.x||0)+'%;top:'+(+t.y||0)+'%;width:'+(+t.w||30)+'%;font-size:'+fsOf(t)+'px;z-index:'+(+t.z||0)+';'
    +'border-radius:'+(t.sq?'0':RADpx().toFixed(1)+'px')+';'
    +(+t.r?'transform:rotate('+(+t.r)+'deg);':'')
    +borderCss(t)
    +decoCss(t,true)
    +(t.tc?'color:'+esc(t.tc)+';':'');
  const cls='block txtobj'+(t.ff?' ffo':'')+(t.tc?' tco':'');
  const ffs=t.ff?' style="font-family:'+esc(fontCss(t.ff))+'"':'';
  return '<div class="abswrap txtfree'+(t.sq?' sqo':'')+'" style="'+st+'" data-text="'+i+'">'+
    '<div class="'+cls+'"'+ffs+'><div class="bd">'+sanitizeHtml(t.text||'')+'</div></div></div>';
}
function pageHtml(n){
  const on=itemsAll().filter(it=>(it.overrides&&+it.overrides.page)===n);
  const fr=frames().map((f,i)=>({f,i})).filter(x=>(+x.f.page||1)===n);
  const tx=texts().map((t,i)=>({t,i})).filter(x=>(+x.t.page||1)===n);
  return '<div class="page" data-page="'+n+'" style="position:relative;">'+
    on.map(absWrap).join('')+tx.map(x=>txtFreeDiv(x.t,x.i)).join('')+fr.map(x=>frameDiv(x.f,x.i)).join('')+'</div>';
}
function renderCurrent(){
  const N=pageCount();
  curPage=Math.max(1,Math.min(N,curPage));
  document.getElementById('out').innerHTML=pageHtml(curPage);
  wireDrag(); wirePan();
  markSel();
  updateOffpage(); setTimeout(updateOffpage,250);   // again once images have height
}
// Grey out anything ENTIRELY outside the page (parked). Partly-off objects
// stay full colour — bleeding off the edge is design, and print clips it.
function updateOffpage(){
  const page=document.querySelector('#out .page'); if(!page) return;
  const pr=page.getBoundingClientRect();
  document.querySelectorAll('#out .abswrap, #out .frameobj').forEach(el=>{
    const r=el.getBoundingClientRect();
    el.classList.toggle('offpage', r.right<pr.left||r.left>pr.right||r.bottom<pr.top||r.top>pr.bottom);
  });
}
function renderAllPages(){
  const N=pageCount(); let html='';
  for(let n=1;n<=N;n++) html+=pageHtml(n);
  document.getElementById('out').innerHTML=html;
}

// ── Selection: any number of objects; last picked = primary ─────────
let SEL=[];
function primary(){ return SEL.length?SEL[SEL.length-1]:null; }
function primItem(){ const p=primary(); return (p&&p[0]==='i')?+p.slice(1):null; }
function primFrame(){ const p=primary(); return (p&&p[0]==='f')?+p.slice(1):null; }
function primText(){ const p=primary(); return (p&&p[0]==='t')?+p.slice(1):null; }
function selItemIdxs(){ return SEL.filter(s=>s[0]==='i').map(s=>+s.slice(1)); }
function selFrameIdxs(){ return SEL.filter(s=>s[0]==='f').map(s=>+s.slice(1)); }
function selTextIdxs(){ return SEL.filter(s=>s[0]==='t').map(s=>+s.slice(1)); }
function setSel(key,additive){
  if(additive){ const i=SEL.indexOf(key); if(i>=0) SEL.splice(i,1); else SEL.push(key); }
  else SEL=[key];
  if(cropKey&&cropKey!==primary()) cropKey=null;
  showKnobs(); markSel();
}
function clearSel(){ cropKey=null; if(!SEL.length) return; SEL=[]; showKnobs(); markSel(); }
function elOf(key){
  // Scoped to #out: the filmstrip renders the same page markup as previews, so an
  // unscoped query could hand back a THUMBNAIL instead of the object on the canvas.
  return key[0]==='i' ? document.querySelector('#out .abswrap[data-absidx="'+key.slice(1)+'"]')
       : key[0]==='t' ? document.querySelector('#out .txtfree[data-text="'+key.slice(1)+'"]')
                      : document.querySelector('#out .frameobj[data-frame="'+key.slice(1)+'"]');
}
function ovOf(key){
  return key[0]==='i' ? (COMP.items[+key.slice(1)].overrides=COMP.items[+key.slice(1)].overrides||{})
       : key[0]==='t' ? texts()[+key.slice(1)]
                      : frames()[+key.slice(1)];
}

// ── Drag: every selected object moves together ──────────────────────
let dragMoved=false;
function dragSelFrom(e,w){
  const page=w.closest('.page'); if(!page) return;
  const pr=page.getBoundingClientRect();
  const pre=snap();
  const sx=e.clientX, sy=e.clientY;
  const start=SEL.map(key=>{ const o=ovOf(key); return {key, x:+o.x||0, y:+o.y||0}; });
  dragMoved=false;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/pr.width*100, dy=(ev.clientY-sy)/pr.height*100;
    if(Math.abs(dx)+Math.abs(dy)>0.1) dragMoved=true;
    start.forEach(s=>{
      const o=ovOf(s.key);
      o.x=Math.round(Math.max(-150,Math.min(240,s.x+dx))*10)/10;   // park freely off-page
      o.y=Math.round(Math.max(-150,Math.min(240,s.y+dy))*10)/10;
      const el=elOf(s.key); if(el){ el.style.left=o.x+'%'; el.style.top=o.y+'%'; }
    });
    updateOffpage();
  };
  // Let go over a card in the filmstrip and the selection moves to THAT card,
  // keeping the position it had. This is the quick way to shift a picture to
  // another page without cutting and pasting.
  const overThumb=ev=>{
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const th=el&&el.closest&&el.closest('.sthumb');
    return th?+th.dataset.n:null;
  };
  const mvHi=ev=>{
    const n=overThumb(ev);
    document.querySelectorAll('.sthumb.dragover').forEach(x=>x.classList.remove('dragover'));
    if(n){ const t=document.querySelector('.sthumb[data-n="'+n+'"]'); if(t) t.classList.add('dragover'); }
  };
  const pinTouched=()=>SEL.forEach(k=>{ const o=ovOf(k); if(o&&o.rule&&!o.pin) o.pin=1; });
  const up=ev=>{
    removeEventListener('pointermove',mv); removeEventListener('pointermove',mvHi);
    removeEventListener('pointerup',up);
    document.querySelectorAll('.sthumb.dragover').forEach(x=>x.classList.remove('dragover'));
    const n=dragMoved?overThumb(ev):null;
    if(dragMoved) pinTouched();
    if(n&&n!==curPage){
      // Snap back to where they started, then re-home them on the target card.
      start.forEach(s=>{ const o=ovOf(s.key); o.x=s.x; o.y=s.y; });
      const id=cardIdAt(n);
      SEL.forEach(key=>{ const o=ovOf(key); o.card=id; o.page=n; });
      pushUndo(pre);
      renderCurrent(); showKnobs(); markSel();
      return;
    }
    if(dragMoved) pushUndo(pre);
  };
  addEventListener('pointermove',mv); addEventListener('pointermove',mvHi);
  addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
function keyOfEl(w){
  return w.dataset.absidx!=null ? 'i'+w.dataset.absidx
       : w.dataset.text!=null   ? 't'+w.dataset.text
       : 'f'+w.dataset.frame;
}
// What kind of object is behind a key?
function isTextKey(key){
  if(key[0]==='t') return true;
  if(key[0]!=='i') return false;
  const it=COMP.items[+key.slice(1)];
  return !!it&&it.ref_type==='post'&&((it.overrides||{}).part||'txt')==='txt';
}
function isPicKey(key){
  if(key[0]!=='i') return false;
  const it=COMP.items[+key.slice(1)];
  if(!it) return false;
  if(it.ref_type==='post')  return String((it.overrides||{}).part||'').slice(0,3)==='img';
  // Dragged-in and uploaded pictures crop too. SVG logos don't — they scale.
  if(it.ref_type==='media') return (it.content||{}).kind!=='svg';
  return false;
}
function wireDrag(){
  document.querySelectorAll('#out .abswrap,#out .frameobj').forEach(w=>{
    w.onpointerdown=e=>{
      if(e.target.closest('.rszh,.crE')) return;
      if(e.target.closest('[contenteditable="true"]')) return;
      if(editing) commitEdit(false);        // click away = saved, never lost
      const key=keyOfEl(w);
      if(cropKey===key&&e.target.closest('img')) return cropDrag(e,w,key);
      w._wasSel=SEL.includes(key);
      if(e.shiftKey){ setSel(key,true); if(!SEL.includes(key)) return; }
      else if(!w._wasSel) setSel(key,false);
      dragSelFrom(e,w);
    };
  });
}
// Click an ALREADY-selected text object again (no drag) → edit right there.
document.getElementById('out').addEventListener('click',e=>{
  const w=e.target.closest('.abswrap'); if(!w) return;
  if(e.target.closest('[contenteditable="true"]')) return;
  let key=null, isText=false;
  if(w.dataset.absidx!=null){
    const idx=+w.dataset.absidx; key='i'+idx;
    const it=COMP.items[idx];
    // Person cards are editable too — but NOT isTextKey, because resizing one
    // must scale the portrait with the words, not reflow the words alone.
    isText=!!it&&( (it.ref_type==='post'&&((it.overrides||{}).part||'txt')==='txt')
                 || it.ref_type==='contact' );
  }else if(w.dataset.text!=null){ key='t'+w.dataset.text; isText=true; }
  if(key&&isText&&w._wasSel&&!dragMoved&&SEL.length===1&&SEL[0]===key) enterEdit(key,e.clientX,e.clientY);
});
// Empty space: drag on the PAGE draws a selection rectangle (everything it
// touches gets selected); drag on the grey outside pans the canvas.
// A plain click on either deselects.
let panWired=false;
function wirePan(){
  if(panWired) return; panWired=true;
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    if(e.target.closest('#panel')||e.target.closest('#strip')||e.target.closest('#stripTab')||e.target.closest('#res')||e.target.closest('#resTab')
       ||e.target.closest('.abswrap')||e.target.closest('.frameobj')||e.target.closest('[contenteditable="true"]')) return;
    if(editing) commitEdit(false);
    if(e.target.closest('#out .page')){ startMarquee(e); return; }
    clearSel();
    const sx=e.clientX, sy=e.clientY, opx=panX, opy=panY;
    document.body.style.cursor='grabbing';
    const mv=ev=>{ panX=opx+(ev.clientX-sx); panY=opy+(ev.clientY-sy); setView(); };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); document.body.style.cursor=''; };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
    e.preventDefault();
  });
}
function startMarquee(e){
  const sx=e.clientX, sy=e.clientY;
  const additive=e.shiftKey;
  let box=null, moved=false;
  const mv=ev=>{
    moved=true;
    if(!box){ box=document.createElement('div'); box.className='marquee'; document.body.appendChild(box); }
    Object.assign(box.style,{
      left:Math.min(sx,ev.clientX)+'px', top:Math.min(sy,ev.clientY)+'px',
      width:Math.abs(ev.clientX-sx)+'px', height:Math.abs(ev.clientY-sy)+'px' });
  };
  const up=ev=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(box) box.remove();
    if(!moved){ clearSel(); return; }
    const x1=Math.min(sx,ev.clientX), y1=Math.min(sy,ev.clientY);
    const x2=Math.max(sx,ev.clientX), y2=Math.max(sy,ev.clientY);
    const hits=[];
    document.querySelectorAll('#out .abswrap, #out .frameobj').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.right>x1&&r.left<x2&&r.bottom>y1&&r.top<y2) hits.push(keyOfEl(el));
    });
    if(!additive) SEL=[];
    hits.forEach(h=>{ if(!SEL.includes(h)) SEL.push(h); });
    showKnobs(); markSel();
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.preventDefault();
}

// ── Page navigation ─────────────────────────────────────────────────
function setPage(n){ curPage=n; SEL=[]; renderCurrent(); showKnobs(); stripMark(); }
// Insert a new card AFTER the current one — a yearbook is built by inserting,
// not only by appending.
function addPage(){
  pushUndo();
  const nid=newCardId();
  const f=chapterOf(curPage);
  cards().splice(curPage,0,{id:nid});
  // A chapter is a container: adding a page grows it instead of breaking it in two.
  if(f){ const list=f.ch.cards||[]; const at=list.indexOf(cardIdAt(curPage)); list.splice(at+1,0,nid); }
  joinPlacement(cardIdAt(curPage), nid);
  enforceChapters();
  setPage(curPage+1);
}
function deletePage(){
  if(pageCount()<=1) return;        // a document keeps at least one card
  pushUndo();                       // Ctrl+Z brings the card and its objects back
  const id=cardIdAt(curPage);
  COMP.items=(COMP.items||[]).filter(it=>!(it.overrides&&it.overrides.card===id));
  COMP.params.frames=frames().filter(f=>f.card!==id);
  COMP.params.texts =texts().filter(t=>t.card!==id);
  cards().splice(curPage-1,1);
  enforceChapters();
  curPage=Math.min(curPage,pageCount());
  SEL=[]; renderCurrent(); showKnobs();
}

// ── Object operations ───────────────────────────────────────────────
function removeSelected(){
  if(!SEL.length) return;
  pushUndo();                       // Ctrl+Z is the safety net, not a dialog
  selItemIdxs().sort((a,b)=>b-a).forEach(i=>COMP.items.splice(i,1));
  selFrameIdxs().sort((a,b)=>b-a).forEach(i=>frames().splice(i,1));
  selTextIdxs().sort((a,b)=>b-a).forEach(i=>texts().splice(i,1));
  SEL=[]; renderCurrent(); showKnobs();
}
function bumpZ(dir){
  if(!SEL.length) return;
  pushUndo();
  // Collect the live override objects on this card (same references, so the
  // renormalise below sees the change we are about to make).
  const onCard=[];
  itemsAll().forEach(x=>{ const o=x.overrides; if(o&&+o.page===curPage) onCard.push(o); });
  frames().forEach(f=>{ if((+f.page||1)===curPage) onCard.push(f); });
  texts().forEach(t=>{ if((+t.page||1)===curPage) onCard.push(t); });

  const zs=onCard.map(o=>+o.z||0);
  const z = dir>0 ? Math.max(0,...zs)+1 : Math.min(0,...zs)-1;
  SEL.forEach(key=>{ ovOf(key).z=z; });

  // Then lift the whole card so nothing sits below 0. Ordering is unchanged, but
  // no object ever carries a negative z-index — which is what made "Back" hide it.
  const lo=Math.min(0,...onCard.map(o=>+o.z||0));
  if(lo<0) onCard.forEach(o=>{ o.z=(+o.z||0)-lo; });
  onCard.forEach(o=>{ if(!(+o.z)) delete o.z; });

  render(); showKnobs(); markSel();
}
// A free text object: headline, page number, anything — no card behind it.
function addText(){
  pushUndo();
  texts().push({ page:curPage, card:cardIdAt(curPage), x:34, y:40, w:32,
    text:'<h3>New text</h3><p>Click it again to edit…</p>' });
  renderCurrent();
  SEL=['t'+(texts().length-1)]; showKnobs(); markSel();
}
// ── Copy / cut / paste ──────────────────────────────────────────────
// Objects carry their resolved `content` into the clipboard, so a paste renders
// immediately — and it goes through localStorage as well as memory, which means
// you can copy in one document's tab and paste into another. (Content is only a
// render cache; ref_ids re-resolve on next load, so nothing goes stale.)
const CLIPKEY='tns_editor_clip';
let CLIP=null;
const deepCopy=o=>JSON.parse(JSON.stringify(o||{}));
function copySel(){
  if(!SEL.length) return;
  CLIP={
    items: selItemIdxs().map(i=>{ const it=COMP.items[i];
      return { ref_type:it.ref_type, ref_id:it.ref_id, content:it.content, overrides:deepCopy(it.overrides) }; }),
    texts: selTextIdxs().map(i=>deepCopy(texts()[i])),
    frames:selFrameIdxs().map(i=>deepCopy(frames()[i]))
  };
  try{ localStorage.setItem(CLIPKEY, JSON.stringify(CLIP)); }catch(e){}
}
function cutSel(){
  if(!SEL.length) return;
  copySel();
  pushUndo();
  selItemIdxs().sort((a,b)=>b-a).forEach(i=>COMP.items.splice(i,1));
  selFrameIdxs().sort((a,b)=>b-a).forEach(i=>frames().splice(i,1));
  selTextIdxs().sort((a,b)=>b-a).forEach(i=>texts().splice(i,1));
  SEL=[]; renderCurrent(); showKnobs();
}
function pasteClip(){
  let c=CLIP;
  if(!c){ try{ c=JSON.parse(localStorage.getItem(CLIPKEY)||'null'); }catch(e){} }
  if(!c||(!(c.items||[]).length&&!(c.texts||[]).length&&!(c.frames||[]).length)) return;
  pushUndo();
  // Everything lands on the CURRENT card, nudged so it doesn't hide the original.
  const land=o=>{ const k=deepCopy(o); k.card=cardIdAt(curPage); k.page=curPage;
    k.x=(+k.x||0)+3; k.y=(+k.y||0)+3; delete k.blk; return k; };
  const newSel=[];
  (c.items||[]).forEach(x=>{ COMP.items.push({ ref_type:x.ref_type, ref_id:x.ref_id, content:x.content,
    overrides:land(x.overrides) }); newSel.push('i'+(COMP.items.length-1)); });
  (c.texts||[]).forEach(t=>{ texts().push(land(t));  newSel.push('t'+(texts().length-1)); });
  (c.frames||[]).forEach(f=>{ frames().push(land(f)); newSel.push('f'+(frames().length-1)); });
  renderCurrent(); SEL=newSel; showKnobs(); markSel();
}

// ── Talking to the SYSTEM clipboard ─────────────────────────────────
// Copy renders the selection as real HTML so it pastes into Google Docs, Word or
// mail as text and pictures. A hidden marker tells our own paste handler that the
// clipboard came from here, so pasting back in restores OBJECTS, not flat text.
const CLIPMARK='<!--tns-objects-->';
function selAsHtml(){
  const parts=[];
  SEL.forEach(k=>{
    if(k[0]==='f') return;                                   // a frame is a border; nothing to paste
    if(k[0]==='t'){ parts.push(texts()[+k.slice(1)].text||''); return; }
    const it=COMP.items[+k.slice(1)]; if(!it) return;
    const c=it.content||{}, ov=it.overrides||{};
    if(ov.text){ parts.push(ov.text); return; }              // user-edited text wins
    if(it.ref_type==='contact'){
      parts.push((c.photo_url?'<p><img src="'+esc(c.photo_url)+'"></p>':'')+
        '<p><b>'+esc(c.name||'')+'</b>'+
        (c.job_title?'<br>'+esc(c.job_title):'')+(c.company?'<br>'+esc(c.company):'')+
        (c.email?'<br>'+esc(c.email):'')+(c.phone?'<br>'+esc(c.phone):'')+'</p>');
    } else if(it.ref_type==='media'){
      if(c.url) parts.push('<p><img src="'+esc(c.url)+'"></p>');
    } else {
      const photo=(c.photos||[])[0];
      parts.push((c.title?'<h3>'+esc(c.title)+'</h3>':'')+
        (photo?'<p><img src="'+esc(photo)+'"></p>':'')+
        (c.body?'<p>'+esc(c.body).replace(/\n/g,'<br>')+'</p>':''));
    }
  });
  return parts.filter(Boolean).join('\n');
}
function htmlToText(h){ const d=document.createElement('div'); d.innerHTML=h; return (d.textContent||'').trim(); }
function nativeSelection(){ try{ return (window.getSelection()||'').toString(); }catch(e){ return ''; } }

// Google Docs (and Word) refuse WebP/AVIF — the formats modern sites serve — and
// show "unsupported format" for a linked image they can't decode. So on copy we
// redraw every picture through a canvas and inline it as a PNG data URI. That also
// removes any dependency on the receiving app being able to reach our URLs at all.
// Conversion happens on OUR server (/api/img-png), not in a canvas here.
// The browser version was intermittent by design: if a picture was already in the
// HTTP cache from the page's own non-CORS <img>, Chrome could reuse that response
// for the crossOrigin request, taint the canvas, and toDataURL would throw — so
// whether a copy worked depended on what happened to be cached. Same-origin
// conversion has no CORS, no canvas and no cache race.
const PNGCACHE=new Map();          // src -> Promise<dataURL|null>, so repeats are free
function pngFor(src){
  if(PNGCACHE.has(src)) return PNGCACHE.get(src);
  const p=(async()=>{
    try{
      const r=await fetch('/api/img-png?u='+encodeURIComponent(src));
      if(!r.ok) return null;
      const b=await r.blob();
      return await new Promise(res=>{
        const fr=new FileReader();
        fr.onload =()=>res(fr.result);
        fr.onerror=()=>res(null);
        fr.readAsDataURL(b);
      });
    }catch(err){ return null; }
  })();
  PNGCACHE.set(src,p);
  return p;
}
// Start converting as soon as something is selected, so Ctrl+C rarely waits.
// (Chrome gives a clipboard-write promise only a short grace period; a cold
// conversion of a big photo can miss it. Warm cache = instant.)
function warmPngCache(){
  if(!SEL.length) return;
  const d=document.createElement('div'); d.innerHTML=selAsHtml();
  d.querySelectorAll('img').forEach(im=>{
    const u=im.getAttribute('src');
    if(u&&!/^data:/i.test(u)) pngFor(u);
  });
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function inlineImages(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const imgs=[...d.querySelectorAll('img')].filter(im=>{
    const u=im.getAttribute('src'); return u&&!/^data:/i.test(u);
  });
  // All at once, each with its own ceiling: one slow picture can't sink the copy.
  await Promise.all(imgs.map(async im=>{
    const png=await withTimeout(pngFor(im.getAttribute('src')), 8000);
    if(png) im.setAttribute('src',png);
    else console.warn('[copy] could not convert', im.getAttribute('src'));
  }));
  return d.innerHTML;
}
function onCopy(e, cut){
  if(editing) return;                       // typing: let the browser copy the text
  if(nativeSelection()) return;             // a real text selection: leave it alone
  if(!SEL.length) return;
  copySel();                                // our own object clipboard
  const html=selAsHtml();
  if(!html){ if(cut) cutSel(); return; }
  const plain=htmlToText(html);
  const hasImg=/<img\b/i.test(html);

  // With pictures we need the async canvas pass, so we write the clipboard
  // ourselves (ClipboardItem accepts a promise). Text-only stays on the simple
  // synchronous path.
  if(hasImg && navigator.clipboard && window.ClipboardItem){
    e.preventDefault();
    try{
      navigator.clipboard.write([ new ClipboardItem({
        'text/html' : inlineImages(html).then(h=>new Blob([CLIPMARK+h],{type:'text/html'}))
                        .catch(()=>new Blob([CLIPMARK+html],{type:'text/html'})),
        'text/plain': new Blob([plain],{type:'text/plain'})
      })]).catch(()=>{});
    }catch(err){
      if(e.clipboardData){                  // ClipboardItem promises unsupported
        e.clipboardData.setData('text/html', CLIPMARK+html);
        e.clipboardData.setData('text/plain', plain);
      }
    }
  }else if(e.clipboardData){
    e.clipboardData.setData('text/html', CLIPMARK+html);
    e.clipboardData.setData('text/plain', plain);
    e.preventDefault();
  }
  if(cut) cutSel();
}
document.addEventListener('copy', e=>onCopy(e,false));
document.addEventListener('cut',  e=>onCopy(e,true));

// Put a freshly uploaded picture on the current card.
function placeMedia(card){
  pushUndo();
  const spot=freeSpot(34, estH(34), 18, 18);
  COMP.items.push({ ref_type:'media', ref_id:card.id,
    content:{ title:card.title, url:card.url, tags:card.tags, kind:card.kind },
    overrides:{ page:curPage, card:cardIdAt(curPage), x:spot.x, y:spot.y, w:34 } });
  renderCurrent(); SEL=['i'+(COMP.items.length-1)]; showKnobs(); markSel();
}
async function addImageFromFile(f){
  const fd=new FormData();
  fd.append('file', f);
  fd.append('title', (f.name||'Pasted image').replace(/\.[a-z0-9]+$/i,''));
  try{
    const r=await fetch('/api/media-cards',{method:'POST',body:fd});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.error||'Could not add that image.'); return; }
    if(d.card) placeMedia(d.card);
  }catch(err){ alert('Could not add that image.'); }
}
async function addImageFromUrl(u){
  try{
    const r=await fetch('/api/media-cards',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ url:u })});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.error||'Could not fetch that image.'); return; }
    if(d.card) placeMedia(d.card);
  }catch(err){ alert('Could not fetch that image.'); }
}
function addTextObjectWith(html){
  pushUndo();
  texts().push({ page:curPage, card:cardIdAt(curPage), x:20, y:20, w:34, text:sanitizeHtml(html) });
  renderCurrent(); SEL=['t'+(texts().length-1)]; showKnobs(); markSel();
}

// Paste: a picture from a web page or the file system becomes a real media card;
// text becomes a text object; our own objects come back as objects.
document.addEventListener('paste', async e=>{
  if(editing) return;                       // typing: native paste into the text
  const dt=e.clipboardData; if(!dt) return;
  const html=dt.getData('text/html')||'';
  if(html.indexOf(CLIPMARK)===0){ e.preventDefault(); pasteClip(); return; }

  const files=[...(dt.files||[])].filter(f=>/^image\//i.test(f.type||''));
  if(files.length){ e.preventDefault(); for(const f of files) await addImageFromFile(f); return; }

  const m=html.match(/<img[^>]+src\s*=\s*["']([^"']+)["']/i);
  if(m && /^https?:\/\//i.test(m[1])){ e.preventDefault(); await addImageFromUrl(m[1]); return; }

  const txt=(dt.getData('text/plain')||'').trim();
  if(/^https?:\/\/\S+$/i.test(txt)){ e.preventDefault(); await addImageFromUrl(txt); return; }
  if(html){ e.preventDefault(); addTextObjectWith(html); return; }
  if(txt){  e.preventDefault(); addTextObjectWith('<p>'+esc(txt).replace(/\n/g,'<br>')+'</p>'); return; }
  pasteClip();
});

// Duplicate every selected object (styling and all), slightly offset.
function dupSelected(){
  if(!SEL.length) return;
  pushUndo();
  const newSel=[];
  selItemIdxs().forEach(i=>{
    const it=COMP.items[i];
    const c={ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content,
              overrides:JSON.parse(JSON.stringify(it.overrides||{})) };
    c.overrides.x=(+c.overrides.x||0)+3; c.overrides.y=(+c.overrides.y||0)+3;
    COMP.items.push(c); newSel.push('i'+(COMP.items.length-1));
  });
  selTextIdxs().forEach(i=>{
    const t=JSON.parse(JSON.stringify(texts()[i])); t.x=(+t.x||0)+3; t.y=(+t.y||0)+3;
    texts().push(t); newSel.push('t'+(texts().length-1));
  });
  selFrameIdxs().forEach(i=>{
    const f=JSON.parse(JSON.stringify(frames()[i])); f.x=(+f.x||0)+3; f.y=(+f.y||0)+3;
    frames().push(f); newSel.push('f'+(frames().length-1));
  });
  renderCurrent(); SEL=newSel; showKnobs(); markSel();
}
// ── Align & distribute (page-% geometry from the live DOM) ─────────
function geoSel(){
  const page=document.querySelector('#out .page'); if(!page) return null;
  return SEL.map(key=>{
    const el=elOf(key), o=ovOf(key); if(!el||!o) return null;
    const wp=+o.w||(key[0]==='f'?20:28);
    const hp=key[0]==='f' ? (+o.h||20) : el.offsetHeight/page.offsetHeight*100;
    return { key, o, el, wp, hp, x:+o.x||0, y:+o.y||0 };
  }).filter(Boolean);
}
function alignSel(mode){
  const g=geoSel(); if(!g||g.length<2) return;
  pushUndo();
  const minX=Math.min(...g.map(a=>a.x)),      maxR=Math.max(...g.map(a=>a.x+a.wp));
  const minY=Math.min(...g.map(a=>a.y)),      maxB=Math.max(...g.map(a=>a.y+a.hp));
  g.forEach(a=>{
    if(mode==='l') a.o.x=minX;
    else if(mode==='r') a.o.x=maxR-a.wp;
    else if(mode==='c') a.o.x=(minX+maxR)/2-a.wp/2;
    else if(mode==='t') a.o.y=minY;
    else if(mode==='b') a.o.y=maxB-a.hp;
    else if(mode==='m') a.o.y=(minY+maxB)/2-a.hp/2;
    a.o.x=Math.round(a.o.x*10)/10; a.o.y=Math.round(a.o.y*10)/10;
    a.el.style.left=a.o.x+'%'; a.el.style.top=a.o.y+'%';
  });
  updateOffpage();
}
function distSel(axis){
  const g=geoSel(); if(!g||g.length<3) return;
  pushUndo();
  const P=axis==='h'?'x':'y', S=axis==='h'?'wp':'hp';
  g.sort((a,b)=>a[P]-b[P]);
  const first=g[0], last=g[g.length-1];
  const span=(last[P]+last[S])-first[P];
  const sum=g.reduce((s,a)=>s+a[S],0);
  const gap=(span-sum)/(g.length-1);
  let cur=first[P];
  g.forEach(a=>{
    a.o[P]=Math.round(cur*10)/10;
    a.el.style[P==='x'?'left':'top']=a.o[P]+'%';
    cur+=a[S]+gap;
  });
  updateOffpage();
}

// ── Undo / redo ─────────────────────────────────────────────────────
let UNDO=[], REDO=[];
function snap(){ return JSON.stringify({ params:COMP.params||{}, items:COMP.items||[] }); }
function pushUndo(pre){
  UNDO.push(pre!=null?pre:snap());
  if(UNDO.length>200) UNDO.shift();
  REDO.length=0;
  updateUndoBtns();
  scheduleSave();               // every change autosaves shortly after
  scheduleStrip();
}
function restoreSnap(js){
  const st=JSON.parse(js);
  COMP.params=st.params; COMP.items=st.items;
  SEL=[]; renderCurrent(); showKnobs(); markSel(); updateUndoBtns();
  scheduleSave(); scheduleStrip();
}
function doUndo(){
  if(editing){ try{ document.execCommand('undo'); }catch(e){} return; }
  if(!UNDO.length) return;
  REDO.push(snap());
  restoreSnap(UNDO.pop());
}
function doRedo(){
  if(editing){ try{ document.execCommand('redo'); }catch(e){} return; }
  if(!REDO.length) return;
  UNDO.push(snap());
  restoreSnap(REDO.pop());
}
function updateUndoBtns(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u) u.disabled=!UNDO.length&&!editing;
  if(r) r.disabled=!REDO.length&&!editing;
}

// ── The panel: always complete; controls grey out when not applicable ─
let editing=false, savedSel=null;
const FONTS=[
  ['Plus Jakarta Sans','Jakarta'],['Georgia','Georgia'],['Playfair Display','Playfair Display'],
  ['Merriweather','Merriweather'],['Lora','Lora'],['Montserrat','Montserrat'],
  ['Oswald','Oswald'],['Raleway','Raleway'],['Nunito','Nunito'],['Roboto Slab','Roboto Slab'],
  ['Caveat','Caveat (hand)'],['Dancing Script','Dancing Script'],['Pacifico','Pacifico'],
  ['Abril Fatface','Abril Fatface'],['Futura Book','Futura Book'],['Jost','Jost'],
  ['Arial','Arial'],['Courier New','Courier New']
];
const SWATCH=['#23291d','#1f4a45','#c9a24b','#7a8470','#8c2f1b','#2a5d8c','#ffffff','#000000'];
// Live style refresh for all selected objects, no re-render.
function liveSelStyle(){
  SEL.forEach(key=>{
    const el=elOf(key); if(!el) return;
    const o=ovOf(key);
    if(key[0]!=='f'){
      el.style.width=(+o.w||28)+'%';
      el.style.fontSize=fsOf(o)+'px';
      el.style.transform=+o.r?('rotate('+(+o.r)+'deg)'):'';
      const bw=+o.bw||0;
      el.style.border=bw?((bw*pScale()).toFixed(1)+'px '+(BORDER_STYLES.includes(o.bs)?o.bs:'solid')+' '+(o.bc||'#23291d')):'';
      el.style.padding=(bw||o.bg)?PADpx().toFixed(1)+'px':'';
      el.style.color=o.tc||'';
      el.style.background=o.bg||'';
      const sh=+o.sh||0;
      const bare=isTextKey(key)&&!o.bg&&!bw;
      el.style.textShadow=(sh&&bare)?shStr(SHT,sh):'';
      el.style.boxShadow=(sh&&!bare)?shStr(SHB,sh):'';
      el.style.borderRadius=o.sq?'0':RADpx().toFixed(1)+'px';
      el.classList.toggle('sqo',!!o.sq);
    }else{
      el.style.width=(+o.w||20)+'%'; el.style.height=(+o.h||20)+'%';
      el.style.transform=+o.r?('rotate('+(+o.r)+'deg)'):'';
      el.style.border=((+o.bw||2)*pScale()).toFixed(1)+'px '+(BORDER_STYLES.includes(o.bs)?o.bs:'solid')+' '+(o.bc||'#c9a24b');
      el.style.background=o.bg||'';
      el.style.boxShadow=+o.sh?shStr(SHB,+o.sh):'';
      el.style.borderRadius=o.sq?'0':RADpx().toFixed(1)+'px';
    }
  });
}
// The panel is CONTEXTUAL: it shows only what applies to the current mode —
// editing text, cropping, a selection, or nothing.
// The rule is a set of controls, not hidden state: every part of it is visible
// and changeable on the card it belongs to.
function placementSectionHtml(){
  const f=placementOf(curPage); if(!f) return '';
  const n=(f.p.cards||[]).length;
  const edited=plcHasLocalEdits(f.pid);
  return '<div class="kh">From your library — '+esc(f.p.name||'card')+'</div>'+
    '<div class="hint">v'+(+f.p.version||1)+' · '+n+' page'+(n===1?'':'s')+'. '+
      (edited?'You have changed this copy. ':'')+
      'Changes here stay in this print until you send them back.</div>'+
    '<div class="krow"><button id="plcPush" style="flex:1;" '+
      'title="Save these pages back to the original as a new version">⬆ Update the original</button>'+
      '<button id="plcUnlink" title="Stop following the original">⛓</button></div>';
}
function wirePlacementSection(){
  const f=placementOf(curPage); if(!f) return;
  const a=document.getElementById('plcPush');  if(a) a.onclick=()=>pushPlacement(f.pid);
  const b=document.getElementById('plcUnlink'); if(b) b.onclick=()=>unlinkPlacement(f.pid);
}
function chapterSectionHtml(){
  const cp=chapterPos(curPage); if(!cp) return '';
  return '<div class="kh">Chapter — '+esc(cp.ch.name||'')+'</div>'+
    '<div class="krow"><input type="text" id="chName" value="'+esc(cp.ch.name||'')+'" '+
      'style="flex:1;font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid #d9d4c4;border-radius:8px;">'+
      '</div>'+
    '<div class="hint">Page '+cp.i+' of '+cp.n+'. These cards move together and stay side by side. '+
      '＋ adds a page to the chapter.</div>'+
    '<div class="krow"><button id="chUngroup" style="flex:1;" title="Keep the pages, drop the grouping">⊟ Ungroup</button>'+
      '<button id="chDel" class="danger" title="Delete the chapter and all its pages">🗑</button></div>';
}
function wireChapterSection(){
  const cp=chapterPos(curPage); if(!cp) return;
  const nm=document.getElementById('chName');
  if(nm) nm.onchange=()=>{ pushUndo(); cp.ch.name=nm.value.trim()||'Chapter'; showKnobs(); scheduleStrip(); };
  const ug=document.getElementById('chUngroup');
  if(ug) ug.onclick=()=>ungroupChapter(cp.id);
  const dl=document.getElementById('chDel');
  if(dl) dl.onclick=()=>deleteChapter(cp.id);
}
function ruleSectionHtml(){
  const r=ruleOf(curPage); if(!r) return '';
  const pinned=(COMP.items||[]).filter(it=>it.overrides&&it.overrides.card===cardIdAt(curPage)&&+it.overrides.pin).length;
  const fld=f=>'<label style="display:flex;align-items:center;gap:4px;font-size:11.5px;">'+
    '<input type="checkbox" class="rfld" data-f="'+f+'"'+
    ((r.fields&&r.fields[f]===false)?'':' checked')+'> '+f+'</label>';
  return '<div class="kh">Card rule — '+esc(r.name||'group')+'</div>'+
    '<div class="krow"><span style="font-size:11.5px;flex:0 0 auto;">Columns</span>'+
      '<input type="number" id="rCols" min="1" max="8" step="1" value="'+(+r.cols||4)+'" style="width:56px;">'+
      '<button id="rRefresh" style="flex:1;" title="Fetch the group again and relay">↻ Refresh</button></div>'+
    '<div class="krow" style="flex-wrap:wrap;gap:7px;">'+RULEFIELDS.map(fld).join('')+'</div>'+
    (r.exclude&&r.exclude.length
      ? '<div class="hint">Leaving out '+r.exclude.length+'. <a href="#" id="rClearEx">Put them back</a></div>' : '')+
    (pinned
      ? '<div class="hint">'+pinned+' moved by hand — the rule leaves those alone. '+
        '<a href="#" id="rUnpin">Release them</a></div>' : '')+
    '<div class="krow"><button id="rUnlink" class="danger" style="flex:1;" '+
      'title="Drop the rule — the card keeps what is on it and stops updating">⛓ Unlink</button></div>';
}
function wireRuleSection(){
  const q=id=>document.getElementById(id);
  const r=ruleOf(curPage); if(!r) return;
  const id=cardIdAt(curPage);
  const cols=q('rCols');
  if(cols) cols.onchange=()=>{ pushUndo(); r.cols=Math.max(1,Math.min(8,+cols.value||4)); applyRule(curPage,{quiet:1}); };
  const rf=q('rRefresh'); if(rf) rf.onclick=()=>applyRule(curPage);
  document.querySelectorAll('.rfld').forEach(cb=>cb.onchange=()=>{
    pushUndo(); r.fields=r.fields||{}; r.fields[cb.dataset.f]=cb.checked; applyRule(curPage,{quiet:1});
  });
  const ex=q('rClearEx');
  if(ex) ex.onclick=e=>{ e.preventDefault(); pushUndo(); r.exclude=[]; applyRule(curPage,{quiet:1}); };
  const up=q('rUnpin');
  if(up) up.onclick=e=>{ e.preventDefault(); pushUndo();
    (COMP.items||[]).forEach(it=>{ const o=it.overrides; if(o&&o.card===id&&o.pin) delete o.pin; });
    applyRule(curPage,{quiet:1}); };
  const ul=q('rUnlink');
  if(ul) ul.onclick=()=>{
    if(!confirm('Drop the rule? The card keeps what is on it, but it will stop following the group.')) return;
    pushUndo();
    delete rules()[id];
    (COMP.items||[]).forEach(it=>{ const o=it.overrides;
      if(o&&o.rule===id){ delete o.rule; delete o.ri; delete o.pin; delete o.flds; } });
    renderCurrent(); showKnobs(); markSel();
  };
}

function showKnobs(){
  try{ warmPngCache(); }catch(e){}     // pre-convert this selection's pictures for copying
  const k=document.getElementById('knobs');
  const q=id=>document.getElementById(id);
  const n=SEL.length;
  const p=primary();
  const pI=primItem(), pF=primFrame(), pT=primText();
  const it=pI!=null?COMP.items[pI]:null;
  const ov=it?(it.overrides=it.overrides||{}):(pT!=null?texts()[pT]:(pF!=null?frames()[pF]:{}));

  // ── MODE: editing text ────────────────────────────────────────────
  if(editing){
    k.innerHTML=
      '<div class="kh">Editing text — select words, style them</div>'+
      '<select id="tbFont" title="Font at the cursor — arrow keys preview live"><option value="">Font…</option>'+
        FONTS.map(([v,t])=>'<option value="'+v+'" style="font-family:\''+v+'\'">'+t+'</option>').join('')+'</select>'+
      '<div class="krow"><input type="number" id="tbSize" min="4" max="500" step="1" value="14" title="Size in px — arrow keys step it live" style="flex:1;width:0;">'+
        '<span style="font-size:11px;color:var(--muted);">px</span>'+
        '<input type="color" id="tbColor" value="#23291d" title="Colour of the selection"></div>'+
      '<div class="krow">'+SWATCH.map(c=>'<button class="sw" data-c="'+c+'" style="background:'+c+'" title="'+c+'"></button>').join('')+'</div>'+
      '<div class="krow"><button id="tbB" style="font-weight:800;">B</button>'+
        '<button id="tbI" style="font-style:italic;">I</button>'+
        '<button id="tbU" style="text-decoration:underline;">U</button>'+
        (pI!=null?'<button id="tbReset" title="Back to the original text">↺</button>':'')+
        '<button id="tbDone" class="primary" style="flex:1;">✓ Done</button></div>'+
      '<div class="hint" style="margin-top:6px;">Clicking anywhere outside also finishes — it saves by itself.</div>';
    q('tbFont').onchange=e=>{ if(e.target.value) applyStyle('fontFamily',fontCss(e.target.value)); };
    q('tbSize').oninput=e=>{
      const px=+e.target.value; if(!(px>=4&&px<=500)) return;
      const base=fsOf(ov)||13.5;                    // the object's own size
      applyStyle('fontSize',(px/base).toFixed(4)+'em');
    };
    q('tbColor').oninput=e=>applyStyle('color',e.target.value);
    k.querySelectorAll('.sw').forEach(b=>{
      b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>applyStyle('color',b.dataset.c);
    });
    [['tbB','bold'],['tbI','italic'],['tbU','underline']].forEach(([id,cmd])=>{
      const b=q(id); b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>{ restoreSel(); document.execCommand(cmd); };
    });
    const rs=q('tbReset');
    if(rs) rs.onclick=()=>{ pushUndo(); delete COMP.items[pI].overrides.text;
      editing=false; savedSel=null; styleSpan=null; render(); showKnobs(); markSel(); updateUndoBtns(); };
    q('tbDone').onclick=()=>commitEdit(true);
    updateTb();
    return;
  }

  // ── MODE: cropping ────────────────────────────────────────────────
  if(cropKey&&p===cropKey){
    k.innerHTML=
      '<div class="kh">Cropping the picture</div>'+
      '<div class="hint">Drag the four gold edges in — or back out to restore. '+
        'Drag inside the picture to slide it. Nothing is ever lost.</div>'+
      '<div style="margin-top:8px;"><button id="knCropDone" class="primary" style="width:100%;">✓ Done cropping</button></div>';
    q('knCropDone').onclick=()=>{ cropKey=null; showKnobs(); markSel(); };
    return;
  }

  // ── The card's own rule, if it has one ────────────────────────────
  const cardRuleHtml=placementSectionHtml()+chapterSectionHtml()+ruleSectionHtml();

  // ── MODE: nothing selected ────────────────────────────────────────
  if(!n){
    k.innerHTML=cardRuleHtml+
      (cardRuleHtml?'':'<div class="kh">This card</div><div class="hint">It has no rule — the '+
        'objects on it stay exactly as you put them.<br><br>To make a card that follows a group, '+
        'open <b>Content</b>, tick a group, and drag its <b>heading</b> onto the page. That card '+
        'then updates when people join or leave, and its settings appear here.</div>')+
      '<div class="kh">Objects</div><div class="hint">Click an object to select it — '+
      'Shift-click or drag a rectangle on the page for several. Drag to move, gold dot to resize, '+
      'click a selected text again to edit it.</div>';
    wirePlacementSection(); wireChapterSection(); wireRuleSection();
    return;
  }

  // ── MODE: selection ───────────────────────────────────────────────
  const anyText=SEL.some(isTextKey);
  const anyColor=SEL.some(kk=>kk[0]!=='f');
  const singlePic=n===1&&isPicKey(p);
  const singleMedia=n===1&&it&&it.ref_type==='media';
  const title= n>1?n+' objects'
    : pF!=null?'Frame'
    : anyText?'Text'
    : singlePic?'Picture'
    : singleMedia?'Logo / graphic'
    : it&&it.ref_type==='contact'?'Person':'Object';
  const firstTextKey=SEL.find(isTextKey);
  const px0=firstTextKey?Math.round(fsOf(ovOf(firstTextKey))):14;
  k.innerHTML=
    '<div class="kh" style="display:flex;justify-content:space-between;align-items:center;">'+
      '<span>'+title+'</span>'+
      '<button id="knUnplace" class="danger" title="Remove from this document (cards stay in your library)">✕ Remove</button></div>'+
    '<div class="krow"><button id="knFront" style="flex:1;" title="Bring in front">⬆ Front</button>'+
      '<button id="knBack" style="flex:1;" title="Send behind">⬇ Back</button>'+
      '<button id="knDup" title="Duplicate (Ctrl+D)">⧉</button></div>'+
    (n>=2?'<div class="krow"><button id="alL" title="Align left edges">⇤</button>'+
      '<button id="alC" title="Align centres (horizontal)">↔</button>'+
      '<button id="alR" title="Align right edges">⇥</button>'+
      '<button id="alT" title="Align top edges">⤒</button>'+
      '<button id="alM" title="Align middles (vertical)">↕</button>'+
      '<button id="alB" title="Align bottom edges">⤓</button>'+
      (n>=3?'<button id="dsH" title="Spread evenly left-to-right">⋯</button>'+
            '<button id="dsV" title="Spread evenly top-to-bottom">⋮</button>':'')+'</div>':'')+
    '<div class="krow" style="margin-top:8px;"><span style="width:16px;font-weight:800;color:var(--green);" title="Width">W</span>'+
      '<input type="range" id="knW" min="4" max="100" step="0.5" value="'+(+ov.w||28)+'" style="flex:1;width:auto;margin:0;">'+
      '<span id="szPct" style="width:40px;text-align:right;font-size:11px;font-weight:700;">'+Math.round(+ov.w||28)+'%</span></div>'+
    '<div class="krow"><span style="width:16px;font-weight:800;color:var(--green);" title="Angle">∠</span>'+
      '<input type="range" id="knR" min="-180" max="180" step="1" value="'+Math.round(+ov.r||0)+'" style="flex:1;width:auto;margin:0;">'+
      '<span id="rDeg" style="width:40px;text-align:right;font-size:11px;font-weight:700;">'+Math.round(+ov.r||0)+'°</span></div>'+
    (anyText?
      '<div class="kh">Text</div>'+
      '<div class="krow"><input type="number" id="knPx" min="4" max="500" step="1" value="'+px0+'" style="width:62px;" title="Text size in px — arrow keys step it live">'+
        '<select id="knFF" style="flex:1;margin-bottom:0;">'+
