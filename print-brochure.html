          '<option value="">Jakarta (default)</option>'+
          FONTS.map(([v,t])=>'<option value="'+v+'" style="font-family:'+esc(fontCss(v))+'"'+(ov.ff===v?' selected':'')+'>'+t+'</option>').join('')+
        '</select></div>':'')+
    '<div class="kh">Border</div>'+
    '<div class="kh">Position</div>'+
    '<div class="krow"><span style="font-size:11px;color:var(--muted);">X</span>'+
      '<input type="number" id="knX" step="0.5" value="'+(Math.round((+ov.x||0)*10)/10)+'" style="width:60px;">'+
      '<span style="font-size:11px;color:var(--muted);">Y</span>'+
      '<input type="number" id="knY" step="0.5" value="'+(Math.round((+ov.y||0)*10)/10)+'" style="width:60px;">'+
      '<span style="font-size:11px;color:var(--muted);">W</span>'+
      '<input type="number" id="knWn" step="0.5" min="1" max="200" value="'+(Math.round((+ov.w||28)*10)/10)+'" style="width:60px;"></div>'+
    '<div class="krow"><input type="number" id="knBw" min="0" max="30" step="1" value="'+(+ov.bw||0)+'" title="Border width (0 = none)" style="width:56px;">'+
      '<select id="knBs" style="flex:1;margin-bottom:0;">'+
        BORDER_STYLES.map(s=>'<option value="'+s+'"'+((ov.bs||'solid')===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<input type="color" id="knBc" value="'+(ov.bc||'#c9a24b')+'" title="Border colour"></div>'+
    '<div class="kh">Background</div>'+
    '<div class="krow"><button id="knBgNone" class="'+(ov.bg?'':'on')+'">None</button>'+
      ['#ffffff','#f7f3e8','#1f4a45','#c9a24b'].map(c=>'<button class="sw bgsw" data-c="'+c+'" style="background:'+c+'" title="'+c+'"></button>').join('')+
      '<input type="color" id="knBg" value="'+(ov.bg&&/^#/.test(ov.bg)?ov.bg:'#ffffff')+'" title="Any background colour"></div>'+
    '<div class="krow" style="margin-top:8px;"><button id="knSh" style="flex:0 0 auto;white-space:nowrap;" title="Click to step the shadow: 0 = none, then 1–2–3">Shadow '+(+ov.sh||0)+'</button>'+
      '<button id="knSq" style="flex:1;white-space:nowrap;" title="Click to switch to this — pictures, background, border and shadow together">'+
      (ov.sq?'Rounded corners':'Square corners')+'</button></div>'+
    (singlePic?
      '<div class="kh">Picture</div><div class="krow">'+
        '<button id="knCrop" style="flex:1;" title="Crop: drag any edge in or out, drag inside to slide the picture">✂ Crop</button></div>':'')+
    (singleMedia?'<div class="krow"><button id="knCap" style="flex:1;">'+(ov.caption?'Caption: shown':'Caption: hidden')+'</button></div>':'')+
    (anyColor?
      '<div class="kh">Text colour (whole object)</div>'+
      '<div class="krow">'+SWATCH.map(c=>'<button class="sw" data-c="'+c+'" style="background:'+c+'" title="'+c+'"></button>').join('')+
        '<input type="color" id="knTc" value="'+(ov.tc||'#23291d')+'"></div>':'')+
    (n===1&&isTextKey(p)?'<div class="hint" style="margin-top:6px;">Click the text again to edit the words — mixed fonts, sizes and colours per selection.</div>':'');

  q('knUnplace').onclick=()=>removeSelected();
  q('knFront').onclick=()=>bumpZ(1);
  q('knBack').onclick=()=>bumpZ(-1);
  q('knDup').onclick=()=>dupSelected();
  [['alL','l'],['alC','c'],['alR','r'],['alT','t'],['alM','m'],['alB','b']].forEach(([id,m])=>{
    const b=q(id); if(b) b.onclick=()=>alignSel(m);
  });
  const dh=q('dsH'); if(dh) dh.onclick=()=>distSel('h');
  const dv=q('dsV'); if(dv) dv.onclick=()=>distSel('v');
  const liveSlider=(id,apply,label,fmt)=>{
    const el=q(id); if(!el) return;
    el.oninput=e=>{ if(el._pre==null) el._pre=snap(); apply(+e.target.value);
      const l=q(label); if(l) l.textContent=fmt(+e.target.value); liveSelStyle(); };
    el.onchange=()=>{ if(el._pre!=null){ pushUndo(el._pre); el._pre=null; } };
  };
  // Exact numbers, in % of the page — the same units everything else uses.
  [['knX','x'],['knY','y'],['knWn','w']].forEach(([id,key])=>{
    const el=q(id); if(!el) return;
    el.onchange=()=>{
      const v=+el.value; if(!isFinite(v)) return;
      pushUndo();
      SEL.forEach(k2=>{ const o=ovOf(k2);
        o[key]=Math.round(v*10)/10;
        if(o.rule&&!o.pin) o.pin=1;        // typing a position is a hand-adjustment too
      });
      render(); showKnobs(); markSel();
    };
  });
  wirePlacementSection(); wireChapterSection(); wireRuleSection();
  liveSlider('knW', v=>SEL.forEach(key=>{
    const o=ovOf(key);
    if(isTextKey(key)){    // text reshapes: wider box = longer lines, same letters
      const f0=fsOf(o); o.w=v;
      o.ts=Math.round(f0/(13.5*(v/28))*1000)/1000;
      if(Math.abs(o.ts-1)<0.002) delete o.ts;
    } else o.w=v;
  }), 'szPct', v=>Math.round(v)+'%');
  liveSlider('knR', v=>SEL.forEach(key=>{ const o=ovOf(key); if(v) o.r=v; else delete o.r; }), 'rDeg', v=>Math.round(v)+'°');
  const kp=q('knPx');
  if(kp){
    kp.oninput=e=>{
      const px=+e.target.value; if(!(px>=4&&px<=500)) return;
      if(kp._pre==null) kp._pre=snap();
      // Must be the exact inverse of fsOf(), pScale() included — otherwise the
      // number you type is only honoured on A4.
      SEL.forEach(key=>{ if(!isTextKey(key)) return; const o=ovOf(key);
        o.ts=Math.round(px/(13.5*((+o.w||28)/28)*pScale())*1000)/1000;
        if(Math.abs(o.ts-1)<0.002) delete o.ts; });
      liveSelStyle();
    };
    kp.onchange=()=>{ if(kp._pre!=null){ pushUndo(kp._pre); kp._pre=null; } };
  }
  q('knBw').oninput=e=>{ if(e.target._pre==null) e.target._pre=snap();
    SEL.forEach(key=>{ const o=ovOf(key); const v=+e.target.value; if(v) o.bw=v; else if(key[0]!=='f') delete o.bw; else o.bw=0; }); liveSelStyle(); };
  q('knBw').onchange=e=>{ if(e.target._pre!=null){ pushUndo(e.target._pre); e.target._pre=null; } };
  q('knBs').onchange=e=>{ pushUndo(); SEL.forEach(key=>{ ovOf(key).bs=e.target.value; }); liveSelStyle(); };
  q('knBc').oninput=e=>{ if(e.target._pre==null) e.target._pre=snap(); SEL.forEach(key=>{ ovOf(key).bc=e.target.value; }); liveSelStyle(); };
  q('knBc').onchange=e=>{ if(e.target._pre!=null){ pushUndo(e.target._pre); e.target._pre=null; } };
  q('knBgNone').onclick=()=>{ pushUndo(); SEL.forEach(key=>{ delete ovOf(key).bg; }); liveSelStyle(); showKnobs(); };

    SEL.forEach(key=>{ ovOf(key).bg=b.dataset.c; }); liveSelStyle(); showKnobs(); });
  q('knBg').oninput=e=>{ if(e.target._pre==null) e.target._pre=snap();

  q('knBg').onchange=e=>{ if(e.target._pre!=null){ pushUndo(e.target._pre); e.target._pre=null; } };
  q('knSh').onclick=()=>{ pushUndo();
    const v=((+ov.sh||0)+1)%4;

    liveSelStyle(); showKnobs(); };
  const cap=q('knCap');
  if(cap) cap.onclick=()=>{ pushUndo(); ov.caption=!ov.caption; render(); showKnobs(); markSel(); };
  const sq=q('knSq');

      // and make the box a window. Ancient cover-crops convert exactly.

// ── In-place text editing ───────────────────────────────────────────
// Click a selected text object again → edit right there, caret where you
// clicked. Any click outside commits automatically; nothing is ever lost.
function curBd(){ return document.querySelector('#out [contenteditable="true"]'); }
let styleSpan=null, holdSel=false;
function enterEdit(key,cx,cy){
  const el=elOf(key); if(!el) return;
  const bd=el.querySelector('.bd'); if(!bd) return;
  bd.setAttribute('contenteditable','true');
  bd.focus();
  if(cx!=null&&document.caretRangeFromPoint){
    const r=document.caretRangeFromPoint(cx,cy);
    if(r&&bd.contains(r.startContainer)){ const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
  editing=true; savedSel=null; styleSpan=null;
  try{ document.execCommand('styleWithCSS',false,true); }catch(e){}
  updateUndoBtns(); showKnobs();
}
function commitEdit(rerender){
  const bd=curBd();
  if(bd){
    const wrap=bd.closest('.abswrap');
    const nw=sanitizeHtml(bd.innerHTML);
    if(wrap&&wrap.dataset.absidx!=null){
      const it=COMP.items[+wrap.dataset.absidx];
      const ov=it.overrides=it.overrides||{};
      if(nw!==(ov.text||'')){ pushUndo(); ov.text=nw; }   // pre-state pushed BEFORE the change
    }else if(wrap&&wrap.dataset.text!=null){
      const t=texts()[+wrap.dataset.text];
      if(t&&nw!==(t.text||'')){ pushUndo(); t.text=nw; }
    }
    bd.removeAttribute('contenteditable');
  }
  editing=false; savedSel=null; styleSpan=null; updateUndoBtns();
  if(rerender){ render(); showKnobs(); markSel(); }
  else showKnobs();
}
document.addEventListener('selectionchange',()=>{
  if(!editing||holdSel) return;
  const sel=getSelection(); if(!sel.rangeCount) return;
  const bd=curBd(); if(!bd) return;
  if(bd.contains(sel.anchorNode)){
    savedSel=sel.getRangeAt(0).cloneRange();
    styleSpan=null;              // a NEW selection gets a fresh style span
    updateTb();                  // …and the toolbar shows its font + size
  }
});
function restoreSel(){
  const bd=curBd(); if(!bd) return;
  bd.focus();
  if(savedSel){ const s=getSelection(); s.removeAllRanges(); s.addRange(savedSel); }
}
// Style the saved selection by wrapping it ONCE in a span; repeated calls
// (arrow-stepping fonts/sizes) restyle the SAME span — live preview, no
// nesting, and focus stays where it is (the dropdown keeps taking arrows).
// Everything INSIDE the styled selection is flattened to `inherit` for that
// property, so mixed sizes/fonts/colours all take the new value uniformly.
function flattenProp(sp,prop){
  sp.querySelectorAll('*').forEach(el=>{ try{ el.style[prop]='inherit'; }catch(e){} });
}
function applyStyle(prop,val){
  const bd=curBd(); if(!bd) return;
  if(styleSpan&&bd.contains(styleSpan)){ styleSpan.style[prop]=val; flattenProp(styleSpan,prop); return; }
  if(!savedSel||savedSel.collapsed){       // caret only → set the typing style
    restoreSel();
    try{
      document.execCommand('styleWithCSS',false,true);
      if(prop==='fontFamily') document.execCommand('fontName',false,String(val).replace(/'/g,''));
      else if(prop==='color') document.execCommand('foreColor',false,val);
    }catch(e){}
    return;
  }
  holdSel=true;
  const sp=document.createElement('span'); sp.style[prop]=val;
  const r=savedSel;
  try{ r.surroundContents(sp); }
  catch(e){ const frag=r.extractContents(); sp.appendChild(frag); r.insertNode(sp); }
  flattenProp(sp,prop);
  styleSpan=sp;
  const r2=document.createRange(); r2.selectNodeContents(sp); savedSel=r2;
  setTimeout(()=>holdSel=false,0);
}
// Show the font + size AT the cursor/selection in the toolbar.
function updateTb(){
  const f=document.getElementById('tbFont'), s=document.getElementById('tbSize');
  if(!f||!s) return;
  const bd=curBd(); if(!bd) return;
  const sel=getSelection(); if(!sel.rangeCount||!sel.anchorNode) return;
  const el=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
  if(!el||!bd.contains(el)) return;
  const cs=getComputedStyle(el);
  const fam=(cs.fontFamily||'').split(',')[0].replace(/["']/g,'').trim();
  const m=FONTS.find(([v])=>v.toLowerCase()===fam.toLowerCase());
  if(document.activeElement!==f){ f.value=m?m[0]:''; f.options[0].textContent=m?'Font…':(fam||'Font…'); }
  if(document.activeElement!==s) s.value=Math.round(parseFloat(cs.fontSize)||14);
}

// ── Selection visuals: outline every selected object, resize dot on primary ─
function markSel(){
  document.querySelectorAll('#out .abswrap.sel,#out .frameobj.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('#out .abswrap.cropping').forEach(x=>x.classList.remove('cropping'));
  document.querySelectorAll('#out .rszh,#out .crE').forEach(h=>h.remove());
  document.querySelectorAll('#out [contenteditable="true"]').forEach(b=>b.removeAttribute('contenteditable'));
  SEL.forEach(key=>{ const el=elOf(key); if(el) el.classList.add('sel'); });
  const p=primary(); if(!p) return;
  const el=elOf(p); if(!el) return;
  if(cropKey===p&&isPicKey(p)){
    // Crop mode: four edge handles, no resize dot; drag inside = slide picture.
    el.classList.add('cropping');
    ['t','b','l','r'].forEach(edge=>{
      const h=document.createElement('div'); h.className='crE'; h.dataset.edge=edge;
      h.title='Drag to crop this edge (drag back out to restore)';
      el.appendChild(h);
      h.onpointerdown=e=>cropEdgeDrag(e,el,p,edge);
    });
    return;
  }
  const rz=document.createElement('div'); rz.className='rszh'; rz.title='Drag to resize';
  el.appendChild(rz); wireResize(rz,el,p);
}
function wireResize(h,wrap,key){
  h.onpointerdown=e=>{
    e.stopPropagation(); e.preventDefault();
    const page=wrap.closest('.page'), pr=page.getBoundingClientRect();
    const o=ovOf(key);
    const pre=snap();
    let resized=false;
    const sx=e.clientX, sy=e.clientY;
    const ow=+o.w||(key[0]==='f'?20:28), oh=+o.h||20;
    // Text boxes RESHAPE: wider box = longer lines, fewer rows — the text
    // itself keeps its size (ts compensates for the width-linked font).
    const reflow=isTextKey(key), fs0=fsOf(o);
    const mv=ev=>{
      resized=true;
      o.w=Math.round(Math.max(3,Math.min(100, ow+(ev.clientX-sx)/pr.width*100))*10)/10;
      if(reflow){ o.ts=Math.round(fs0/(13.5*(o.w/28))*1000)/1000; if(Math.abs(o.ts-1)<0.002) delete o.ts; }
      if(key[0]==='f') o.h=Math.round(Math.max(2,Math.min(100, oh+(ev.clientY-sy)/pr.height*100))*10)/10;
      liveSelStyle();
      const s=document.getElementById('knW');
      if(s){ s.value=o.w; const pl=document.getElementById('szPct'); if(pl) pl.textContent=Math.round(o.w)+'%'; }
      updateOffpage();
    };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
      if(resized) pushUndo(pre); };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  };
}
// ── Crop (window model) ─────────────────────────────────────────────
// The picture keeps its own size (pw em); the object box is a WINDOW onto it.
// In crop mode: drag any of the four edges to shape the window (the picture
// does not move on the page), drag inside to slide the picture. Dragging
// edges back OUT restores the hidden parts — that's the "uncrop".
let cropKey=null;
function applyCrop(wrap,o){
  wrap.style.left=(+o.x||0)+'%'; wrap.style.top=(+o.y||0)+'%';
  wrap.style.width=(+o.w||28)+'%';
  wrap.style.fontSize=fsOf(o)+'px';
  const fs=fsOf(o), Wem=wrap.offsetWidth/fs;
  const blk=wrap.querySelector('.imgo'), img=wrap.querySelector('img');
  if(blk){ blk.style.position='relative'; blk.style.overflow='hidden'; blk.style.height=r4((+o.phr||0.6)*Wem)+'em'; }
  if(img){ img.style.position='absolute'; img.style.width=r4((+o.pwr||1)*Wem)+'em'; img.style.maxWidth='none';
           img.style.height='auto'; img.style.objectFit=''; img.style.objectPosition='';
           img.style.left=r4((+o.ixr||0)*Wem)+'em'; img.style.top=r4((+o.iyr||0)*Wem)+'em'; }
}
function cropDrag(e,wrap,key){
  const o=ovOf(key);
  const img=wrap.querySelector('img'); if(!img||!+o.pwr) return;
  const pre=snap();
  const fs0=fsOf(o);
  const a=(img.naturalHeight/img.naturalWidth)||0.75;
  const Wem=wrap.offsetWidth/fs0;
  const pw=o.pwr*Wem, ph=(+o.phr||0.6)*Wem, imgH=pw*a;
  const sx=e.clientX, sy=e.clientY;
  const ox=(+o.ixr||0)*Wem, oy=(+o.iyr||0)*Wem;
  let moved=false;
  const mv=ev=>{
    moved=true;
    const k=screenScale();
    const dxE=(ev.clientX-sx)/k/fs0, dyE=(ev.clientY-sy)/k/fs0;
    const ix=Math.max(Wem-pw, Math.min(0, ox+dxE));
    const iy=Math.max(ph-imgH, Math.min(0, oy+dyE));
    o.ixr=r4(ix/Wem); o.iyr=r4(iy/Wem);
    img.style.left=r4(ix)+'em'; img.style.top=r4(iy)+'em';
  };
  const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved) pushUndo(pre); };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
function cropEdgeDrag(e,wrap,key,edge){
  e.stopPropagation(); e.preventDefault();
  const o=ovOf(key);
  const page=wrap.closest('.page'), pr=page.getBoundingClientRect();
  const img=wrap.querySelector('img'); if(!img||!+o.pwr) return;
  const pre=snap();
  let moved=false;
  const fs0=fsOf(o);                                  // stays constant (ts compensates)
  const a=(img.naturalHeight/img.naturalWidth)||0.75;
  const emPerPctW=page.offsetWidth/100/fs0;           // em per 1% page width
  const emPerPctH=page.offsetHeight/100/fs0;
  const Wem0=(+o.w||28)*emPerPctW;
  const pw=o.pwr*Wem0;                                // picture size is FIXED during the drag
  const imgH=pw*a;
  const sx=e.clientX, sy=e.clientY;
  const st={x:+o.x||0, y:+o.y||0, w:+o.w||28,
            ph:(+o.phr||0.6)*Wem0, ix:(+o.ixr||0)*Wem0, iy:(+o.iyr||0)*Wem0};
  const mv=ev=>{
    moved=true;
    const dxPct=(ev.clientX-sx)/pr.width*100;
    const dyEm=(ev.clientY-sy)/screenScale()/fs0;
    let x=st.x, y=st.y, w=st.w, ph=st.ph, ix=st.ix, iy=st.iy;
    if(edge==='r'){
      const maxW=(pw+st.ix)/emPerPctW;                // window can't outgrow the picture
      w=Math.max(3, Math.min(maxW, st.w+dxPct));
    }else if(edge==='l'){
      let d=Math.max(st.ix/emPerPctW, Math.min(st.w-3, dxPct));   // + = crop in, − = restore
      x=st.x+d; w=st.w-d; ix=st.ix-d*emPerPctW;
    }else if(edge==='b'){
      ph=Math.max(2, Math.min(imgH+st.iy, st.ph+dyEm));
    }else{                                            // top
      let d=Math.max(st.iy, Math.min(st.ph-2, dyEm));
      y=st.y+d/emPerPctH; ph=st.ph-d; iy=st.iy-d;
    }
    const WemN=w*emPerPctW;
    o.x=Math.round(x*10)/10; o.y=Math.round(y*10)/10;
    o.w=Math.round(w*100)/100;
    o.pwr=r4(pw/WemN); o.phr=r4(ph/WemN);
    o.ixr=r4(ix/WemN); o.iyr=r4(iy/WemN);
    o.ts=Math.round(fs0/(13.5*(o.w/28))*1000)/1000;
    if(Math.abs(o.ts-1)<0.002) delete o.ts;
    applyCrop(wrap,o);
    updateOffpage();
  };
  const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved){ pushUndo(pre); markSel(); } };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
}

// ── Global controls ─────────────────────────────────────────────────
// Changing paper must NOT restyle the design. x/y/w are percentages of the page,
// so a bigger sheet would otherwise blow everything up — bigger boxes, bigger type.
// Rescale the percentages by the paper ratio instead: every object keeps its
// physical width, position and text size, and the larger sheet simply gives more
// room around the design. The stored model stays percentage-based, so nothing
// about the data contract changes.
// ── Paper ───────────────────────────────────────────────────────────
// A print is DESIGNED on one paper and can be PRINTED on any other. Nothing
// stored ever changes: the page is always laid out at its design size, and the
// output paper is applied as a single CSS zoom over the whole page.
//
// That is the point. Rescaling stored coordinates drags in every unit in the
// document — px inside text, borders, crop ratios — and any one of them that is
// not relative breaks. Scaling the rendered page scales ALL of it together,
// including the px, because none of it knows it is being scaled.
document.getElementById('outPaper').onchange=e=>{
  COMP.params=COMP.params||{};
  COMP.params.outPaper=e.target.value;
  scheduleSave();
  applyPaper();
  render(); applyZoom(curScale*100); showKnobs(); markSel(); scheduleStrip();
};
document.getElementById('zoom').oninput=e=>zoomToPct(+e.target.value);
document.getElementById('zoomIn').onclick=()=>zoomStep(1.25);
document.getElementById('zoomOut').onclick=()=>zoomStep(1/1.25);
document.getElementById('zoomFit').onclick=()=>syncZoom();

// Track the mouse so keyboard zoom anchors where you're looking.
let lastMouse=null, lastNudge=0;
document.getElementById('addTextBtn').onclick=()=>{ if(editing) commitEdit(false); addText(); };
document.addEventListener('mousemove',e=>{ lastMouse={x:e.clientX,y:e.clientY}; });

// The wheel zooms EVERYWHERE (anchored to the cursor, even off the page) —
// except over the panel, which scrolls normally.
document.addEventListener('wheel',e=>{
  if(e.target.closest&&e.target.closest('#panel,#strip,#res')) return;   // let the panel/picker/strip scroll
  e.preventDefault();
  zoomStep(e.deltaY<0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
}, { passive:false });

// Keyboard: +/= zoom in, -/_ zoom out, 0 fits, Ctrl+Z/Y undo/redo,
// Delete removes the selection. While typing, the browser behaves normally.
document.addEventListener('keydown',e=>{
  if(e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); doRedo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSelected(); return; }
  // Ctrl+C/X/V are NOT handled here — the real copy/cut/paste events are, further
  // down. Intercepting the key stops anything reaching the system clipboard, which
  // is what broke pasting into Google Docs.
  if(e.key==='PageDown'){ e.preventDefault(); if(curPage<pageCount()) setPage(curPage+1); return; }
  if(e.key==='PageUp'){   e.preventDefault(); if(curPage>1)           setPage(curPage-1); return; }
  if(e.key==='Delete'&&SEL.length){ e.preventDefault(); removeSelected(); return; }
  if(e.key==='Escape'){ e.preventDefault();
    if(cropKey){ cropKey=null; showKnobs(); markSel(); } else clearSel(); return; }
  // Arrow keys nudge the selection: 0.5% per press, 0.1% with Shift.
  if(SEL.length&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    const st=e.shiftKey?0.1:0.5;
    const dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0;
    const dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;
    if(Date.now()-lastNudge>800) pushUndo(); else scheduleSave();   // coalesce bursts into one undo step
    lastNudge=Date.now();
    SEL.forEach(kk=>{ const o=ovOf(kk);
      o.x=Math.round(((+o.x||0)+dx)*10)/10; o.y=Math.round(((+o.y||0)+dy)*10)/10;
      const el=elOf(kk); if(el){ el.style.left=o.x+'%'; el.style.top=o.y+'%'; } });
    updateOffpage();
    return;
  }
  const at=lastMouse||{};
  if(e.key==='+'||e.key==='='){ e.preventDefault(); zoomStep(1.25, at.x, at.y); }
  else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoomStep(1/1.25, at.x, at.y); }
  else if(e.key==='0'){ e.preventDefault(); syncZoom(); }
});
// Page navigation buttons.
// Undo / redo buttons (mousedown-preventDefault keeps the text editor focused,
// so while editing they drive the browser's native text undo).
const _ub=document.getElementById('undoBtn'), _rb=document.getElementById('redoBtn');
_ub.onmousedown=e=>e.preventDefault(); _rb.onmousedown=e=>e.preventDefault();
_ub.onclick=()=>doUndo(); _rb.onclick=()=>doRedo();
updateUndoBtns();

// Cards dragged in from the Make board (another window) land where dropped.
// The composition is saved with the new ref, then re-fetched so the card's
// LIVE content resolves — same mirror rule as everything else.
// Accept our own cards, and also pictures and files dragged in from a web page
// or the desktop. Without the extra types here the browser refuses the drop.
// ── CHAPTERS: cards that hold together ──────────────────────────────
// params.chapters[id] = { name, cards:[cardId, …] }
// A chapter's cards are ALWAYS contiguous in the document. That is not a nicety:
// a chapter with a stranger's page wedged between 1/3 and 2/3 is meaningless on
// paper, and it makes "where does the new page go" unanswerable.
// enforceChapters() re-establishes the invariant after any card-list change, so
// no single operation has to be careful.
function chapters(){ COMP.params=COMP.params||{}; return COMP.params.chapters=COMP.params.chapters||{}; }
function newChId(){ return 'ch'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function chapterOfCard(id){
  if(!id) return null;
  const cs=chapters();
  for(const k in cs){ if((cs[k].cards||[]).indexOf(id)>=0) return { id:k, ch:cs[k] }; }
  return null;
}
function chapterOf(n){ return chapterOfCard(cardIdAt(n)); }
// Position in the chapter, 1-based, and its length: "2/3".
function chapterPos(n){
  const f=chapterOf(n); if(!f) return null;
  const list=(f.ch.cards||[]).filter(id=>cards().some(c=>c.id===id));
  return { id:f.id, ch:f.ch, i:list.indexOf(cardIdAt(n))+1, n:list.length };
}
function enforceChapters(){
  const cs=chapters();
  Object.keys(cs).forEach(k=>{
    const ch=cs[k];
    // drop members that no longer exist, and re-order to document order
    const present=cards().map(c=>c.id);
    ch.cards=(ch.cards||[]).filter(id=>present.indexOf(id)>=0);
    if(!ch.cards.length){ delete cs[k]; return; }
    ch.cards.sort((a,b)=>present.indexOf(a)-present.indexOf(b));
    // pull any strays up so the run is unbroken
    const first=present.indexOf(ch.cards[0]);
    const arr=cards();
    ch.cards.forEach((id,off)=>{
      const at=arr.findIndex(c=>c.id===id);
      const want=first+off;
      if(at!==want && at>=0){ const [m]=arr.splice(at,1); arr.splice(want,0,m); }
    });
  });
  // Placements track pages too; drop any that no longer exist, and forget a
  // placement whose pages have all gone.
  const present=cards().map(c=>c.id);
  const ps=(COMP.params&&COMP.params.placements)||{};
  Object.keys(ps).forEach(k=>{
    ps[k].cards=(ps[k].cards||[]).filter(id=>present.indexOf(id)>=0);
    if(!ps[k].cards.length) delete ps[k];
  });
  syncPages();
}
function createChapter(n){
  const id=cardIdAt(n); if(!id) return;
  if(chapterOfCard(id)) return;
  const name=prompt('Name this chapter (e.g. "The team", "Kunder"):','Chapter');
  if(!name||!name.trim()) return;
  pushUndo();
  chapters()[newChId()]={ name:name.trim(), cards:[id] };
  enforceChapters(); renderCurrent(); showKnobs(); scheduleStrip();
}
function ungroupChapter(chId){
  pushUndo();
  delete chapters()[chId];
  enforceChapters(); renderCurrent(); showKnobs(); scheduleStrip();
}
function deleteChapter(chId){
  const ch=chapters()[chId]; if(!ch) return;
  const ids=(ch.cards||[]).slice();
  if(cards().length<=ids.length){ alert('That would delete every page — a print keeps at least one.'); return; }
  if(!confirm('Delete the chapter “'+(ch.name||'')+'” and its '+ids.length+
              ' page'+(ids.length===1?'':'s')+'? Ctrl+Z brings it back.')) return;
  pushUndo();
  COMP.items=(COMP.items||[]).filter(it=>!(it.overrides&&ids.indexOf(it.overrides.card)>=0));
  COMP.params.frames=frames().filter(f=>ids.indexOf(f.card)<0);
  COMP.params.texts =texts().filter(t=>ids.indexOf(t.card)<0);
  COMP.params.cards=cards().filter(c=>ids.indexOf(c.id)<0);
  delete chapters()[chId];
  enforceChapters();
  curPage=Math.min(curPage,pageCount());
  SEL=[]; renderCurrent(); showKnobs(); scheduleStrip();
}

// ── GROUP CARDS: a rule, not a snapshot ─────────────────────────────
// params.rules[cardId] = { kind:'group', group_id, name, exclude:[], cols, fields:{} }
// Objects the rule placed carry overrides.rule = cardId. Move one by hand and it
// gets overrides.pin = 1: refresh then relays everyone else AROUND it and leaves
// yours exactly where you put it. Unlink drops the rule and the card becomes an
// ordinary snapshot.
function rules(){ COMP.params=COMP.params||{}; return COMP.params.rules=COMP.params.rules||{}; }
function ruleOf(n){ const id=cardIdAt(n); return id?rules()[id]:null; }
const RULEFIELDS=['photo','name','title','email','phone'];

// Fetch the group's ACTIVE members (the server filters status now).
async function ruleMembers(rule){
  const p=new URLSearchParams();
  p.set('groups',String(rule.group_id));
  p.set('living','1'); p.set('deceased','1'); p.set('people','1'); p.set('pets','1');
  p.set('section','g:'+rule.group_id); p.set('limit','500'); p.set('offset','0');
  const r=await fetch('/api/content?'+p.toString());
  if(!r.ok) return null;
  const sec=((await r.json()).sections||[])[0];
  if(!sec) return null;
  const ex=new Set((rule.exclude||[]).map(Number));
  return sec.items.filter(o=>!ex.has(+o.id));
}

// Place the members in a grid, then MEASURE what was actually rendered and
// correct the rows. Estimating heights is what made things overflow oddly;
// the browser already knows the true height, so ask it.
function ruleLayout(cardId, members, rule){
  const startPage=Math.max(1, cards().findIndex(c=>c.id===cardId)+1);
  const cols=Math.max(1,Math.min(8,+rule.cols||4));
  const gap=2.5, margin=6;
  const w=(100-margin*2-gap*(cols-1))/cols;

  // Slots already taken by pinned objects on this card keep their place.
  const pinned=(COMP.items||[]).filter(it=>it.overrides&&it.overrides.rule===cardId&&+it.overrides.pin);
  const pinnedIds=new Set(pinned.map(it=>+it.ref_id));

  // Drop the unpinned ones; we are about to lay them out again.
  COMP.items=(COMP.items||[]).filter(it=>!(it.overrides&&it.overrides.rule===cardId&&!+it.overrides.pin));

  const fresh=members.filter(m=>!pinnedIds.has(+m.id));
  const P=paperOf((COMP.params&&COMP.params.paper)||'a4');
  let est=w*(P.w/P.h)*1.45;                       // first guess, corrected below
  fresh.forEach((m,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    COMP.items.push({ ref_type:'contact', ref_id:+m.id, content:m, overrides:{
      page:startPage, card:cardId, rule:cardId, ri:i,
      x:Math.round((margin+col*(w+gap))*10)/10,
      y:Math.round((margin+row*(est+gap))*10)/10,
      w:Math.round(w*10)/10,
      flds:RULEFIELDS.filter(f=>rule.fields&&rule.fields[f]!==false).join(',')
    }});
  });
  return { cols, gap, margin, w, count:fresh.length, startPage };
}

// Second pass: read the real heights off the page and re-space the rows,
// spilling onto as many cards as this paper needs.
function ruleCorrect(cardId, plan){
  const page=document.querySelector('#out .page'); if(!page||!plan.count) return;
  const pr=page.getBoundingClientRect(); if(!pr.height) return;
  let tallest=0;
  page.querySelectorAll('.abswrap').forEach(el=>{
    const k=keyOfEl(el); if(!k) return;
    const ov=ovOf(k); if(!ov||ov.rule!==cardId||+ov.pin) return;
    const h=el.getBoundingClientRect().height/pr.height*100;
    if(h>tallest) tallest=h;
  });
  if(tallest<=0) return;
  const rowH=tallest+plan.gap;
  const usable=100-plan.margin*2+plan.gap;
  const rows=Math.max(1,Math.floor(usable/rowH));
  const per=rows*plan.cols;

  const startIdx=cards().findIndex(c=>c.id===cardId);
  let maxPage=startIdx+1;
  (COMP.items||[]).forEach(it=>{
    const ov=it.overrides; if(!ov||ov.rule!==cardId||+ov.pin) return;
    const i=+ov.ri||0;
    const sheet=Math.floor(i/per), n=i%per;
    const col=n%plan.cols, row=Math.floor(n/plan.cols);
    const pg=startIdx+1+sheet;
    ensureCards(pg);
    ov.page=pg; ov.card=cardIdAt(pg);
    ov.x=Math.round((plan.margin+col*(plan.w+plan.gap))*10)/10;
    ov.y=Math.round((plan.margin+row*rowH)*10)/10;
    if(pg>maxPage) maxPage=pg;
  });
  syncPages();
}

async function applyRule(n, opts){
  const cardId=cardIdAt(n); if(!cardId) return;
  const rule=rules()[cardId]; if(!rule) return;
  const members=await ruleMembers(rule);
  if(!members){ alert('Could not read that group.'); return; }
  pushUndo();
  // Someone pinned who has left the group comes off — a team page showing an
  // ex-employee is worse than losing a nudge.
  const live=new Set(members.map(m=>+m.id));
  const dropped=[];
  COMP.items=(COMP.items||[]).filter(it=>{
    const ov=it.overrides;
    if(!ov||ov.rule!==cardId||!+ov.pin) return true;
    if(live.has(+it.ref_id)) return true;
    dropped.push((it.content&&it.content.name)||'someone');
    return false;
  });
  const plan=ruleLayout(cardId, members, rule);
  syncPages(); renderCurrent();
  ruleCorrect(cardId, plan);
  renderCurrent(); showKnobs(); markSel();
  if(dropped.length) groupBanner(dropped.join(', ')+(dropped.length>1?' are':' is')+
    ' no longer in the group — taken off this card.');
  else if(!opts||!opts.quiet) groupBanner('Card updated — '+plan.count+' from '+(rule.name||'the group')+'.');
}

// ── Dropping a whole group ──────────────────────────────────────────
// No arbitrary cap. The drop FILLS the card with a grid of as many as physically
// fit — a number that means something, because it depends on the paper and the
// size — then reports what's left with one button to continue onto new cards.
// ── Dropping without covering what's already there ──────────────────
// Measured from the RENDERED card, so these are real boxes, not estimates.
function occupiedRects(){
  const page=document.querySelector('#out .page'); if(!page) return [];
  const pr=page.getBoundingClientRect();
  if(!pr.width||!pr.height) return [];
  const out=[];
  page.querySelectorAll('.abswrap,.txtfree,.frameobj').forEach(el=>{
    const r=el.getBoundingClientRect();
    out.push({ x:(r.left-pr.left)/pr.width*100,  y:(r.top-pr.top)/pr.height*100,
               w:r.width/pr.width*100,           h:r.height/pr.height*100 });
  });
  return out;
}
const rectsHit=(a,b)=>!(a.x+a.w<=b.x || b.x+b.w<=a.x || a.y+a.h<=b.y || b.y+b.h<=a.y);
// Lowest point anything reaches on this card — where a new grid should start.
function occupiedBottom(){
  const occ=occupiedRects();
  return occ.length ? Math.max(0, ...occ.map(o=>o.y+o.h)) : 0;
}
// Where you dropped, if it's clear. Otherwise the nearest clear place, searching
// down and across. Falls back to the drop point if the card is genuinely full.
function freeSpot(w,h,x0,y0){
  const occ=occupiedRects();
  const clear=c=>!occ.some(o=>rectsHit(c,o));
  const want={ x:Math.max(1,Math.min(99-w,x0)), y:Math.max(1,y0), w, h };
  if(clear(want)) return want;
  const sx=Math.max(2.5,w*0.34), sy=Math.max(2.5,h*0.34);
  for(let y=1; y<=140; y+=sy)
    for(let x=1; x+w<=99; x+=sx){
      const t={x:Math.round(x*10)/10, y:Math.round(y*10)/10, w, h};
      if(clear(t)) return t;
    }
  return want;
}
// Rough height of an object at width w%, as a share of page height.
function estH(w){
  const P=paperOf((COMP&&COMP.params&&COMP.params.paper)||'a4');
  return w*(P.w/P.h)*CARDASPECT;
}

const GRIDMARGIN=6, GRIDGAP=2.5, CARDASPECT=1.45;
function planFor(cols){
  const P=paperOf((COMP&&COMP.params&&COMP.params.paper)||'a4');
  const w=(100-GRIDMARGIN*2-GRIDGAP*(cols-1))/cols;              // % of page width
  // A person card runs about 1.45x as tall as it is wide (portrait + three lines);
  // convert that to a share of page HEIGHT, which is what rows are measured in.
  const hPct=w*(P.w/P.h)*CARDASPECT;
  const rows=Math.max(1, Math.floor((100-GRIDMARGIN*2+GRIDGAP)/(hPct+GRIDGAP)));
  return { w, hPct, rows, cols, perCard:rows*cols };
}
// Use the BIGGEST cards that still get everyone onto one card, down to 6 columns.
// So six people come out large, seventeen come out as a proper team page, and a
// hundred customers pack tightly — without you choosing a number.
function gridPlan(count){
  let best=null;
  for(let cols=2; cols<=6; cols++){
    const p=planFor(cols);
    if(!best) best=p;
    if(count && p.perCard>=count) return p;
    best=p;
  }
  return best;
}
// One plan for the whole drop, so the leftovers on later cards are laid out at
// exactly the same size as the first card — not re-planned for a smaller count.
function placeGrid(items, kind, groupKey, startPage, g, continuous, topY){
  const y0=(topY==null?GRIDMARGIN:topY);
  let page=startPage, i=0;
  while(i<items.length){
    ensureCards(page);
    // continuous = one card, rows carrying on into the grey below the page.
    const slice=continuous?items:items.slice(i, i+g.perCard);
    slice.forEach((o,n)=>{
      const col=n%g.cols, row=Math.floor(n/g.cols);
      COMP.items.push({ ref_type:kind, ref_id:o.id, content:o, overrides:{
        page, card:cardIdAt(page),
        x:Math.round((GRIDMARGIN+col*(g.w+GRIDGAP))*10)/10,
        y:Math.round((y0+row*(g.hPct+GRIDGAP))*10)/10,
        w:Math.round(g.w*10)/10,
        grp:groupKey,           // which group these came from — groundwork
        gi:(continuous?n:i+n)   // position in the group's grid, for exact re-flow
      }});
    });
    i+=slice.length;
    if(i<items.length) page++;
  }
  return page;
}
function groupBanner(msg, btnLabel, fn){
  let b=document.getElementById('grpBanner');
  if(!b){ b=document.createElement('div'); b.id='grpBanner';
    b.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;'+
      'background:#fff;border:2px solid var(--gold);border-radius:12px;padding:9px 14px;'+
      'box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:13px;display:flex;gap:10px;align-items:center;';
    document.body.appendChild(b); }
  b.innerHTML='<span>'+esc(msg)+'</span>';
  if(btnLabel){ const btn=document.createElement('button');
    btn.textContent=btnLabel;
    btn.style.cssText='font-family:inherit;font-weight:700;font-size:12.5px;padding:4px 9px;'+
      'border:1px solid var(--green);border-radius:8px;background:var(--green);color:#f4efe4;cursor:pointer;';
    btn.onclick=()=>{ b.remove(); fn(); }; b.appendChild(btn); }
  const x=document.createElement('button');
  x.textContent='✕';
  x.style.cssText='font-family:inherit;font-size:12px;border:0;background:none;cursor:pointer;color:#7a8470;';
  x.onclick=()=>b.remove(); b.appendChild(x);
  clearTimeout(groupBanner._t); groupBanner._t=setTimeout(()=>{ if(b) b.remove(); }, 14000);
}
// Dragging a group in creates a RULE card, not a snapshot: the card remembers
// the group, so adding someone to it later and pressing ↻ brings them in.
// Timeline and Archive stay snapshots — there is no membership to follow.
async function dropGroup(d){
  const gid=(String(d.section||'').slice(0,2)==='g:')?+String(d.section).slice(2):0;
  if(!gid){                                   // Timeline / Archive: place them as they are
    try{
      const r=await fetch('/api/content?'+d.q+'&section='+encodeURIComponent(d.section)+'&limit=500&offset=0');
      if(!r.ok){ alert('Could not load that.'); return; }
      const sec=((await r.json()).sections||[])[0];
      if(!sec||!sec.items.length){ alert('Nothing there with the current filters.'); return; }
      const g=gridPlan(sec.items.length);
      pushUndo();
      const bot=occupiedBottom();
      placeGrid(sec.items, sec.kind, d.section, curPage, g, true, bot>0?Math.min(bot+2.5,100):6);
      syncPages(); renderCurrent(); showKnobs(); markSel();
      groupBanner('Placed '+sec.items.length+' from '+(d.title||'that source')+'.');
    }catch(e){ alert('Could not place that.'); }
    return;
  }
  // A group lands on its OWN card, so the rule owns the whole page.
  pushUndo();
  cards().splice(curPage,0,{id:newCardId()});
  syncPages();
  curPage=curPage+1; SEL=[];
  const id=cardIdAt(curPage);
  rules()[id]={ kind:'group', group_id:gid, name:d.title||'Group', exclude:[], cols:4, fields:{} };
  await applyRule(curPage,{quiet:1});
  groupBanner('“'+(d.title||'Group')+'” is now a rule card — it follows the group.');
}

document.addEventListener('dragover',e=>{
  const t=[...(e.dataTransfer.types||[])];
  if(t.includes('text/ts-card')||t.includes('text/ts-group')||t.includes('text/ts-block')
     ||t.includes('Files')||t.includes('text/uri-list')||t.includes('text/html'))
    e.preventDefault();
});
// A saved card is a whole PAGE, so it does not land on top of the page you are
// working on. By default it becomes a NEW card straight after the current one.
// Drop it on a page in the filmstrip and it goes into that page instead.
// Push this print's copy back up to the saved card, as a new version. This is
// the ONLY way edits reach the original — never automatic, because one nudge for
// one customer would otherwise land in every print that takes the update.
async function pushPlacement(pid){
  const p=placements()[pid]; if(!p) return;
  if(editing) commitEdit(true);
  const ids=(p.cards||[]).filter(id=>cards().some(c=>c.id===id));
  if(!ids.length){ alert('Those pages are gone.'); return; }
  const pageOf=id=>ids.indexOf(id)+1;
  const onPage=(COMP.items||[]).filter(it=>it.overrides&&ids.indexOf(it.overrides.card)>=0);
  const fr=frames().filter(f=>ids.indexOf(f.card)>=0);
  const tx=texts().filter(t=>ids.indexOf(t.card)>=0);
  if(!confirm('Update the original “'+(p.name||'card')+'” with what is on '+
      (ids.length>1?'these '+ids.length+' pages':'this page')+'?\n\n'+
      'Every other print will then be offered this version.')) return;
  const rebase=o=>{ const c=JSON.parse(JSON.stringify(o||{}));
    c.page=pageOf(c.card)||1;
    delete c.card; delete c.blk; delete c.grp; delete c.gi; delete c.pin;
    delete c.rule; delete c.ri; delete c.plc; return c; };
  try{
    const r=await fetch('/api/print-blocks/'+p.block_id,{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ pages:ids.length,
        params:{ frames:fr.map(rebase), texts:tx.map(rebase) },
        items:onPage.map(it=>({ref_type:it.ref_type,ref_id:it.ref_id,overrides:rebase(it.overrides)})) })});
    if(!r.ok){ alert('Could not update the original.'); return; }
    const d=await r.json().catch(()=>({}));
    p.version = +d.version || (+p.version||1)+1;      // the PUT returns the new one
    // The pushed copy is now identical to the original, so it is no longer "edited".
    (COMP.items||[]).forEach(it=>{ if(it.overrides&&it.overrides.plc===pid) delete it.overrides.pin; });
    // Refresh the Content panel, or its badge would keep showing the old version.
    RES.cardsDirty=true;
    if(document.getElementById('res').classList.contains('open')&&RES.cards) fetchContent();
    scheduleSave(); showKnobs(); scheduleStrip();
    groupBanner('“'+(p.name||'card')+'” is now v'+p.version+' — other prints will be offered it.');
  }catch(e){ alert('Could not update the original.'); }
}
function unlinkPlacement(pid){
  const p=placements()[pid]; if(!p) return;
  if(!confirm('Unlink from “'+(p.name||'card')+'”? These pages stay exactly as they are, '+
              'but they stop following the original.')) return;
  pushUndo();
  (COMP.items||[]).forEach(it=>{ if(it.overrides&&it.overrides.plc===pid) delete it.overrides.plc; });
  delete placements()[pid];
  showKnobs(); scheduleStrip();
}

// ── Is anything in this print out of date? ──────────────────────────
// Nothing changes without you ticking it, so an old print stays exactly as it
// was printed. The page count is shown because updating changes the length.
function plcHasLocalEdits(pid){
  return (COMP.items||[]).some(it=>it.overrides&&it.overrides.plc===pid&&
    (+it.overrides.pin||it.overrides.text!=null));
}
async function checkForUpdates(){
  const plcs=placements();
  const ids=Object.keys(plcs);
  if(!ids.length) return;
  let by={};
  try{
    const r=await fetch('/api/print-blocks/versions');
    if(!r.ok) return;
    by=((await r.json()).blocks)||{};
  }catch(e){ return; }
  const behind=ids.map(pid=>{
    const p=plcs[pid], live=by[p.block_id];
    if(!live) return null;
    if((+live.version||1)<=(+p.version||1)) return null;
    return { pid, p, live, edited:plcHasLocalEdits(pid) };
  }).filter(Boolean);
  if(!behind.length) return;
  showUpdateTable(behind);
}
function showUpdateTable(rows){
  const bg=document.getElementById('updOverlay');
  const body=document.getElementById('updBody');
  body.innerHTML='<div class="uhead"><span>Card</span><span>In this print</span><span>Latest</span><span></span></div>'+
    rows.map(r=>{
      const was=(r.p.cards||[]).length, now=Math.max(1,+r.live.pages||1);
      return '<div class="urow'+(r.edited?' edited':'')+'">'+
        '<span><b>'+esc(r.live.name||r.p.name||'card')+'</b>'+
          (r.edited?'<br><span class="uwarn">you changed this copy — updating replaces it</span>':'')+'</span>'+
        '<span>v'+(+r.p.version||1)+' · '+was+' page'+(was===1?'':'s')+'</span>'+
        '<span><b>v'+(+r.live.version||1)+' · '+now+' page'+(now===1?'':'s')+'</b>'+
          (now!==was?'<br><span class="uwarn">the print '+(now>was?'grows by '+(now-was):'loses '+(was-now))+'</span>':'')+'</span>'+
        '<span><input type="checkbox" class="uck" data-pid="'+r.pid+'"'+(r.edited?'':' checked')+'></span>'+
      '</div>';
    }).join('');
  bg.classList.add('open');
  document.getElementById('updGo').onclick=async()=>{
    const picked=[...body.querySelectorAll('.uck')].filter(c=>c.checked).map(c=>c.dataset.pid);
    bg.classList.remove('open');
    for(const pid of picked) await updatePlacement(pid);
    if(picked.length) groupBanner('Updated '+picked.length+' card'+(picked.length===1?'':'s')+'.');
  };
  document.getElementById('updSkip').onclick=()=>bg.classList.remove('open');
}
// Replace a placement's run in place: out with its old pages, in with the new
// ones at the same position. The chapter, if any, is rebuilt around them.
async function updatePlacement(pid){
  const p=placements()[pid]; if(!p) return;
  let b;
  try{
    const r=await fetch('/api/print-blocks/'+p.block_id);
    if(!r.ok) return;
    b=await r.json();
  }catch(e){ return; }
  pushUndo();
  const old=(p.cards||[]).slice();
  const arr=cards();
  let at=arr.findIndex(c=>c.id===old[0]);
  if(at<0) at=arr.length;
  const ch=chapterOfCard(old[0]);
  // out with the old
  COMP.items=(COMP.items||[]).filter(it=>!(it.overrides&&old.indexOf(it.overrides.card)>=0));
  COMP.params.frames=frames().filter(f=>old.indexOf(f.card)<0);
  COMP.params.texts =texts().filter(t=>old.indexOf(t.card)<0);
  COMP.params.cards=arr.filter(c=>old.indexOf(c.id)<0);
  // in with the new, at the same place
  const pages=Math.max(1,+b.pages||1), made=[];
  for(let i=0;i<pages;i++){ const nid=newCardId(); cards().splice(at+i,0,{id:nid}); made.push(nid); }
  if(ch){ const l=ch.ch.cards||[];
    ch.ch.cards=l.filter(id=>old.indexOf(id)<0);
    ch.ch.cards.splice(0,0,...made);
  }else if(pages>1){
    chapters()[newChId()]={ name:b.name||'Chapter', cards:made.slice() };
  }
  p.version=+b.version||1; p.cards=made.slice(); p.name=b.name||p.name;
  syncPages();
  const keep=curPage;
  curPage=at+1;
  stampBlock(b, made, pid);
  enforceChapters();
  curPage=Math.max(1,Math.min(pageCount(),keep));
  renderCurrent(); showKnobs(); scheduleStrip();
}

// params.placements[pid] = { block_id, version, name, cards:[…] }
// A print remembers which of its pages came from which saved card, and at which
// version — that is what lets it be offered the newer one later.
// A new page next to a linked page belongs to the same placement.
function joinPlacement(afterId, newId){
  const f=placementOfCard(afterId); if(!f) return;
  const l=f.p.cards||[]; const at=l.indexOf(afterId);
  l.splice(at<0?l.length:at+1, 0, newId);
}
function placementOfCard(id){
  if(!id) return null;
  const ps=placements();
  for(const k in ps){ if((ps[k].cards||[]).indexOf(id)>=0) return { pid:k, p:ps[k] }; }
  return null;
}
function placementOf(n){ return placementOfCard(cardIdAt(n)); }
function placements(){ COMP.params=COMP.params||{}; return COMP.params.placements=COMP.params.placements||{}; }
function newPlcId(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

async function dropSavedCard(id, onto){
  try{
    const r=await fetch('/api/print-blocks/'+id);
    if(!r.ok){ alert('Could not load that card.'); return; }
    const b=await r.json();
    const pages=Math.max(1,+b.pages||1);
    pushUndo();
    // Always its own pages: a saved card is a whole page, so it never lands on top
    // of the one you are working on.
    const startAt = (onto==='new') ? curPage : curPage-1;
    const made=[];
    for(let i=0;i<pages;i++){ const nid=newCardId(); cards().splice(startAt+i,0,{id:nid}); made.push(nid); }
    syncPages();
    curPage=startAt+1; SEL=[];
    // More than one page arrives as a chapter, so it holds together from the start.
    if(pages>1) chapters()[newChId()]={ name:b.name||'Chapter', cards:made.slice() };
    const pid=newPlcId();
    placements()[pid]={ block_id:+id, version:+b.version||1, name:b.name||'', cards:made.slice() };
    stampBlock(b, made, pid);
    enforceChapters();
  }catch(e){ alert('Could not load that card.'); }
}
document.addEventListener('drop',async e=>{
  const blk=e.dataTransfer.getData('text/ts-block');
  if(blk){ e.preventDefault(); await dropSavedCard(blk,'new'); return; }
  const grp=e.dataTransfer.getData('text/ts-group');
  if(grp){ e.preventDefault();
    let d; try{ d=JSON.parse(grp); }catch(err){ return; }
    if(d&&d.section) await dropGroup(d);
    return;
  }
  const raw=e.dataTransfer.getData('text/ts-card');
  if(!raw){                                   // not one of our cards — a picture?
    const dt=e.dataTransfer;
    const files=[...(dt.files||[])].filter(f=>/^image\//i.test(f.type||''));
    if(files.length){ e.preventDefault(); for(const f of files) await addImageFromFile(f); return; }
    const html=dt.getData('text/html')||'';
    const m=html.match(/<img[^>]+src\s*=\s*["']([^"']+)["']/i);
    if(m&&/^https?:\/\//i.test(m[1])){ e.preventDefault(); await addImageFromUrl(m[1]); return; }
    const uri=(dt.getData('text/uri-list')||dt.getData('text/plain')||'').trim().split(/\s+/)[0];
    if(/^https?:\/\//i.test(uri)){ e.preventDefault(); await addImageFromUrl(uri); return; }
    return;
  }
  e.preventDefault();
  let d; try{ d=JSON.parse(raw); }catch(err){ return; }
  let x0=null, y0=null;
  const page=document.querySelector('#out .page');
  if(page){
    const pr=page.getBoundingClientRect();
    x0=Math.round(Math.max(-30,Math.min(98,(e.clientX-pr.left)/pr.width*100-12))*10)/10;
    y0=Math.round(Math.max(-30,Math.min(98,(e.clientY-pr.top)/pr.height*100-4))*10)/10;
  }
  await placeCardRef(d, x0, y0);
});

// Put one referenced card on the CURRENT page. Shared by the canvas drop and by
// dropping onto a small page in the filmstrip.
async function placeCardRef(d, x0, y0){
  if(!d||!['post','contact','media'].includes(d.ref_type)||!+d.ref_id) return;
  pushUndo();
  // Where you let go, unless something is already there — then the nearest clear spot.
  const spot=freeSpot(24, estH(24), x0==null?8:x0, y0==null?8:y0);
  COMP.items.push({ ref_type:d.ref_type, ref_id:+d.ref_id,
    overrides:{ page:curPage, card:cardIdAt(curPage), w:24, x:spot.x, y:spot.y } });
  await saveNow();
  const r=await fetch('/api/compositions/'+compId);

    const fresh=await r.json();

window.addEventListener('beforeprint',()=>{ if(editing) commitEdit(false); renderAllPages(); });

// ── Autosave: a couple of seconds after the last change, plus the button ──
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,2500); saveState('Unsaved changes'); }
// Never two saves in flight. Each PUT replaces the whole item list, so overlapping
// saves are what let the server interleave them; the guard removes the race at
// the source and the transaction on the server catches anything else.
let saving=false, saveAgain=false;
async function saveNow(){
  if(saving){ saveAgain=true; return; }
  saving=true;
  try{ await saveNowInner(); }
  finally{
    saving=false;
    if(saveAgain){ saveAgain=false; saveNow(); }
  }
}
async function saveNowInner(){
  if(!COMP||!compId) return;
  clearTimeout(saveTimer);
  COMP.params=COMP.params||{}; COMP.params.pages=pageCount();
  const items=COMP.items.map(i=>({ref_type:i.ref_type,ref_id:i.ref_id,overrides:i.overrides||{}}));
  saveState('Saving…');
  let ok=false;
  try{
    const r=await fetch('/api/compositions/'+compId,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items, params:COMP.params||{}}), keepalive:true});
    ok=r.ok;
  }catch(e){}
  saveState(ok?'✓ Saved':'Not saved — retrying');
  if(!ok) scheduleSave();
}
// The panel reports; there is nothing to press. Everything saves 2.5s after the
// last change, and anything still pending is flushed when the tab goes away.
let saveStateT=null;
function saveState(txt, back){
  const el=document.getElementById('saveState'); if(!el) return;
  el.textContent=txt;
  clearTimeout(saveStateT);
  if(back) saveStateT=setTimeout(()=>{ el.textContent='✓ Saved'; }, back);
}
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; saveNow(); } }
// pagehide covers closing and navigating away; keepalive lets the PUT finish.
window.addEventListener('pagehide', flushSave);

// ── PRINT BLOCKS ────────────────────────────────────────────────────
// A block is a saved page you can stamp into any document. It stores
// ref_ids, not content — so the people and posts inside come back LIVE
// every time you use it: layout frozen, data fresh.
// Stamping EXPANDS the block into ordinary objects. Nothing stays linked,
// so everything you stamp is immediately draggable and restylable.

// Save the current page as a reusable block. Page numbers are rebased to 1
// so the block is position-independent — it can land on any page later.
// Save one card as a reusable card. Called from that card in the filmstrip, so
// there is never any doubt which page you meant.
// ⬒ saves this card — or, if it belongs to a chapter, the WHOLE chapter, because
// a chapter is the unit you reuse. Page numbers are rebased to 1..N.
// ⬒ saves this card — or the WHOLE chapter, if it belongs to one, because a
// chapter is the unit you reuse.
//
// SAME NAME = SAME CARD. Save under a name you have already used and it becomes
// the next version of that card, not a fourth copy of it. Give it a new name to
// make a new card. No dialog, nothing ambiguous: the name you type decides.
async function saveCardAsBlock(n){
  if(!COMP) return;
  if(editing) commitEdit(true);
  const cp=chapterPos(n);
  const ids = cp ? (cp.ch.cards||[]).slice() : [cardIdAt(n)];
  const pageOf = id => ids.indexOf(id)+1;
  const onPage=(COMP.items||[]).filter(it=>it.overrides&&ids.indexOf(it.overrides.card)>=0);
  const fr=frames().filter(f=>ids.indexOf(f.card)>=0);
  const tx=texts().filter(t=>ids.indexOf(t.card)>=0);
  if(!onPage.length&&!fr.length&&!tx.length){ alert('There is nothing on that to save.'); return; }
  const suggested = cp ? (cp.ch.name||'Chapter') : (COMP.name?(COMP.name+' — page '+n):'');
  const name=prompt(cp
    ? 'Name this chapter ('+ids.length+' pages). Re-use a name to save a new version of that card:'
    : 'Name this card. Re-use a name to save a new version of that card:', suggested);
  if(!name||!name.trim()) return;
  const nm=name.trim();

  const rebase=o=>{ const c=JSON.parse(JSON.stringify(o||{}));
    c.page=pageOf(c.card)||1;
    delete c.card; delete c.blk; delete c.grp; delete c.gi; delete c.pin;
    delete c.rule; delete c.ri; delete c.plc; return c; };
  const body={ name:nm, kind:'page', pages:ids.length,
    paper:(COMP.params&&COMP.params.paper)||'a4',
    params:{ frames:fr.map(rebase), texts:tx.map(rebase) },
    items:onPage.map(it=>({ref_type:it.ref_type,ref_id:it.ref_id,overrides:rebase(it.overrides)})),
    declares:{} };

  // Is there already a card by that name?
  let existing=null;
  try{
    const v=await fetch('/api/print-blocks/versions');
    if(v.ok){
      const by=((await v.json()).blocks)||{};
      for(const k in by){ if(String(by[k].name||'').trim().toLowerCase()===nm.toLowerCase()){ existing=by[k]; break; } }
    }
  }catch(e){}

  try{
    let r, verb, ver;
    if(existing){
      r=await fetch('/api/print-blocks/'+existing.id,{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ pages:body.pages, params:body.params, items:body.items })});
      const d=await r.json().catch(()=>({}));
      ver=+d.version||((+existing.version||1)+1);
      verb='“'+nm+'” is now v'+ver;
      // If these very pages came from that card, keep this print in step.
      const f=placementOf(n);
      if(f&&+f.p.block_id===+existing.id) f.p.version=ver;
    }else{
      r=await fetch('/api/print-blocks',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
      verb='“'+nm+'” saved';
    }
    if(!r.ok){ alert('Could not save that.'); return; }
    RES.cardsDirty=true;
    if(document.getElementById('res').classList.contains('open')&&RES.cards) fetchContent();
    groupBanner(verb+(ids.length>1?' — '+ids.length+' pages.':'.'));
    saveState('✓ Saved', 2200);
  }catch(e){ alert('Could not save that.'); }
}

// Stamp a block onto the current page: its page 1 lands on curPage, page 2 on
// curPage+1, and so on — adding pages to the document if it needs them.
// Lay a saved card's objects onto cards that ALREADY exist (dropSavedCard made
// them). cardIds[i] is where page i+1 goes; plc tags each object with the
// placement so an update knows exactly what to replace.
function stampBlock(b, cardIds, plc){
  if(!COMP) return;
  COMP.params = COMP.params || {};
  const ids = cardIds || [];
  const place = o => { const c=JSON.parse(JSON.stringify(o||{}));
    const p=Math.max(1,+c.page||1);
    const target = ids[p-1] || cardIdAt(curPage);
    c.card=target; c.blk=b.id; if(plc) c.plc=plc;
    delete c.page; return c; };
  (b.items||[]).forEach(it=>{
    COMP.items.push({ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content,
                      overrides:place(it.overrides) });
  });
  (((b.params||{}).frames)||[]).forEach(f=>frames().push(place(f)));
  (((b.params||{}).texts) ||[]).forEach(t=>texts().push(place(t)));
  syncPages();
  SEL=[];
  renderCurrent(); showKnobs(); markSel(); scheduleStrip();
  if(b.dropped) groupBanner(b.dropped+' card'+(b.dropped>1?'s are':' is')+
    ' no longer in your library, so '+(b.dropped>1?'they were':'it was')+' left out.');
}




// ── The filmstrip: a view of params.cards ───────────────────────────
// Every operation here is a list operation on params.cards — which is exactly
// why the card-list refactor came first. Nothing below renumbers anything.
let stripOpen=true;
function copyCardAt(n){
  const id=cardIdAt(n);
  pushUndo();
  const nid=newCardId();
  cards().splice(n,0,{id:nid});                       // the copy sits right after
  { const f=chapterOfCard(id); if(f){ const l=f.ch.cards||[]; l.splice(l.indexOf(id)+1,0,nid); } }
  joinPlacement(id, nid);
  const clone=o=>{ const c=JSON.parse(JSON.stringify(o)); c.card=nid; return c; };
  (COMP.items||[]).filter(it=>it.overrides&&it.overrides.card===id)
    .map(it=>({ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content, overrides:clone(it.overrides) }))
    .forEach(c=>COMP.items.push(c));
  frames().filter(f=>f.card===id).map(clone).forEach(c=>frames().push(c));
  texts().filter(t=>t.card===id).map(clone).forEach(c=>texts().push(c));
  enforceChapters();
  setPage(n+1);
}
function insertCardAt(n){            // new empty card AFTER page n
  pushUndo();
  const nid=newCardId();
  const f=chapterOf(n);
  cards().splice(n,0,{id:nid});
  if(f){ const list=f.ch.cards||[]; const at=list.indexOf(cardIdAt(n)); list.splice(at+1,0,nid); }
  joinPlacement(cardIdAt(n), nid);
  enforceChapters();
  setPage(n+1);
}
function moveCard(from,to){
  if(from===to) return;
  const arr=cards();
  const movingId=cardIdAt(from), targetId=cardIdAt(to);
  const fromCh=chapterOfCard(movingId), toCh=chapterOfCard(targetId);
  pushUndo();
  if(fromCh){
    // The whole chapter travels together — you cannot pull one page out by dragging.
    const ids=(fromCh.ch.cards||[]).slice();
    const block=ids.map(id=>arr.find(c=>c.id===id)).filter(Boolean);
    const before=arr.filter(c=>ids.indexOf(c.id)<0);
    let at=before.findIndex(c=>c.id===targetId);
    if(at<0) at=before.length; else if(to>from) at+=1;
    before.splice(at,0,...block);
    COMP.params.cards=before;
  }else{
    const [m]=arr.splice(from-1,1);
    arr.splice(to-1,0,m);
    // Dropped onto a page that belongs to a chapter? Then it joins that chapter.
    if(toCh){ const l=toCh.ch.cards||[]; const at=l.indexOf(targetId);
      l.splice(to>from?at+1:at,0,movingId); }
  }
  enforceChapters();
  setPage(Math.max(1,Math.min(pageCount(),to)));
}
function renderStrip(){
  const host=document.getElementById('stripInner');
  if(!host||!COMP) return;
  const P=paperOf((COMP.params&&COMP.params.paper)||'a4');
  const natW=P.w*MMPX, natH=P.h*MMPX;

  const N=pageCount();

  for(let n=1;n<=N;n++){
    const rl=ruleOf(n);
    const cp=chapterPos(n);
    const pl=placementOf(n);
    html+='<div class="sthumb'+(n===curPage?' cur':'')+(cp?' chIn':'')+'" data-n="'+n+'" draggable="true" title="Page '+n+
      (cp?' — '+esc(cp.ch.name||'chapter')+' '+cp.i+'/'+cp.n+', moves with its chapter':' — click to edit, drag to move')+'">'+
      (cp&&cp.i===1?'<span class="schap" data-chap="'+n+'" title="Chapter settings">'+esc(cp.ch.name||'chapter')+'</span>'
        : (pl?'<span class="schap" data-chap="'+n+'" title="From your library — v'+(+pl.p.version||1)+'">⬒ '+esc(pl.p.name||'card')+'</span>':''))+
      (rl?'<span class="srule" data-rule="'+n+'" title="This card follows the group ‘'+esc(rl.name||'')+'’ — click for its settings">↻ '+esc(rl.name||'group')+'</span>':'')+
      '<div class="sprev" style="width:'+TW+'px;height:'+TH+'px;">'+
        '<div class="sscale" style="width:'+natW+'px;height:'+natH+'px;transform:scale('+k+');">'+pageHtml(n)+'</div>'+
      '</div>'+
      '<div class="sact"><div class="sactin">'+
        '<button data-ins="'+n+'" title="Insert an empty card after this one">＋</button>'+
        '<button data-cpy="'+n+'" title="Duplicate this card">⧉</button>'+
        '<button data-savecard="'+n+'" title="Save this card to reuse in other prints">⬒</button>'+
        (chapterOf(n)?'':'<button data-chnew="'+n+'" title="Start a chapter with this card">⊞</button>')+
        (N>1?'<button class="danger" data-del="'+n+'" title="Delete this card">✕</button>':'')+
      '</div></div>'+
      '<div class="snum" title="'+esc(cp?(cp.ch.name||'chapter')+' '+cp.i+'/'+cp.n:(pl?pl.p.name||'':'Page '+n))+'">'+
        (cp ? esc(cp.ch.name||'chapter')+' '+cp.i+'/'+cp.n
            : pl ? esc(pl.p.name||'card')
            : n)+'</div></div>';
  }
  html+='<div id="stripEnd" title="Drop a saved card here to add it as a new page at the end"'+
        ' style="width:'+TW+'px;height:'+TH+'px;">+</div>';
  host.innerHTML=html;
  const endz=document.getElementById('stripEnd');
  if(endz){
    endz.ondragover=e=>{
      if(![...(e.dataTransfer.types||[])].includes('text/ts-block')) return;
      e.preventDefault(); e.stopPropagation(); endz.classList.add('over');
    };
    endz.ondragleave=()=>endz.classList.remove('over');
    endz.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); endz.classList.remove('over');
      const id=e.dataTransfer.getData('text/ts-block'); if(!id) return;
      setPage(pageCount());                 // append after the last card
      await dropSavedCard(id,'new');
    };
  }
  let dragFrom=null;
  host.querySelectorAll('.sthumb').forEach(el=>{
    const n=+el.dataset.n;
    el.onclick=e=>{ if(e.target.closest('.sact')) return; setPage(n); };
    el.ondragstart=e=>{ dragFrom=n; e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain','card'); }catch(err){} };
    // A small page accepts three things: another card (reorder), and content or a
    // whole group dragged out of the Content panel — dropped straight onto THAT page.
    el.ondragover=e=>{
      const t=[...(e.dataTransfer.types||[])];
      if(dragFrom==null && !t.includes('text/ts-card') && !t.includes('text/ts-group')
         && !t.includes('text/ts-block')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect=dragFrom==null?'copy':'move';
      el.classList.add('dragover');
    };
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); el.classList.remove('dragover');
      if(dragFrom!=null){ if(dragFrom!==n) moveCard(dragFrom,n); dragFrom=null; return; }
      const grp=e.dataTransfer.getData('text/ts-group');
      const one=e.dataTransfer.getData('text/ts-card');
      const blk=e.dataTransfer.getData('text/ts-block');
      if(!grp&&!one&&!blk) return;
      if(n!==curPage) setPage(n);            // work on the page you dropped onto
      if(blk){ await dropSavedCard(blk,'here'); }
      else if(grp){ let d; try{ d=JSON.parse(grp); }catch(err){ return; }
               if(d&&d.section) await dropGroup(d); }
      else   { let d; try{ d=JSON.parse(one); }catch(err){ return; }
               await placeCardRef(d, null, null); }
    };
    el.ondragend=()=>{ dragFrom=null; host.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover')); };
  });
  host.querySelectorAll('[data-ins]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); insertCardAt(+b.dataset.ins); });
  host.querySelectorAll('[data-cpy]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); copyCardAt(+b.dataset.cpy); });
  host.querySelectorAll('[data-savecard]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); saveCardAsBlock(+b.dataset.savecard); });
  host.querySelectorAll('[data-rule]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    setPage(+b.dataset.rule); showKnobs(); });
  host.querySelectorAll('[data-chnew]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); createChapter(+b.dataset.chnew); });
  host.querySelectorAll('[data-chap]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setPage(+b.dataset.chap); showKnobs(); });
  host.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const n=+b.dataset.del; if(n!==curPage) setPage(n); deletePage(); });
  const cur=host.querySelector('.sthumb.cur');
  if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
// The strip renders every page, so it is NOT redrawn on each drag: pushUndo()

// ── Content panel ───────────────────────────────────────────────────
// Filters on top (the same tree geometry as the studio sidebar, via the shared
// filter-tree.css), content below. SECTIONED by group: a person in three groups
// appears under all three, because that is how you look for them.
//
// Filtering and paging happen on the SERVER — the panel never buffers the whole
// database. One group can hold a hundred people.
const RES={
  loaded:false, groups:[], counts:{}, sections:[],
  on:{},                          // 'g:5' -> true   which groups are ticked
  // Nothing is on at the start: you normally want one group, not everything.
  // The attribute filters begin fully on, which means "no restriction".
  ungrouped:false, timeline:false, archive:false, cards:false,
  cardList:[], cardsDirty:true,
  living:true, deceased:true, people:true, pets:true,
  y1:String(new Date().getFullYear()), y2:String(new Date().getFullYear()+1),
  q:'', size:13.5, busy:false, seq:0
};
const RSIZES={S:9.5, M:13.5, L:19};

function resQuery(extra){
  const p=new URLSearchParams();
  p.set('groups', Object.keys(RES.on).filter(k=>RES.on[k]).map(k=>k.slice(2)).join(','));
  p.set('ungrouped',RES.ungrouped?'1':'0');
  p.set('timeline', RES.timeline?'1':'0');
  p.set('archive',  RES.archive?'1':'0');
  p.set('living',   RES.living?'1':'0');
  p.set('deceased', RES.deceased?'1':'0');
  p.set('people',   RES.people?'1':'0');
  p.set('pets',     RES.pets?'1':'0');
  if(RES.y1) p.set('y1',RES.y1);
  if(RES.y2) p.set('y2',RES.y2);
  if(RES.q)  p.set('q',RES.q);
  Object.keys(extra||{}).forEach(k=>p.set(k,extra[k]));
  return p.toString();
}
