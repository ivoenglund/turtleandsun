<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brochure — Turtle &amp; Sun</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&family=Oswald:wght@400;600&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Roboto+Slab:wght@400;700&family=Dancing+Script:wght@600&family=Pacifico&family=Abril+Fatface&display=swap');
  :root{ --ink:#23291d; --green:#1f4a45; --gold:#c9a24b; --cream:#f7f3e8; --muted:#7a8470; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; color:var(--ink); background:#e8e4d8; overflow:hidden; }
  /* Page width/height/padding are injected per paper size by applyPaper(). */
  .page{ width:210mm; min-height:296mm; margin:0 auto 14px; background:#fff; position:relative; overflow:visible;
         box-shadow:0 2px 14px rgba(0,0,0,.18); padding:16mm; display:flex; flex-direction:column; }
  /* Objects parked outside the page stay visible but grey — fetch them back
     any time. (Print clips to the page, so parked objects never print.) */
  .offpage{ opacity:.35; filter:grayscale(.8); }
  .marquee{ position:fixed; border:1.5px dashed var(--gold); background:rgba(201,162,75,.12);
            z-index:50; pointer-events:none; }
  /* ── Objects ──────────────────────────────────────────────────────
     Every picture and every text is its OWN object on the page: freely
     draggable, resizable, rotatable, borderable. All typography is em so
     the wrapper's font-size zooms the whole object. */
  /* --ui (set per zoom) keeps selection outlines and handles the SAME SCREEN
     SIZE at any zoom — on an A0 at fit-zoom they used to shrink to nothing. */
  .abswrap{ cursor:grab; }
  .abswrap.sel{ outline:calc(3px*var(--ui,1)) dashed var(--gold); outline-offset:calc(3px*var(--ui,1)); }
  .block{ margin:0; }
  .block h3{ font-family:Georgia,serif; color:var(--green); font-size:1.56em; margin:0 0 .35em; }
  .block .meta{ font-size:.85em; color:var(--muted); margin-bottom:.65em; }
  .block p{ margin:0 0 .73em; font-size:1em; line-height:1.45; }
  .block.txt-s p{ font-size:.85em; } .block.txt-l p{ font-size:1.2em; line-height:1.5; }
  .block.txt-l h3{ font-size:1.85em; }
  .block img{ width:100%; height:auto; border-radius:.55em; display:block; margin:0; }
  .block.media{ text-align:center; }
  .block.media img{ object-fit:contain; }
  .block.media .cap{ font-size:.89em; color:#5c5c4d; margin-top:.5em; }
  .imgo.cropped{ border-radius:.55em; }
  .sqc img, .imgo.sqc, .imgo.cropped.sqc{ border-radius:0!important; }
  .block.ffo h3, .block.ffo p, .block.ffo .meta, .block.ffo .cap{ font-family:inherit; }
  .block.tco h3, .block.tco p, .block.tco .meta, .block.tco .cap, .block.tco b,
  .block.tco .role, .block.tco .ct{ color:inherit; }
  .block.font-serif h3,.block.font-serif p{ font-family:Georgia,'Times New Roman',serif; }
  .block.font-hand h3,.block.font-hand p{ font-family:'Caveat',cursive; font-size:1.35em; }
  .block .bd[contenteditable="true"]{ outline:calc(2px*var(--ui,1)) solid #7FB36F; outline-offset:calc(2px*var(--ui,1)); border-radius:2mm; cursor:text; }
  .person{ text-align:center; }
  .person img{ max-width:100%; width:auto; border-radius:.55em; display:block; margin:0 auto .55em; }
  .person .init{ width:8.4em; height:10em; border-radius:.55em; background:var(--cream); color:var(--green);
                 display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:1.63em; margin:0 auto .35em; }
  .person b{ font-size:1em; display:block; }
  .person .role{ font-size:.81em; color:var(--green); font-weight:700; }
  .person .ct{ font-size:.78em; color:var(--muted); line-height:1.4; }
  /* A frame = its own object: a border you can drag, resize, restyle. */
  .frameobj{ cursor:grab; border-radius:6px; }
  .frameobj.sel{ outline:calc(3px*var(--ui,1)) dashed var(--gold); outline-offset:calc(3px*var(--ui,1)); }
  .rszh{ position:absolute; right:calc(-9px*var(--ui,1)); bottom:calc(-9px*var(--ui,1));
         width:calc(17px*var(--ui,1)); height:calc(17px*var(--ui,1)); border-radius:50%;
         background:var(--gold); border:calc(2px*var(--ui,1)) solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4);
         cursor:nwse-resize; z-index:6; touch-action:none; }
  /* Crop mode: four edge handles — drag any edge to shape the window, drag
     inside the picture to choose what shows. */
  .abswrap.cropping{ outline-color:#7FB36F; }
  .abswrap.cropping img{ cursor:move; }
  .crE{ position:absolute; background:var(--gold); border:calc(2px*var(--ui,1)) solid #fff;
        box-shadow:0 1px 5px rgba(0,0,0,.4); z-index:6; touch-action:none; }
  .crE[data-edge="l"],.crE[data-edge="r"]{ top:50%; width:calc(11px*var(--ui,1)); height:calc(30px*var(--ui,1));
        margin-top:calc(-15px*var(--ui,1)); border-radius:calc(6px*var(--ui,1)); cursor:ew-resize; }
  .crE[data-edge="l"]{ left:calc(-6px*var(--ui,1)); } .crE[data-edge="r"]{ right:calc(-6px*var(--ui,1)); }
  .crE[data-edge="t"],.crE[data-edge="b"]{ left:50%; height:calc(11px*var(--ui,1)); width:calc(30px*var(--ui,1));
        margin-left:calc(-15px*var(--ui,1)); border-radius:calc(6px*var(--ui,1)); cursor:ns-resize; }
  .crE[data-edge="t"]{ top:calc(-6px*var(--ui,1)); } .crE[data-edge="b"]{ bottom:calc(-6px*var(--ui,1)); }
  /* ── Panel ────────────────────────────────────────────────────────── */
  #panel{ position:fixed; right:16px; top:16px; width:258px; max-height:calc(100vh - 32px); overflow:auto;
          background:#fff; border:2px solid var(--gold); border-radius:14px; padding:10px 12px;
          box-shadow:0 4px 18px rgba(0,0,0,.2); z-index:10; font-size:13px; }
  #panel .prow, #panel .krow{ display:flex; gap:5px; align-items:center; margin-bottom:5px; }
  #panel .prow > button{ flex:1; }
  #panel .ph, #panel .kh{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
                          color:var(--green); margin:8px 0 3px; }
  #panel .ph:first-child, #panel .kh:first-child{ margin-top:0; }
  #panel button{ font-family:inherit; font-weight:700; font-size:12.5px; padding:5px 8px; border:1px solid #d9d4c4;
                 border-radius:8px; background:#fff; cursor:pointer; color:var(--ink); line-height:1.2; }
  #panel button:hover{ background:#f4efe4; }
  #panel button:disabled{ opacity:.35; cursor:default; }
  #panel button.primary{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.primary:hover{ background:#17403b; }
  #panel button.on{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.danger{ color:#8c2f1b; border-color:#dcc0b5; font-size:11px; padding:3px 8px; }
  #panel button.danger:hover{ background:#f9ece7; }
  #panel select{ width:100%; font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px;
                 border:1px solid #d9d4c4; background:#fff; color:var(--ink); margin-bottom:3px; }
  #panel select:disabled, #panel button:disabled, #panel input:disabled{ opacity:.35; }
  #panel input[type=range]{ width:100%; margin:1px 0 3px; accent-color:var(--gold); }
  #panel input[type=number]{ font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px; border:1px solid #d9d4c4; }
  #zoomWrap input[type=range]{ flex:1; min-width:0; width:auto; margin:0; }
  #pgLabel{ flex:1; text-align:center; font-weight:700; }
  #knobs{ margin-top:8px; padding-top:8px; border-top:2px solid #efe9d8; }
  #knobs .row{ display:flex; gap:4px; flex-wrap:wrap; }
  #knobs .hint{ font-size:12px; color:var(--muted); line-height:1.45; }
  #knobs .sw{ width:21px; height:21px; border-radius:6px; padding:0; border:1px solid rgba(0,0,0,.18); cursor:pointer; }
  #knobs input[type=color]{ width:34px; height:26px; padding:0 2px; border:1px solid #d9d4c4; border-radius:6px; background:#fff; cursor:pointer; }
  /* The canvas floats free: translate+scale, no anchors, no scrollbars. Fit brings it home. */
  #out{ position:absolute; left:0; top:0; transform-origin:0 0; }
  #zoomWrap button, #pageNav button{ font-family:inherit; font-weight:700; padding:4px 8px; border:1px solid #c9c4b4; border-radius:7px; background:#fff; cursor:pointer; }
  #zoomWrap button:hover, #pageNav button:hover{ background:#f4efe4; }
  #pageNav button:disabled{ opacity:.4; cursor:default; }
  #out .page{ cursor:grab; }
  .err{ text-align:center; padding:60px; color:var(--muted); }
  @media print{
    #panel{ display:none!important; } .rszh,.crE{ display:none!important; }
    [contenteditable]{ outline:none!important; }
    .abswrap.sel,.frameobj.sel{ outline:none!important; }
    body{ background:#fff; overflow:visible!important; height:auto!important; }
    #out{ position:static!important; transform:none!important; width:auto!important; height:auto!important; margin:0!important; overflow:visible!important; }
    .page{ box-shadow:none; margin:0; page-break-after:always; height:auto; min-height:296mm; overflow:hidden!important; }
    body.fmt-poster .page{ height:1000mm; }
    #out .page{ cursor:auto; }
  }
</style>
</head>
<body>

<aside id="panel">
  <div id="docCtl">
    <div class="prow">
      <button onclick="window.print()" title="Print / save as PDF">🖨 PDF</button>
      <button id="saveBtn" class="primary">Save</button>
      <button id="undoBtn" title="Undo (Ctrl+Z)" style="flex:0 0 auto;">↶</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" style="flex:0 0 auto;">↷</button>
    </div>
    <div class="ph">Paper</div>
    <select id="paper"></select>
    <div class="ph">Zoom · <span id="zoomPct">100%</span></div>
    <div id="zoomWrap" class="prow">
      <button id="zoomOut" title="Zoom out ( - )">−</button>
      <input type="range" id="zoom" min="5" max="200" value="18">
      <button id="zoomIn" title="Zoom in ( + )">＋</button>
      <button id="zoomFit" title="Fit to window ( 0 )">Fit</button>
    </div>
    <div class="ph">Page</div>
    <div id="pageNav" class="prow">
      <button id="pgPrev" title="Previous page">◀</button>
      <span id="pgLabel">1 / 1</span>
      <button id="pgNext" title="Next page">▶</button>
      <button id="pgAdd" title="Add a page">＋</button>
      <button id="pgDel" title="Delete this page">🗑</button>
    </div>
    <div class="prow"><button id="addTextBtn" title="Add a free text object to this page">＋ Text</button></div>
  </div>
  <div id="knobs"></div>
</aside>
<div id="out"><div class="err">Loading…</div></div>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compId = new URLSearchParams(location.search).get('comp');

// Limited rich text: only harmless formatting survives (text is content; scripts
// are not). DOM-based: parse into an inert template, drop dangerous elements,
// unwrap unknown tags, and keep only whitelisted style properties on the rest.
const STYLE_OK=['font-family','font-size','color','font-weight','font-style','text-decoration'];
function cleanStyle(s){
  return String(s||'').split(';').map(d=>{
    const i=d.indexOf(':'); if(i<0) return '';
    const p=d.slice(0,i).trim().toLowerCase(), v=d.slice(i+1).trim();
    if(!STYLE_OK.includes(p)) return '';
    if(/url\s*\(|expression|javascript|@import|[<>]/i.test(v)) return '';
    return p+':'+v;
  }).filter(Boolean).join(';');
}
function sanitizeHtml(s){
  const t=document.createElement('template');
  t.innerHTML=String(s||'');
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,svg,img,video,audio,form,input,button,textarea,select').forEach(e=>e.remove());
  const OK=['H3','P','B','STRONG','U','I','EM','BR','DIV','SPAN'];
  (function walk(node){
    [...node.children].forEach(el=>{
      walk(el);
      if(!OK.includes(el.tagName)){          // unknown (font, a, …) → unwrap, keep content
        while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
        el.remove(); return;
      }
      [...el.attributes].forEach(a=>{ if(a.name.toLowerCase()!=='style') el.removeAttribute(a.name); });
      const cs=cleanStyle(el.getAttribute('style'));
      if(cs) el.setAttribute('style',cs); else el.removeAttribute('style');
    });
  })(t.content);
  return t.innerHTML;
}

// ── Object renderers ───────────────────────────────────────────────
// A post decomposes into SEPARATE objects: one text object + one object per
// photo (part: 'txt' | 'img0','img1',…). They never move together — every
// piece is dragged, sized, angled and bordered on its own.
const BORDER_STYLES=['solid','dashed','dotted','double'];
function borderCss(ov,emScaled){
  const bw=+ov.bw||0; if(!bw) return '';
  const bs=BORDER_STYLES.includes(ov.bs)?ov.bs:'solid';
  const w=emScaled?(bw/13.5)+'em':bw+'px';
  return 'border:'+w+' '+bs+' '+esc(ov.bc||'#23291d')+';padding:.4em;';
}
function postBlock(it){
  const c=it.content||{}, ov=it.overrides||{};
  const part=ov.part||'txt';
  if(part.slice(0,3)==='img'){
    const ph=(c.photos||[])[+part.slice(3)||0];
    // Crop = a WINDOW (height phr, overflow hidden) over the picture, which
    // keeps its own size (pwr) and offset (ixr/iyr) — all ratios of the
    // window width, so paper changes and resizing leave the crop intact.
    let bs='', ist='';
    if(+ov.pwr){
      const cr=cropEms(ov);
      bs=' style="position:relative;overflow:hidden;height:'+r4(cr.ph)+'em;"';
      ist=' style="position:absolute;width:'+r4(cr.pw)+'em;max-width:none;left:'+r4(cr.ix)+'em;top:'+r4(cr.iy)+'em;border-radius:0;"';
    }else if(+ov.ph){   // ancient cover-crop: still renders; converts on crop entry
      ist=' style="height:'+(+ov.ph)+'em;object-fit:cover;object-position:'+
        (ov.px!=null?+ov.px:50)+'% '+(ov.py!=null?+ov.py:50)+'%;"';
    }
    const icls='block imgo'+(+ov.pwr?' cropped':'')+(ov.sq?' sqc':'');
    return '<div class="'+icls+'"'+bs+' data-idx="'+it._idx+'">'+
      (ph?'<img src="'+esc(ph)+'"'+ist+'>':'<div class="hint">picture missing</div>')+'</div>';
  }
  const cls=['block','txtobj', ov.txt?'txt-'+ov.txt:'', ov.font?'font-'+ov.font:'',
             ov.ff?'ffo':'', ov.tc?'tco':''].filter(Boolean).join(' ');
  const ffs=ov.ff?' style="font-family:\''+esc(ov.ff)+'\'"':'';
  let inner;
  if(ov.text){ inner='<div class="bd">'+sanitizeHtml(ov.text)+'</div>'; }
  else{
    const paras=String(c.body||'').split(/\n\n+/).filter(Boolean).slice(0,12)
      .map(p=>'<p>'+esc(p)+'</p>').join('');
    inner='<div class="bd">'+(c.title?'<h3>'+esc(c.title)+'</h3>':'')+
      (c.author&&!ov.nodate?'<div class="meta">'+esc(c.author)+'</div>':'')+paras+'</div>';
  }
  return '<div class="'+cls+'"'+ffs+' data-idx="'+it._idx+'">'+inner+'</div>';
}
function personCard(it){
  const c=it.content, ov=it.overrides||{};
  const init=(c.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return '<div class="person block'+(ov.tc?' tco':'')+'" data-idx="'+it._idx+'">'+
    (c.photo_url?'<img src="'+esc(c.photo_url)+'">':'<div class="init">'+esc(init)+'</div>')+
    '<b>'+esc(c.name||'')+'</b>'+
    (c.job_title?'<div class="role">'+esc(c.job_title)+'</div>':'')+
    '<div class="ct">'+[c.email,c.phone].filter(Boolean).map(esc).join('<br>')+'</div></div>';
}
// Media card = an SVG (logo/graphic). Rendered via <img> so no script runs.
function mediaBlock(it){
  const c=it.content||{}, ov=it.overrides||{};
  const showCap = ov.caption && c.title;
  return '<div class="block media'+(ov.tc?' tco':'')+(ov.sq?' sqc':'')+'" data-idx="'+it._idx+'">'+
    (c.url?'<img src="'+esc(c.url)+'">':'')+
    (showCap?'<div class="cap">'+esc(c.title)+'</div>':'')+'</div>';
}

let COMP=null;
let curPage=1;
function render(){ renderCurrent(); }
function frames(){ COMP.params=COMP.params||{}; return COMP.params.frames=COMP.params.frames||[]; }
function texts(){ COMP.params=COMP.params||{}; return COMP.params.texts=COMP.params.texts||[]; }
// Explode posts into separate objects (text + each photo) the first time a
// document opens under the object model; everything else just gets a place.
function normalizeItems(){
  COMP.params=COMP.params||{};
  frames(); texts();
  const out=[]; let n=0;
  const seed=()=>{ const s={x:8+(n%3)*30, y:6+Math.floor(n/3)*24}; n++; return s; };
  (COMP.items||[]).forEach(it=>{
    const ov=it.overrides=it.overrides||{};
    if(+ov.pw&&!+ov.pwr){   // absolute-em window crop (one deploy old) → ratios
      const P=paperOf((COMP.params&&COMP.params.paper)||'a4');
      const Wem=P.w*MMPX*((+ov.w||28)/100)/fsOf(ov);
      ov.pwr=r4(+ov.pw/Wem); ov.phr=r4((+ov.ph||10)/Wem);
      ov.ixr=r4((+ov.ix||0)/Wem); ov.iyr=r4((+ov.iy||0)/Wem);
      delete ov.pw; delete ov.ph;
    }
    delete ov.ix; delete ov.iy; delete ov.tx; delete ov.ty;   // pre-object-model leftovers
    if(it.ref_type==='post'&&!ov.part){
      const photos=(it.content&&it.content.photos)||[];
      const s=(ov.x==null)?seed():{x:+ov.x,y:+ov.y};
      const page=ov.page==null?1:+ov.page, w=+ov.w||28;
      out.push({ ...it, overrides:Object.assign({},ov,{part:'txt',page,x:s.x,y:s.y,w}) });
      photos.forEach((p,i)=> out.push({ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content,
        overrides:{ part:'img'+i, page, x:Math.min(88,s.x+3+i*4), y:Math.min(92,s.y+3+i*4), w } }));
    } else {
      if(ov.page==null){ const s=seed(); ov.page=1; if(ov.x==null) ov.x=s.x; if(ov.y==null) ov.y=s.y; if(ov.w==null) ov.w=28; }
      out.push(it);
    }
  });
  COMP.items=out;
}

async function load(){
  if(!compId){ document.getElementById('out').innerHTML='<div class="err">No composition given (?comp=ID).</div>'; return; }
  const r=await fetch('/api/compositions/'+compId);
  if(!r.ok){ document.getElementById('out').innerHTML='<div class="err">Could not load the brochure.</div>'; return; }
  COMP=await r.json();
  document.title=COMP.name+' · Turtle & Sun';
  normalizeItems();
  buildPaperOptions();
  const paper=(COMP.params&&COMP.params.paper)||'a4';
  document.getElementById('paper').value=paperOf(paper).k;
  applyPaper(paper);
  render();
  syncZoom();
  showKnobs();
}

// ── Paper sizes ─────────────────────────────────────────────────────
const PAPERS=[
  {k:'a0',n:'A0',w:841,h:1189,u:'cm'},
  {k:'a1',n:'A1',w:594,h:841,u:'cm'},
  {k:'a2',n:'A2',w:420,h:594,u:'cm'},
  {k:'a3',n:'A3',w:297,h:420,u:'cm'},
  {k:'a4',n:'A4',w:210,h:297,u:'cm'},
  {k:'a5',n:'A5',w:148,h:210,u:'cm'},
  {k:'a6',n:'A6',w:105,h:148,u:'cm'},
  {k:'letter', n:'US Letter',  w:215.9,h:279.4,u:'in'},
  {k:'legal',  n:'US Legal',   w:215.9,h:355.6,u:'in'},
  {k:'tabloid',n:'US Tabloid', w:279.4,h:431.8,u:'in'},
  {k:'ansic',  n:'US ANSI C',  w:431.8,h:558.8,u:'in'},
  {k:'ansid',  n:'US ANSI D',  w:558.8,h:863.6,u:'in'},
  {k:'ansie',  n:'US ANSI E',  w:863.6,h:1117.6,u:'in'},
  {k:'poster', n:'Poster',     w:700,  h:1000,  u:'cm', canvas:true},
];
const paperArea=P=>P.w*P.h;
const num1=x=>String(Math.round(x*10)/10);
function paperLabel(P){
  return P.u==='in'
    ? P.n+' — '+num1(P.w/25.4)+' × '+num1(P.h/25.4)+' in'
    : P.n+' — '+num1(P.w/10)+' × '+num1(P.h/10)+' cm';
}
function paperOf(k){ return PAPERS.find(x=>x.k===k) || PAPERS.find(x=>x.k==='a4'); }
function buildPaperOptions(){
  const sel=document.getElementById('paper');
  sel.innerHTML=PAPERS.slice().sort((a,b)=>paperArea(b)-paperArea(a))
    .map(P=>'<option value="'+P.k+'">'+paperLabel(P)+'</option>').join('');
}
function applyPaper(k){
  const P=paperOf(k);
  document.body.className = P.canvas ? 'fmt-poster' : 'fmt-doc';
  let st=document.getElementById('pageSize');
  if(!st){ st=document.createElement('style'); st.id='pageSize'; document.head.appendChild(st); }
  let css='@page{ size:'+P.w+'mm '+P.h+'mm; margin:0; }';
  if(P.canvas){
    css+=' .page{ width:'+P.w+'mm; height:'+P.h+'mm; min-height:0; padding:0; }';
  }else{
    const pad=Math.max(8, Math.round(P.w*0.06));
    css+=' .page{ width:'+P.w+'mm; min-height:'+P.h+'mm; height:auto; padding:'+pad+'mm; }';
  }
  st.textContent=css;
}

// ── Zoom + free pan ─────────────────────────────────────────────────
const ZMIN=5, ZMAX=200;
let curScale=1;
function clampPct(p){ return Math.max(ZMIN, Math.min(ZMAX, p)); }
function contentNat(){
  const out=document.getElementById('out');
  let w=0,h=0;
  out.querySelectorAll('.page').forEach(p=>{ w=Math.max(w,p.offsetWidth); h=Math.max(h,p.offsetTop+p.offsetHeight); });
  return { w, h };
}
let panX=20, panY=16;
function setView(){
  const out=document.getElementById('out');
  out.style.transform='translate('+panX+'px,'+panY+'px) scale('+curScale+')';
  out.style.setProperty('--ui', String(1/curScale));   // constant-screen-size handles/outlines
}
function applyZoom(pct){ pct=clampPct(pct); curScale=pct/100; setView(); syncZoomLabel(pct); }
function syncZoomLabel(pct){
  const zi=document.getElementById('zoom'); if(zi) zi.value=Math.round(pct);
  const zp=document.getElementById('zoomPct'); if(zp) zp.textContent=Math.round(pct)+'%';
}
function fitPct(){
  const {w}=contentNat();
  if(!w) return 100;
  return clampPct(Math.min(100, (window.innerWidth-306)/w*100));
}
function syncZoom(){
  const {w}=contentNat();
  const pct=fitPct();
  curScale=pct/100;
  panX=Math.max(14, ((window.innerWidth-292)-w*curScale)/2);
  panY=16;
  setView(); syncZoomLabel(pct);
}
function zoomToPct(pct, cx, cy){
  pct=clampPct(pct);
  if(cx==null){ cx=(window.innerWidth-292)/2; cy=window.innerHeight/2; }
  const s0=curScale;
  const px=(cx-panX)/s0, py=(cy-panY)/s0;
  curScale=pct/100;
  panX=cx-px*curScale; panY=cy-py*curScale;
  setView(); syncZoomLabel(pct);
}
function zoomStep(factor, cx, cy){ zoomToPct(curScale*100*factor, cx, cy); }

// ── Page model ──────────────────────────────────────────────────────
function itemsAll(){ return (COMP.items||[]).map((it,i)=>({ ...it, _idx:i })); }
function pageCount(){
  let n=(COMP.params&&+COMP.params.pages)||1;
  itemsAll().forEach(it=>{ const p=it.overrides&&+it.overrides.page; if(p>n) n=p; });
  frames().forEach(f=>{ if(+f.page>n) n=+f.page; });
  texts().forEach(t=>{ if(+t.page>n) n=+t.page; });
  return Math.max(1,n);
}
function cardInner(it){
  return it.ref_type==='contact' ? personCard(it)
       : it.ref_type==='media'   ? mediaBlock(it)
       : postBlock(it);
}
// An object's font-size follows its width (true zoom), times a text-zoom knob.
function fsOf(ov){
  const w=(ov&&ov.w!=null)?+ov.w:28, ts=(ov&&ov.ts)?+ov.ts:1;
  return Math.max(4, Math.min(120, 13.5*(w/28)*ts));
}
// Crop geometry is stored as RATIOS of the window width (pwr/phr/ixr/iyr), so
// it survives paper-size changes and object resizing untouched. cropEms turns
// them into em values for the CURRENT paper.
const MMPX=96/25.4;
const r4=v=>Math.round(v*10000)/10000;
function cropEms(ov){
  const P=paperOf((COMP&&COMP.params&&COMP.params.paper)||'a4');
  const fs=fsOf(ov);
  const Wem=P.w*MMPX*((+ov.w||28)/100)/fs;
  return { Wem, pw:(+ov.pwr||1)*Wem, ph:(+ov.phr||0.6)*Wem, ix:(+ov.ixr||0)*Wem, iy:(+ov.iyr||0)*Wem };
}
function absWrap(it){
  const ov=it.overrides||{};
  const x=ov.x!=null?+ov.x:10, y=ov.y!=null?+ov.y:10, w=+ov.w||28;
  const st='position:absolute;left:'+x+'%;top:'+y+'%;width:'+w+'%;font-size:'+fsOf(ov)+'px;z-index:'+(+ov.z||0)+';'
    +(+ov.r?'transform:rotate('+(+ov.r)+'deg);':'')
    +borderCss(ov,true)
    +(ov.tc?'color:'+esc(ov.tc)+';':'');
  return '<div class="abswrap" style="'+st+'" data-absidx="'+it._idx+'">'+cardInner(it)+'</div>';
}
function frameDiv(f,i){
  const bs=BORDER_STYLES.includes(f.bs)?f.bs:'solid';
  return '<div class="frameobj" data-frame="'+i+'" style="position:absolute;'+
    'left:'+(+f.x||0)+'%;top:'+(+f.y||0)+'%;width:'+(+f.w||20)+'%;height:'+(+f.h||20)+'%;'+
    'z-index:'+(+f.z||0)+';border:'+(+f.bw||2)+'px '+bs+' '+esc(f.bc||'#c9a24b')+';'+
    (+f.r?'transform:rotate('+(+f.r)+'deg);':'')+'"></div>';
}
// A free text object — lives in params (like frames), needs no card behind it.
function txtFreeDiv(t,i){
  const st='position:absolute;left:'+(+t.x||0)+'%;top:'+(+t.y||0)+'%;width:'+(+t.w||30)+'%;font-size:'+fsOf(t)+'px;z-index:'+(+t.z||0)+';'
    +(+t.r?'transform:rotate('+(+t.r)+'deg);':'')
    +borderCss(t,true)
    +(t.tc?'color:'+esc(t.tc)+';':'');
  const cls='block txtobj'+(t.ff?' ffo':'')+(t.tc?' tco':'');
  const ffs=t.ff?' style="font-family:\''+esc(t.ff)+'\'"':'';
  return '<div class="abswrap txtfree" style="'+st+'" data-text="'+i+'">'+
    '<div class="'+cls+'"'+ffs+'><div class="bd">'+sanitizeHtml(t.text||'')+'</div></div></div>';
}
function pageHtml(n){
  const on=itemsAll().filter(it=>(it.overrides&&+it.overrides.page)===n);
  const fr=frames().map((f,i)=>({f,i})).filter(x=>(+x.f.page||1)===n);
  const tx=texts().map((t,i)=>({t,i})).filter(x=>(+x.t.page||1)===n);
  return '<div class="page" data-page="'+n+'" style="position:relative;">'+
    on.map(absWrap).join('')+tx.map(x=>txtFreeDiv(x.t,x.i)).join('')+fr.map(x=>frameDiv(x.f,x.i)).join('')+'</div>';
}
function renderCurrent(){
  const N=pageCount();
  curPage=Math.max(1,Math.min(N,curPage));
  document.getElementById('out').innerHTML=pageHtml(curPage);
  wireDrag(); wirePan();
  updatePageNav(); markSel();
  updateOffpage(); setTimeout(updateOffpage,250);   // again once images have height
}
// Grey out anything ENTIRELY outside the page (parked). Partly-off objects
// stay full colour — bleeding off the edge is design, and print clips it.
function updateOffpage(){
  const page=document.querySelector('#out .page'); if(!page) return;
  const pr=page.getBoundingClientRect();
  document.querySelectorAll('#out .abswrap, #out .frameobj').forEach(el=>{
    const r=el.getBoundingClientRect();
    el.classList.toggle('offpage', r.right<pr.left||r.left>pr.right||r.bottom<pr.top||r.top>pr.bottom);
  });
}
function renderAllPages(){
  const N=pageCount(); let html='';
  for(let n=1;n<=N;n++) html+=pageHtml(n);
  document.getElementById('out').innerHTML=html;
}

// ── Selection: any number of objects; last picked = primary ─────────
let SEL=[];
function primary(){ return SEL.length?SEL[SEL.length-1]:null; }
function primItem(){ const p=primary(); return (p&&p[0]==='i')?+p.slice(1):null; }
function primFrame(){ const p=primary(); return (p&&p[0]==='f')?+p.slice(1):null; }
function primText(){ const p=primary(); return (p&&p[0]==='t')?+p.slice(1):null; }
function selItemIdxs(){ return SEL.filter(s=>s[0]==='i').map(s=>+s.slice(1)); }
function selFrameIdxs(){ return SEL.filter(s=>s[0]==='f').map(s=>+s.slice(1)); }
function selTextIdxs(){ return SEL.filter(s=>s[0]==='t').map(s=>+s.slice(1)); }
function setSel(key,additive){
  if(additive){ const i=SEL.indexOf(key); if(i>=0) SEL.splice(i,1); else SEL.push(key); }
  else SEL=[key];
  if(cropKey&&cropKey!==primary()) cropKey=null;
  showKnobs(); markSel();
}
function clearSel(){ cropKey=null; if(!SEL.length) return; SEL=[]; showKnobs(); markSel(); }
function elOf(key){
  return key[0]==='i' ? document.querySelector('.abswrap[data-absidx="'+key.slice(1)+'"]')
       : key[0]==='t' ? document.querySelector('.txtfree[data-text="'+key.slice(1)+'"]')
                      : document.querySelector('.frameobj[data-frame="'+key.slice(1)+'"]');
}
function ovOf(key){
  return key[0]==='i' ? (COMP.items[+key.slice(1)].overrides=COMP.items[+key.slice(1)].overrides||{})
       : key[0]==='t' ? texts()[+key.slice(1)]
                      : frames()[+key.slice(1)];
}

// ── Drag: every selected object moves together ──────────────────────
let dragMoved=false;
function dragSelFrom(e,w){
  const page=w.closest('.page'); if(!page) return;
  const pr=page.getBoundingClientRect();
  const pre=snap();
  const sx=e.clientX, sy=e.clientY;
  const start=SEL.map(key=>{ const o=ovOf(key); return {key, x:+o.x||0, y:+o.y||0}; });
  dragMoved=false;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/pr.width*100, dy=(ev.clientY-sy)/pr.height*100;
    if(Math.abs(dx)+Math.abs(dy)>0.1) dragMoved=true;
    start.forEach(s=>{
      const o=ovOf(s.key);
      o.x=Math.round(Math.max(-150,Math.min(240,s.x+dx))*10)/10;   // park freely off-page
      o.y=Math.round(Math.max(-150,Math.min(240,s.y+dy))*10)/10;
      const el=elOf(s.key); if(el){ el.style.left=o.x+'%'; el.style.top=o.y+'%'; }
    });
    updateOffpage();
  };
  const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(dragMoved) pushUndo(pre); };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
function keyOfEl(w){
  return w.dataset.absidx!=null ? 'i'+w.dataset.absidx
       : w.dataset.text!=null   ? 't'+w.dataset.text
       : 'f'+w.dataset.frame;
}
// What kind of object is behind a key?
function isTextKey(key){
  if(key[0]==='t') return true;
  if(key[0]!=='i') return false;
  const it=COMP.items[+key.slice(1)];
  return !!it&&it.ref_type==='post'&&((it.overrides||{}).part||'txt')==='txt';
}
function isPicKey(key){
  if(key[0]!=='i') return false;
  const it=COMP.items[+key.slice(1)];
  return !!it&&it.ref_type==='post'&&String((it.overrides||{}).part||'').slice(0,3)==='img';
}
function wireDrag(){
  document.querySelectorAll('.abswrap,.frameobj').forEach(w=>{
    w.onpointerdown=e=>{
      if(e.target.closest('.rszh,.crE')) return;
      if(e.target.closest('[contenteditable="true"]')) return;
      if(editing) commitEdit(false);        // click away = saved, never lost
      const key=keyOfEl(w);
      if(cropKey===key&&e.target.closest('img')) return cropDrag(e,w,key);
      w._wasSel=SEL.includes(key);
      if(e.shiftKey){ setSel(key,true); if(!SEL.includes(key)) return; }
      else if(!w._wasSel) setSel(key,false);
      dragSelFrom(e,w);
    };
  });
}
// Click an ALREADY-selected text object again (no drag) → edit right there.
document.getElementById('out').addEventListener('click',e=>{
  const w=e.target.closest('.abswrap'); if(!w) return;
  if(e.target.closest('[contenteditable="true"]')) return;
  let key=null, isText=false;
  if(w.dataset.absidx!=null){
    const idx=+w.dataset.absidx; key='i'+idx;
    const it=COMP.items[idx];
    isText=it&&it.ref_type==='post'&&((it.overrides||{}).part||'txt')==='txt';
  }else if(w.dataset.text!=null){ key='t'+w.dataset.text; isText=true; }
  if(key&&isText&&w._wasSel&&!dragMoved&&SEL.length===1&&SEL[0]===key) enterEdit(key,e.clientX,e.clientY);
});
// Empty space: drag on the PAGE draws a selection rectangle (everything it
// touches gets selected); drag on the grey outside pans the canvas.
// A plain click on either deselects.
let panWired=false;
function wirePan(){
  if(panWired) return; panWired=true;
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    if(e.target.closest('#panel')||e.target.closest('.abswrap')||e.target.closest('.frameobj')||e.target.closest('[contenteditable="true"]')) return;
    if(editing) commitEdit(false);
    if(e.target.closest('.page')){ startMarquee(e); return; }
    clearSel();
    const sx=e.clientX, sy=e.clientY, opx=panX, opy=panY;
    document.body.style.cursor='grabbing';
    const mv=ev=>{ panX=opx+(ev.clientX-sx); panY=opy+(ev.clientY-sy); setView(); };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); document.body.style.cursor=''; };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
    e.preventDefault();
  });
}
function startMarquee(e){
  const sx=e.clientX, sy=e.clientY;
  const additive=e.shiftKey;
  let box=null, moved=false;
  const mv=ev=>{
    moved=true;
    if(!box){ box=document.createElement('div'); box.className='marquee'; document.body.appendChild(box); }
    Object.assign(box.style,{
      left:Math.min(sx,ev.clientX)+'px', top:Math.min(sy,ev.clientY)+'px',
      width:Math.abs(ev.clientX-sx)+'px', height:Math.abs(ev.clientY-sy)+'px' });
  };
  const up=ev=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(box) box.remove();
    if(!moved){ clearSel(); return; }
    const x1=Math.min(sx,ev.clientX), y1=Math.min(sy,ev.clientY);
    const x2=Math.max(sx,ev.clientX), y2=Math.max(sy,ev.clientY);
    const hits=[];
    document.querySelectorAll('#out .abswrap, #out .frameobj').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.right>x1&&r.left<x2&&r.bottom>y1&&r.top<y2) hits.push(keyOfEl(el));
    });
    if(!additive) SEL=[];
    hits.forEach(h=>{ if(!SEL.includes(h)) SEL.push(h); });
    showKnobs(); markSel();
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.preventDefault();
}

// ── Page navigation ─────────────────────────────────────────────────
function updatePageNav(){
  const N=pageCount();
  const lab=document.getElementById('pgLabel'); if(lab) lab.textContent='Page '+curPage+' / '+N;
  const prev=document.getElementById('pgPrev'), next=document.getElementById('pgNext'), del=document.getElementById('pgDel');
  if(prev) prev.disabled=curPage<=1;
  if(next) next.disabled=curPage>=N;
  if(del)  del.disabled=N<=1;
}
function setPage(n){ curPage=n; SEL=[]; renderCurrent(); syncZoom(); showKnobs(); }
function addPage(){ pushUndo(); COMP.params.pages=pageCount()+1; setPage(COMP.params.pages); }
function deletePage(){
  const N=pageCount();
  if(!confirm('Delete page '+curPage+'? Objects on it go back to the tray.')) return;
  pushUndo();
  itemsAll().forEach(it=>{ const ov=it.overrides; if(!ov||ov.page==null) return;
    if(+ov.page===curPage){ delete ov.page; delete ov.x; delete ov.y; }
    else if(+ov.page>curPage){ ov.page=+ov.page-1; }
  });
  COMP.params.frames=frames().filter(f=>(+f.page||1)!==curPage);
  frames().forEach(f=>{ if(+f.page>curPage) f.page=+f.page-1; });
  COMP.params.texts=texts().filter(t=>(+t.page||1)!==curPage);
  texts().forEach(t=>{ if(+t.page>curPage) t.page=+t.page-1; });
  COMP.params.pages=Math.max(1,N-1);
  curPage=Math.min(curPage, pageCount());
  SEL=[]; renderCurrent(); syncZoom(); showKnobs();
}

// ── Object operations ───────────────────────────────────────────────
function removeSelected(){
  if(!SEL.length) return;
  if(!confirm(SEL.length>1?'Remove these '+SEL.length+' objects from the document?':'Remove this object from the document?')) return;
  pushUndo();
  selItemIdxs().sort((a,b)=>b-a).forEach(i=>COMP.items.splice(i,1));
  selFrameIdxs().sort((a,b)=>b-a).forEach(i=>frames().splice(i,1));
  selTextIdxs().sort((a,b)=>b-a).forEach(i=>texts().splice(i,1));
  SEL=[]; renderCurrent(); showKnobs();
}
function moveSelToPage(n){
  if(!SEL.length) return;
  n=Math.max(1,Math.min(pageCount(),n));
  pushUndo();
  SEL.forEach(key=>{ ovOf(key).page=n; });
  curPage=n; renderCurrent(); showKnobs();
}
function bumpZ(dir){
  if(!SEL.length) return;
  pushUndo();
  const zs=itemsAll().filter(x=>(x.overrides&&+x.overrides.page)===curPage).map(x=>+(x.overrides&&x.overrides.z)||0)
    .concat(frames().filter(f=>(+f.page||1)===curPage).map(f=>+f.z||0))
    .concat(texts().filter(t=>(+t.page||1)===curPage).map(t=>+t.z||0));
  const z = dir>0 ? Math.max(0,...zs)+1 : Math.min(0,...zs)-1;
  SEL.forEach(key=>{ ovOf(key).z=z; });
  render(); showKnobs(); markSel();
}
// A free text object: headline, page number, anything — no card behind it.
function addText(){
  pushUndo();
  texts().push({ page:curPage, x:34, y:40, w:32,
    text:'<h3>New text</h3><p>Click it again to edit…</p>' });
  renderCurrent();
  SEL=['t'+(texts().length-1)]; showKnobs(); markSel();
}
// Duplicate every selected object (styling and all), slightly offset.
function dupSelected(){
  if(!SEL.length) return;
  pushUndo();
  const newSel=[];
  selItemIdxs().forEach(i=>{
    const it=COMP.items[i];
    const c={ ref_type:it.ref_type, ref_id:it.ref_id, content:it.content,
              overrides:JSON.parse(JSON.stringify(it.overrides||{})) };
    c.overrides.x=(+c.overrides.x||0)+3; c.overrides.y=(+c.overrides.y||0)+3;
    COMP.items.push(c); newSel.push('i'+(COMP.items.length-1));
  });
  selTextIdxs().forEach(i=>{
    const t=JSON.parse(JSON.stringify(texts()[i])); t.x=(+t.x||0)+3; t.y=(+t.y||0)+3;
    texts().push(t); newSel.push('t'+(texts().length-1));
  });
  selFrameIdxs().forEach(i=>{
    const f=JSON.parse(JSON.stringify(frames()[i])); f.x=(+f.x||0)+3; f.y=(+f.y||0)+3;
    frames().push(f); newSel.push('f'+(frames().length-1));
  });
  renderCurrent(); SEL=newSel; showKnobs(); markSel();
}
// ── Align & distribute (page-% geometry from the live DOM) ─────────
function geoSel(){
  const page=document.querySelector('#out .page'); if(!page) return null;
  return SEL.map(key=>{
    const el=elOf(key), o=ovOf(key); if(!el||!o) return null;
    const wp=+o.w||(key[0]==='f'?20:28);
    const hp=key[0]==='f' ? (+o.h||20) : el.offsetHeight/page.offsetHeight*100;
    return { key, o, el, wp, hp, x:+o.x||0, y:+o.y||0 };
  }).filter(Boolean);
}
function alignSel(mode){
  const g=geoSel(); if(!g||g.length<2) return;
  pushUndo();
  const minX=Math.min(...g.map(a=>a.x)),      maxR=Math.max(...g.map(a=>a.x+a.wp));
  const minY=Math.min(...g.map(a=>a.y)),      maxB=Math.max(...g.map(a=>a.y+a.hp));
  g.forEach(a=>{
    if(mode==='l') a.o.x=minX;
    else if(mode==='r') a.o.x=maxR-a.wp;
    else if(mode==='c') a.o.x=(minX+maxR)/2-a.wp/2;
    else if(mode==='t') a.o.y=minY;
    else if(mode==='b') a.o.y=maxB-a.hp;
    else if(mode==='m') a.o.y=(minY+maxB)/2-a.hp/2;
    a.o.x=Math.round(a.o.x*10)/10; a.o.y=Math.round(a.o.y*10)/10;
    a.el.style.left=a.o.x+'%'; a.el.style.top=a.o.y+'%';
  });
  updateOffpage();
}
function distSel(axis){
  const g=geoSel(); if(!g||g.length<3) return;
  pushUndo();
  const P=axis==='h'?'x':'y', S=axis==='h'?'wp':'hp';
  g.sort((a,b)=>a[P]-b[P]);
  const first=g[0], last=g[g.length-1];
  const span=(last[P]+last[S])-first[P];
  const sum=g.reduce((s,a)=>s+a[S],0);
  const gap=(span-sum)/(g.length-1);
  let cur=first[P];
  g.forEach(a=>{
    a.o[P]=Math.round(cur*10)/10;
    a.el.style[P==='x'?'left':'top']=a.o[P]+'%';
    cur+=a[S]+gap;
  });
  updateOffpage();
}
// A frame = a border AROUND the selection, born as its own object.
function frameSelection(){
  if(!SEL.length) return;
  const page=document.querySelector('#out .page'); if(!page) return;
  const pr=page.getBoundingClientRect();
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  SEL.forEach(key=>{ const el=elOf(key); if(!el) return; const r=el.getBoundingClientRect();
    x1=Math.min(x1,r.left); y1=Math.min(y1,r.top); x2=Math.max(x2,r.right); y2=Math.max(y2,r.bottom); });
  if(x2<x1) return;
  pushUndo();
  const pad=10*curScale;
  x1-=pad; y1-=pad; x2+=pad; y2+=pad;
  frames().push({ page:curPage,
    x:Math.round((x1-pr.left)/pr.width*1000)/10,  y:Math.round((y1-pr.top)/pr.height*1000)/10,
    w:Math.round((x2-x1)/pr.width*1000)/10,        h:Math.round((y2-y1)/pr.height*1000)/10,
    bw:2, bs:'solid', bc:'#c9a24b', r:0, z:0 });
  renderCurrent();
  SEL=['f'+(frames().length-1)]; showKnobs(); markSel();
}

// ── Undo / redo ─────────────────────────────────────────────────────
let UNDO=[], REDO=[];
function snap(){ return JSON.stringify({ params:COMP.params||{}, items:COMP.items||[] }); }
function pushUndo(pre){
  UNDO.push(pre!=null?pre:snap());
  if(UNDO.length>200) UNDO.shift();
  REDO.length=0;
  updateUndoBtns();
  scheduleSave();               // every change autosaves shortly after
}
function restoreSnap(js){
  const st=JSON.parse(js);
  COMP.params=st.params; COMP.items=st.items;
  SEL=[]; renderCurrent(); showKnobs(); markSel(); updateUndoBtns();
  scheduleSave();
}
function doUndo(){
  if(editing){ try{ document.execCommand('undo'); }catch(e){} return; }
  if(!UNDO.length) return;
  REDO.push(snap());

// ── In-place text editing ───────────────────────────────────────────
// Click a selected text object again → edit right there, caret where you
// clicked. Any click outside commits automatically; nothing is ever lost.
function curBd(){ return document.querySelector('[contenteditable="true"]'); }
let styleSpan=null, holdSel=false;
function enterEdit(key,cx,cy){
  const el=elOf(key); if(!el) return;
  const bd=el.querySelector('.bd'); if(!bd) return;
  bd.setAttribute('contenteditable','true');
  bd.focus();
  if(cx!=null&&document.caretRangeFromPoint){
    const r=document.caretRangeFromPoint(cx,cy);
    if(r&&bd.contains(r.startContainer)){ const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
  editing=true; savedSel=null; styleSpan=null;
  try{ document.execCommand('styleWithCSS',false,true); }catch(e){}
  updateUndoBtns(); showKnobs();
}
function commitEdit(rerender){
  const bd=curBd();
  if(bd){
    const wrap=bd.closest('.abswrap');
    const nw=sanitizeHtml(bd.innerHTML);
    if(wrap&&wrap.dataset.absidx!=null){
      const it=COMP.items[+wrap.dataset.absidx];
      const ov=it.overrides=it.overrides||{};
      if(nw!==(ov.text||'')){ pushUndo(); ov.text=nw; }   // pre-state pushed BEFORE the change
    }else if(wrap&&wrap.dataset.text!=null){
      const t=texts()[+wrap.dataset.text];
      if(t&&nw!==(t.text||'')){ pushUndo(); t.text=nw; }
    }
    bd.removeAttribute('contenteditable');
  }
  editing=false; savedSel=null; styleSpan=null; updateUndoBtns();
  if(rerender){ render(); showKnobs(); markSel(); }
  else showKnobs();
}
document.addEventListener('selectionchange',()=>{
  if(!editing||holdSel) return;
  const sel=getSelection(); if(!sel.rangeCount) return;
  const bd=curBd(); if(!bd) return;
  if(bd.contains(sel.anchorNode)){
    savedSel=sel.getRangeAt(0).cloneRange();
    styleSpan=null;              // a NEW selection gets a fresh style span
    updateTb();                  // …and the toolbar shows its font + size
  }
});
function restoreSel(){
  const bd=curBd(); if(!bd) return;
  bd.focus();
  if(savedSel){ const s=getSelection(); s.removeAllRanges(); s.addRange(savedSel); }
}
// Style the saved selection by wrapping it ONCE in a span; repeated calls
// (arrow-stepping fonts/sizes) restyle the SAME span — live preview, no
// nesting, and focus stays where it is (the dropdown keeps taking arrows).
// Everything INSIDE the styled selection is flattened to `inherit` for that
// property, so mixed sizes/fonts/colours all take the new value uniformly.
function flattenProp(sp,prop){
  sp.querySelectorAll('*').forEach(el=>{ try{ el.style[prop]='inherit'; }catch(e){} });
}
function applyStyle(prop,val){
  const bd=curBd(); if(!bd) return;
  if(styleSpan&&bd.contains(styleSpan)){ styleSpan.style[prop]=val; flattenProp(styleSpan,prop); return; }
  if(!savedSel||savedSel.collapsed){       // caret only → set the typing style
    restoreSel();
    try{
      document.execCommand('styleWithCSS',false,true);
      if(prop==='fontFamily') document.execCommand('fontName',false,String(val).replace(/'/g,''));
      else if(prop==='color') document.execCommand('foreColor',false,val);
    }catch(e){}
    return;
  }
  holdSel=true;
  const sp=document.createElement('span'); sp.style[prop]=val;
  const r=savedSel;
  try{ r.surroundContents(sp); }
  catch(e){ const frag=r.extractContents(); sp.appendChild(frag); r.insertNode(sp); }
  flattenProp(sp,prop);
  styleSpan=sp;
  const r2=document.createRange(); r2.selectNodeContents(sp); savedSel=r2;
  setTimeout(()=>holdSel=false,0);
}
// Show the font + size AT the cursor/selection in the toolbar.
function updateTb(){
  const f=document.getElementById('tbFont'), s=document.getElementById('tbSize');
  if(!f||!s) return;
  const bd=curBd(); if(!bd) return;
  const sel=getSelection(); if(!sel.rangeCount||!sel.anchorNode) return;
  const el=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
  if(!el||!bd.contains(el)) return;
  const cs=getComputedStyle(el);
  const fam=(cs.fontFamily||'').split(',')[0].replace(/["']/g,'').trim();
  const m=FONTS.find(([v])=>v.toLowerCase()===fam.toLowerCase());
  if(document.activeElement!==f){ f.value=m?m[0]:''; f.options[0].textContent=m?'Font…':(fam||'Font…'); }
  if(document.activeElement!==s) s.value=Math.round(parseFloat(cs.fontSize)||14);
}

// ── Selection visuals: outline every selected object, resize dot on primary ─
function markSel(){
  document.querySelectorAll('.abswrap.sel,.frameobj.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.abswrap.cropping').forEach(x=>x.classList.remove('cropping'));
  document.querySelectorAll('.rszh,.crE').forEach(h=>h.remove());
  document.querySelectorAll('[contenteditable="true"]').forEach(b=>b.removeAttribute('contenteditable'));
  SEL.forEach(key=>{ const el=elOf(key); if(el) el.classList.add('sel'); });
  const p=primary(); if(!p) return;
  const el=elOf(p); if(!el) return;
  if(cropKey===p&&isPicKey(p)){
    // Crop mode: four edge handles, no resize dot; drag inside = slide picture.
    el.classList.add('cropping');
    ['t','b','l','r'].forEach(edge=>{
      const h=document.createElement('div'); h.className='crE'; h.dataset.edge=edge;
      h.title='Drag to crop this edge (drag back out to restore)';
      el.appendChild(h);
      h.onpointerdown=e=>cropEdgeDrag(e,el,p,edge);
    });
    return;
  }
  const rz=document.createElement('div'); rz.className='rszh'; rz.title='Drag to resize';
  el.appendChild(rz); wireResize(rz,el,p);
}
function wireResize(h,wrap,key){
  h.onpointerdown=e=>{
    e.stopPropagation(); e.preventDefault();
    const page=wrap.closest('.page'), pr=page.getBoundingClientRect();
    const o=ovOf(key);
    const pre=snap();
    let resized=false;
    const sx=e.clientX, sy=e.clientY;
    const ow=+o.w||(key[0]==='f'?20:28), oh=+o.h||20;
    // Text boxes RESHAPE: wider box = longer lines, fewer rows — the text
    // itself keeps its size (ts compensates for the width-linked font).
    const reflow=isTextKey(key), fs0=fsOf(o);
    const mv=ev=>{
      resized=true;
      o.w=Math.round(Math.max(3,Math.min(100, ow+(ev.clientX-sx)/pr.width*100))*10)/10;
      if(reflow){ o.ts=Math.round(fs0/(13.5*(o.w/28))*1000)/1000; if(Math.abs(o.ts-1)<0.002) delete o.ts; }
      if(key[0]==='f') o.h=Math.round(Math.max(2,Math.min(100, oh+(ev.clientY-sy)/pr.height*100))*10)/10;
      liveSelStyle();
      const s=document.getElementById('knW');
      if(s){ s.value=o.w; const pl=document.getElementById('szPct'); if(pl) pl.textContent=Math.round(o.w)+'%'; }
      updateOffpage();
    };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
      if(resized) pushUndo(pre); };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  };
}
// ── Crop (window model) ─────────────────────────────────────────────
// The picture keeps its own size (pw em); the object box is a WINDOW onto it.
// In crop mode: drag any of the four edges to shape the window (the picture
// does not move on the page), drag inside to slide the picture. Dragging
// edges back OUT restores the hidden parts — that's the "uncrop".
let cropKey=null;
function applyCrop(wrap,o){
  wrap.style.left=(+o.x||0)+'%'; wrap.style.top=(+o.y||0)+'%';
  wrap.style.width=(+o.w||28)+'%';
  wrap.style.fontSize=fsOf(o)+'px';
  const fs=fsOf(o), Wem=wrap.offsetWidth/fs;
  const blk=wrap.querySelector('.imgo'), img=wrap.querySelector('img');
  if(blk){ blk.style.position='relative'; blk.style.overflow='hidden'; blk.style.height=r4((+o.phr||0.6)*Wem)+'em'; }
  if(img){ img.style.position='absolute'; img.style.width=r4((+o.pwr||1)*Wem)+'em'; img.style.maxWidth='none';
           img.style.height='auto'; img.style.objectFit=''; img.style.objectPosition='';
           img.style.left=r4((+o.ixr||0)*Wem)+'em'; img.style.top=r4((+o.iyr||0)*Wem)+'em'; }
}
function cropDrag(e,wrap,key){
  const o=ovOf(key);
  const img=wrap.querySelector('img'); if(!img||!+o.pwr) return;
  const pre=snap();
  const fs0=fsOf(o);
  const a=(img.naturalHeight/img.naturalWidth)||0.75;
  const Wem=wrap.offsetWidth/fs0;
  const pw=o.pwr*Wem, ph=(+o.phr||0.6)*Wem, imgH=pw*a;
  const sx=e.clientX, sy=e.clientY;
  const ox=(+o.ixr||0)*Wem, oy=(+o.iyr||0)*Wem;
  let moved=false;
  const mv=ev=>{
    moved=true;
    const dxE=(ev.clientX-sx)/curScale/fs0, dyE=(ev.clientY-sy)/curScale/fs0;
    const ix=Math.max(Wem-pw, Math.min(0, ox+dxE));
    const iy=Math.max(ph-imgH, Math.min(0, oy+dyE));
    o.ixr=r4(ix/Wem); o.iyr=r4(iy/Wem);
    img.style.left=r4(ix)+'em'; img.style.top=r4(iy)+'em';
  };
  const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved) pushUndo(pre); };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
function cropEdgeDrag(e,wrap,key,edge){
  e.stopPropagation(); e.preventDefault();
  const o=ovOf(key);
  const page=wrap.closest('.page'), pr=page.getBoundingClientRect();
  const img=wrap.querySelector('img'); if(!img||!+o.pwr) return;
  const pre=snap();
  let moved=false;
  const fs0=fsOf(o);                                  // stays constant (ts compensates)
  const a=(img.naturalHeight/img.naturalWidth)||0.75;
  const emPerPctW=page.offsetWidth/100/fs0;           // em per 1% page width
  const emPerPctH=page.offsetHeight/100/fs0;
  const Wem0=(+o.w||28)*emPerPctW;
  const pw=o.pwr*Wem0;                                // picture size is FIXED during the drag
  const imgH=pw*a;
  const sx=e.clientX, sy=e.clientY;
  const st={x:+o.x||0, y:+o.y||0, w:+o.w||28,
            ph:(+o.phr||0.6)*Wem0, ix:(+o.ixr||0)*Wem0, iy:(+o.iyr||0)*Wem0};
  const mv=ev=>{
    moved=true;
    const dxPct=(ev.clientX-sx)/pr.width*100;
    const dyEm=(ev.clientY-sy)/curScale/fs0;
    let x=st.x, y=st.y, w=st.w, ph=st.ph, ix=st.ix, iy=st.iy;
    if(edge==='r'){
      const maxW=(pw+st.ix)/emPerPctW;                // window can't outgrow the picture
      w=Math.max(3, Math.min(maxW, st.w+dxPct));
    }else if(edge==='l'){
      let d=Math.max(st.ix/emPerPctW, Math.min(st.w-3, dxPct));   // + = crop in, − = restore
      x=st.x+d; w=st.w-d; ix=st.ix-d*emPerPctW;
    }else if(edge==='b'){
      ph=Math.max(2, Math.min(imgH+st.iy, st.ph+dyEm));
    }else{                                            // top
      let d=Math.max(st.iy, Math.min(st.ph-2, dyEm));
      y=st.y+d/emPerPctH; ph=st.ph-d; iy=st.iy-d;
    }
    const WemN=w*emPerPctW;
    o.x=Math.round(x*10)/10; o.y=Math.round(y*10)/10;
    o.w=Math.round(w*100)/100;
    o.pwr=r4(pw/WemN); o.phr=r4(ph/WemN);
    o.ixr=r4(ix/WemN); o.iyr=r4(iy/WemN);
    o.ts=Math.round(fs0/(13.5*(o.w/28))*1000)/1000;
    if(Math.abs(o.ts-1)<0.002) delete o.ts;
    applyCrop(wrap,o);
    updateOffpage();
  };
  const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved){ pushUndo(pre); markSel(); } };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
}

// ── Global controls ─────────────────────────────────────────────────
document.getElementById('paper').onchange=e=>{
  COMP.params=COMP.params||{}; COMP.params.paper=e.target.value;
  applyPaper(e.target.value); render(); syncZoom();
};
document.getElementById('zoom').oninput=e=>zoomToPct(+e.target.value);
document.getElementById('zoomIn').onclick=()=>zoomStep(1.25);
document.getElementById('zoomOut').onclick=()=>zoomStep(1/1.25);
document.getElementById('zoomFit').onclick=()=>syncZoom();

// Track the mouse so keyboard zoom anchors where you're looking.
let lastMouse=null, lastNudge=0;
document.getElementById('addTextBtn').onclick=()=>{ if(editing) commitEdit(false); addText(); };
document.addEventListener('mousemove',e=>{ lastMouse={x:e.clientX,y:e.clientY}; });

// The wheel zooms EVERYWHERE (anchored to the cursor, even off the page) —
// except over the panel, which scrolls normally.
document.addEventListener('wheel',e=>{
  if(e.target.closest&&e.target.closest('#panel')) return;
  e.preventDefault();
  zoomStep(e.deltaY<0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
}, { passive:false });

// Keyboard: +/= zoom in, -/_ zoom out, 0 fits, Ctrl+Z/Y undo/redo,
// Delete removes the selection. While typing, the browser behaves normally.
document.addEventListener('keydown',e=>{
  if(e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); doRedo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSelected(); return; }
  if(e.key==='Delete'&&SEL.length){ e.preventDefault(); removeSelected(); return; }
  if(e.key==='Escape'){ e.preventDefault();
    if(cropKey){ cropKey=null; showKnobs(); markSel(); } else clearSel(); return; }
  // Arrow keys nudge the selection: 0.5% per press, 0.1% with Shift.
  if(SEL.length&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    const st=e.shiftKey?0.1:0.5;
    const dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0;
    const dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;
    if(Date.now()-lastNudge>800) pushUndo(); else scheduleSave();   // coalesce bursts into one undo step
    lastNudge=Date.now();
    SEL.forEach(kk=>{ const o=ovOf(kk);
      o.x=Math.round(((+o.x||0)+dx)*10)/10; o.y=Math.round(((+o.y||0)+dy)*10)/10;
      const el=elOf(kk); if(el){ el.style.left=o.x+'%'; el.style.top=o.y+'%'; } });
    updateOffpage();
    return;
  }
  const at=lastMouse||{};
  if(e.key==='+'||e.key==='='){ e.preventDefault(); zoomStep(1.25, at.x, at.y); }
  else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoomStep(1/1.25, at.x, at.y); }
  else if(e.key==='0'){ e.preventDefault(); syncZoom(); }
});
// Page navigation buttons.
document.getElementById('pgPrev').onclick=()=>setPage(curPage-1);
document.getElementById('pgNext').onclick=()=>setPage(curPage+1);
document.getElementById('pgAdd').onclick=()=>addPage();
document.getElementById('pgDel').onclick=()=>deletePage();
// Undo / redo buttons (mousedown-preventDefault keeps the text editor focused,
// so while editing they drive the browser's native text undo).
const _ub=document.getElementById('undoBtn'), _rb=document.getElementById('redoBtn');
_ub.onmousedown=e=>e.preventDefault(); _rb.onmousedown=e=>e.preventDefault();
_ub.onclick=()=>doUndo(); _rb.onclick=()=>doRedo();
updateUndoBtns();

// Print = all pages in order; restore the single-page editor afterwards.
window.addEventListener('beforeprint',()=>{ if(editing) commitEdit(false); renderAllPages(); });
window.addEventListener('afterprint',()=>{ renderCurrent(); applyZoom(curScale*100); });

// ── Autosave: a couple of seconds after the last change, plus the button ──
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,2500); }
async function saveNow(){
  if(!COMP||!compId) return;
  clearTimeout(saveTimer);
  COMP.params=COMP.params||{}; COMP.params.pages=pageCount();
  const items=COMP.items.map(i=>({ref_type:i.ref_type,ref_id:i.ref_id,overrides:i.overrides||{}}));
  const btn=document.getElementById('saveBtn');
  if(btn) btn.textContent='Saving…';
  let ok=false;
  try{
    const r=await fetch('/api/compositions/'+compId,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items, params:COMP.params||{}})});
    ok=r.ok;
  }catch(e){}
  if(btn){ btn.textContent= ok ? '✓ Saved' : 'Save failed'; setTimeout(()=>btn.textContent='Save',1500); }
}
document.getElementById('saveBtn').onclick=()=>{ if(editing) commitEdit(true); saveNow(); };
load();
</script>
</body>
