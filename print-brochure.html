<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brochure — Turtle &amp; Sun</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&family=Oswald:wght@400;600&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Roboto+Slab:wght@400;700&family=Dancing+Script:wght@600&family=Pacifico&family=Abril+Fatface&display=swap');
  :root{ --ink:#23291d; --green:#1f4a45; --gold:#c9a24b; --cream:#f7f3e8; --muted:#7a8470; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; color:var(--ink); background:#e8e4d8; overflow:hidden; }
  /* Page width/height/padding are injected per paper size by applyPaper(). */
  .page{ width:210mm; min-height:296mm; margin:0 auto 14px; background:#fff; position:relative; overflow:hidden;
         box-shadow:0 2px 14px rgba(0,0,0,.18); padding:16mm; display:flex; flex-direction:column; }
  .block.sel{ outline:3px dashed var(--gold); outline-offset:3px; }
  .block.pos-left, .block.pos-right{ display:flex; gap:5mm; align-items:flex-start; }
  .block.pos-left img, .block.pos-right img{ width:45%; margin-bottom:0; }
  .block.pos-right{ flex-direction:row-reverse; }
  .block.pos-left > div, .block.pos-right > div{ flex:1; }
  /* All card typography and image caps are in em so a card scales as ONE thing:
     the wrapper's font-size (set from its width + text-zoom) zooms everything. */
  .block.img-s img{ max-height:15.4em; object-fit:cover; }
  .block.img-m img{ max-height:26.6em; object-fit:cover; }
  .block.img-l img{ max-height:42em; object-fit:cover; }
  .block.txt-s p{ font-size:.85em; } .block.txt-l p{ font-size:1.2em; line-height:1.5; }
  .block.txt-l h3{ font-size:1.85em; }
  .block.media{ text-align:center; }
  .block.media img{ object-fit:contain !important; max-height:22.4em; margin:0 auto; }
  .block.media.img-s img{ max-height:12.6em; } .block.media.img-m img{ max-height:22.4em; }
  .block.media.img-l img{ max-height:36.4em; } .block.media.big img{ max-height:56em; }
  .block.media .cap{ font-size:.89em; color:#5c5c4d; margin-top:.85em; }
  .block.ffo h3, .block.ffo p, .block.ffo .meta, .block.ffo .cap{ font-family:inherit; }
  /* One floating panel on the right holds every control; the rest is clean page. */
  #panel{ position:fixed; right:16px; top:16px; width:258px; max-height:calc(100vh - 32px); overflow:auto;
          background:#fff; border:2px solid var(--gold); border-radius:14px; padding:10px 12px;
          box-shadow:0 4px 18px rgba(0,0,0,.2); z-index:10; font-size:13px; }
  #panel .prow, #panel .krow{ display:flex; gap:5px; align-items:center; margin-bottom:5px; }
  #panel .prow > button{ flex:1; }
  #panel .ph, #panel .kh{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
                          color:var(--green); margin:8px 0 3px; }
  #panel .ph:first-child, #panel .kh:first-child{ margin-top:0; }
  #panel button{ font-family:inherit; font-weight:700; font-size:12.5px; padding:5px 8px; border:1px solid #d9d4c4;
                 border-radius:8px; background:#fff; cursor:pointer; color:var(--ink); line-height:1.2; }
  #panel button:hover{ background:#f4efe4; }
  #panel button:disabled{ opacity:.35; cursor:default; }
  #panel button.primary{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.primary:hover{ background:#17403b; }
  #panel button.on{ background:var(--green); color:#f4efe4; border-color:var(--green); }
  #panel button.danger{ color:#8c2f1b; border-color:#dcc0b5; font-size:11px; padding:3px 8px; }
  #panel button.danger:hover{ background:#f9ece7; }
  #panel select{ width:100%; font-family:inherit; font-size:13px; padding:5px 8px; border-radius:8px;
                 border:1px solid #d9d4c4; background:#fff; color:var(--ink); margin-bottom:3px; }
  #panel select:disabled, #panel button:disabled, #panel input:disabled{ opacity:.35; }
  #panel input[type=range]{ width:100%; margin:1px 0 3px; accent-color:var(--gold); }
  #zoomWrap input[type=range]{ flex:1; min-width:0; width:auto; margin:0; }
  #pgLabel{ flex:1; text-align:center; font-weight:700; }
  #knobs{ margin-top:8px; padding-top:8px; border-top:2px solid #efe9d8; }
  #knobs .row{ display:flex; gap:4px; flex-wrap:wrap; }
  #knobs .hint{ font-size:12px; color:var(--muted); line-height:1.45; }
  #knobs .sw{ width:21px; height:21px; border-radius:6px; padding:0; border:1px solid rgba(0,0,0,.18); cursor:pointer; }
  #knobs input[type=color]{ width:34px; height:26px; padding:0 2px; border:1px solid #d9d4c4; border-radius:6px; background:#fff; cursor:pointer; }
  .block.font-serif h3,.block.font-serif p{ font-family:Georgia,'Times New Roman',serif; }
  .block.font-hand h3,.block.font-hand p{ font-family:'Caveat',cursive; font-size:1.35em; }
  .block .bd[contenteditable="true"]{ outline:2px solid #7FB36F; outline-offset:2px; border-radius:2mm; cursor:text; }
  /* Picture and text are independently movable INSIDE a card; text sits above
     the picture so it can lie over it. Offsets are em → they scale with the card. */
  .block img{ position:relative; z-index:1; }
  .block .bd, .block .cap{ position:relative; z-index:2; }
  .rszh{ position:absolute; right:-9px; bottom:-9px; width:17px; height:17px; border-radius:50%;
         background:var(--gold); border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4);
         cursor:nwse-resize; z-index:6; touch-action:none; }
  .mvh{ position:absolute; left:-9px; top:-9px; width:17px; height:17px; border-radius:50%;
        background:var(--green); border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4);
        cursor:move; z-index:6; touch-action:none; }
  .tdh{ position:absolute; right:-9px; width:18px; height:18px; border-radius:5px; background:#fff;
        border:2px solid var(--gold); color:var(--gold); font-weight:800; font-size:11px; line-height:14px;
        text-align:center; cursor:move; z-index:6; touch-action:none; user-select:none; }
  /* The canvas floats free: translate+scale, no anchors, no scrollbars. Fit brings it home. */
  #out{ position:absolute; left:0; top:0; transform-origin:0 0; }
  #zoomWrap button, #pageNav button{ font-family:inherit; font-weight:700; padding:4px 8px; border:1px solid #c9c4b4; border-radius:7px; background:#fff; cursor:pointer; }
  #zoomWrap button:hover, #pageNav button:hover{ background:#f4efe4; }
  #pageNav button:disabled{ opacity:.4; cursor:default; }
  #out .page{ cursor:grab; }
  .abswrap.sel{ outline:3px dashed var(--gold); outline-offset:3px; }
  .block.abs{ position:absolute; margin:0; cursor:grab; }
  .block.abs:active{ cursor:grabbing; }
  .block.abs .person{ background:#fff; }
  @media print{ #panel{ display:none!important; } .rszh,.mvh,.tdh{ display:none!important; }
    [contenteditable]{ outline:none!important; } body{ padding-left:0!important; } .block.sel,.abswrap.sel{ outline:none; }
    .page{ height:auto; min-height:296mm; } body.fmt-poster .page{ height:1000mm; }
    .block{ page-break-inside:avoid; }
    #out .page{ cursor:auto; }
    /* Never print the on-screen zoom/pan transform — always full size, in flow. */
    body{ overflow:visible!important; height:auto!important; }
    #out{ position:static!important; transform:none!important; width:auto!important; height:auto!important; margin:0!important; overflow:visible!important; } }
  .page.cover{ padding:0; background:var(--green); color:#f4efe4; }
  .cover .img{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .cover .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(31,74,69,0) 30%,rgba(31,74,69,.88) 78%); }
  .cover .txt{ position:absolute; left:0; right:0; bottom:0; padding:18mm; }
  .cover h1{ font-family:Georgia,serif; font-size:44px; margin:0 0 6px; line-height:1.1; }
  .cover .sub{ font-size:17px; color:#ffe8b0; font-weight:600; }
  .cover .band{ position:absolute; top:0; left:0; right:0; height:9mm;
                background:linear-gradient(90deg,#FFF5A0,#FFE800,#FFD000,#FFAA00,#FF9500); }
  h2.sect{ font-family:Georgia,serif; color:var(--green); font-size:26px; margin:0 0 3mm; }
  .rule{ border:none; border-top:3px solid var(--gold); width:60px; margin:0 0 6mm; }
  .block{ margin-bottom:8mm; }
  .block img{ width:100%; height:auto; border-radius:.55em; display:block; margin-bottom:1.1em; }
  .block.big img{ max-height:42em; object-fit:cover; }
  .block h3{ font-family:Georgia,serif; color:var(--green); font-size:1.56em; margin:0 0 .35em; }
  .block .meta{ font-size:.85em; color:var(--muted); margin-bottom:.65em; }
  .block p{ margin:0 0 .73em; font-size:1em; line-height:1.45; }
  .team{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6mm; }
  .person{ text-align:center; }
  .person img{ max-width:100%; max-height:14.6em; width:auto; border-radius:.55em; display:block; margin:0 auto .55em; }
  .person .init{ width:8.4em; height:10em; border-radius:.55em; background:var(--cream); color:var(--green);
                 display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:1.63em; margin:0 auto .35em; }
  .person b{ font-size:1em; display:block; }
  .person .role{ font-size:.81em; color:var(--green); font-weight:700; }
  .person .ct{ font-size:.78em; color:var(--muted); line-height:1.4; }
  .backpage{ background:var(--green); color:#f4efe4; align-items:center; justify-content:center; text-align:center; }
  .backpage h2{ font-family:Georgia,serif; font-size:30px; margin:0 0 4mm; color:#f4efe4; }
  .backpage .foot{ position:absolute; bottom:12mm; left:0; right:0; font-size:11.5px; color:#cdddd2; }
  .err{ text-align:center; padding:60px; color:var(--muted); }
  @media print{
    body{ background:#fff; padding-left:0; } #panel{ display:none; }
    .page{ box-shadow:none; margin:0; page-break-after:always; width:auto; min-height:auto; height:296mm; }
  }
</style>
</head>
<body>

<aside id="panel">
  <div id="docCtl">
    <div class="prow">
      <button onclick="window.print()" title="Print / save as PDF">🖨 PDF</button>
      <button id="saveBtn" class="primary">Save</button>
      <button id="undoBtn" title="Undo (Ctrl+Z)" style="flex:0 0 auto;">↶</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" style="flex:0 0 auto;">↷</button>
    </div>
    <div class="ph">Paper</div>
    <select id="paper"></select>
    <div class="ph">Zoom · <span id="zoomPct">100%</span></div>
    <div id="zoomWrap" class="prow">
      <button id="zoomOut" title="Zoom out ( - )">−</button>
      <input type="range" id="zoom" min="5" max="200" value="18">
      <button id="zoomIn" title="Zoom in ( + )">＋</button>
      <button id="zoomFit" title="Fit to window ( 0 )">Fit</button>
    </div>
    <div class="ph">Page</div>
    <div id="pageNav" class="prow">
      <button id="pgPrev" title="Previous page">◀</button>
      <span id="pgLabel">1 / 1</span>
      <button id="pgNext" title="Next page">▶</button>
      <button id="pgAdd" title="Add a page">＋</button>
      <button id="pgDel" title="Delete this page">🗑</button>
    </div>
  </div>
  <div id="knobs"></div>
</aside>
<div id="out"><div class="err">Loading…</div></div>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compId = new URLSearchParams(location.search).get('comp');

// Limited rich text: only harmless formatting survives (text is content; scripts
// are not). DOM-based: parse into an inert template, drop dangerous elements,
// unwrap unknown tags, and keep only whitelisted style properties on the rest.
const STYLE_OK=['font-family','font-size','color','font-weight','font-style','text-decoration'];
function cleanStyle(s){
  return String(s||'').split(';').map(d=>{
    const i=d.indexOf(':'); if(i<0) return '';
    const p=d.slice(0,i).trim().toLowerCase(), v=d.slice(i+1).trim();
    if(!STYLE_OK.includes(p)) return '';
    if(/url\s*\(|expression|javascript|@import|[<>]/i.test(v)) return '';
    return p+':'+v;
  }).filter(Boolean).join(';');
}
function sanitizeHtml(s){
  const t=document.createElement('template');
  t.innerHTML=String(s||'');
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,svg,img,video,audio,form,input,button,textarea,select').forEach(e=>e.remove());
  const OK=['H3','P','B','STRONG','U','I','EM','BR','DIV','SPAN'];
  (function walk(node){
    [...node.children].forEach(el=>{
      walk(el);
      if(!OK.includes(el.tagName)){          // unknown (font, a, …) → unwrap, keep content
        while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
        el.remove(); return;
      }
      [...el.attributes].forEach(a=>{ if(a.name.toLowerCase()!=='style') el.removeAttribute(a.name); });
      const cs=cleanStyle(el.getAttribute('style'));
      if(cs) el.setAttribute('style',cs); else el.removeAttribute('style');
    });
  })(t.content);
  return t.innerHTML;
}
// Inline offset (em) for a movable component inside the card.
function offStyle(x,y){ return (x||y)?'left:'+(+x||0)+'em;top:'+(+y||0)+'em;':''; }
function postBlock(it){
  const c=it.content, ov=it.overrides||{}, big=ov.big;
  const ph=(c.photos||[])[0];
  const cls=['block', big?'big':'', ov.pos?'pos-'+ov.pos:'', ov.img?'img-'+ov.img:'',
             ov.txt?'txt-'+ov.txt:'', ov.font?'font-'+ov.font:'', ov.ff?'ffo':''].filter(Boolean).join(' ');
  const ffs=ov.ff?' style="font-family:\''+esc(ov.ff)+'\'"':'';
  const ist=offStyle(ov.ix,ov.iy)?' style="'+offStyle(ov.ix,ov.iy)+'"':'';
  const tst=offStyle(ov.tx,ov.ty)?' style="'+offStyle(ov.tx,ov.ty)+'"':'';
  let inner;
  if(ov.text){ inner='<div class="bd"'+tst+'>'+sanitizeHtml(ov.text)+'</div>'; }
  else{
    const paras=String(c.body||'').split(/\n\n+/).filter(Boolean).slice(0, big?12:4)
      .map(p=>'<p>'+esc(p)+'</p>').join('');
    inner='<div class="bd"'+tst+'>'+(c.title?'<h3>'+esc(c.title)+'</h3>':'')+
      (c.author&&!ov.nodate?'<div class="meta">'+esc(c.author)+'</div>':'')+paras+'</div>';
  }
  return '<div class="'+cls+'"'+ffs+' data-idx="'+it._idx+'">'+
    (ph?'<img src="'+esc(ph)+'"'+ist+'>':'')+inner+'</div>';
}
function personCard(it){
  const c=it.content;
  const init=(c.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return '<div class="person">'+
    (c.photo_url?'<img src="'+esc(c.photo_url)+'">':'<div class="init">'+esc(init)+'</div>')+
    '<b>'+esc(c.name||'')+'</b>'+
    (c.job_title?'<div class="role">'+esc(c.job_title)+'</div>':'')+
    '<div class="ct">'+[c.email,c.phone].filter(Boolean).map(esc).join('<br>')+'</div></div>';
}
// Media card = an SVG (logo/graphic). Rendered via <img> so no script runs.
function mediaBlock(it){
  const c=it.content||{}, ov=it.overrides||{};
  const cls=['block','media', ov.big?'big':'', ov.img?'img-'+ov.img:''].filter(Boolean).join(' ');
  const showCap = ov.caption && c.title;
  const ist=offStyle(ov.ix,ov.iy)?' style="'+offStyle(ov.ix,ov.iy)+'"':'';
  const tst=offStyle(ov.tx,ov.ty)?' style="'+offStyle(ov.tx,ov.ty)+'"':'';
  return '<div class="'+cls+'" data-idx="'+it._idx+'">'+
    (c.url?'<img src="'+esc(c.url)+'"'+ist+'>':'')+
    (showCap?'<div class="cap"'+tst+'>'+esc(c.title)+'</div>':'')+'</div>';
}

let COMP=null;
let curPage=1;
function render(){ renderCurrent(); }
// Every card lives on a page at a free position (page/x/y/w in its overrides).
// Legacy: poster items already had x/y → page 1; anything else starts unplaced.
function normalizeItems(){
  COMP.params=COMP.params||{};
  let n=0;
  (COMP.items||[]).forEach(it=>{
    const ov=it.overrides=it.overrides||{};
    if(ov.page==null){                 // unplaced (incl. legacy) → drop onto page 1
      ov.page=1;
      if(ov.x==null) ov.x=8+(n%3)*30;
      if(ov.y==null) ov.y=6+Math.floor(n/3)*24;
      if(ov.w==null) ov.w=28;
      n++;
    }
  });
}

async function load(){
  if(!compId){ document.getElementById('out').innerHTML='<div class="err">No composition given (?comp=ID).</div>'; return; }
  const r=await fetch('/api/compositions/'+compId);
  if(!r.ok){ document.getElementById('out').innerHTML='<div class="err">Could not load the brochure.</div>'; return; }
  COMP=await r.json();
  document.title=COMP.name+' · Turtle & Sun';
  normalizeItems();
  buildPaperOptions();
  const paper=(COMP.params&&COMP.params.paper)||'a4';
  document.getElementById('paper').value=paperOf(paper).k;
  applyPaper(paper);
  render();
  syncZoom();
  showKnobs();
}

// ── Paper sizes ─────────────────────────────────────────────────────
// Dimensions in mm (portrait). A-series shown in cm, US sizes in inches.
// `canvas:true` = the free-placement poster renderer; the rest flow as pages.
const PAPERS=[
  {k:'a0',n:'A0',w:841,h:1189,u:'cm'},
  {k:'a1',n:'A1',w:594,h:841,u:'cm'},
  {k:'a2',n:'A2',w:420,h:594,u:'cm'},
  {k:'a3',n:'A3',w:297,h:420,u:'cm'},
  {k:'a4',n:'A4',w:210,h:297,u:'cm'},
  {k:'a5',n:'A5',w:148,h:210,u:'cm'},
  {k:'a6',n:'A6',w:105,h:148,u:'cm'},
  {k:'letter', n:'US Letter',  w:215.9,h:279.4,u:'in'},
  {k:'legal',  n:'US Legal',   w:215.9,h:355.6,u:'in'},
  {k:'tabloid',n:'US Tabloid', w:279.4,h:431.8,u:'in'},
  {k:'ansic',  n:'US ANSI C',  w:431.8,h:558.8,u:'in'},
  {k:'ansid',  n:'US ANSI D',  w:558.8,h:863.6,u:'in'},
  {k:'ansie',  n:'US ANSI E',  w:863.6,h:1117.6,u:'in'},
  {k:'poster', n:'Poster',     w:700,  h:1000,  u:'cm', canvas:true},
];
const paperArea=P=>P.w*P.h;
const num1=x=>String(Math.round(x*10)/10);
function paperLabel(P){
  return P.u==='in'
    ? P.n+' — '+num1(P.w/25.4)+' × '+num1(P.h/25.4)+' in'
    : P.n+' — '+num1(P.w/10)+' × '+num1(P.h/10)+' cm';
}
function paperOf(k){ return PAPERS.find(x=>x.k===k) || PAPERS.find(x=>x.k==='a4'); }
function buildPaperOptions(){
  const sel=document.getElementById('paper');
  sel.innerHTML=PAPERS.slice().sort((a,b)=>paperArea(b)-paperArea(a))
    .map(P=>'<option value="'+P.k+'">'+paperLabel(P)+'</option>').join('');
}

function applyPaper(k){
  const P=paperOf(k);
  document.body.className = P.canvas ? 'fmt-poster' : 'fmt-doc';
  let st=document.getElementById('pageSize');
  if(!st){ st=document.createElement('style'); st.id='pageSize'; document.head.appendChild(st); }
  let css='@page{ size:'+P.w+'mm '+P.h+'mm; margin:0; }';
  if(P.canvas){
    css+=' .page{ width:'+P.w+'mm; height:'+P.h+'mm; min-height:0; padding:0; }';
  }else{
    const pad=Math.max(8, Math.round(P.w*0.06));
    css+=' .page{ width:'+P.w+'mm; min-height:'+P.h+'mm; height:auto; padding:'+pad+'mm; }';
    css+=' .cover h1{ font-size:'+Math.round(P.w*0.209)+'px; }';
    css+=' .cover .sub{ font-size:'+Math.max(11,Math.round(P.w*0.081))+'px; }';
  }
  st.textContent=css;
}

// ── Zoom ────────────────────────────────────────────────────────────
// Any paper can be scaled to fit and panned. Zoom is anchored to a focal
// point (the mouse, or the viewport centre) so the spot you point at stays
// put; near the edges the scroll simply clamps ("physical constraints").
const ZMIN=5, ZMAX=200;   // percent
let curScale=1;           // fraction; kept in sync with the slider
function posterMode(){ return document.body.classList.contains('fmt-poster'); }
function clampPct(p){ return Math.max(ZMIN, Math.min(ZMAX, p)); }

// Natural (unscaled) size of the rendered content — transform-independent.
function contentNat(){
  const out=document.getElementById('out');
  let w=0,h=0;
  out.querySelectorAll('.page').forEach(p=>{ w=Math.max(w,p.offsetWidth); h=Math.max(h,p.offsetTop+p.offsetHeight); });
  return { w, h };
}
// The canvas is free-floating: pan (panX/panY) + scale, no anchors anywhere.
// Lose it off-screen? The Fit button always brings it back.
let panX=20, panY=16;
function setView(){
  const out=document.getElementById('out');
  out.style.transform='translate('+panX+'px,'+panY+'px) scale('+curScale+')';
}
function applyZoom(pct){
  pct=clampPct(pct);
  curScale=pct/100;
  setView();
  syncZoomLabel(pct);
}
function syncZoomLabel(pct){
  const zi=document.getElementById('zoom'); if(zi) zi.value=Math.round(pct);
  const zp=document.getElementById('zoomPct'); if(zp) zp.textContent=Math.round(pct)+'%';
}
// Scale so the page fits the viewport width (never above 100%).
function fitPct(){
  const {w}=contentNat();
  if(!w) return 100;
  return clampPct(Math.min(100, (window.innerWidth-306)/w*100));
}
// Fit = rescue: scale to the window and centre in the space left of the panel.
function syncZoom(){
  const {w}=contentNat();
  const pct=fitPct();
  curScale=pct/100;
  panX=Math.max(14, ((window.innerWidth-292)-w*curScale)/2);
  panY=16;
  setView();
  syncZoomLabel(pct);
}

// Zoom to a new percent while keeping (cx,cy) — a client point — over the
// same spot on the canvas. Falls back to viewport centre when no point given.
function zoomToPct(pct, cx, cy){
  pct=clampPct(pct);
  if(cx==null){ cx=(window.innerWidth-292)/2; cy=window.innerHeight/2; }
  const s0=curScale;
  const px=(cx-panX)/s0, py=(cy-panY)/s0;   // content point under focal
  curScale=pct/100;
  panX=cx-px*curScale; panY=cy-py*curScale;
  setView();
  syncZoomLabel(pct);
}
function zoomStep(factor, cx, cy){ zoomToPct(curScale*100*factor, cx, cy); }

// ── Page model ──────────────────────────────────────────────────────
// A document is N pages. Each card sits on one page at a free position.
// We edit ONE page at a time; print stitches every page in order.
function itemsAll(){ return (COMP.items||[]).map((it,i)=>({ ...it, _idx:i })); }
function pageCount(){
  let n=(COMP.params&&+COMP.params.pages)||1;
  itemsAll().forEach(it=>{ const p=it.overrides&&+it.overrides.page; if(p>n) n=p; });
  return Math.max(1,n);
}
function cardInner(it){
  return it.ref_type==='contact' ? personCard(it)
       : it.ref_type==='media'   ? mediaBlock(it)
       : postBlock(it);
}
// A card's font-size follows its width (true zoom: text + images scale as one),
// times an optional text-zoom fine-tune. All inner sizes are em, so this one
// number scales the whole card.
function fsOf(ov){
  const w=(ov&&ov.w!=null)?+ov.w:28, ts=(ov&&ov.ts)?+ov.ts:1;
  return Math.max(4, Math.min(120, 13.5*(w/28)*ts));
}
function absWrap(it){
  const ov=it.overrides||{};
  const x=ov.x!=null?ov.x:10, y=ov.y!=null?ov.y:10, w=ov.w||28;
  return '<div class="abswrap" style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+w+'%;font-size:'+fsOf(ov)+'px;z-index:'+(+ov.z||0)+';" data-absidx="'+it._idx+'">'+cardInner(it)+'</div>';
}
function markAbs(){ document.querySelectorAll('.abswrap .block,.abswrap .person').forEach(b=>b.classList.add('abs')); }

// The editor view: a single page of freely-placed cards.
function renderCurrent(){
  const N=pageCount();
  curPage=Math.max(1,Math.min(N,curPage));
  const on=itemsAll().filter(it=>(it.overrides&&+it.overrides.page)===curPage);
  document.getElementById('out').innerHTML=
    '<div class="page" data-page="'+curPage+'" style="position:relative;">'+on.map(absWrap).join('')+'</div>';
  markAbs(); wireDrag(); wirePan();
  updatePageNav(); markSel();
}
// Print view: every page, in order.
function renderAllPages(){
  const N=pageCount(), all=itemsAll(); let html='';
  for(let n=1;n<=N;n++){
    const on=all.filter(it=>(it.overrides&&+it.overrides.page)===n);
    html+='<div class="page printpage" style="position:relative;">'+on.map(absWrap).join('')+'</div>';
  }
  document.getElementById('out').innerHTML=html; markAbs();
}

// Drag the whole card (x/y saved as % of the page).
function dragCardFrom(e,w,idx){
  const page=w.closest('.page'), pr=page.getBoundingClientRect();
  const pre=snap();
  const sx=e.clientX, sy=e.clientY;
  const ox=parseFloat(w.style.left), oy=parseFloat(w.style.top);
  let moved=false;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/pr.width*100, dy=(ev.clientY-sy)/pr.height*100;
    if(Math.abs(dx)+Math.abs(dy)>0.1) moved=true;
    w.style.left=Math.max(0,Math.min(96,ox+dx))+'%';
    w.style.top=Math.max(0,Math.min(98,oy+dy))+'%';
  };
  const up=()=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved){
      pushUndo(pre);
      const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
      ov.x=Math.round(parseFloat(w.style.left)*10)/10; ov.y=Math.round(parseFloat(w.style.top)*10)/10;
    }
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
// Drag ONE piece of a card — its picture or its text — anywhere, even over
// the other piece (text renders above the picture). Offsets are em → they
// scale with the card.
function dragComp(e,w,idx,kind){
  const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
  const el= kind==='img' ? w.querySelector('img') : (w.querySelector('.bd')||w.querySelector('.cap'));
  if(!el) return;
  const pre=snap();
  const fs=parseFloat(w.style.fontSize)||13.5;
  const kx=kind==='img'?'ix':'tx', ky=kind==='img'?'iy':'ty';
  const sx=e.clientX, sy=e.clientY, ox=+ov[kx]||0, oy=+ov[ky]||0;
  let moved=false;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/curScale/fs, dy=(ev.clientY-sy)/curScale/fs;
    if(Math.abs(dx)+Math.abs(dy)>0.02) moved=true;
    ov[kx]=Math.round((ox+dx)*100)/100; ov[ky]=Math.round((oy+dy)*100)/100;
    el.style.left=ov[kx]+'em'; el.style.top=ov[ky]+'em';
  };
  const up=()=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
    if(moved) pushUndo(pre);
    else { if(ox) ov[kx]=ox; else delete ov[kx]; if(oy) ov[ky]=oy; else delete ov[ky]; }
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
  e.stopPropagation(); e.preventDefault();
}
function wireDrag(){
  document.querySelectorAll('.abswrap').forEach(w=>{
    w.onpointerdown=e=>{
      if(e.target.closest('.rszh,.mvh,.tdh')) return;      // handles run themselves
      if(e.target.closest('[contenteditable="true"]')) return;
      if(editing) commitEdit(false);        // keep the edit — never lose it on a stray click
      const idx=+w.dataset.absidx;
      if(selIdx===idx){                     // selected card: pieces move individually
        if(e.target.closest('img')) return dragComp(e,w,idx,'img');
        if(e.target.closest('.cap')) return dragComp(e,w,idx,'txt');
      }
      selIdx=idx; showKnobs(); markSel();
      dragCardFrom(e,w,idx);
    };
  });
}
// Drag anywhere that isn't a card or the panel to move the canvas freely.
// Any click outside the text editor auto-saves an edit in progress.
let panWired=false;
function wirePan(){
  if(panWired) return; panWired=true;
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    if(e.target.closest('#panel')||e.target.closest('.abswrap')||e.target.closest('[contenteditable="true"]')) return;
    if(editing) commitEdit(false);          // click away = saved, never lost
    const sx=e.clientX, sy=e.clientY, opx=panX, opy=panY;
    document.body.style.cursor='grabbing';
    const mv=ev=>{ panX=opx+(ev.clientX-sx); panY=opy+(ev.clientY-sy); setView(); };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); document.body.style.cursor=''; };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
    e.preventDefault();
  });
}

// ── Page navigation ─────────────────────────────────────────────────
function updatePageNav(){
  const N=pageCount();
  const lab=document.getElementById('pgLabel'); if(lab) lab.textContent='Page '+curPage+' / '+N;
  const prev=document.getElementById('pgPrev'), next=document.getElementById('pgNext'), del=document.getElementById('pgDel');
  if(prev) prev.disabled=curPage<=1;
  if(next) next.disabled=curPage>=N;
  if(del)  del.disabled=N<=1 && !itemsAll().some(it=>(it.overrides&&+it.overrides.page)===curPage);
}
function setPage(n){ curPage=n; renderCurrent(); syncZoom(); }
function addPage(){ pushUndo(); COMP.params.pages=pageCount()+1; setPage(COMP.params.pages); }
function deletePage(){
  const N=pageCount();
  if(!confirm('Delete page '+curPage+'? Cards on it go back to the tray.')) return;
  pushUndo();
  itemsAll().forEach(it=>{ const ov=it.overrides; if(!ov||ov.page==null) return;
    if(+ov.page===curPage){ delete ov.page; delete ov.x; delete ov.y; }
    else if(+ov.page>curPage){ ov.page=+ov.page-1; }
  });
  COMP.params.pages=Math.max(1,N-1);
  curPage=Math.min(curPage, pageCount());
  renderCurrent(); syncZoom();
}

// ── Placing / moving cards ──────────────────────────────────────────
// Remove a card from THIS document (the underlying card stays in the library;
// re-add it from the Make tab).
function removeCard(idx){
  if(!confirm('Remove this card from the document?')) return;
  pushUndo();
  COMP.items.splice(idx,1);
  selIdx=null; renderCurrent(); showKnobs();
}
function moveCardToPage(idx,n){
  pushUndo();
  const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
  ov.page=Math.max(1,Math.min(pageCount(),n));
  curPage=ov.page; renderCurrent(); showKnobs();   // follow the card
}

// ── Undo / redo ─────────────────────────────────────────────────────
// Snapshot-based: every change (move, resize, knob, text, page ops) pushes the
// PRE-state. 200 deep. While typing in the text editor, native undo applies.
let UNDO=[], REDO=[];
function snap(){ return JSON.stringify({ params:COMP.params||{}, items:COMP.items||[] }); }
function pushUndo(pre){
  UNDO.push(pre!=null?pre:snap());
  if(UNDO.length>200) UNDO.shift();
  REDO.length=0;
  updateUndoBtns();
}
function restoreSnap(js){
  const st=JSON.parse(js);
  COMP.params=st.params; COMP.items=st.items;
  selIdx=null; renderCurrent(); showKnobs(); markSel(); updateUndoBtns();
}
function doUndo(){
  if(editing){ try{ document.execCommand('undo'); }catch(e){} return; }
  if(!UNDO.length) return;
  REDO.push(snap());
  restoreSnap(UNDO.pop());
}
function doRedo(){
  if(editing){ try{ document.execCommand('redo'); }catch(e){} return; }
  if(!REDO.length) return;
  UNDO.push(snap());
  restoreSnap(REDO.pop());
}
function updateUndoBtns(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u) u.disabled=!UNDO.length&&!editing;
  if(r) r.disabled=!REDO.length&&!editing;
}

// ── Knobs: select a card → adjust it, live ──────────────────────────

let editing=false, savedSel=null;
const FONTS=[

// Width/text-zoom apply live to the DOM — no re-render, no lost focus.
function liveCardStyle(){

// The panel is ALWAYS complete — every control visible from the start.
// With no card selected the card controls are simply disabled (grey).

    '<div class="krow"><button id="knFront"'+dis+' style="flex:1;" title="Bring in front of overlapping cards">⬆ Front</button>'+

      '<button id="knLayout"'+dis+' title="Put the picture and text back in their places">↺ Layout</button></div>'+
    '<div class="kh">Size · <span id="szPct">'+(it?Math.round(ov.w||28)+'%':'–')+'</span></div>'+
    '<input type="range" id="knW" min="6" max="95" step="0.5" value="'+(it?(ov.w||28):28)+'"'+dis+'>'+
    '<div class="kh">Text zoom · <span id="tsPct">'+(it?Math.round((ov.ts||1)*100)+'%':'–')+'</span></div>'+
    '<input type="range" id="knTs" min="40" max="250" step="5" value="'+(it?Math.round((ov.ts||1)*100):100)+'"'+dis+'>'+

    '<select id="tbFont"'+disT+' title="Font at the cursor — arrow keys preview live"><option value="">Font…</option>'+
      FONTS.map(([v,t])=>'<option value="'+v+'" style="font-family:\''+v+'\'">'+t+'</option>').join('')+'</select>'+

  if(isPost){

    q('tbFont').onchange=e=>{ if(e.target.value) applyStyle('fontFamily',"'"+e.target.value+"'"); };
    q('tbSize').oninput=e=>{ const px=+e.target.value; if(px>=4&&px<=500) applyStyle('fontSize',px+'px'); };

    k.querySelectorAll('.sw').forEach(b=>{

// Bring in front of / send behind the other cards on this page.
function bumpZ(dir){
  const ov=COMP.items[selIdx].overrides=COMP.items[selIdx].overrides||{};
  pushUndo();
  const zs=itemsAll().filter(x=>(x.overrides&&+x.overrides.page)===curPage).map(x=>+(x.overrides&&x.overrides.z)||0);
  ov.z = dir>0 ? Math.max(0,...zs)+1 : Math.min(0,...zs)-1;
  render(); showKnobs(); markSel();
}

// ── In-place text editing ───────────────────────────────────────────
// The selected post card's text is ALWAYS editable — just click into it.
// Clicking anywhere else commits automatically; nothing is ever lost.
function curBd(){ return document.querySelector('[contenteditable="true"]'); }
let styleSpan=null, holdSel=false;
function bdFocus(){
  editing=true; savedSel=null; styleSpan=null;
  try{ document.execCommand('styleWithCSS',false,true); }catch(e){}
  updateUndoBtns();
}
function commitEdit(rerender){
  const bd=curBd();
  let sameCard=false;
  if(bd){
    const bl=bd.closest('[data-idx]');
    if(bl){
      const it=COMP.items[+bl.dataset.idx];
      const ov=it.overrides=it.overrides||{};
      const nw=sanitizeHtml(bd.innerHTML);
      if(nw!==(ov.text||'')){ pushUndo(); ov.text=nw; }   // pre-state pushed BEFORE the change
      sameCard=(+bl.dataset.idx===selIdx);
    }
    if(sameCard&&!rerender) bd.blur();                     // stays armed for the next click
    else bd.removeAttribute('contenteditable');
  }
  editing=false; savedSel=null; styleSpan=null; updateUndoBtns();
  if(rerender){ render(); showKnobs(); markSel(); }
}
// Remember the selection inside the editable and restore it after panel
// clicks — styling never kicks you out of the editor.
document.addEventListener('selectionchange',()=>{
  if(!editing||holdSel) return;
  const sel=getSelection(); if(!sel.rangeCount) return;
  const bd=curBd(); if(!bd) return;
  if(bd.contains(sel.anchorNode)){
    savedSel=sel.getRangeAt(0).cloneRange();
    styleSpan=null;              // a NEW selection gets a fresh style span
    updateTb();                  // …and the toolbar shows its font + size
  }
});
function restoreSel(){
  const bd=curBd(); if(!bd) return;
  bd.focus();
  if(savedSel){ const s=getSelection(); s.removeAllRanges(); s.addRange(savedSel); }
}
// Style the saved selection by wrapping it ONCE in a span; repeated calls
// (arrow-stepping fonts/sizes) restyle the SAME span — live preview, no
// nesting, and focus stays where it is (the dropdown keeps taking arrows).
function applyStyle(prop,val){
  const bd=curBd(); if(!bd) return;
  if(styleSpan&&bd.contains(styleSpan)){ styleSpan.style[prop]=val; return; }
  if(!savedSel||savedSel.collapsed){       // caret only → set the typing style
    restoreSel();
    try{
      document.execCommand('styleWithCSS',false,true);
      if(prop==='fontFamily') document.execCommand('fontName',false,String(val).replace(/'/g,''));
      else if(prop==='color') document.execCommand('foreColor',false,val);
    }catch(e){}
    return;
  }
  holdSel=true;
  const sp=document.createElement('span'); sp.style[prop]=val;
  const r=savedSel;
  try{ r.surroundContents(sp); }
  catch(e){ const frag=r.extractContents(); sp.appendChild(frag); r.insertNode(sp); }
  styleSpan=sp;
  const r2=document.createRange(); r2.selectNodeContents(sp); savedSel=r2;
  setTimeout(()=>holdSel=false,0);
}
// Show the font + size AT the cursor/selection in the toolbar.
function updateTb(){
  const f=document.getElementById('tbFont'), s=document.getElementById('tbSize');
  if(!f||!s) return;
  const bd=curBd(); if(!bd) return;
  const sel=getSelection(); if(!sel.rangeCount||!sel.anchorNode) return;
  const el=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
  if(!el||!bd.contains(el)) return;
  const cs=getComputedStyle(el);
  const fam=(cs.fontFamily||'').split(',')[0].replace(/["']/g,'').trim();
  const m=FONTS.find(([v])=>v.toLowerCase()===fam.toLowerCase());
  if(document.activeElement!==f){ f.value=m?m[0]:''; f.options[0].textContent=m?'Font…':(fam||'Font…'); }
  if(document.activeElement!==s) s.value=Math.round(parseFloat(cs.fontSize)||14);
}

// ── Selection: outline + handles + always-editable text ─────────────
function markSel(){
  document.querySelectorAll('.abswrap.sel,.block.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.rszh,.mvh,.tdh').forEach(h=>h.remove());
  document.querySelectorAll('[contenteditable="true"]').forEach(b=>{
    if(!b.closest('.abswrap[data-absidx="'+selIdx+'"]')) b.removeAttribute('contenteditable');
  });
  if(selIdx==null) return;
  const el=document.querySelector('.abswrap[data-absidx="'+selIdx+'"]')||document.querySelector('.block[data-idx="'+selIdx+'"]');
  if(!el) return;
  el.classList.add('sel');
  if(el.classList.contains('abswrap')){
    const idx=+el.dataset.absidx;
    const rz=document.createElement('div'); rz.className='rszh'; rz.title='Drag to resize';
    el.appendChild(rz); wireResize(rz,el);
    const mv=document.createElement('div'); mv.className='mvh'; mv.title='Drag to move the card';
    el.appendChild(mv);
    mv.onpointerdown=e=>{ if(editing) commitEdit(false); dragCardFrom(e,el,idx); };
    const bd=el.querySelector('.bd');
    if(bd&&COMP.items[idx].ref_type==='post'){
      bd.setAttribute('contenteditable','true');    // click in = edit, no button needed
      bd.onfocus=bdFocus;
      const th=document.createElement('div'); th.className='tdh'; th.textContent='T';
      th.title='Drag to slide the text — over the picture, anywhere';
      th.style.top=(bd.offsetTop||0)+'px';
      el.appendChild(th);
      th.onpointerdown=e=>{ if(editing) commitEdit(false); dragComp(e,el,idx,'txt'); };
    }
  }
}
function wireResize(h,wrap){
  h.onpointerdown=e=>{
    e.stopPropagation(); e.preventDefault();
    const page=wrap.parentElement, pr=page.getBoundingClientRect();
    const idx=+wrap.dataset.absidx;
    const ov=COMP.items[idx].overrides=COMP.items[idx].overrides||{};
    const pre=snap();
    let resized=false;
    const sx=e.clientX, ow=parseFloat(wrap.style.width)||ov.w||28;
    const mv=ev=>{
      resized=true;
      ov.w=Math.max(6,Math.min(95, ow+(ev.clientX-sx)/pr.width*100));
      wrap.style.width=ov.w+'%'; wrap.style.fontSize=fsOf(ov)+'px';
      const s=document.getElementById('knW');
      if(s){ s.value=ov.w; const p=document.getElementById('szPct'); if(p) p.textContent=Math.round(ov.w)+'%'; }
    };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
      if(resized){ ov.w=Math.round(ov.w*10)/10; pushUndo(pre); } };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  };
}
document.getElementById('out').addEventListener('click',e=>{
  const bl=e.target.closest('.block[data-idx]'); if(!bl) return;
  if(e.target.closest('[contenteditable="true"]')) return;   // clicks inside the editor stay in the editor
  if(editing) commitEdit(false);
  selIdx=+bl.dataset.idx; showKnobs(); markSel();
});
document.getElementById('paper').onchange=e=>{
  COMP.params=COMP.params||{}; COMP.params.paper=e.target.value;
  applyPaper(e.target.value); render(); syncZoom();
};
document.getElementById('zoom').oninput=e=>zoomToPct(+e.target.value);
document.getElementById('zoomIn').onclick=()=>zoomStep(1.25);
document.getElementById('zoomOut').onclick=()=>zoomStep(1/1.25);
document.getElementById('zoomFit').onclick=()=>syncZoom();

// Track the mouse so keyboard zoom anchors where you're looking.
let lastMouse=null;
document.addEventListener('mousemove',e=>{ lastMouse={x:e.clientX,y:e.clientY}; });

// The wheel zooms EVERYWHERE (anchored to the cursor, even off the page) —
// except over the panel, which scrolls normally.
document.addEventListener('wheel',e=>{
  if(e.target.closest&&e.target.closest('#panel')) return;
  e.preventDefault();
  zoomStep(e.deltaY<0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
}, { passive:false });

// Keyboard: +/= zoom in, -/_ zoom out, 0 fits, Ctrl+Z/Y undo/redo.
// While editing text or in a field, the browser's own behaviour applies.
document.addEventListener('keydown',e=>{
  if(e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); doRedo(); return; }
  const at=lastMouse||{};
  if(e.key==='+'||e.key==='='){ e.preventDefault(); zoomStep(1.25, at.x, at.y); }
  else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoomStep(1/1.25, at.x, at.y); }
  else if(e.key==='0'){ e.preventDefault(); syncZoom(); }
});
// Page navigation buttons.
document.getElementById('pgPrev').onclick=()=>setPage(curPage-1);
document.getElementById('pgNext').onclick=()=>setPage(curPage+1);
document.getElementById('pgAdd').onclick=()=>addPage();
document.getElementById('pgDel').onclick=()=>deletePage();
// Undo / redo buttons (mousedown-preventDefault keeps the text editor focused,
// so while editing they drive the browser's native text undo).
const _ub=document.getElementById('undoBtn'), _rb=document.getElementById('redoBtn');
_ub.onmousedown=e=>e.preventDefault(); _rb.onmousedown=e=>e.preventDefault();
_ub.onclick=()=>doUndo(); _rb.onclick=()=>doRedo();
updateUndoBtns();

// Print = all pages in order; restore the single-page editor afterwards.
window.addEventListener('beforeprint',()=>{ if(editing) commitEdit(false); renderAllPages(); });
window.addEventListener('afterprint',()=>{ renderCurrent(); applyZoom(curScale*100); });

document.getElementById('saveBtn').onclick=async()=>{
  if(editing) commitEdit(true);
  COMP.params=COMP.params||{}; COMP.params.pages=pageCount();
  const items=COMP.items.map(i=>({ref_type:i.ref_type,ref_id:i.ref_id,overrides:i.overrides||{}}));
  const r=await fetch('/api/compositions/'+compId,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items, params:COMP.params||{}})});
  document.getElementById('saveBtn').textContent = r.ok ? '✓ Saved' : 'Save failed';
  setTimeout(()=>document.getElementById('saveBtn').textContent='Save layout',1500);
};
load();
</script>
