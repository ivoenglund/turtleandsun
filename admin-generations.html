<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generation Review — Admin</title>
<script src="/nav.js?v=20260712a"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f5f2ea;color:#1C0A00;font-size:13px;}
.page-header{padding:16px 24px 10px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
.page-header h1{font-size:18px;font-weight:800;}
.page-header .hint{font-size:12px;color:#888;line-height:1.5;}
.filters{padding:10px 24px 12px;background:#fff;border-bottom:1px solid #e3dcc8;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filters select,.filters button{padding:7px 12px;border-radius:8px;border:1px solid #ccc;font-size:13px;cursor:pointer;}
.filters button{background:#1C2A14;color:#FFE800;border:none;font-weight:700;}
.filters .count{color:#888;font-size:12px;margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px 24px;}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid #e3dcc8;position:relative;}
.card.flagged{border-color:#e53935;}
.card.failed{border-color:#ff9800;}
.thumb{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#eee;cursor:pointer;}
.thumb-placeholder{width:100%;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;font-size:12px;color:#aaa;background:#f5f5f5;}
.card-body{padding:10px 12px;}
.card-title{font-weight:700;font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:11px;color:#888;margin-bottom:8px;line-height:1.5;}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn{padding:5px 10px;border-radius:7px;border:1.5px solid #1C2A14;background:#fff;color:#1C2A14;font-size:11px;font-weight:700;cursor:pointer;}
.btn:hover{background:#f0f7ea;}
.btn.danger{border-color:#e53935;color:#e53935;}
.btn.danger:hover{background:#fff5f5;}
.btn.danger.active{background:#e53935;color:#fff;}
.btn.regen{background:#1C2A14;color:#FFE800;}
.btn.regen:hover{background:#2d4a24;}
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-right:4px;}
.badge-success{background:#c8e6c9;color:#1b5e20;}
.badge-failed{background:#ffccbc;color:#bf360c;}
.badge-pending{background:#fff3cd;color:#856404;}
.badge-order{background:#e3f2fd;color:#0d47a1;}
.badge-flagged{background:#e53935;color:#fff;}
.flag-badge{position:absolute;top:8px;right:8px;background:#e53935;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
.loading{text-align:center;padding:60px;color:#aaa;}
.pagination{display:flex;gap:8px;justify-content:center;padding:20px;}
.pagination button{padding:7px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:13px;}
.pagination button.active{background:#1C2A14;color:#FFE800;border-color:#1C2A14;}
/* Lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:999;align-items:center;justify-content:center;}
.lb.open{display:flex;}
.lb-inner{position:relative;max-width:90vw;max-height:90vh;}
.lb-inner img,.lb-inner video{max-width:90vw;max-height:88vh;border-radius:8px;display:block;}
.lb-close{position:absolute;top:-34px;right:0;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;}
</style>
</head>
<body class="ts-nav-loggedin ts-nav-admin">
<div class="sun"></div>
<script src="/currency.js?v=20260526a"></script>
<div class="page-header">
  <h1>Generation Review</h1>
  <span class="hint"><a href="/admin" style="color:#3A6B20;text-decoration:none;">← Admin</a> &nbsp;·&nbsp; Flag bad outputs · ↺ Regen sends customer a new email · if it looks fine, move on</span>
</div>

<div class="filters">
  <select id="fSource" onchange="load(1)">
    <option value="">All sources</option>
    <option value="customer_order">Customer orders</option>
    <option value="admin_test">Admin tests</option>
    <option value="preview">Previews</option>
    <option value="lab_batch">Lab batch</option>
  </select>
  <select id="fStatus" onchange="load(1)">
    <option value="">All statuses</option>
    <option value="success">Success</option>
    <option value="failed">Failed</option>
    <option value="pending">Pending</option>
  </select>
  <select id="fFlagged" onchange="load(1)">
    <option value="">All</option>
    <option value="1">Flagged only</option>
  </select>
  <span class="count" id="countLine"></span>
</div>

<div id="grid" class="grid"><div class="loading">Loading…</div></div>
<div id="pagination" class="pagination"></div>

<div class="lb" id="lb" onclick="closeLb()">
  <div class="lb-inner" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLb()">×</button>
    <div id="lbContent"></div>
  </div>
</div>

<script>
let currentPage = 1;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(s){return s?new Date(s).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):'—';}
function fmtSecs(s){if(!s||s<0)return '—';if(s<60)return s+'s';return Math.round(s/60)+'m '+( s%60)+'s';}

function openLb(url, isVideo) {
  document.getElementById('lbContent').innerHTML = isVideo
    ? `<video src="${esc(url)}" controls autoplay style="max-width:90vw;max-height:88vh;border-radius:8px;display:block;"></video>`
    : `<img src="${esc(url)}" style="max-width:90vw;max-height:88vh;border-radius:8px;display:block;">`;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lbContent').innerHTML='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });

async function toggleFlag(id, currentlyFlagged) {
  const newState = !currentlyFlagged;
  const note = newState ? (prompt('Optional note (leave blank to skip):') || null) : null;
  await fetch(`/admin/api/generations/${id}/flag`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ flagged: newState, note })
  });
  load(currentPage);
}

async function genThumb(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Generating…';
  try {
    const r = await fetch(`/admin/api/generations/${id}/tiktok-thumbnail`, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    btn.textContent = '✓ Done';
    btn.style.background = '#e8f5e9';
    // Insert a download link next to the button
    const link = document.createElement('a');
    link.href = d.url;
    link.target = '_blank';
    link.download = '';
    link.className = 'btn';
    link.textContent = '↓ Download';
    btn.parentNode.insertBefore(link, btn.nextSibling);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'TikTok Thumb';
    alert('Thumbnail error: ' + e.message);
  }
}

async function regenerate(id) {
  if (!confirm('Trigger a new generation for this order? It will send a new delivery email.')) return;
  const r = await fetch(`/admin/api/generations/${id}/regenerate`, { method:'POST' });
  const j = await r.json();
  alert(j.ok ? 'Regeneration started.' : 'Error: ' + j.error);
}

async function load(page) {
  currentPage = page || 1;
  document.getElementById('grid').innerHTML = '<div class="loading">Loading…</div>';
  const source  = document.getElementById('fSource').value;
  const status  = document.getElementById('fStatus').value;
  const flagged = document.getElementById('fFlagged').value;
  const params  = new URLSearchParams({ page: currentPage });
  if (source)  params.set('source', source);
  if (status)  params.set('status', status);
  if (flagged) params.set('flagged', flagged);

  const r = await fetch('/admin/api/generations?' + params);
  const { rows, limit } = await r.json();

  document.getElementById('countLine').textContent = rows.length + ' shown';

  if (!rows.length) {
    document.getElementById('grid').innerHTML = '<div class="loading">No results.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('grid').innerHTML = rows.map(g => {
    const thumbUrl  = g.output_asset_url || g.thumb_url || g.output_url || null;
    const isVideo   = thumbUrl && /\.(mp4|webm|mov)(\?|$)/i.test(thumbUrl);
    const videoUrl  = g.output_video_asset_url || (isVideo ? thumbUrl : null);
    const hasTikTok = !!g.tiktok_thumbnail_url;
    const isFailed = g.status === 'failed';
    const isFlagged = g.flagged;

    return `<div class="card${isFlagged?' flagged':''}${isFailed?' failed':''}" id="card-${g.id}">
      ${isFlagged ? '<span class="flag-badge">⚑ Flagged</span>' : ''}
      ${g.input_photo_url ? `<img src="${esc(g.input_photo_url)}" title="Original photo" style="position:absolute;top:8px;left:8px;width:44px;height:44px;object-fit:cover;border-radius:6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);z-index:2;">` : ''}
      ${!thumbUrl
        ? `<div class="thumb-placeholder">${isFailed ? '✗ Failed' : 'Pending…'}</div>`
        : isVideo
          ? `<div style="position:relative;cursor:pointer;" onclick="openLb('${esc(thumbUrl)}',true)">
               <video class="thumb" src="${esc(thumbUrl)}" preload="metadata" muted playsinline style="pointer-events:none;"></video>
               <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
                 <div style="width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;">
                   <div style="width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:16px solid #fff;margin-left:3px;"></div>
                 </div>
               </div>
             </div>`
          : `<img class="thumb" src="${esc(thumbUrl)}" onclick="openLb('${esc(thumbUrl)}',false)" onerror="this.style.display='none'">`}
      <div class="card-body">
        <div class="card-title" title="${esc(g.concept_name||g.product||'')}">
          ${esc(g.concept_name || g.product || 'Unknown')}
        </div>
        <div class="card-meta">
          <span class="badge badge-${g.status}">${g.status}</span>
          <span class="badge badge-order">${esc(g.source_type||'')}</span>
          ${g.email ? '<br>' + esc(g.email) : ''}
          <br>${fmtDate(g.created_at)} · ${fmtSecs(g.secs)}
          ${g.flag_note ? `<br><span style="color:#e53935">⚑ ${esc(g.flag_note)}</span>` : ''}
          ${g.error_message ? `<br><span style="color:#e53935;font-size:10px;">${esc(g.error_message.slice(0,80))}</span>` : ''}
        </div>
        <div class="card-actions">
          ${thumbUrl ? `<button class="btn" onclick="openLb('${esc(thumbUrl)}',${isVideo})">View</button>` : ''}
          <button class="btn danger${isFlagged?' active':''}" onclick="toggleFlag(${g.id},${isFlagged})">${isFlagged?'Unflag':'Flag'}</button>
          ${g.order_id ? `<button class="btn regen" onclick="regenerate(${g.id})">↺ Regen</button>` : ''}
          ${videoUrl ? (hasTikTok
            ? `<a class="btn" href="${esc(g.tiktok_thumbnail_url)}" target="_blank" download style="background:#e8f5e9;">↓ TikTok Thumb</a>`
            : `<button class="btn" onclick="genThumb(${g.id},this)">TikTok Thumb</button>`) : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  // Pagination
  const hasMore = rows.length === limit;
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  if (currentPage > 1) {
    const pb = document.createElement('button');
    pb.textContent = '← Prev';
    pb.onclick = () => load(currentPage - 1);
    pag.appendChild(pb);
  }
  if (hasMore) {
    const nb = document.createElement('button');
    nb.textContent = 'Next →';
    nb.onclick = () => load(currentPage + 1);
    pag.appendChild(nb);
  }
}

NavBar.init({ requireAuth: true }).then(() => load(1));
</script>
</body>
</html>
