<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Clips — Turtle and Sun Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f2ea;color:#1C0A00;font-size:13px}
.page{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.subtitle{color:#666;font-size:12px;margin-bottom:20px}
h2{font-size:15px;font-weight:700;margin:24px 0 10px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:8px;border:none;font-weight:700;font-size:12px;cursor:pointer}
.btn-primary{background:#1C2A14;color:#FFE800}
.btn-primary:hover{background:#2d4a24}
.btn-primary:disabled{background:#aaa;color:#fff;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{background:#c0392b;color:#fff}
.btn-danger:hover{background:#a93226}
.select-all-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#555}
.triplets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.triplet-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative}
.triplet-card .check-wrap{position:absolute;top:8px;left:8px;z-index:2}
.triplet-card .check-wrap input{width:18px;height:18px;cursor:pointer}
.triplet-card.selected{outline:2px solid #1C2A14}
.media-row{display:flex;height:90px;gap:1px;background:#eee}
.media-thumb{flex:1;overflow:hidden;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-thumb.empty{font-size:10px;color:#bbb}
.card-info{padding:8px 10px}
.card-info .concept{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info .triplet-num{font-size:10px;color:#888}
.card-missing{font-size:10px;color:#c0392b;margin-top:2px}
.clips-table{width:100%;border-collapse:collapse;font-size:12px}
.clips-table th{text-align:left;padding:6px 8px;border-bottom:2px solid #ddd;font-weight:700;color:#555}
.clips-table td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle}
.clips-table tr:hover td{background:#f9f7f3}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-pending{background:#e0e0e0;color:#555}
.badge-processing{background:#fff3cd;color:#856404}
.badge-done{background:#d4edda;color:#155724}
.badge-error{background:#f8d7da;color:#721c24}
.pub-icons{display:flex;gap:4px}
.pub-icon{font-size:14px;opacity:.3}
.pub-icon.active{opacity:1}
.thumb-tiny{width:36px;height:64px;object-fit:cover;border-radius:4px;cursor:pointer}
a.detail-link{color:#1C2A14;font-weight:700;text-decoration:none}
a.detail-link:hover{text-decoration:underline}
.empty-state{text-align:center;padding:32px;color:#aaa;font-size:13px}
.flash{padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:12px}
.flash-ok{background:#d4edda;color:#155724}
.flash-err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="page">
  <h1>Social Clips</h1>
  <p class="subtitle">Select triplets to queue &rarr; open each clip to configure scenes and generate &rarr; publish to channels.</p>

  <div id="flash" style="display:none" class="flash"></div>

  <h2>Triplets &mdash; select to queue</h2>
  <div class="toolbar">
    <label class="select-all-row"><input type="checkbox" id="select-all"> Select all</label>
    <button class="btn btn-primary" id="btn-queue" disabled onclick="queueSelected()">Queue selected &#9658;</button>
    <span id="sel-count" style="font-size:11px;color:#888"></span>
  </div>
  <div class="triplets-grid" id="triplets-grid">
    <div class="empty-state">Loading&hellip;</div>
  </div>

  <h2>Clips library</h2>
  <div class="toolbar">
    <button class="btn btn-sm btn-primary" onclick="loadClips()">&#8635; Refresh</button>
  </div>
  <table class="clips-table">
    <thead>
      <tr>
        <th>Preview</th>
        <th>Concept</th>
        <th>Status</th>
        <th>Published</th>
        <th>Created</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="clips-tbody">
      <tr><td colspan="6" class="empty-state">Loading&hellip;</td></tr>
    </tbody>
  </table>
</div>

<script>
let selected = new Set();
let tripletsData = [];

async function init() {
  await Promise.all([loadTriplets(), loadClips()]);
}

async function loadTriplets() {
  const r = await fetch('/admin/api/social-clips/triplets');
  const data = await r.json();
  tripletsData = data;
  renderTriplets(data);
}

function renderTriplets(triplets) {
  const grid = document.getElementById('triplets-grid');
  if (!triplets.length) { grid.innerHTML = '<div class="empty-state">No triplets found.</div>'; return; }
  grid.innerHTML = triplets.map(t => {
    const hasBefore = !!t.before_url;
    const hasVideo  = !!t.video_url;
    const canQueue  = hasBefore && hasVideo;
    return `
    <div class="triplet-card${selected.has(t.id) ? ' selected' : ''}" id="tc-${t.id}">
      <div class="check-wrap">
        <input type="checkbox" ${selected.has(t.id) ? 'checked' : ''} ${canQueue ? '' : 'disabled'}
               onchange="toggleSelect(${t.id}, this.checked)">
      </div>
      <div class="media-row">
        <div class="media-thumb${hasBefore ? '' : ' empty'}">
          ${hasBefore ? `<img src="${escHtml(t.before_url)}" loading="lazy">` : 'No before'}
        </div>
        <div class="media-thumb${hasVideo ? '' : ' empty'}">
          ${hasVideo
            ? `<video src="${escHtml(t.video_url)}" muted playsinline preload="none"
                 onmouseenter="this.play()" onmouseleave="this.pause()"></video>`
            : 'No video'}
        </div>
      </div>
      <div class="card-info">
        <div class="concept">${escHtml(t.concept_name || '&mdash;')}</div>
        <div class="triplet-num">Triplet #${t.triplet_number || t.id}</div>
        ${!canQueue ? `<div class="card-missing">Missing ${!hasBefore ? 'before image' : 'after video'}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleSelect(id, checked) {
  if (checked) selected.add(id); else selected.delete(id);
  const card = document.getElementById('tc-' + id);
  if (card) card.classList.toggle('selected', checked);
  updateSelCount();
}

function updateSelCount() {
  const n = selected.size;
  document.getElementById('sel-count').textContent = n ? n + ' selected' : '';
  document.getElementById('btn-queue').disabled = n === 0;
}

document.getElementById('select-all').addEventListener('change', function() {
  tripletsData.forEach(t => {
    if (t.before_url && t.video_url) {
      const cb = document.querySelector('#tc-' + t.id + ' input[type=checkbox]');
      if (cb) { cb.checked = this.checked; toggleSelect(t.id, this.checked); }
    }
  });
});

async function queueSelected() {
  const ids = [...selected];
  if (!ids.length) return;
  const btn = document.getElementById('btn-queue');
  btn.disabled = true;
  btn.textContent = 'Queuing…';
  try {
    const r = await fetch('/admin/api/social-clips/queue', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ triplet_ids: ids }),
    });
    const d = await r.json();
    if (d.created) {
      showFlash('Queued ' + d.created.length + ' clip(s). Open each one below to generate.', 'ok');
      selected.clear();
      renderTriplets(tripletsData);
      updateSelCount();
      await loadClips();
    } else {
      showFlash(d.error || 'Unknown error', 'err');
    }
  } catch(e) { showFlash(e.message, 'err'); }
  btn.textContent = 'Queue selected ►';
  updateSelCount();
}

async function loadClips() {
  const r = await fetch('/admin/api/social-clips');
  const clips = await r.json();
  const tbody = document.getElementById('clips-tbody');
  if (!clips.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No clips yet &mdash; queue some above.</td></tr>';
    return;
  }
  tbody.innerHTML = clips.map(c => `
    <tr>
      <td>${c.output_url
        ? `<video class="thumb-tiny" src="${escHtml(c.output_url)}" muted playsinline preload="none"
             onmouseenter="this.play()" onmouseleave="this.pause()" onclick="window.location='/admin/social-clips/${c.id}'"></video>`
        : '&mdash;'}</td>
      <td><a class="detail-link" href="/admin/social-clips/${c.id}">${escHtml(c.concept_name || '&mdash;')}</a></td>
      <td>
        <span class="badge badge-${c.status}">${c.status}</span>
        ${c.error_msg ? `<div style="color:#c0392b;font-size:10px;margin-top:2px">${escHtml(c.error_msg.slice(0, 80))}</div>` : ''}
      </td>
      <td><div class="pub-icons">
        <span class="pub-icon${c.published_tiktok ? ' active' : ''}" title="TikTok">&#127925;</span>
        <span class="pub-icon${c.published_instagram ? ' active' : ''}" title="Instagram">&#128247;</span>
        <span class="pub-icon${c.published_youtube ? ' active' : ''}" title="YouTube">&#9654;&#65039;</span>
      </div></td>
      <td>${new Date(c.created_at).toLocaleDateString()}</td>
      <td style="display:flex;gap:4px">
        <a class="btn btn-sm btn-primary" href="/admin/social-clips/${c.id}">Open</a>
        <button class="btn btn-sm btn-danger" onclick="deleteClip(${c.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

async function deleteClip(id) {
  if (!confirm('Delete this clip?')) return;
  await fetch('/admin/api/social-clips/' + id, { method: 'DELETE' });
  await loadClips();
}

function showFlash(msg, type) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash flash-' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
